name: Finalize verified 7x7 Classic artifact boundary

on:
  push:
    branches:
      - agent/perfect-classic-artifact-verification
    paths:
      - .github/workflows/finalize-perfect-classic-artifact-verification.yml

permissions:
  contents: write

concurrency:
  group: finalize-perfect-classic-artifact-verification
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-artifact-verification
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the exact production-only file set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/perfect-classic-artifact-final
          python3 scripts/build-perfect-classic-artifact-verification.py \
            --expected-source-sha "$GITHUB_SHA" \
            --output /tmp/perfect-classic-artifact-final
          cat /tmp/perfect-classic-artifact-final/manifest.json

      - name: Run focused artifact and workflow gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/perfect-classic-download-fragments.py \
            scripts/patch-perfect-classic-fragment-downloads.py
          node --test \
            tests/perfect-classic-download-fragments.test.js \
            tests/perfect-classic-fragment-workflow-patch.test.js
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true); puts path }' \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml

      - name: Run complete release gates
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser
          git diff --check

      - name: Publish only the tested production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/build-perfect-classic-artifact-verification.py \
            .github/workflows/finalize-perfect-classic-artifact-verification.yml
          changed="$(git status --short | cut -c4- | sort)"
          expected=$'.github/workflows/compute-perfect-classic-7x7-role1.yml\n.github/workflows/compute-perfect-classic-7x7-role2.yml\n.github/workflows/finalize-perfect-classic-artifact-verification.yml\n.github/workflows/harden-perfect-classic-artifact-downloader.yml\n.github/workflows/verify-perfect-classic-artifact-boundary.yml\nscripts/build-perfect-classic-artifact-verification.py\nscripts/perfect-classic-download-fragments.py\ntests/perfect-classic-download-fragments.test.js'
          test "$changed" = "$expected"
          git add \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml \
            scripts/perfect-classic-download-fragments.py \
            tests/perfect-classic-download-fragments.test.js
          git diff --cached --check
          git commit -m 'Verify every sharded 7x7 Classic proof artifact'
          git push origin HEAD:agent/perfect-classic-artifact-verification
