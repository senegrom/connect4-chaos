name: Accelerate current Perfect Chaos 14-to-16 closure rounds

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/accelerate-perfect-chaos-16-current.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: accelerate-perfect-chaos-16-current
  cancel-in-progress: false

jobs:
  stage_red:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31645462606'
      SOURCE_SHA: '4ab9d9b11127c6d494f30ee55c7ecd8f122498b6'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download and verify the recovered Red round 4 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$conclusion" = 'success'
          rm -rf previous seed prepared
          mkdir -p previous seed/red
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name perfect-chaos-red-16-classification-round4-recovered \
            --dir previous
          python3 scripts/perfect-chaos-artifacts.py verify --directory previous
          summary=$(find previous -name campaign-summary.json -print -quit)
          role=$(find previous -type d -name red-prepared -print -quit)
          test -n "$summary"
          test -n "$role"
          node - "$summary" <<'NODE'
          const summary = require(`./${process.argv[2]}`);
          if (summary.role !== 'red' || summary.fromPieces !== 14 || summary.targetPieces !== 16) {
            throw new Error('Recovered Red round 4 has incompatible metadata.');
          }
          if (!summary.classificationComplete || summary.policyConflicts !== 0) {
            throw new Error('Recovered Red round 4 is incomplete or conflicted.');
          }
          if (summary.existingRejectedRoots !== 7904 || summary.newRejectedRoots !== 18) {
            throw new Error('Recovered Red round 4 changed its rejection accounting.');
          }
          if (summary.cumulativeRejectedRoots !== 7922) {
            throw new Error('Recovered Red round 4 cumulative rejection count is not 7,922.');
          }
          NODE
          cp -a "$role"/. seed/red/

      - name: Rebuild Red through 14 pieces with two deterministic workers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-chaos-prefix.mjs prepare-role \
            --role red \
            --frontier-pieces 16 \
            --pass-budget 9999 \
            --shards 32 \
            --shard-from-pieces 14 \
            --shard-workers 2 \
            --seed-rejections seed \
            --output prepared
          node scripts/perfect-chaos-prefix.mjs replay-role \
            --directory prepared \
            --role red \
            --frontier-pieces 14 \
            > prepared/red-replay.json
          node - <<'NODE'
          const checkpoint = require('./prepared/checkpoint.json');
          const replay = require('./prepared/red-replay.json').replay;
          if (!checkpoint.complete || checkpoint.mode !== 'preparation' || checkpoint.role !== 'red') {
            throw new Error('Accelerated Red preparation is incomplete or incompatible.');
          }
          if (checkpoint.target !== 16 || checkpoint.rejectionCounts?.at14 !== 7922) {
            throw new Error('Accelerated Red preparation has the wrong target or rejection count.');
          }
          if (checkpoint.sharding?.workers !== 2) {
            throw new Error('Accelerated Red preparation did not use two workers.');
          }
          for (const summary of checkpoint.result?.nativeSummaries ?? []) {
            if (Object.hasOwn(summary, 'policyConflicts') && summary.policyConflicts !== 0) {
              throw new Error('Accelerated Red preparation contains a conflicted segment.');
            }
          }
          if (replay.segments.at(-1)?.frontierPieces !== 14) {
            throw new Error('Accelerated Red preparation does not replay through 14 pieces.');
          }
          NODE
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, ROLE_CODES, read_table,
          )
          frontier = read_table(
              Path('prepared/red/12-14.frontier.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          rejected = read_table(
              Path('prepared/red/reject-14.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          if frontier.role != ROLE_CODES['red'] or frontier.boundary != 14:
              raise RuntimeError('Accelerated Red frontier has incompatible metadata.')
          if rejected.role != ROLE_CODES['red'] or rejected.boundary != 14:
              raise RuntimeError('Accelerated Red rejection table has incompatible metadata.')
          if len(rejected.records) != 7922 or not frontier.records:
              raise RuntimeError('Accelerated Red checkpoint has invalid proof-table counts.')
          print({'redFrontierRoots': len(frontier.records), 'redRejectedRoots': len(rejected.records)})
          PY
          python3 scripts/perfect-chaos-artifacts.py write --directory prepared
          python3 scripts/perfect-chaos-artifacts.py verify --directory prepared

      - name: Publish deterministic Red shard matrix
        id: matrix
        shell: bash
        run: |
          echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(64))))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-14-current-staged
          path: prepared
          if-no-files-found: error
          retention-days: 30

  classify_red:
    needs: stage_red
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.stage_red.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-current-staged
          path: prepared

      - name: Compile native solver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp \
            -o /tmp/perfect-chaos-prefix

      - name: Classify deterministic Red shard with fail-closed leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          python3 scripts/perfect-chaos-classify.py \
            --solver /tmp/perfect-chaos-prefix \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 64 \
            --maximum-states 4000000 \
            --rejected 'shard/rejected-${{ matrix.shard }}.bin' \
            --policy 'shard/policy-${{ matrix.shard }}.bin' \
            --frontier 'shard/frontier-${{ matrix.shard }}.bin' \
            --summary 'shard/summary-${{ matrix.shard }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-current-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: error
          retention-days: 30

  merge_red:
    needs:
      - stage_red
      - classify_red
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-current-staged
          path: prepared

      - uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-red-16-current-shard-*
          path: shards
          merge-multiple: true

      - name: Hardened Red merge, accounting, and optional closure replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-count 64 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table, write_table,
          )
          existing = read_table(
              Path('prepared/red/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          discovered = read_table(
              Path('result/new-reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          if len(existing.records) != 7922:
              raise RuntimeError('Current Red round did not start from 7,922 rejections.')
          write_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, existing.role,
              existing.boundary, FRONTIER_RECORD_SIZE,
              [*existing.records, *discovered.records],
          )
          cumulative = read_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          summary = json.loads(Path('result/classification.json').read_text())
          if not summary.get('classificationComplete') or summary.get('policyConflicts') != 0:
              raise RuntimeError('Current Red classification is incomplete or conflicted.')
          summary['existingRejectedRoots'] = len(existing.records)
          summary['newRejectedRoots'] = len(discovered.records)
          summary['cumulativeRejectedRoots'] = len(cumulative.records)
          summary['rejectionProgress'] = len(cumulative.records) - len(existing.records)
          Path('result/campaign-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          cp -a prepared/red result/red-prepared
          cp result/reject-14.bin result/red-prepared/reject-14.bin
          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          if [[ "$new" == '0' ]]; then
            cp result/14-16.policy.bin result/red-prepared/14-16.policy.bin
            cp result/14-16.frontier.bin result/red-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/red-prepared result/assembled/red
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role red \
              --frontier-pieces 16 \
              > result/red-16-replay.json
            test "$(node -p "require('./result/red-16-replay.json').replay.segments.at(-1).frontierPieces")" = '16'
          fi
          python3 scripts/perfect-chaos-artifacts.py write --directory result
          python3 scripts/perfect-chaos-artifacts.py verify --directory result

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-current-round
          path: result
          if-no-files-found: error
          retention-days: 30

  stage_yellow:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31641909525'
      SOURCE_SHA: 'e94820dc5f7a3b5ac3d0bf7f2fceb1e6344fb98f'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download and normalize the recovered Yellow round 1 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$conclusion" = 'success'
          rm -rf previous seed prepared
          mkdir -p previous seed/yellow
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name perfect-chaos-yellow-16-classification-round1-recovered \
            --dir previous
          summary=$(find previous -name campaign-summary.json -print -quit)
          role=$(find previous -type d -name yellow-prepared -print -quit)
          sums=$(find previous -name SHA256SUMS -print -quit)
          test -n "$summary"
          test -n "$role"
          test -n "$sums"
          base=$(dirname "$sums")
          sed 's#  result/#  #' "$sums" > "$base/SHA256SUMS.normalized"
          (cd "$base" && sha256sum --check --strict SHA256SUMS.normalized)
          node - "$summary" <<'NODE'
          const summary = require(`./${process.argv[2]}`);
          if (summary.role !== 'yellow' || summary.fromPieces !== 14 || summary.targetPieces !== 16) {
            throw new Error('Recovered Yellow round 1 has incompatible metadata.');
          }
          if (!summary.classificationComplete || summary.policyConflicts !== 0) {
            throw new Error('Recovered Yellow round 1 is incomplete or conflicted.');
          }
          if (summary.existingRejectedRoots !== 0 || summary.newRejectedRoots !== 15378) {
            throw new Error('Recovered Yellow round 1 changed its rejection accounting.');
          }
          if (summary.cumulativeRejectedRoots !== 15378) {
            throw new Error('Recovered Yellow round 1 cumulative rejection count is not 15,378.');
          }
          NODE
          cp -a "$role"/. seed/yellow/

      - name: Rebuild Yellow through 14 pieces with two deterministic workers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-chaos-prefix.mjs prepare-role \
            --role yellow \
            --frontier-pieces 16 \
            --pass-budget 9999 \
            --shards 64 \
            --shard-from-pieces 14 \
            --shard-workers 2 \
            --seed-rejections seed \
            --output prepared
          node scripts/perfect-chaos-prefix.mjs replay-role \
            --directory prepared \
            --role yellow \
            --frontier-pieces 14 \
            > prepared/yellow-replay.json
          node - <<'NODE'
          const checkpoint = require('./prepared/checkpoint.json');
          const replay = require('./prepared/yellow-replay.json').replay;
          if (!checkpoint.complete || checkpoint.mode !== 'preparation' || checkpoint.role !== 'yellow') {
            throw new Error('Accelerated Yellow preparation is incomplete or incompatible.');
          }
          if (checkpoint.target !== 16 || checkpoint.rejectionCounts?.at14 !== 15378) {
            throw new Error('Accelerated Yellow preparation has the wrong target or rejection count.');
          }
          if (checkpoint.sharding?.workers !== 2) {
            throw new Error('Accelerated Yellow preparation did not use two workers.');
          }
          for (const summary of checkpoint.result?.nativeSummaries ?? []) {
            if (Object.hasOwn(summary, 'policyConflicts') && summary.policyConflicts !== 0) {
              throw new Error('Accelerated Yellow preparation contains a conflicted segment.');
            }
          }
          if (replay.segments.at(-1)?.frontierPieces !== 14) {
            throw new Error('Accelerated Yellow preparation does not replay through 14 pieces.');
          }
          NODE
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, ROLE_CODES, read_table,
          )
          frontier = read_table(
              Path('prepared/yellow/12-14.frontier.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          rejected = read_table(
              Path('prepared/yellow/reject-14.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          if frontier.role != ROLE_CODES['yellow'] or frontier.boundary != 14:
              raise RuntimeError('Accelerated Yellow frontier has incompatible metadata.')
          if rejected.role != ROLE_CODES['yellow'] or rejected.boundary != 14:
              raise RuntimeError('Accelerated Yellow rejection table has incompatible metadata.')
          if len(rejected.records) != 15378 or not frontier.records:
              raise RuntimeError('Accelerated Yellow checkpoint has invalid proof-table counts.')
          print({'yellowFrontierRoots': len(frontier.records), 'yellowRejectedRoots': len(rejected.records)})
          PY
          python3 scripts/perfect-chaos-artifacts.py write --directory prepared
          python3 scripts/perfect-chaos-artifacts.py verify --directory prepared

      - name: Publish deterministic Yellow shard matrix
        id: matrix
        shell: bash
        run: |
          echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(128))))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-14-current-staged
          path: prepared
          if-no-files-found: error
          retention-days: 30

  classify_yellow:
    needs: stage_yellow
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.stage_yellow.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-yellow-14-current-staged
          path: prepared

      - name: Compile native solver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp \
            -o /tmp/perfect-chaos-prefix

      - name: Classify deterministic Yellow shard with fail-closed leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          python3 scripts/perfect-chaos-classify.py \
            --solver /tmp/perfect-chaos-prefix \
            --input prepared/yellow/12-14.frontier.bin \
            --role yellow \
            --target-pieces 16 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 128 \
            --maximum-states 4000000 \
            --rejected 'shard/rejected-${{ matrix.shard }}.bin' \
            --policy 'shard/policy-${{ matrix.shard }}.bin' \
            --frontier 'shard/frontier-${{ matrix.shard }}.bin' \
            --summary 'shard/summary-${{ matrix.shard }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-16-current-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: error
          retention-days: 30

  merge_yellow:
    needs:
      - stage_yellow
      - classify_yellow
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-yellow-14-current-staged
          path: prepared

      - uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-yellow-16-current-shard-*
          path: shards
          merge-multiple: true

      - name: Hardened Yellow merge, accounting, and optional closure replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/yellow/12-14.frontier.bin \
            --role yellow \
            --target-pieces 16 \
            --shard-count 128 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table, write_table,
          )
          existing = read_table(
              Path('prepared/yellow/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          discovered = read_table(
              Path('result/new-reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          if len(existing.records) != 15378:
              raise RuntimeError('Current Yellow round did not start from 15,378 rejections.')
          write_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, existing.role,
              existing.boundary, FRONTIER_RECORD_SIZE,
              [*existing.records, *discovered.records],
          )
          cumulative = read_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          summary = json.loads(Path('result/classification.json').read_text())
          if not summary.get('classificationComplete') or summary.get('policyConflicts') != 0:
              raise RuntimeError('Current Yellow classification is incomplete or conflicted.')
          summary['existingRejectedRoots'] = len(existing.records)
          summary['newRejectedRoots'] = len(discovered.records)
          summary['cumulativeRejectedRoots'] = len(cumulative.records)
          summary['rejectionProgress'] = len(cumulative.records) - len(existing.records)
          Path('result/campaign-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          cp -a prepared/yellow result/yellow-prepared
          cp result/reject-14.bin result/yellow-prepared/reject-14.bin
          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          if [[ "$new" == '0' ]]; then
            cp result/14-16.policy.bin result/yellow-prepared/14-16.policy.bin
            cp result/14-16.frontier.bin result/yellow-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/yellow-prepared result/assembled/yellow
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role yellow \
              --frontier-pieces 16 \
              > result/yellow-16-replay.json
            test "$(node -p "require('./result/yellow-16-replay.json').replay.segments.at(-1).frontierPieces")" = '16'
          fi
          python3 scripts/perfect-chaos-artifacts.py write --directory result
          python3 scripts/perfect-chaos-artifacts.py verify --directory result

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-16-current-round
          path: result
          if-no-files-found: error
          retention-days: 30
