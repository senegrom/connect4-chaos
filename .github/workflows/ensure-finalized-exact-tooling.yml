name: Ensure exact-tooling finalizer completes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ensure-finalized-exact-tooling.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ensure-finalized-exact-tooling
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch or wait for the fail-closed finalizer
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          ready() {
            git fetch origin main >/dev/null 2>&1
            git cat-file -e origin/main:.audit/finalized-exact-solver-tooling.json 2>/dev/null
          }
          if ! ready; then
            if git cat-file -e origin/main:.github/workflows/finalize-perfect-solver-tooling.yml 2>/dev/null; then
              gh workflow run finalize-perfect-solver-tooling.yml --repo "$repo" --ref main
            else
              echo 'Neither a completion audit nor the finalizer workflow exists.' >&2
              exit 1
            fi
          fi
          for _ in $(seq 1 420); do
            if ready; then
              git show origin/main:.audit/finalized-exact-solver-tooling.json \
                > /tmp/finalized-exact-solver-tooling.json
              jq -e '.format == "connect4-finalized-exact-solver-tooling-verification-v1" and .result == "success"' \
                /tmp/finalized-exact-solver-tooling.json >/dev/null
              exit 0
            fi
            sleep 30
          done
          echo 'The exact-tooling finalizer did not publish a successful audit in time.' >&2
          exit 1

      - name: Remove this completion guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm --ignore-unmatch .github/workflows/ensure-finalized-exact-tooling.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Remove completed exact-tooling guard'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
