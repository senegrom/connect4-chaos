name: Verify Perfect Chaos shard downloader against live 128-shard evidence

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/verify-perfect-chaos-shard-downloader-live.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery

      - name: Enumerate all pages, verify every archive digest, and extract 512 files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-download-shards.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id 32028068015 \
            --run-sha 50893d8350e6258cae6d973ce7365da18fd298fd \
            --artifact-prefix perfect-chaos-yellow-16-43413-shard- \
            --shard-count 128 \
            --output shards \
            --metadata shard-download.json \
            --workers 16
          test "$(find shards -maxdepth 1 -type f | wc -l)" = 512
          test "$(jq '.artifacts | length' shard-download.json)" = 128
          test "$(jq '[.artifacts[].archiveSha256] | unique | length' shard-download.json)" = 128

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-live-shard-downloader-verification
          path: shard-download.json
          if-no-files-found: error
          retention-days: 90
