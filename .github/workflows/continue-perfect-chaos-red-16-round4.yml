name: Continue Red Perfect Chaos 14-to-16 round 4

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/continue-perfect-chaos-red-16-round4.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: continue-perfect-chaos-red-16-round4
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31643549278'
      SOURCE_SHA: '2561e20714dcee40c26542eb2da090fbe29efd71'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download and verify the locked Red round 3 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$actual_sha" = "$SOURCE_SHA"
          rm -rf previous seed prepared
          mkdir -p previous seed/red
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name perfect-chaos-red-16-classification-round3 \
            --dir previous
          summary=$(find previous -name campaign-summary.json -print -quit)
          role=$(find previous -type d -name red-prepared -print -quit)
          sums=$(find previous -name SHA256SUMS -print -quit)
          test -n "$summary"
          test -n "$role"
          test -n "$sums"
          test "$(node -p "require('./$summary').newRejectedRoots")" = '22'
          test "$(node -p "require('./$summary').cumulativeRejectedRoots")" = '7904'
          test "$(node -p "require('./$summary').policyConflicts")" = '0'
          base=$(dirname "$sums")
          (cd "$base" && sha256sum --check --strict "$(basename "$sums")")
          cp -a "$role"/. seed/red/

      - name: Rebuild the exact Red prefix through 14 pieces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-chaos-prefix.mjs prepare-role \
            --role red \
            --frontier-pieces 16 \
            --pass-budget 9999 \
            --shards 32 \
            --shard-from-pieces 14 \
            --seed-rejections seed \
            --output prepared
          node scripts/perfect-chaos-prefix.mjs replay-role \
            --directory prepared \
            --role red \
            --frontier-pieces 14 \
            > prepared/red-replay.json
          node - <<'NODE'
          const checkpoint = require('./prepared/checkpoint.json');
          const replay = require('./prepared/red-replay.json').replay;
          if (!checkpoint.complete || checkpoint.mode !== 'preparation') {
            throw new Error('Red round 4 preparation did not complete.');
          }
          if (replay.segments.at(-1)?.frontierPieces !== 14) {
            throw new Error('Red round 4 does not end at the certified 14-piece frontier.');
          }
          NODE
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, ROLE_CODES, read_table,
          )
          frontier = read_table(
              Path('prepared/red/12-14.frontier.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          rejected = read_table(
              Path('prepared/red/reject-14.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          if frontier.role != ROLE_CODES['red'] or frontier.boundary != 14:
              raise RuntimeError('The rebuilt Red frontier has incompatible metadata.')
          if rejected.role != ROLE_CODES['red'] or rejected.boundary != 14:
              raise RuntimeError('The rebuilt Red rejection table has incompatible metadata.')
          if len(rejected.records) != 7904:
              raise RuntimeError('The rebuilt Red cumulative rejection count is not 7,904.')
          if not frontier.records:
              raise RuntimeError('The rebuilt Red 14-piece frontier is empty.')
          print({'redFrontierRoots': len(frontier.records), 'redRejectedRoots': len(rejected.records)})
          PY
          find prepared -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  prepared/#  #' \
            > prepared/SHA256SUMS
          (cd prepared && sha256sum --check --strict SHA256SUMS)

      - name: Publish deterministic Red shard matrix
        id: matrix
        shell: bash
        run: |
          echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(64))))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-14-round4-staged
          path: prepared
          if-no-files-found: error
          retention-days: 30

  classify:
    needs: stage
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.stage.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-round4-staged
          path: prepared

      - name: Compile native solver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp \
            -o /tmp/perfect-chaos-prefix

      - name: Classify deterministic Red shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          python3 scripts/perfect-chaos-classify.py \
            --solver /tmp/perfect-chaos-prefix \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 64 \
            --maximum-states 4000000 \
            --rejected 'shard/rejected-${{ matrix.shard }}.bin' \
            --policy 'shard/policy-${{ matrix.shard }}.bin' \
            --frontier 'shard/frontier-${{ matrix.shard }}.bin' \
            --summary 'shard/summary-${{ matrix.shard }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-round4-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: error
          retention-days: 30

  merge:
    needs:
      - stage
      - classify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-round4-staged
          path: prepared

      - uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-red-16-round4-shard-*
          path: shards
          merge-multiple: true

      - name: Merge, verify, and checkpoint Red round 4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-count 64 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table, write_table,
          )
          existing = read_table(
              Path('prepared/red/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          discovered = read_table(
              Path('result/new-reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          if len(existing.records) != 7904:
              raise RuntimeError('Red round 4 did not start from 7,904 cumulative rejections.')
          write_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, existing.role,
              existing.boundary, FRONTIER_RECORD_SIZE,
              [*existing.records, *discovered.records],
          )
          cumulative = read_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          summary = json.loads(Path('result/classification.json').read_text())
          if summary.get('policyConflicts') != 0:
              raise RuntimeError('Conflicting Red policy actions were found.')
          summary['existingRejectedRoots'] = len(existing.records)
          summary['newRejectedRoots'] = len(discovered.records)
          summary['cumulativeRejectedRoots'] = len(cumulative.records)
          summary['rejectionProgress'] = len(cumulative.records) - len(existing.records)
          Path('result/campaign-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          cp -a prepared/red result/red-prepared
          cp result/reject-14.bin result/red-prepared/reject-14.bin
          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          if [[ "$new" == '0' ]]; then
            cp result/14-16.policy.bin result/red-prepared/14-16.policy.bin
            cp result/14-16.frontier.bin result/red-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/red-prepared result/assembled/red
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role red \
              --frontier-pieces 16 \
              > result/red-16-replay.json
          fi
          find result -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  result/#  #' \
            > result/SHA256SUMS
          (cd result && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-classification-round4
          path: result
          if-no-files-found: error
          retention-days: 30
