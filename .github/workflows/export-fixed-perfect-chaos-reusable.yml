name: Export corrected Perfect Chaos reusable workflow

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/export-fixed-perfect-chaos-reusable.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Correct the classification matrix output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/reusable-perfect-chaos-16-round.yml')
          text = path.read_text()
          old = '''          echo "shards=$(SHARD_COUNT="$SHARD_COUNT" python3 -c 'import json, os; print(json.dumps(list(range(int(os.environ["SHARD_COUNT"]))))')" >> "$GITHUB_OUTPUT"
          '''
          new = '''          SHARD_COUNT="$SHARD_COUNT" python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          print("shards=" + json.dumps(list(range(int(os.environ["SHARD_COUNT"])))))
          PYTHON
          '''
          if text.count(old) != 1:
              raise RuntimeError('Reusable workflow matrix anchor mismatch.')
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: corrected-perfect-chaos-reusable
          path: .github/workflows/reusable-perfect-chaos-16-round.yml
          if-no-files-found: error
          retention-days: 1
