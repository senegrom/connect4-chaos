name: Temporary CodeQL diagnostic

on:
  push:
    branches: [fix/code-scanning-2026-09-16]

permissions:
  contents: read

jobs:
  analyze:
    name: Diagnostic (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          output: diagnostic-results
          upload: never
          upload-database: false
      - name: Require zero CodeQL findings
        run: |
          python3 - <<'PY'
          import glob
          import json
          reports = sorted(glob.glob('diagnostic-results/*.sarif'))
          if not reports:
              raise SystemExit('No SARIF reports produced')
          total = 0
          for name in reports:
              with open(name, encoding='utf-8') as source:
                  report = json.load(source)
              if not report.get('runs'):
                  raise SystemExit('No analysis runs in SARIF report')
              for run in report['runs']:
                  results = run.get('results', [])
                  total += len(results)
                  print(f'CODEQL_RESULTS {name}: {len(results)}')
                  for result in results:
                      locations = []
                      for location in result.get('locations', []):
                          physical = location.get('physicalLocation', {})
                          locations.append({
                              'path': physical.get('artifactLocation', {}).get('uri'),
                              'region': physical.get('region', {}),
                          })
                      print('CODEQL_FINDING ' + json.dumps({
                          'rule': result.get('ruleId'),
                          'level': result.get('level'),
                          'message': result.get('message', {}).get('text'),
                          'locations': locations,
                      }))
          if total:
              raise SystemExit(f'CodeQL reported {total} finding(s)')
          PY
