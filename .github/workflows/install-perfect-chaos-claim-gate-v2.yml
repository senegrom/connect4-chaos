name: Verify strict Perfect Chaos claim gate

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-claim-gate-v2.yml

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-claim-gate-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install and verify the two-report claim gate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/perfect-chaos-claim-gate-v2.tar.xz
          tar --extract --xz --file /tmp/perfect-chaos-claim-gate-v2.tar.xz --directory .
          python3 -m py_compile scripts/perfect-chaos-claim-gate.py scripts/test-perfect-chaos-claim-gate.py
          python3 scripts/test-perfect-chaos-claim-gate.py
          npm run check
          npm test
          git diff --check

      - name: Commit the validated gate and remove the installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git rm .github/workflows/install-perfect-chaos-claim-gate-v2.yml
          git add scripts/perfect-chaos-claim-gate.py scripts/test-perfect-chaos-claim-gate.py
          git commit -m 'Require independent Perfect Chaos proof reports'
          git push origin HEAD:agent/perfect-chaos-16-recovery
