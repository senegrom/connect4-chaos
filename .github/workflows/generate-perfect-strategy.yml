name: Generate perfect-play strategy

on:
  workflow_dispatch:
    inputs:
      handoff_remaining:
        description: Empty cells at which the browser exact solver takes over (18-26)
        required: true
        default: '24'
        type: string
      workers:
        description: Parallel native oracle processes (1-8)
        required: true
        default: '4'
        type: string
      commit_strategy:
        description: Commit the verified strategy to main
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: perfect-play-strategy
  cancel-in-progress: false

env:
  ORACLE_COMMIT: d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
  ORACLE_BOOK_SHA256: 38f9834317c37d9516e45a21da598569a5d1556595686593d14c2e63f59c1f38
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          handoff='${{ inputs.handoff_remaining }}'
          workers='${{ inputs.workers }}'
          if ! [[ "$handoff" =~ ^(1[89]|2[0-6])$ ]]; then
            echo 'handoff_remaining must be an integer from 18 through 26.' >&2
            exit 1
          fi
          if ! [[ "$workers" =~ ^[1-8]$ ]]; then
            echo 'workers must be an integer from 1 through 8.' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project
        run: npm ci

      - name: Build pinned exact oracle
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/PascalPons/connect4.git /tmp/connect4-oracle
          git -C /tmp/connect4-oracle checkout --quiet "$ORACLE_COMMIT"
          make -C /tmp/connect4-oracle -j2 c4solver
          curl --fail --location --retry 3 \
            https://github.com/PascalPons/connect4/releases/download/book/7x6_small.book \
            --output /tmp/connect4-oracle/7x6_small.book
          echo "$ORACLE_BOOK_SHA256  /tmp/connect4-oracle/7x6_small.book" | sha256sum --check --strict

      - name: Generate deterministic exact strategy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-strategy.mjs build \
            --oracle /tmp/connect4-oracle/c4solver \
            --oracle-book /tmp/connect4-oracle/7x6_small.book \
            --exact-table assets/perfect-book.bin \
            --output assets/perfect-strategy.bin \
            --manifest data/perfect-strategy.manifest.json \
            --handoff-remaining '${{ inputs.handoff_remaining }}' \
            --workers '${{ inputs.workers }}' \
            --roles both \
            --source "PascalPons/connect4@$ORACLE_COMMIT weak exact analysis; 7x6_small.book sha256=$ORACLE_BOOK_SHA256"
          node scripts/perfect-strategy.mjs verify --input assets/perfect-strategy.bin

      - name: Validate repository
        run: |
          npm run ci
          git diff --check

      - name: Upload strategy artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfect-play-strategy-r${{ inputs.handoff_remaining }}
          path: |
            assets/perfect-strategy.bin
            data/perfect-strategy.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified strategy
        if: inputs.commit_strategy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/perfect-strategy.bin data/perfect-strategy.manifest.json
          if git diff --cached --quiet; then
            echo 'The committed perfect-play strategy is already current.'
            exit 0
          fi
          git commit -m "Add exact strategy to ${{ inputs.handoff_remaining }} empty cells"
          git push origin HEAD:main
