name: Supervise exact-tooling rollout

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: supervise-exact-tooling-rollout
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile exact named rollout workflows
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflows=(
            finalize-perfect-solver-tooling.yml
            ensure-finalized-exact-tooling.yml
            persist-failed-prefix-journals.yml
            bound-exact-prefix-preparation.yml
            ensure-perfect-chaos-promotion-trigger.yml
            harden-classic-7x7-promotion-fanin.yml
            use-rejection-deltas-in-repair.yml
            expose-perfect-chaos-segment-repair.yml
            install-next-chaos-boundary-generator.yml
            harden-next-chaos-boundary-generator-v2.yml
            harden-next-chaos-boundary-generator-v3.yml
            harden-next-chaos-boundary-generator.yml
          )
          jq -n '{format:"connect4-exact-tooling-rollout-supervisor-v1", workflows:[]}' \
            > /tmp/exact-tooling-rollout.json
          active=0
          remaining=0
          changed=0

          for workflow in "${workflows[@]}"; do
            path=".github/workflows/$workflow"
            [[ -f "$path" ]] || continue
            remaining=$((remaining + 1))
            response="$(gh api --method GET "repos/$repo/actions/workflows/$workflow/runs" \
              -f branch=main -F per_page=20)"
            latest="$(jq -c '.workflow_runs | sort_by(.created_at) | reverse | .[0] // null' <<< "$response")"
            action=observed
            if [[ "$latest" = null ]]; then
              gh workflow run "$workflow" --repo "$repo" --ref main
              action=dispatched
              changed=1
            else
              status="$(jq -r '.status' <<< "$latest")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$latest")"
              attempt="$(jq -r '.run_attempt' <<< "$latest")"
              run_id="$(jq -r '.id' <<< "$latest")"
              if [[ "$status" != completed ]]; then
                active=$((active + 1))
              elif [[ "$conclusion" = failure || "$conclusion" = cancelled || "$conclusion" = timed_out ]]; then
                if (( attempt < 3 )); then
                  gh api --method POST "repos/$repo/actions/runs/$run_id/rerun-failed-jobs"
                  action=rerun-failed-jobs
                  active=$((active + 1))
                  changed=1
                else
                  action=retry-exhausted
                fi
              elif [[ "$conclusion" = success ]]; then
                # A successful one-shot normally removes itself. If the file
                # remains, rerun it against latest main so its race-safe
                # publication step can complete or report a deterministic no-op.
                gh workflow run "$workflow" --repo "$repo" --ref main
                action=redispatched-after-success
                active=$((active + 1))
                changed=1
              fi
            fi
            jq --arg workflow "$workflow" --argjson latest "$latest" --arg action "$action" \
              '.workflows += [{workflow:$workflow, action:$action, latest:$latest}]' \
              /tmp/exact-tooling-rollout.json > /tmp/exact-tooling-rollout.next
            mv /tmp/exact-tooling-rollout.next /tmp/exact-tooling-rollout.json
          done

          complete=false
          required=(
            .audit/finalized-exact-solver-tooling.json
            scripts/perfect-chaos-prefix.mjs
            scripts/perfect-chaos-rejection-delta.mjs
            scripts/perfect-chaos-repair-segment.mjs
            scripts/perfect-chaos-next-boundary.py
            tests/perfect-chaos-promotion-trigger.test.js
            tests/perfect-classic-7x7-promotion-fanin.test.js
            tests/perfect-chaos-journal-deadline.test.js
          )
          if (( remaining == 0 )); then
            complete=true
            for path in "${required[@]}"; do
              [[ -f "$path" ]] || complete=false
            done
            grep -Fq 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs || complete=false
          fi
          jq \
            --argjson remaining "$remaining" \
            --argjson active "$active" \
            --argjson changed "$changed" \
            --argjson complete "$complete" \
            '. + {remaining:$remaining, active:$active, changed:$changed, complete:$complete}' \
            /tmp/exact-tooling-rollout.json > /tmp/exact-tooling-rollout.next
          mv /tmp/exact-tooling-rollout.next /tmp/exact-tooling-rollout.json
          cat /tmp/exact-tooling-rollout.json
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Retain the current rollout decision
        uses: actions/upload-artifact@v4
        with:
          name: exact-tooling-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/exact-tooling-rollout.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish completion and retire the supervisor
        if: steps.supervise.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/exact-tooling-rollout.json .audit/exact-tooling-rollout-complete.json
            git rm --ignore-unmatch .github/workflows/supervise-exact-tooling-rollout.yml
            git add .audit/exact-tooling-rollout-complete.json
            git commit -m 'Record completed exact-tooling rollout'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
