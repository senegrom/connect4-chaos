name: Fix exact-tooling rollout completion guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-exact-tooling-rollout-supervisor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install and validate the missing step identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/supervise-exact-tooling-rollout.yml')
          text = path.read_text()
          anchor = '''      - name: Reconcile exact named rollout workflows
        shell: bash
'''
          replacement = '''      - name: Reconcile exact named rollout workflows
        id: supervise
        shell: bash
'''
          if '        id: supervise\n' not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError('Could not locate the rollout reconciliation step.')
              text = text.replace(anchor, replacement, 1)
          if "if: steps.supervise.outputs.complete == 'true'" not in text:
              raise RuntimeError('The completion guard no longer references the reviewed step identity.')
          path.write_text(text, newline='\n')
          PY
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/supervise-exact-tooling-rollout.yml
          grep -F -- 'id: supervise' .github/workflows/supervise-exact-tooling-rollout.yml
          grep -F -- "steps.supervise.outputs.complete == 'true'" \
            .github/workflows/supervise-exact-tooling-rollout.yml
          git diff --check

      - name: Publish only the reviewed orchestration fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-exact-tooling-rollout-supervisor.yml
          git add .github/workflows/supervise-exact-tooling-rollout.yml
          git commit -m 'Fix exact-tooling rollout completion guard'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
                .github/workflows/supervise-exact-tooling-rollout.yml
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
          exit 1
