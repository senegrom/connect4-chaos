name: Supervise safe exact segment reuse rollout

on:
  workflow_dispatch:
  schedule:
    - cron: '11,41 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: supervise-exact-segment-reuse-rollout
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require a completed clean quarantine
        shell: bash
        run: |
          set -euo pipefail
          test -f .audit/generated-workflow-quarantine.json
          jq -e '.credentialScan.result == "pass"' \
            .audit/generated-workflow-quarantine.json >/dev/null

      - name: Advance only exact source-level reuse work
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            fix-rejection-delta-direct-callers-v2.yml
            use-rejection-deltas-in-repair.yml
            expose-perfect-chaos-segment-repair.yml
            audit-perfect-chaos-round-layout.yml
            verify-perfect-chaos-segment-reuse.yml
            audit-perfect-chaos-classification-shard-layout.yml
            ensure-perfect-chaos-promotion-trigger.yml
          )
          jq -n '{format:"connect4-exact-segment-reuse-rollout-v1",workflows:[]}' \
            > /tmp/exact-segment-reuse-rollout.json
          active=0
          remaining=0
          for workflow in "${workflows[@]}"; do
            path=".github/workflows/$workflow"
            [[ -f "$path" ]] || continue
            remaining=$((remaining + 1))
            response="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch=main -F per_page=20 2>/dev/null || printf '{"workflow_runs":[]}')"
            latest="$(jq -c '.workflow_runs | sort_by(.created_at) | reverse | .[0] // null' <<< "$response")"
            action=observed
            if [[ "$latest" = null ]]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
              action=dispatched
              active=$((active + 1))
            else
              status="$(jq -r '.status' <<< "$latest")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$latest")"
              attempt="$(jq -r '.run_attempt' <<< "$latest")"
              run_id="$(jq -r '.id' <<< "$latest")"
              if [[ "$status" != completed ]]; then
                active=$((active + 1))
              elif [[ "$conclusion" = failure || "$conclusion" = cancelled || "$conclusion" = timed_out ]]; then
                if (( attempt < 3 )); then
                  gh api --method POST \
                    "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/rerun-failed-jobs"
                  action=rerun-failed-jobs
                  active=$((active + 1))
                else
                  action=retry-exhausted
                fi
              elif [[ "$conclusion" = success ]]; then
                gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
                action=redispatched-after-success
                active=$((active + 1))
              fi
            fi
            jq --arg workflow "$workflow" --arg action "$action" --argjson latest "$latest" \
              '.workflows += [{workflow:$workflow,action:$action,latest:$latest}]' \
              /tmp/exact-segment-reuse-rollout.json \
              > /tmp/exact-segment-reuse-rollout.next
            mv /tmp/exact-segment-reuse-rollout.next \
              /tmp/exact-segment-reuse-rollout.json
          done

          complete=false
          required=(
            scripts/perfect-chaos-rejection-delta.mjs
            scripts/perfect-chaos-repair-segment.mjs
            .audit/perfect-chaos-round-layout.json
            .audit/perfect-chaos-segment-reuse-verification.json
            .audit/perfect-chaos-classifier-shard-layout.json
            tests/perfect-chaos-promotion-trigger.test.js
          )
          if (( remaining == 0 )); then
            complete=true
            for path in "${required[@]}"; do [[ -f "$path" ]] || complete=false; done
          fi
          jq --argjson remaining "$remaining" --argjson active "$active" \
             --argjson complete "$complete" \
            '. + {remaining:$remaining,active:$active,complete:$complete}' \
            /tmp/exact-segment-reuse-rollout.json \
            > /tmp/exact-segment-reuse-rollout.next
          mv /tmp/exact-segment-reuse-rollout.next \
            /tmp/exact-segment-reuse-rollout.json
          cat /tmp/exact-segment-reuse-rollout.json
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Retain the rollout decision
        uses: actions/upload-artifact@v4
        with:
          name: exact-segment-reuse-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/exact-segment-reuse-rollout.json
          if-no-files-found: error
          retention-days: 30

      - name: Record completion and retire this supervisor
        if: steps.reconcile.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/exact-segment-reuse-rollout.json \
              .audit/exact-segment-reuse-rollout-complete.json
            git rm --ignore-unmatch \
              .github/workflows/supervise-exact-segment-reuse-rollout.yml
            git add .audit/exact-segment-reuse-rollout-complete.json
            git commit -m 'Record completed exact segment reuse rollout'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
