name: Continue Perfect Chaos 14-to-16 closure

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/continue-perfect-chaos-16-closure.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: continue-perfect-chaos-16-closure
  cancel-in-progress: false

jobs:
  stage_red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31642140708'
      SOURCE_SHA: 'a87140f527c454b3e9a7cad5340b32a4bba78c01'
    steps:
      - uses: actions/checkout@v6

      - name: Download the locked Red round 3 prefix
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$conclusion" = 'success'
          rm -rf prepared
          mkdir -p prepared
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name perfect-chaos-red-14-round3-prepared \
            --dir prepared

      - name: Verify the Red prefix and cumulative rejection table
        shell: bash
        run: |
          set -euo pipefail
          test -f prepared/SHA256SUMS
          if grep -q '  prepared/' prepared/SHA256SUMS; then
            sha256sum --check --strict prepared/SHA256SUMS
          else
            (cd prepared && sha256sum --check --strict SHA256SUMS)
          fi
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, ROLE_CODES, read_table,
          )
          frontier = read_table(
              Path('prepared/red/12-14.frontier.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          rejected = read_table(
              Path('prepared/red/reject-14.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          if frontier.role != ROLE_CODES['red'] or frontier.boundary != 14:
              raise RuntimeError('The staged Red frontier has incompatible metadata.')
          if rejected.role != ROLE_CODES['red'] or rejected.boundary != 14:
              raise RuntimeError('The staged Red rejection table has incompatible metadata.')
          if len(rejected.records) != 7882:
              raise RuntimeError('The staged Red cumulative rejection count is not 7,882.')
          if not frontier.records:
              raise RuntimeError('The staged Red 14-piece frontier is empty.')
          print({'redFrontierRoots': len(frontier.records), 'redRejectedRoots': len(rejected.records)})
          PY

      - name: Publish deterministic Red shard matrix
        id: matrix
        shell: bash
        run: |
          echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(64))))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-14-round3-staged
          path: prepared
          if-no-files-found: error
          retention-days: 30

  stage_yellow:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31641909525'
      SOURCE_SHA: 'e94820dc5f7a3b5ac3d0bf7f2fceb1e6344fb98f'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download and verify the corrected Yellow round 1 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$conclusion" = 'success'
          rm -rf previous seed prepared
          mkdir -p previous seed/yellow
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name perfect-chaos-yellow-16-classification-round1-recovered \
            --dir previous
          summary=$(find previous -name campaign-summary.json -print -quit)
          role=$(find previous -type d -name yellow-prepared -print -quit)
          sums=$(find previous -name SHA256SUMS -print -quit)
          test -n "$summary"
          test -n "$role"
          test -n "$sums"
          test "$(node -p "require('./$summary').newRejectedRoots")" = '15378'
          test "$(node -p "require('./$summary').cumulativeRejectedRoots")" = '15378'
          base=$(dirname "$sums")
          (cd "$base" && sha256sum --check --strict "$(basename "$sums")")
          cp -a "$role"/. seed/yellow/

      - name: Rebuild the exact Yellow prefix through 14 pieces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-chaos-prefix.mjs prepare-role \
            --role yellow \
            --frontier-pieces 16 \
            --pass-budget 9999 \
            --shards 64 \
            --shard-from-pieces 14 \
            --seed-rejections seed \
            --output prepared
          node scripts/perfect-chaos-prefix.mjs replay-role \
            --directory prepared \
            --role yellow \
            --frontier-pieces 14 \
            > prepared/yellow-replay.json
          node - <<'NODE'
          const checkpoint = require('./prepared/checkpoint.json');
          const replay = require('./prepared/yellow-replay.json').replay;
          if (!checkpoint.complete || checkpoint.mode !== 'preparation') {
            throw new Error('Yellow round 2 preparation did not complete.');
          }
          if (replay.segments.at(-1)?.frontierPieces !== 14) {
            throw new Error('Yellow round 2 does not end at the certified 14-piece frontier.');
          }
          NODE
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, ROLE_CODES, read_table,
          )
          frontier = read_table(
              Path('prepared/yellow/12-14.frontier.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          rejected = read_table(
              Path('prepared/yellow/reject-14.bin'),
              FRONTIER_MAGIC,
              FRONTIER_RECORD_SIZE,
          )
          if frontier.role != ROLE_CODES['yellow'] or frontier.boundary != 14:
              raise RuntimeError('The rebuilt Yellow frontier has incompatible metadata.')
          if rejected.role != ROLE_CODES['yellow'] or rejected.boundary != 14:
              raise RuntimeError('The rebuilt Yellow rejection table has incompatible metadata.')
          if len(rejected.records) != 15378:
              raise RuntimeError('The rebuilt Yellow cumulative rejection count is not 15,378.')
          if not frontier.records:
              raise RuntimeError('The rebuilt Yellow 14-piece frontier is empty.')
          print({'yellowFrontierRoots': len(frontier.records), 'yellowRejectedRoots': len(rejected.records)})
          PY
          find prepared -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  prepared/#  #' \
            > prepared/SHA256SUMS
          (cd prepared && sha256sum --check --strict SHA256SUMS)

      - name: Publish deterministic Yellow shard matrix
        id: matrix
        shell: bash
        run: |
          echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(128))))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-14-round2-staged
          path: prepared
          if-no-files-found: error
          retention-days: 30

  classify_red:
    needs: stage_red
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.stage_red.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-round3-staged
          path: prepared

      - name: Compile native solver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp \
            -o /tmp/perfect-chaos-prefix

      - name: Classify deterministic Red shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          python3 scripts/perfect-chaos-classify.py \
            --solver /tmp/perfect-chaos-prefix \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 64 \
            --maximum-states 4000000 \
            --rejected 'shard/rejected-${{ matrix.shard }}.bin' \
            --policy 'shard/policy-${{ matrix.shard }}.bin' \
            --frontier 'shard/frontier-${{ matrix.shard }}.bin' \
            --summary 'shard/summary-${{ matrix.shard }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-round3-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: error
          retention-days: 30

  merge_red:
    needs:
      - stage_red
      - classify_red
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-red-14-round3-staged
          path: prepared

      - uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-red-16-round3-shard-*
          path: shards
          merge-multiple: true

      - name: Merge, verify, and checkpoint Red round 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/red/12-14.frontier.bin \
            --role red \
            --target-pieces 16 \
            --shard-count 64 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table, write_table,
          )
          existing = read_table(
              Path('prepared/red/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          discovered = read_table(
              Path('result/new-reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          if len(existing.records) != 7882:
              raise RuntimeError('Red round 3 did not start from 7,882 cumulative rejections.')
          write_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, existing.role,
              existing.boundary, FRONTIER_RECORD_SIZE,
              [*existing.records, *discovered.records],
          )
          cumulative = read_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          summary = json.loads(Path('result/classification.json').read_text())
          if summary.get('policyConflicts') != 0:
              raise RuntimeError('Conflicting Red policy actions were found.')
          summary['existingRejectedRoots'] = len(existing.records)
          summary['newRejectedRoots'] = len(discovered.records)
          summary['cumulativeRejectedRoots'] = len(cumulative.records)
          summary['rejectionProgress'] = len(cumulative.records) - len(existing.records)
          Path('result/campaign-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          cp -a prepared/red result/red-prepared
          cp result/reject-14.bin result/red-prepared/reject-14.bin
          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          if [[ "$new" == '0' ]]; then
            cp result/14-16.policy.bin result/red-prepared/14-16.policy.bin
            cp result/14-16.frontier.bin result/red-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/red-prepared result/assembled/red
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role red \
              --frontier-pieces 16 \
              > result/red-16-replay.json
          fi
          find result -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  result/#  #' \
            > result/SHA256SUMS
          (cd result && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-16-classification-round3
          path: result
          if-no-files-found: error
          retention-days: 30

  classify_yellow:
    needs: stage_yellow
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.stage_yellow.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-yellow-14-round2-staged
          path: prepared

      - name: Compile native solver
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp \
            -o /tmp/perfect-chaos-prefix

      - name: Classify deterministic Yellow shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          python3 scripts/perfect-chaos-classify.py \
            --solver /tmp/perfect-chaos-prefix \
            --input prepared/yellow/12-14.frontier.bin \
            --role yellow \
            --target-pieces 16 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 128 \
            --maximum-states 4000000 \
            --rejected 'shard/rejected-${{ matrix.shard }}.bin' \
            --policy 'shard/policy-${{ matrix.shard }}.bin' \
            --frontier 'shard/frontier-${{ matrix.shard }}.bin' \
            --summary 'shard/summary-${{ matrix.shard }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-16-round2-shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: error
          retention-days: 30

  merge_yellow:
    needs:
      - stage_yellow
      - classify_yellow
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: perfect-chaos-yellow-14-round2-staged
          path: prepared

      - uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-yellow-16-round2-shard-*
          path: shards
          merge-multiple: true

      - name: Merge, verify, and checkpoint Yellow round 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/yellow/12-14.frontier.bin \
            --role yellow \
            --target-pieces 16 \
            --shard-count 128 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from pathlib import Path
          from perfect_chaos_tables import (
              FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table, write_table,
          )
          existing = read_table(
              Path('prepared/yellow/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          discovered = read_table(
              Path('result/new-reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          if len(existing.records) != 15378:
              raise RuntimeError('Yellow round 2 did not start from 15,378 cumulative rejections.')
          write_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, existing.role,
              existing.boundary, FRONTIER_RECORD_SIZE,
              [*existing.records, *discovered.records],
          )
          cumulative = read_table(
              Path('result/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE,
          )
          summary = json.loads(Path('result/classification.json').read_text())
          if summary.get('policyConflicts') != 0:
              raise RuntimeError('Conflicting Yellow policy actions were found.')
          summary['existingRejectedRoots'] = len(existing.records)
          summary['newRejectedRoots'] = len(discovered.records)
          summary['cumulativeRejectedRoots'] = len(cumulative.records)
          summary['rejectionProgress'] = len(cumulative.records) - len(existing.records)
          Path('result/campaign-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
          cp -a prepared/yellow result/yellow-prepared
          cp result/reject-14.bin result/yellow-prepared/reject-14.bin
          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          if [[ "$new" == '0' ]]; then
            cp result/14-16.policy.bin result/yellow-prepared/14-16.policy.bin
            cp result/14-16.frontier.bin result/yellow-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/yellow-prepared result/assembled/yellow
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role yellow \
              --frontier-pieces 16 \
              > result/yellow-16-replay.json
          fi
          find result -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  result/#  #' \
            > result/SHA256SUMS
          (cd result && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-yellow-16-classification-round2
          path: result
          if-no-files-found: error
          retention-days: 30
