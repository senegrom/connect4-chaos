name: Cancel flawed journal integration verifier

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cancel-journal-integration-v1.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel all active first-version verifier runs
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/install-safe-perfect-chaos-journal.yml/runs" \
            -f branch=main -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
          while read -r id; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" \
              >/dev/null 2>&1 || true
          done < <(jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<< "$response")

      - name: Remove the flawed verifier only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm --ignore-unmatch \
              .github/workflows/install-safe-perfect-chaos-journal.yml \
              .github/workflows/cancel-journal-integration-v1.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Remove flawed journal integration verifier'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
