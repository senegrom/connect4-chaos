name: Export training source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-training-source.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pack training source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/connect4-training-source.tgz neural scripts tests .github package.json package-lock.json
      - name: Upload training source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: training-source
          path: /tmp/connect4-training-source.tgz
          if-no-files-found: error
          retention-days: 1
