name: Install sharded Perfect Chaos incremental repair

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-incremental-repair-sharding.yml
      - scripts/patch-perfect-chaos-incremental-repair-sharding.py

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-incremental-repair-sharding
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply adaptive repair sharding and strengthen CLI coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-perfect-chaos-incremental-repair-sharding.py \
            scripts/perfect-chaos-prefix.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/perfect-chaos-incremental-repair.test.js')
          source = path.read_text()
          old = "    '--maximum-states', '2000000',\n    '--output-policy', outputPolicy,"
          new = (
              "    '--maximum-states', '2000000',\n"
              "    '--shards', '2',\n"
              "    '--minimum-states-per-shard', '10000',\n"
              "    '--shard-workers', '2',\n"
              "    '--output-policy', outputPolicy,"
          )
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise RuntimeError('Could not install sharded repair CLI options in the regression test.')

          old_assertion = (
              "    assert.equal(repaired.report.fallbackFullRegeneration, false);\n"
              "    assert.equal(\n"
              "      repaired.report.unaffectedRoots + repaired.report.affectedExistingRoots,"
          )
          new_assertion = (
              "    assert.equal(repaired.report.fallbackFullRegeneration, false);\n"
              "    assert.equal(repaired.report.repair.format, "
              "'connect4-chaos-prefix-sharded-certificate-v1');\n"
              "    assert.equal(repaired.report.repair.shardWorkers, 2);\n"
              "    assert.equal(\n"
              "      repaired.report.unaffectedRoots + repaired.report.affectedExistingRoots,"
          )
          if old_assertion in source:
              source = source.replace(old_assertion, new_assertion, 1)
          elif new_assertion not in source:
              raise RuntimeError('Could not install sharded repair assertions in the regression test.')
          path.write_text(source)
          PY

      - name: Parse and reproduce the complete small exact verification
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/perfect-chaos-prefix.mjs
          node scripts/perfect-chaos-prefix.mjs verify > sharded-repair-verification.json
          jq -e '
            .incrementalPreparation.repairSummaries | length >= 1
            and all(.[]; .status == "safe"
              and .fallbackFullRegeneration == false
              and (.repairRoots == 0
                or (.repair.format == "connect4-chaos-prefix-sharded-certificate-v1"
                  and .repair.shardWorkers == 2)))
          ' sharded-repair-verification.json >/dev/null

      - name: Verify direct CLI no-op and changed-boundary repairs
        run: node --test tests/perfect-chaos-incremental-repair.test.js

      - name: Commit the verified sharded repair engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs tests/perfect-chaos-incremental-repair.test.js
          if git diff --cached --quiet; then
            echo 'Sharded incremental repair is already installed.'
            exit 0
          fi
          git commit -m 'Shard exact incremental repair for Perfect Chaos'
          git push origin HEAD:agent/perfect-chaos-16-recovery

      - name: Upload sharded repair equivalence evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-sharded-incremental-repair-verification
          path: sharded-repair-verification.json
          if-no-files-found: error
          retention-days: 90
