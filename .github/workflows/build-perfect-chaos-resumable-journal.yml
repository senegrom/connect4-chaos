name: Verify resumable Perfect Chaos prefix journal on current main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-perfect-chaos-resumable-journal.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-perfect-chaos-resumable-journal
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      OUTPUT_BRANCH: agent/perfect-chaos-resumable-journal-v2
    steps:
      - name: Check out the exact triggering main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0

      - name: Check out the reviewed journal patch tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-journal-current-main
          path: patch
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Apply the reviewed patch to current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release rev-parse HEAD)" = "$GITHUB_SHA"
          (cd release && python3 ../patch/scripts/patch-perfect-chaos-journal-current-main.py)
          node --check release/scripts/perfect-chaos-prefix.mjs
          git -C release diff --check
          test "$(git -C release status --short | cut -c4-)" = 'scripts/perfect-chaos-prefix.mjs'

      - name: Prove fresh, reused, and corrupted-journal behavior
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          cd release
          npm ci
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/prefix-verify.json
          jq -e '
            .journal.fresh.hits == 0
            and .journal.fresh.misses >= 2
            and .journal.fresh.stores >= 2
            and .journal.reused.misses == 0
            and .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
            and .journal.recovered.misses >= 1
            and .journal.recovered.hits >= 1
            and (.journal.corrupted.entry | test("^[0-9a-f]{64}$"))
            and (.journal.fresh.sourceSha256 | test("^[0-9a-f]{64}$"))
            and (.journal.fresh.binarySha256 | test("^[0-9a-f]{64}$"))
            and .replay.red.replay.segments[-1].frontierStates == 1477
            and .replay.yellow.replay.segments[-1].frontierStates == 4515
          ' /tmp/prefix-verify.json >/dev/null

          rm -rf /tmp/journal-disabled /tmp/journal-disabled.journal
          node scripts/perfect-chaos-prefix.mjs generate \
            --frontier-pieces 8 \
            --maximum-passes 20 \
            --output /tmp/journal-disabled \
            --journal none \
            > /tmp/journal-disabled.json
          test ! -e /tmp/journal-disabled.journal
          jq -e 'has("journal") | not' /tmp/journal-disabled.json >/dev/null

          rm -rf /tmp/journal-conflict
          set +e
          node scripts/perfect-chaos-prefix.mjs generate \
            --frontier-pieces 8 \
            --maximum-passes 20 \
            --output /tmp/journal-conflict \
            --journal /tmp/journal-conflict \
            > /tmp/journal-conflict.out 2> /tmp/journal-conflict.err
          code=$?
          set -e
          test "$code" != 0
          grep -F -- 'journal must be outside' /tmp/journal-conflict.err

      - name: Run complete exact and browser release gates
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          cd release
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check
          test "$(git status --short | cut -c4-)" = 'scripts/perfect-chaos-prefix.mjs'
          grep -F -- 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'binarySha256' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'invalidations' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'reference.sharding?.count' scripts/perfect-chaos-prefix.mjs

      - name: Publish a production-only branch and pull request
        shell: bash
        run: |
          set -euo pipefail
          cd release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git status --short | cut -c4-)" = 'scripts/perfect-chaos-prefix.mjs'
          git switch -C "$OUTPUT_BRANCH"
          git add scripts/perfect-chaos-prefix.mjs
          git commit -m 'Add resumable exact prefix journal'
          git push --force-with-lease origin "HEAD:refs/heads/$OUTPUT_BRANCH"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$OUTPUT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            cat > /tmp/pr-body.md <<'EOF'
          Exact prefix preparation repeats expensive deterministic native segment work across counterexample rounds. This adds a content-addressed journal that reuses only entries bound to the exact native binary, source frontier, role, boundaries, rejection tables, sharding geometry and generator semantics.

          Corrupted, truncated, stale, mismatched or partially written entries are invalidated and recomputed. The journal is outside the certificate output tree and never becomes certificate evidence. Disabling it reproduces the existing behavior.

          The current-main verifier proved fresh-store, complete reuse and corruption recovery; compared sharded and unsharded exact outputs; replayed the committed 16-piece reference; and passed the complete exact, policy and browser release gates. The published branch changes only `scripts/perfect-chaos-prefix.mjs`.
          EOF
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$OUTPUT_BRANCH" \
              --title 'Add resumable exact Perfect Chaos prefix journal' \
              --body-file /tmp/pr-body.md
          fi

      - name: Retain exact verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-resumable-journal-current-main
          path: |
            /tmp/prefix-verify.json
            /tmp/journal-disabled.json
          if-no-files-found: error
          retention-days: 90
