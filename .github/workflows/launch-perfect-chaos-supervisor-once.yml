name: Launch repaired Perfect Chaos supervisor once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/launch-perfect-chaos-supervisor-once.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: launch-perfect-chaos-supervisor-once
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch and bind exactly one supervisor run
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow=supervise-perfect-chaos-main.yml
          before="$(gh api --method GET \
            "repos/$repo/actions/workflows/$workflow/runs" \
            -f branch=main -F per_page=100 --jq '[.workflow_runs[].id]')"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$workflow" --repo "$repo" --ref main

          candidate=''
          for _ in $(seq 1 60); do
            runs="$(gh api --method GET \
              "repos/$repo/actions/workflows/$workflow/runs" \
              -f branch=main -F per_page=100)"
            candidates="$(jq \
              --argjson before "$before" \
              --arg started "$started" \
              '[.workflow_runs[] | select(
                .event == "workflow_dispatch"
                and (.id as $id | ($before | index($id)) == null)
                and .created_at >= $started
              )]' <<< "$runs")"
            count="$(jq 'length' <<< "$candidates")"
            if [[ "$count" = 1 ]]; then
              candidate="$(jq -c '.[0] | {
                id, run_attempt, event, status, conclusion, head_sha,
                created_at, updated_at, html_url, display_title
              }' <<< "$candidates")"
              break
            fi
            if (( count > 1 )); then
              echo "Ambiguous supervisor launch: $count runs appeared." >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$candidate"
          jq -n \
            --argjson run "$candidate" \
            --arg launchedAt "$started" \
            --arg sourceSha "$GITHUB_SHA" \
            '{
              format:"connect4-perfect-chaos-supervisor-launch-v1",
              sourceSha:$sourceSha,
              launchedAt:$launchedAt,
              run:$run
            }' > /tmp/perfect-chaos-supervisor-launch.json
          cat /tmp/perfect-chaos-supervisor-launch.json

      - name: Record the run and remove temporary launch probes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/perfect-chaos-supervisor-launch.json \
              .audit/perfect-chaos-supervisor-launch.json
            git rm --ignore-unmatch \
              .github/workflows/launch-perfect-chaos-supervisor-once.yml \
              .github/workflows/test-connector-action-trigger.yml \
              .github/workflows/inspect-pr19-build.yml \
              .audit/connector-action-trigger.json \
              .audit/pr19-final-build-inspection.json
            git add .audit/perfect-chaos-supervisor-launch.json
            git commit -m 'Record repaired Perfect Chaos supervisor launch'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
