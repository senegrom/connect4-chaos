name: Build rerun-safe Perfect Chaos artifact handling

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/build-rerun-safe-chaos-artifacts.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-rerun-safe-perfect-chaos-artifacts
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out campaign tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Start from the verified release evidence workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml

      - name: Install rerun-safe selector and patch production workflows
        shell: bash
        env:
          DOWNLOAD_B64: ...