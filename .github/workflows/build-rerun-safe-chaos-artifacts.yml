name: Build rerun-safe Perfect Chaos artifact handling

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/build-rerun-safe-chaos-artifacts.yml
      - scripts/perfect-chaos-download-artifact.py
      - scripts/test-perfect-chaos-download-artifact.py
      - scripts/patch-rerun-safe-artifacts.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-rerun-safe-perfect-chaos-artifacts
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out campaign tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Start from the verified release evidence workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml

      - name: Patch production workflows with the committed selector
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/perfect-chaos-download-artifact.py scripts/test-perfect-chaos-download-artifact.py
          python3 scripts/patch-rerun-safe-artifacts.py
          python3 -m py_compile \
            scripts/perfect-chaos-download-artifact.py \
            scripts/test-perfect-chaos-download-artifact.py

      - name: Prove duplicate Red rerun artifacts are byte-equivalent
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live-red live-red-audit
          python3 scripts/perfect-chaos-download-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id 32034741055 \
            --run-sha 57f36a602aef0d2515da93a858a7b80adc8842a6 \
            --artifact-name perfect-chaos-red-18-40047-round \
            --output live-red \
            --metadata live-red-audit/download.json
          jq -e '
            .format == "connect4-chaos-equivalent-named-artifact-download-v1"
            and .matchingArchives == 2
            and .selectedArtifactId == 9292183852
            and ([.artifacts[].contentManifestSha256] | unique | length) == 1
          ' live-red-audit/download.json >/dev/null
          python3 scripts/perfect-chaos-artifacts.py verify --directory live-red
          jq -e '
            .role == "red"
            and .fromPieces == 16
            and .targetPieces == 18
            and .existingRejectedRoots == 40047
            and .newRejectedRoots == 314
            and .cumulativeRejectedRoots == 40361
            and .classificationComplete == true
            and .policyConflicts == 0
          ' live-red/campaign-summary.json >/dev/null

      - name: Run focused and complete verification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-perfect-chaos-download-artifact.py
          python3 scripts/test-perfect-chaos-download-shards.py
          python3 scripts/test-perfect-chaos-auto-advance.py
          python3 scripts/test-perfect-chaos-certify-closure.py
          npm ci
          npm run ci
          npm run test:browser

      - name: Parse workflows and require the exact production diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf live-red live-red-audit
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/ci.yml \
            .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-16-round.yml \
            .github/workflows/reusable-perfect-chaos-18-round.yml \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml
          git diff --check
          git status --short | tee /tmp/status.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              '.github/workflows/ci.yml',
              '.github/workflows/reusable-perfect-chaos-16-evidenced-round.yml',
              '.github/workflows/reusable-perfect-chaos-18-evidenced-round.yml',
              '.github/workflows/reusable-perfect-chaos-16-round.yml',
              '.github/workflows/reusable-perfect-chaos-18-round.yml',
              '.github/workflows/reusable-perfect-chaos-auto-advance.yml',
          }
          ignored = set()
          actual = set()
          for line in Path('/tmp/status.txt').read_text().splitlines():
              if line:
                  actual.add(line[3:])
          actual -= ignored
          if actual != expected:
              raise RuntimeError(
                  f'Production diff differs: missing={sorted(expected-actual)}, '
                  f'unexpected={sorted(actual-expected)}'
              )
          PY

      - name: Package verified production files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verified
          mkdir -p verified
          cp --parents \
            .github/workflows/ci.yml \
            .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-16-round.yml \
            .github/workflows/reusable-perfect-chaos-18-round.yml \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml \
            scripts/perfect-chaos-download-artifact.py \
            scripts/test-perfect-chaos-download-artifact.py \
            verified/
          (cd verified && \
            find . -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS && \
            sha256sum --check --strict SHA256SUMS)

      - name: Upload verified production package
        uses: actions/upload-artifact@v4
        with:
          name: verified-rerun-safe-chaos-artifacts
          path: verified
          if-no-files-found: error
          retention-days: 90
