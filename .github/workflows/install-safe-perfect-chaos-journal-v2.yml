name: Verify literal-safe exact journal integration v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-safe-perfect-chaos-journal-v2.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: install-safe-perfect-chaos-journal-v2
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require clean quarantine and removal of the first verifier
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 330); do
            git fetch origin main
            if git cat-file -e origin/main:.audit/generated-workflow-quarantine.json 2>/dev/null \
              && git show origin/main:.audit/generated-workflow-quarantine.json \
                | jq -e '.credentialScan.result == "pass"' >/dev/null \
              && ! git cat-file -e origin/main:.github/workflows/install-safe-perfect-chaos-journal.yml 2>/dev/null; then
              git reset --hard origin/main
              exit 0
            fi
            sleep 30
          done
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply the independently verified journal source file
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs; then
            if ! git ls-remote --exit-code --heads origin \
                refs/heads/agent/perfect-chaos-resumable-journal-v2 >/dev/null; then
              if git cat-file -e HEAD:.github/workflows/build-perfect-chaos-resumable-journal.yml 2>/dev/null; then
                gh workflow run build-perfect-chaos-resumable-journal.yml \
                  --repo "$GITHUB_REPOSITORY" --ref main
              fi
              for _ in $(seq 1 240); do
                git ls-remote --exit-code --heads origin \
                  refs/heads/agent/perfect-chaos-resumable-journal-v2 >/dev/null && break
                sleep 30
              done
            fi
            git fetch origin agent/perfect-chaos-resumable-journal-v2
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r FETCH_HEAD)
            test "$(printf '%s\n' "${changed[@]}")" = 'scripts/perfect-chaos-prefix.mjs'
            git cherry-pick --no-commit FETCH_HEAD
          fi
          grep -F -- 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs
          node --check scripts/perfect-chaos-prefix.mjs

      - name: Render target expressions without exposing them to this workflow parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          target = Path('.github/workflows/reusable-perfect-chaos-18-round.yml')
          text = target.read_text()
          start = text.index('  prepare:\n')
          endings = [
              text.find('\n  classify:', start),
              text.find('\n  merge:', start),
              text.find('\n  evidence:', start),
          ]
          end = min(value for value in endings if value >= 0)
          prefix, job, suffix = text[:start], text[start:end], text[end:]
          if 'actions/cache/restore@v4' in job or '--journal ' in job:
              raise RuntimeError('The exact prepare job already has an unreviewed journal boundary.')

          expression = lambda value: chr(36) + '{{ ' + value + ' }}'
          role = expression('inputs.role')
          runner_os = expression('runner.os')
          run_id = expression('github.run_id')
          run_attempt = expression('github.run_attempt')
          prepare_outcome = expression('steps.exact-prepare.outcome')
          journal = f'$RUNNER_TEMP/perfect-chaos-prefix-journal-{role}'
          key = f'perfect-chaos-prefix-journal-v2-{runner_os}-{role}-{run_id}-{run_attempt}'
          restore = f'perfect-chaos-prefix-journal-v2-{runner_os}-{role}-'

          npm_anchor = '      - run: npm ci\n'
          if job.count(npm_anchor) != 1:
              raise RuntimeError('Could not locate exactly one prepare-job npm installation.')
          cache = f'''      - name: Create exact prefix journal directory
        shell: bash
        run: mkdir -p "{journal}"

      - name: Restore exact prefix journal
        uses: actions/cache/restore@v4
        with:
          path: {journal}
          key: {key}
          restore-keys: |
            {restore}

'''
          job = job.replace(npm_anchor, npm_anchor + cache, 1)

          command = 'node scripts/perfect-chaos-prefix.mjs prepare-role \\\n'
          if job.count(command) != 1:
              raise RuntimeError('Could not locate exactly one prepare-role command.')
          command_at = job.index(command)
          run_at = job.rfind('        run: |\n', 0, command_at)
          step_at = job.rfind('      - ', 0, run_at)
          if min(run_at, step_at) < 0:
              raise RuntimeError('Could not isolate the exact preparation step.')
          header = job[step_at:run_at]
          if 'id: exact-prepare' in header or 'continue-on-error:' in header:
              raise RuntimeError('The exact preparation step already has outcome handling.')
          job = job[:step_at] + header + (
              '        id: exact-prepare\n'
              '        continue-on-error: true\n'
          ) + job[run_at:]

          timeout = re.search(r'^    timeout-minutes: ([0-9]+)$', job, re.M)
          if timeout is None:
              raise RuntimeError('The exact prepare job requires an explicit timeout.')
          job_minutes = int(timeout.group(1))
          if job_minutes < 45:
              raise RuntimeError(f'Unsafe exact preparation timeout: {job_minutes}.')
          command_minutes = job_minutes - 20
          bounded = (
              f'timeout --signal=TERM --kill-after=120s {command_minutes}m '
              'node scripts/perfect-chaos-prefix.mjs prepare-role \\\n'
              f'            --journal "{journal}" \\\n'
          )
          job = job.replace(command, bounded, 1)

          command_at = job.index('node scripts/perfect-chaos-prefix.mjs prepare-role')
          next_step = job.find('\n      - ', command_at)
          if next_step < 0:
              raise RuntimeError('Could not locate the post-preparation step.')
          persistence = f'''
      - name: Validate partial exact prefix journal
        id: journal-state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          journal="{journal}"
          test -d "$journal" && test ! -L "$journal"
          if find "$journal" -type l -print -quit | grep -q .; then
            echo 'The exact journal contains a symbolic link.' >&2
            exit 1
          fi
          bytes="$(du -sb "$journal" | cut -f1)"
          files="$(find "$journal" -type f | wc -l)"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if (( files > 0 && bytes <= 4294967296 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save complete content-addressed journal entries
        if: always() && steps.journal-state.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: {journal}
          key: {key}

      - name: Preserve exact preparation outcome
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: {prepare_outcome}
        run: |
          set -euo pipefail
          if [[ "$PREPARE_OUTCOME" != success ]]; then
            echo "Exact prefix preparation concluded: $PREPARE_OUTCOME" >&2
            exit 1
          fi

'''
          job = job[:next_step] + persistence + job[next_step:]
          target.write_text(prefix + job + suffix, newline='\n')

          test_path = Path('tests/perfect-chaos-journal-workflow.test.js')
          test_path.write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';

          const source = readFileSync(fileURLToPath(new URL(
            '../.github/workflows/reusable-perfect-chaos-18-round.yml',
            import.meta.url,
          )), 'utf8');
          const start = source.indexOf('  prepare:\n');
          const end = ['\n  classify:', '\n  merge:', '\n  evidence:']
            .map((anchor) => source.indexOf(anchor, start))
            .filter((value) => value >= 0)
            .sort((left, right) => left - right)[0];
          const prepare = source.slice(start, end);
          const expression = (value) => String.fromCharCode(36) + '{{ ' + value + ' }}';

          test('journal cache identity is scoped by role, run, and attempt', () => {
            assert.equal((prepare.match(/actions\/cache\/restore@v4/g) ?? []).length, 1);
            assert.equal((prepare.match(/actions\/cache\/save@v4/g) ?? []).length, 1);
            const key = [
              'perfect-chaos-prefix-journal-v2',
              expression('runner.os'),
              expression('inputs.role'),
              expression('github.run_id'),
              expression('github.run_attempt'),
            ].join('-');
            assert.ok(prepare.includes('key: ' + key));
          });

          test('bounded preparation saves complete entries before restoring failure', () => {
            assert.match(prepare, /timeout --signal=TERM --kill-after=120s [0-9]+m node scripts\/perfect-chaos-prefix\.mjs prepare-role/);
            const command = prepare.indexOf('node scripts/perfect-chaos-prefix.mjs prepare-role');
            const save = prepare.indexOf('uses: actions/cache/save@v4');
            const gate = prepare.indexOf('Preserve exact preparation outcome');
            assert.ok(command >= 0 && save > command && gate > save);
            assert.match(prepare.slice(0, command), /id: exact-prepare/);
            assert.match(prepare.slice(0, command), /continue-on-error: true/);
            assert.ok(prepare.includes('PREPARE_OUTCOME: ' + expression('steps.exact-prepare.outcome')));
          });

          test('journal storage is bounded and outside certificate output', () => {
            assert.match(prepare, /bytes <= 4294967296/);
            assert.match(prepare, /find "\$journal" -type l/);
            const paths = prepare.split('\n').filter((line) => line.trimStart().startsWith('path: '));
            assert.equal(paths.length, 2);
            assert.ok(paths.every((line) => !/generated|prepared/.test(line)));
          });
          ''', newline='\n')

          rendered = target.read_text()
          for value in (
              expression('inputs.role'),
              expression('runner.os'),
              expression('github.run_id'),
              expression('github.run_attempt'),
              expression('steps.exact-prepare.outcome'),
          ):
              if value not in rendered:
                  raise RuntimeError(f'Rendered exact workflow is missing {value!r}.')
          PY

          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/reusable-perfect-chaos-18-round.yml
          node --check tests/perfect-chaos-journal-workflow.test.js
          git diff --check

      - name: Prove exact journal semantics and all release gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/perfect-chaos-journal-workflow.test.js
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/literal-safe-journal-v2.json
          jq -e '
            .journal.fresh.hits == 0
            and .journal.fresh.misses >= 2
            and .journal.reused.misses == 0
            and .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
            and .journal.recovered.hits >= 1
          ' /tmp/literal-safe-journal-v2.json >/dev/null
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish only the tested production files and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          paths = [
              Path('scripts/perfect-chaos-prefix.mjs'),
              Path('.github/workflows/reusable-perfect-chaos-18-round.yml'),
              Path('tests/perfect-chaos-journal-workflow.test.js'),
          ]
          audit = {
              'format': 'connect4-literal-safe-perfect-chaos-journal-v1',
              'result': 'success',
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'files': [
                  {
                      'path': path.as_posix(),
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in paths
              ],
              'journalIsCertificateEvidence': False,
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/literal-safe-perfect-chaos-journal-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-safe-perfect-chaos-journal-v2.yml
          mkdir -p .audit
          cp /tmp/literal-safe-perfect-chaos-journal-audit.json \
            .audit/literal-safe-perfect-chaos-journal.json
          git add scripts/perfect-chaos-prefix.mjs \
                  .github/workflows/reusable-perfect-chaos-18-round.yml \
                  tests/perfect-chaos-journal-workflow.test.js \
                  .audit/literal-safe-perfect-chaos-journal.json
          git commit -m 'Persist resumable exact prefix journals safely'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
                .github/workflows/reusable-perfect-chaos-18-round.yml
              node --test tests/perfect-chaos-journal-workflow.test.js
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Retain full journal proof output
        uses: actions/upload-artifact@v4
        with:
          name: literal-safe-perfect-chaos-journal-v2-${{ github.run_id }}
          path: /tmp/literal-safe-journal-v2.json
          if-no-files-found: error
          retention-days: 90
