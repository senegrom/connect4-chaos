name: Compute perfect classic 7x6 role 2 certificate

on:
  push:
    branches:
      - agent/perfect-classic-missing-certificates
    paths:
      - .github/workflows/compute-perfect-classic-7x6-role2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfect-classic-certificate-7x6-role2-${{ github.ref }}
  cancel-in-progress: false

env:
  ROWS: '7'
  COLUMNS: '6'
  CONNECT: '4'
  ROLE: '2'
  ROOT_VALUE: '-1'
  HANDOFF: '24'
  TABLE_BITS: '27'
  MAXIMUM_NODES: '0'
  MAXIMUM_STATES: '30000000'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/7x6-r2-initial
          node scripts/perfect-classic-shards.mjs initial-frontier \
            --rows "$ROWS" --columns "$COLUMNS" --connect "$CONNECT" \
            --role "$ROLE" --root-value "$ROOT_VALUE" \
            --output generated/7x6-r2-initial/matrix.json \
            > generated/7x6-r2-initial/report.json
          echo "matrix=$(jq -c '{include:.include}' generated/7x6-r2-initial/matrix.json)" >> "$GITHUB_OUTPUT"

  prefix-one:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Solve one-move AI state to the three-move frontier
        shell: bash
        run: |
          set -euo pipefail
          output="generated/7x6-r2-prefix1-${{ matrix.id }}"
          mkdir -p "$output"
          node scripts/perfect-classic-shards.mjs generate \
            --rows "$ROWS" --columns "$COLUMNS" --connect "$CONNECT" --role "$ROLE" \
            --start-current '${{ matrix.current }}' --start-mask '${{ matrix.mask }}' \
            --start-moves '${{ matrix.moves }}' --handoff-remaining "$HANDOFF" \
            --frontier-remaining 39 --table-bits "$TABLE_BITS" \
            --maximum-nodes "$MAXIMUM_NODES" --maximum-states "$MAXIMUM_STATES" \
            --output "$output" > "$output/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: c4cert-7x6-r2-prefix1-${{ matrix.id }}
          path: generated/7x6-r2-prefix1-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

  collect-one:
    needs: prefix-one
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: c4cert-7x6-r2-prefix1-*
          path: downloaded
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find downloaded -type f -name fragment.json | sort)
          args=(); for manifest in "${manifests[@]}"; do args+=(--input "$manifest"); done
          mkdir -p generated/7x6-r2-frontier1
          node scripts/perfect-classic-shards.mjs collect-frontier "${args[@]}" \
            --output generated/7x6-r2-frontier1/matrix.json \
            > generated/7x6-r2-frontier1/report.json
          echo "matrix=$(jq -c '{include:.include}' generated/7x6-r2-frontier1/matrix.json)" >> "$GITHUB_OUTPUT"

  prefix-two:
    needs: collect-one
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.collect-one.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Solve three-move AI state to the five-move frontier
        shell: bash
        run: |
          set -euo pipefail
          output="generated/7x6-r2-prefix2-${{ matrix.id }}"
          mkdir -p "$output"
          node scripts/perfect-classic-shards.mjs generate \
            --rows "$ROWS" --columns "$COLUMNS" --connect "$CONNECT" --role "$ROLE" \
            --start-current '${{ matrix.current }}' --start-mask '${{ matrix.mask }}' \
            --start-moves '${{ matrix.moves }}' --handoff-remaining "$HANDOFF" \
            --frontier-remaining 37 --table-bits "$TABLE_BITS" \
            --maximum-nodes "$MAXIMUM_NODES" --maximum-states "$MAXIMUM_STATES" \
            --output "$output" > "$output/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: c4cert-7x6-r2-prefix2-${{ matrix.id }}
          path: generated/7x6-r2-prefix2-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

  collect-two:
    needs: prefix-two
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: c4cert-7x6-r2-prefix2-*
          path: downloaded
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find downloaded -type f -name fragment.json | sort)
          args=(); for manifest in "${manifests[@]}"; do args+=(--input "$manifest"); done
          mkdir -p generated/7x6-r2-frontier2
          node scripts/perfect-classic-shards.mjs collect-frontier "${args[@]}" \
            --output generated/7x6-r2-frontier2/matrix.json \
            > generated/7x6-r2-frontier2/report.json
          echo "matrix=$(jq -c '{include:.include}' generated/7x6-r2-frontier2/matrix.json)" >> "$GITHUB_OUTPUT"

  full:
    needs: collect-two
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.collect-two.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the exact five-move subtree certificate
        shell: bash
        run: |
          set -euo pipefail
          output="generated/7x6-r2-full-${{ matrix.id }}"
          mkdir -p "$output"
          node scripts/perfect-classic-shards.mjs generate \
            --rows "$ROWS" --columns "$COLUMNS" --connect "$CONNECT" --role "$ROLE" \
            --start-current '${{ matrix.current }}' --start-mask '${{ matrix.mask }}' \
            --start-moves '${{ matrix.moves }}' --handoff-remaining "$HANDOFF" \
            --table-bits "$TABLE_BITS" --maximum-nodes "$MAXIMUM_NODES" \
            --maximum-states "$MAXIMUM_STATES" --output "$output" \
            > "$output/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: c4cert-7x6-r2-full-${{ matrix.id }}
          path: generated/7x6-r2-full-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [prefix-one, prefix-two, full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: c4cert-7x6-r2-*
          path: downloaded
      - shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find downloaded -type f -name fragment.json | sort)
          args=(); for manifest in "${manifests[@]}"; do args+=(--input "$manifest"); done
          mkdir -p generated/7x6-r2-certificate
          node scripts/perfect-classic-shards.mjs assemble "${args[@]}" \
            --root-value "$ROOT_VALUE" --output generated/7x6-r2-certificate \
            > generated/7x6-r2-certificate/assembly.json
      - uses: actions/upload-artifact@v4
        with:
          name: c4cert-7x6-r2-assembled
          path: generated/7x6-r2-certificate
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: c4cert-7x6-r2-assembled
          path: generated/7x6-r2-certificate
      - shell: bash
        run: |
          set -euo pipefail
          node scripts/perfect-classic-policy.mjs verify-reference \
            --reference generated/7x6-r2-certificate/manifest.json \
            --verify-table-bits 25 \
            > generated/7x6-r2-certificate/verification.json
          node scripts/perfect-classic-shards.mjs finalize \
            --reference generated/7x6-r2-certificate/manifest.json \
            --verification generated/7x6-r2-certificate/verification.json \
            > generated/7x6-r2-certificate/finalization.json
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-certificate-7x6-c4-role2
          path: generated/7x6-r2-certificate
          if-no-files-found: error
          retention-days: 90
