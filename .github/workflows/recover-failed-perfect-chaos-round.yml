name: Recover failed Perfect Chaos proof jobs
run-name: >-
  Recover failed Perfect Chaos jobs — run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Continue Perfect Chaos 18-piece refinement on main
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-perfect-chaos-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CONTINUE_WORKFLOW: continue-perfect-chaos-18-main.yml
      WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Bind the failure to one unchanged role state
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          Path('failed-workflow-run.json').write_text(
              os.environ['WORKFLOW_RUN_JSON'] + '\n', newline='\n'
          )
          PY
          python3 scripts/perfect-chaos-failed-run-recovery.py \
            --root . \
            --event failed-workflow-run.json \
            --maximum-attempts 3 \
            --output failed-run-recovery-decision.json
          cat failed-run-recovery-decision.json
          {
            echo "action=$(jq -r '.action' failed-run-recovery-decision.json)"
            echo "role=$(jq -r '.role // ""' failed-run-recovery-decision.json)"
            echo "run_id=$(jq -r '.runId' failed-run-recovery-decision.json)"
            echo "run_attempt=$(jq -r '.runAttempt // 0' failed-run-recovery-decision.json)"
            echo "head_sha=$(jq -r '.headSha // ""' failed-run-recovery-decision.json)"
            echo "state_path=$(jq -r '.statePath // ""' failed-run-recovery-decision.json)"
            echo "state_digest=$(jq -r '.stateSha256 // ""' failed-run-recovery-decision.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Recheck role-specific active work immediately before recovery
        id: active
        if: steps.decision.outputs.action == 'rerun-failed-jobs'
        shell: bash
        env:
          ROLE: ${{ steps.decision.outputs.role }}
        run: |
          set -euo pipefail
          printf '{"workflows":[' > active-runs-payload.json
          separator=''
          for workflow in \
            start-perfect-chaos-18-from-main.yml \
            advance-perfect-chaos-18-main-bootstrap.yml \
            "$CONTINUE_WORKFLOW"
          do
            response="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch=main -F per_page=100)"
            runs="$(jq '[.workflow_runs[] | {
              id, path, event, status, head_branch, head_sha, display_title,
              created_at, updated_at
            }]' <<< "$response")"
            printf '%s{"workflow":%s,"runs":%s}' \
              "$separator" "$(jq -Rn --arg value "$workflow" '$value')" "$runs" \
              >> active-runs-payload.json
            separator=','
          done
          printf ']}' >> active-runs-payload.json

          python3 scripts/perfect-chaos-main-active-runs.py \
            --root . \
            --input active-runs-payload.json \
            --output active-runs-classified.json
          cat active-runs-classified.json
          active="$(jq -r --arg role "$ROLE" '.activeRoles | index($role) != null' \
            active-runs-classified.json)"
          echo "role_active=$active" >> "$GITHUB_OUTPUT"

      - name: Rerun only the failed jobs of the bound workflow run
        id: rerun
        if: >-
          steps.decision.outputs.action == 'rerun-failed-jobs'
          && steps.active.outputs.role_active == 'false'
        shell: bash
        env:
          RUN_ID: ${{ steps.decision.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.decision.outputs.run_attempt }}
          HEAD_SHA: ${{ steps.decision.outputs.head_sha }}
          STATE_PATH: ${{ steps.decision.outputs.state_path }}
          STATE_DIGEST: ${{ steps.decision.outputs.state_digest }}
        run: |
          set -euo pipefail
          current_digest="$(sha256sum "$STATE_PATH" | cut -d' ' -f1)"
          test "$current_digest" = "$STATE_DIGEST"

          run="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.path' <<< "$run")" = ".github/workflows/$CONTINUE_WORKFLOW"
          test "$(jq -r '.head_branch' <<< "$run")" = main
          test "$(jq -r '.head_sha' <<< "$run")" = "$HEAD_SHA"
          test "$(jq -r '.status' <<< "$run")" = completed
          test "$(jq -r '.conclusion' <<< "$run")" = failure
          test "$(jq -r '.run_attempt' <<< "$run")" = "$RUN_ATTEMPT"

          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
          expected_attempt=$((RUN_ATTEMPT + 1))
          observed=false
          for _ in $(seq 1 60); do
            run="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
            attempt="$(jq -r '.run_attempt' <<< "$run")"
            status="$(jq -r '.status' <<< "$run")"
            if [[ "$attempt" = "$expected_attempt" ]]; then
              observed=true
              jq '{id, run_attempt, status, conclusion, head_sha, html_url}' <<< "$run" \
                > failed-run-rerun.json
              break
            fi
            sleep 2
          done
          if [[ "$observed" != true ]]; then
            echo "Run $RUN_ID did not enter attempt $expected_attempt." >&2
            exit 1
          fi
          cat failed-run-rerun.json
          echo "rerun=true" >> "$GITHUB_OUTPUT"

      - name: Publish recovery evidence
        if: always()
        shell: bash
        env:
          ROLE_ACTIVE: ${{ steps.active.outputs.role_active || 'not-checked' }}
          RERUN: ${{ steps.rerun.outputs.rerun || 'false' }}
        run: |
          set -euo pipefail
          ROLE_ACTIVE="$ROLE_ACTIVE" RERUN="$RERUN" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          decision_path = Path('failed-run-recovery-decision.json')
          decision = json.loads(decision_path.read_text()) if decision_path.exists() else None
          classified_path = Path('active-runs-classified.json')
          rerun_path = Path('failed-run-rerun.json')
          evidence = {
              'format': 'connect4-chaos-failed-run-recovery-evidence-v1',
              'decision': decision,
              'roleActiveAtRecheck': os.environ['ROLE_ACTIVE'],
              'rerunIssued': os.environ['RERUN'] == 'true',
              'classifiedActiveRuns': (
                  json.loads(classified_path.read_text()) if classified_path.exists() else None
              ),
              'rerun': json.loads(rerun_path.read_text()) if rerun_path.exists() else None,
              'recoveryRunId': int(os.environ['GITHUB_RUN_ID']),
              'recoveryRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('failed-run-recovery-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perfect-chaos-failed-run-recovery-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: |
            failed-run-recovery-decision.json
            active-runs-classified.json
            failed-run-rerun.json
            failed-run-recovery-evidence.json
          if-no-files-found: warn
          retention-days: 90
