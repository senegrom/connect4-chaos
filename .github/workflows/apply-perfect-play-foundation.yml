name: Apply perfect-play foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-perfect-play-foundation.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: apply-perfect-play-foundation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Apply reviewed source changes
        run: python .automation/start-perfect-play.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project
        run: npm ci

      - name: Build pinned exact oracle
        shell: bash
        env:
          ORACLE_COMMIT: d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/PascalPons/connect4.git /tmp/connect4-oracle
          git -C /tmp/connect4-oracle checkout --quiet "$ORACLE_COMMIT"
          make -C /tmp/connect4-oracle -j2 c4solver
          curl --fail --location --retry 3 \
            https://github.com/PascalPons/connect4/releases/download/book/7x6_small.book \
            --output /tmp/connect4-oracle/7x6_small.book
          echo "ORACLE_BOOK_SHA=$(sha256sum /tmp/connect4-oracle/7x6_small.book | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"

      - name: Generate exact book through ply 8
        shell: bash
        env:
          ORACLE_COMMIT: d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
        run: |
          set -euo pipefail
          node scripts/perfect-book.mjs enumerate --depth 8 > /tmp/perfect-positions.txt
          /tmp/connect4-oracle/c4solver \
            -a \
            -b /tmp/connect4-oracle/7x6_small.book \
            < /tmp/perfect-positions.txt \
            > /tmp/perfect-scores.txt
          test "$(wc -l < /tmp/perfect-scores.txt)" -eq "$(wc -l < /tmp/perfect-positions.txt)"
          node scripts/perfect-book.mjs pack \
            --input /tmp/perfect-scores.txt \
            --output assets/perfect-book.bin \
            --manifest data/perfect-book.manifest.json \
            --max-ply 8 \
            --source "PascalPons/connect4@$ORACLE_COMMIT; 7x6_small.book sha256=$ORACLE_BOOK_SHA"

      - name: Validate implementation
        run: |
          npm run ci
          git diff --check

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Start exact perfect-play book"
          git push origin HEAD:main
          GH_TOKEN="${{ github.token }}" gh workflow run ci.yml --ref main
          GH_TOKEN="${{ github.token }}" gh workflow run pages.yml --ref main
