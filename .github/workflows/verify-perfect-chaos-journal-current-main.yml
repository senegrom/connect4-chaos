name: Verify resumable Perfect Chaos prefix journal

on:
  push:
    branches:
      - agent/perfect-chaos-journal-current-main
    paths:
      - .github/workflows/verify-perfect-chaos-journal-current-main.yml
      - scripts/patch-perfect-chaos-journal-current-main.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-perfect-chaos-journal-current-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PARENT: c7d04915623f31bf16425409c3686fe2ff901663
      PATCH_BRANCH: agent/perfect-chaos-journal-current-main
    steps:
      - name: Check out the exact current main parent
        uses: actions/checkout@v6
        with:
          ref: c7d04915623f31bf16425409c3686fe2ff901663
          path: release
          fetch-depth: 0

      - name: Check out reviewed patch tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-journal-current-main
          path: patch
          fetch-depth: 0

      - name: Apply the reviewed current-main journal patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_PARENT"
          (cd release && python3 ../patch/scripts/patch-perfect-chaos-journal-current-main.py)
          node --check release/scripts/perfect-chaos-prefix.mjs
          git -C release diff --check

      - name: Run the exact journal, corruption, sharding, and replay verifier
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          cd release
          npm ci
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/prefix-verify.json
          jq -e '
            .journal.fresh.hits == 0
            and .journal.fresh.misses >= 2
            and .journal.fresh.stores >= 2
            and .journal.reused.misses == 0
            and .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
            and .journal.recovered.misses >= 1
            and .journal.recovered.hits >= 1
            and (.journal.corrupted.entry | test("^[0-9a-f]{64}$"))
            and (.journal.fresh.sourceSha256 | test("^[0-9a-f]{64}$"))
            and (.journal.fresh.binarySha256 | test("^[0-9a-f]{64}$"))
            and .replay.red.replay.segments[-1].frontierStates == 1477
            and .replay.yellow.replay.segments[-1].frontierStates == 4515
          ' /tmp/prefix-verify.json >/dev/null

          rm -rf /tmp/journal-disabled /tmp/journal-disabled.journal
          node scripts/perfect-chaos-prefix.mjs generate \
            --frontier-pieces 8 \
            --maximum-passes 20 \
            --output /tmp/journal-disabled \
            --journal none \
            > /tmp/journal-disabled.json
          test ! -e /tmp/journal-disabled.journal
          jq -e 'has("journal") | not' /tmp/journal-disabled.json >/dev/null

          set +e
          node scripts/perfect-chaos-prefix.mjs generate \
            --frontier-pieces 8 \
            --maximum-passes 20 \
            --output /tmp/journal-conflict \
            --journal /tmp/journal-conflict \
            > /tmp/journal-conflict.out 2> /tmp/journal-conflict.err
          code=$?
          set -e
          test "$code" != 0
          grep -F -- 'journal must be outside' /tmp/journal-conflict.err

      - name: Run the complete exact and browser suite
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          cd release
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference

      - name: Require the exact one-file production diff
        shell: bash
        run: |
          set -euo pipefail
          git -C release status --short | tee /tmp/release-status
          test "$(git -C release status --short | cut -c4-)" = \
            'scripts/perfect-chaos-prefix.mjs'
          git -C release diff --check
          grep -F -- "connect4-chaos-prefix-journal-v2" \
            release/scripts/perfect-chaos-prefix.mjs
          grep -F -- 'binarySha256' release/scripts/perfect-chaos-prefix.mjs
          grep -F -- 'invalidations' release/scripts/perfect-chaos-prefix.mjs
          grep -F -- 'reference.sharding?.count' release/scripts/perfect-chaos-prefix.mjs

      - name: Create the content-addressed main blob manifest
        shell: bash
        run: |
          set -euo pipefail
          path=scripts/perfect-chaos-prefix.mjs
          expected_blob=$(git -C release hash-object "$path")
          content_sha=$(sha256sum "release/$path" | cut -d' ' -f1)
          blob=$(jq -Rs '{content:.,encoding:"utf-8"}' < "release/$path" \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
          test "$blob" = "$expected_blob"
          jq -n \
            --arg parent "$RELEASE_PARENT" \
            --arg path "$path" \
            --arg sha "$blob" \
            --arg contentSha256 "$content_sha" \
            '{
              format:"connect4-chaos-prefix-journal-main-blobs-v1",
              parent:$parent,
              files:[{path:$path,mode:"100755",type:"blob",sha:$sha,contentSha256:$contentSha256}]
            }' > /tmp/perfect-chaos-journal-main-blobs.json
          jq -e '
            .format == "connect4-chaos-prefix-journal-main-blobs-v1"
            and .parent == "c7d04915623f31bf16425409c3686fe2ff901663"
            and (.files | length) == 1
            and (.files[0].sha | test("^[0-9a-f]{40}$"))
            and (.files[0].contentSha256 | test("^[0-9a-f]{64}$"))
          ' /tmp/perfect-chaos-journal-main-blobs.json >/dev/null

      - name: Publish the verified blob identity without touching main
        shell: bash
        run: |
          set -euo pipefail
          git -C patch config user.name 'github-actions[bot]'
          git -C patch config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C patch fetch origin "$PATCH_BRANCH"
            git -C patch reset --hard "origin/$PATCH_BRANCH"
            mkdir -p patch/.promotion
            cp /tmp/perfect-chaos-journal-main-blobs.json \
              patch/.promotion/perfect-chaos-journal-main-blobs.json
            git -C patch add .promotion/perfect-chaos-journal-main-blobs.json
            if git -C patch diff --cached --quiet; then
              exit 0
            fi
            test "$(git -C patch diff --cached --name-only)" = \
              '.promotion/perfect-chaos-journal-main-blobs.json'
            git -C patch commit -m 'Publish verified prefix journal blob identity'
            if git -C patch push origin "HEAD:$PATCH_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the prefix journal manifest after five races.' >&2
          exit 1
