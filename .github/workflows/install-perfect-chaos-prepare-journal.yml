name: Install resumable journal in exact Chaos preparation workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-perfect-chaos-prepare-journal.yml

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-prepare-journal
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Patch, verify, and publish against the latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            grep -F -- 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs

            python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path('.github/workflows/reusable-perfect-chaos-18-round.yml')
          if path.is_symlink() or not path.is_file():
              raise RuntimeError(f'Workflow must be a regular file: {path}')
          text = path.read_text()
          restore_marker = 'Restore exact preparation journal from a prior attempt'
          upload_marker = 'Preserve exact preparation journal for a rerun'
          argument_marker = '--journal "$journal"'

          if any(marker in text for marker in (restore_marker, upload_marker, argument_marker)):
              if not all(marker in text for marker in (restore_marker, upload_marker, argument_marker)):
                  raise RuntimeError('Preparation journal installation is only partially present.')
          else:
              rebuild = '      - name: Rebuild the exact 16-piece prefix with bounded deterministic workers\n'
              publish = '      - name: Publish deterministic classification matrix\n'
              if text.count(rebuild) != 1 or text.count(publish) != 1:
                  raise RuntimeError('Could not locate the exact preparation step boundaries.')

              restore = '''      - name: Restore exact preparation journal from a prior attempt
                if: ${{ github.run_attempt > 1 }}
                continue-on-error: true
                uses: actions/download-artifact@v5
                with:
                  name: perfect-chaos-${{ inputs.role }}-18-prepare-journal
                  path: .perfect-chaos-prepare.journal

          '''
              text = text.replace(rebuild, restore + rebuild, 1)

              start = text.index(rebuild)
              end = text.index(publish, start)
              block = text[start:end]
              strict = '          set -euo pipefail\n'
              if block.count(strict) != 1:
                  raise RuntimeError('Preparation step must contain exactly one strict-shell anchor.')
              block = block.replace(
                  strict,
                  strict
                  + '          journal=.perfect-chaos-prepare.journal\n'
                  + '          mkdir -p "$journal"\n',
                  1,
              )
              output_anchor = '            --output "$prepared" \\\n'
              if block.count(output_anchor) != 1:
                  raise RuntimeError('Preparation command output anchor changed unexpectedly.')
              block = block.replace(
                  output_anchor,
                  '            --journal "$journal" \\\n' + output_anchor,
                  1,
              )
              text = text[:start] + block + text[end:]

              upload = '''      - name: Preserve exact preparation journal for a rerun
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: perfect-chaos-${{ inputs.role }}-18-prepare-journal
                  path: .perfect-chaos-prepare.journal
                  if-no-files-found: ignore
                  include-hidden-files: true
                  overwrite: true
                  retention-days: 14

          '''
              if text.count(publish) != 1:
                  raise RuntimeError('Classification publication anchor changed during patching.')
              text = text.replace(publish, upload + publish, 1)
              path.write_text(text, newline='\n')

          source = path.read_text()
          checks = {
              restore_marker: 1,
              upload_marker: 1,
              argument_marker: 1,
              'name: perfect-chaos-${{ inputs.role }}-18-prepare-journal': 2,
              'if: ${{ github.run_attempt > 1 }}': 1,
              'continue-on-error: true': 1,
              'if: always()': 1,
              'overwrite: true': 1,
              'include-hidden-files: true': 1,
              'journal=.perfect-chaos-prepare.journal': 1,
          }
          for fragment, expected in checks.items():
              actual = source.count(fragment)
              if actual != expected:
                  raise RuntimeError(f'{fragment!r}: found {actual}, expected {expected}')
          PY

            cat > tests/perfect-chaos-prepare-journal-workflow.test.js <<'NODE'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const WORKFLOW = new URL(
            '../.github/workflows/reusable-perfect-chaos-18-round.yml',
            import.meta.url,
          );

          test('exact 16→18 preparation restores and preserves one role-bound journal', async () => {
            const source = await readFile(WORKFLOW, 'utf8');
            assert.equal((source.match(/Restore exact preparation journal from a prior attempt/g) ?? []).length, 1);
            assert.equal((source.match(/Preserve exact preparation journal for a rerun/g) ?? []).length, 1);
            assert.equal((source.match(/--journal "\$journal"/g) ?? []).length, 1);
            assert.equal((source.match(/name: perfect-chaos-\$\{\{ inputs\.role \}\}-18-prepare-journal/g) ?? []).length, 2);
            assert.equal((source.match(/if: \$\{\{ github\.run_attempt > 1 \}\}/g) ?? []).length, 1);
            assert.equal((source.match(/continue-on-error: true/g) ?? []).length, 1);
            assert.equal((source.match(/overwrite: true/g) ?? []).length, 1);
            assert.equal((source.match(/include-hidden-files: true/g) ?? []).length, 1);
            assert.match(source, /if: always\(\)[\s\S]*?actions\/upload-artifact@v4/);
            assert.match(source, /journal=\.perfect-chaos-prepare\.journal/);
            assert.doesNotMatch(source, /journal="?\$prepared/);
          });

          test('the journal cache remains performance-only and exact publication follows it', async () => {
            const source = await readFile(WORKFLOW, 'utf8');
            const restore = source.indexOf('Restore exact preparation journal from a prior attempt');
            const rebuild = source.indexOf('Rebuild the exact 16-piece prefix with bounded deterministic workers');
            const preserve = source.indexOf('Preserve exact preparation journal for a rerun');
            const publish = source.indexOf('Publish deterministic classification matrix');
            assert.ok(restore >= 0 && restore < rebuild);
            assert.ok(rebuild < preserve && preserve < publish);
            assert.match(source.slice(rebuild, preserve), /scripts\/perfect-chaos-prefix\.mjs prepare-role/);
            assert.match(source.slice(rebuild, preserve), /--journal "\$journal"/);
          });
          NODE

            python3 -m py_compile scripts/perfect-chaos-auto-advance.py
            node --test tests/perfect-chaos-prepare-journal-workflow.test.js
            ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
              .github/workflows/reusable-perfect-chaos-18-round.yml
            npm run check
            npm test
            npm run classic:verify
            npm run classic:policy:verify
            npm run chaos:complete:verify
            npm run chaos:prefix:verify-reference
            npm run test:browser
            git diff --check

            git rm --ignore-unmatch .github/workflows/install-perfect-chaos-prepare-journal.yml
            changed="$(git status --short | cut -c4- | sort)"
            expected=$'.github/workflows/install-perfect-chaos-prepare-journal.yml\n.github/workflows/reusable-perfect-chaos-18-round.yml\ntests/perfect-chaos-prepare-journal-workflow.test.js'
            test "$changed" = "$expected"
            git add .github/workflows/reusable-perfect-chaos-18-round.yml \
                    tests/perfect-chaos-prepare-journal-workflow.test.js
            git commit -m 'Persist exact Chaos preparation journal across reruns'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" = 3 ]]; then
              echo 'main changed during all three verified journal-install attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
