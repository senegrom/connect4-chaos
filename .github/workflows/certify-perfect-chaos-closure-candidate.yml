name: Certify independently audited Perfect Chaos closure candidate

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .campaign/perfect-chaos-16/closure-candidates/*.json
      - .campaign/perfect-chaos-18/closure-candidates/*.json
      - .github/workflows/certify-perfect-chaos-closure-candidate.yml
      - scripts/perfect-chaos-certify-closure.py
      - scripts/test-perfect-chaos-certify-closure.py
  workflow_dispatch:
    inputs:
      candidate_path:
        description: Optional exact closure-candidate path to certify
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: certify-perfect-chaos-closure-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  locate:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.locate.outputs.candidate }}
      should_certify: ${{ steps.locate.outputs.should_certify }}
    steps:
      - name: Check out the campaign branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Test the reusable closure certifier
        run: python3 scripts/test-perfect-chaos-certify-closure.py

      - name: Select exactly one changed closure candidate
        id: locate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REQUESTED: ${{ inputs.candidate_path || '' }}
        run: |
          set -euo pipefail
          candidates=()
          if [[ "$EVENT_NAME" = workflow_dispatch && -n "$REQUESTED" ]]; then
            candidates+=("$REQUESTED")
          elif [[ "$EVENT_NAME" = push ]]; then
            zero='0000000000000000000000000000000000000000'
            if [[ "$BEFORE" = "$zero" ]]; then
              mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$AFTER")
            else
              mapfile -t changed < <(git diff --name-only "$BEFORE" "$AFTER")
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" =~ ^\.campaign/perfect-chaos-(16|18)/closure-candidates/(red|yellow)-[0-9]+\.json$ ]]; then
                candidates+=("$path")
              fi
            done
          fi

          if (( ${#candidates[@]} == 0 )); then
            echo 'No closure candidate changed; workflow/tooling validation only.'
            echo 'candidate=' >> "$GITHUB_OUTPUT"
            echo 'should_certify=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#candidates[@]} != 1 )); then
            printf 'Expected one closure candidate; found %s:\n' "${#candidates[@]}" >&2
            printf '  %s\n' "${candidates[@]}" >&2
            exit 1
          fi

          candidate="${candidates[0]}"
          if [[ ! "$candidate" =~ ^\.campaign/perfect-chaos-(16|18)/closure-candidates/(red|yellow)-[0-9]+\.json$ ]]; then
            echo "Unsafe closure-candidate path: $candidate" >&2
            exit 1
          fi
          test -f "$candidate" && test ! -L "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo 'should_certify=true' >> "$GITHUB_OUTPUT"

  certify:
    needs: locate
    if: needs.locate.outputs.should_certify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      CANDIDATE: ${{ needs.locate.outputs.candidate }}

    steps:
      - name: Check out the campaign branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin the candidate, workflow run, and artifact identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CANDIDATE" && test ! -L "$CANDIDATE"
          jq -e '.format == "connect4-chaos-auto-advance-decision-v1"' "$CANDIDATE" >/dev/null
          jq -e '.closedCandidate == true and .newRejectedRoots == 0 and .nextState == null' "$CANDIDATE" >/dev/null

          role="$(jq -er '.role | select(. == "red" or . == "yellow")' "$CANDIDATE")"
          from="$(jq -er '.fromPieces | select(type == "number" and floor == . and . >= 0)' "$CANDIDATE")"
          target="$(jq -er '.targetPieces | select(type == "number" and floor == . and . > 0)' "$CANDIDATE")"
          cumulative="$(jq -er '.cumulativeRejectedRoots | select(type == "number" and floor == . and . >= 0)' "$CANDIDATE")"
          run_id="$(jq -er '.run | select(type == "number" and floor == . and . > 0)' "$CANDIDATE")"
          run_sha="$(jq -er '.runSha | select(test("^[0-9a-f]{40}$"))' "$CANDIDATE")"
          producer_name="$(jq -er '.artifacts.producer.name | select(test("^[A-Za-z0-9._-]+$"))' "$CANDIDATE")"
          evidence_name="$(jq -er '.artifacts.independentEvidence.name | select(test("^[A-Za-z0-9._-]+$"))' "$CANDIDATE")"
          producer_id="$(jq -er '.artifacts.producer.id | select(type == "number" and floor == . and . > 0)' "$CANDIDATE")"
          evidence_id="$(jq -er '.artifacts.independentEvidence.id | select(type == "number" and floor == . and . > 0)' "$CANDIDATE")"

          expected_path=".campaign/perfect-chaos-${target}/closure-candidates/${role}-${cumulative}.json"
          test "$CANDIDATE" = "$expected_path"
          test "$producer_name" = "perfect-chaos-${role}-${target}-${cumulative}-round"
          test "$evidence_name" = "perfect-chaos-${role}-${target}-${cumulative}-evidence"
          test "$target" -gt "$from"

          run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.head_sha' <<< "$run")" = "$run_sha"
          test "$(jq -r '.status' <<< "$run")" = completed
          test "$(jq -r '.conclusion' <<< "$run")" = success

          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > artifact-pages.json
          CANDIDATE="$CANDIDATE" PRODUCER_ID="$producer_id" EVIDENCE_ID="$evidence_id" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads(Path(os.environ['CANDIDATE']).read_text())
          pages = json.loads(Path('artifact-pages.json').read_text())
          artifacts = [item for page in pages for item in page.get('artifacts', [])]
          for label, identifier in (
              ('producer', int(os.environ['PRODUCER_ID'])),
              ('independentEvidence', int(os.environ['EVIDENCE_ID'])),
          ):
              expected = candidate['artifacts'][label]
              matches = [item for item in artifacts if item.get('id') == identifier]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one artifact id {identifier}; found {len(matches)}.')
              actual = matches[0]
              if actual.get('expired') is not False:
                  raise RuntimeError(f'Artifact {identifier} is expired.')
              for field in ('id', 'name', 'size_in_bytes', 'digest'):
                  if actual.get(field) != expected.get(field):
                      raise RuntimeError(f'Artifact {identifier} differs at {field}.')
              actual_run = actual.get('workflow_run') or {}
              expected_run = expected.get('workflow_run') or {}
              for field in ('id', 'head_sha'):
                  if actual_run.get(field) != expected_run.get(field):
                      raise RuntimeError(f'Artifact {identifier} workflow identity differs at {field}.')
          PY

          certificate_path=".campaign/perfect-chaos-${target}/certificates/${role}.json"
          certified_name="perfect-chaos-${role}-${target}-${cumulative}-certified"
          {
            echo "role=$role"
            echo "from=$from"
            echo "target=$target"
            echo "cumulative=$cumulative"
            echo "run_id=$run_id"
            echo "producer_name=$producer_name"
            echo "evidence_name=$evidence_name"
            echo "certificate_path=$certificate_path"
            echo "certified_name=$certified_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download and revalidate the producer and independent evidence
        shell: bash
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          PRODUCER_NAME: ${{ steps.identity.outputs.producer_name }}
          EVIDENCE_NAME: ${{ steps.identity.outputs.evidence_name }}
        run: |
          set -euo pipefail
          rm -rf producer evidence certified
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$PRODUCER_NAME" --dir producer
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$EVIDENCE_NAME" --dir evidence
          python3 scripts/perfect-chaos-artifacts.py verify --directory producer
          (cd evidence && sha256sum --check --strict SHA256SUMS)

      - name: Construct the generic independently replayed closure certificate
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-certify-closure.py \
            --candidate "$CANDIDATE" \
            --producer producer \
            --evidence evidence \
            --output certificate.json
          mkdir -p certified/closure-evidence
          cp -a producer/. certified/
          cp -a evidence/. certified/closure-evidence/
          cp certificate.json certified/certificate.json
          rm -f certified/SHA256SUMS
          python3 scripts/perfect-chaos-artifacts.py write --directory certified
          python3 scripts/perfect-chaos-artifacts.py verify --directory certified

      - name: Upload the complete certified closure source
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.certified_name }}
          path: certified
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Atomically publish the compact prefix-closure certificate
        shell: bash
        env:
          CERTIFICATE_PATH: ${{ steps.identity.outputs.certificate_path }}
          CERTIFIED_NAME: ${{ steps.identity.outputs.certified_name }}
          CERTIFIED_ID: ${{ steps.upload.outputs.artifact-id }}
          CERTIFIED_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CERTIFIED_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          jq --arg name "$CERTIFIED_NAME" \
             --argjson id "$CERTIFIED_ID" \
             --arg digest "$CERTIFIED_DIGEST" \
             --arg url "$CERTIFIED_URL" \
             '.certifiedArtifact = {name: $name, id: $id, digest: $digest, url: $url}' \
             certificate.json > committed-certificate.json

          content="$(base64 -w0 committed-certificate.json)"
          if current="$(gh api --method GET "repos/$REPOSITORY/contents/$CERTIFICATE_PATH" -f ref="$BRANCH" 2>/dev/null)"; then
            jq -r '.content' <<< "$current" | tr -d '\n' | base64 --decode > existing-certificate.json
            diff -u existing-certificate.json committed-certificate.json
            echo "$CERTIFICATE_PATH is already committed byte-identically."
            exit 0
          fi
          gh api --method PUT "repos/$REPOSITORY/contents/$CERTIFICATE_PATH" \
            -f branch="$BRANCH" \
            -f message="Certify ${{ steps.identity.outputs.role }} ${{ steps.identity.outputs.target }}-piece Perfect Chaos prefix closure" \
            -f content="$content" >/dev/null
          echo "Committed $CERTIFICATE_PATH."
