name: Build verified self-dispatching Perfect Chaos campaign loop

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-campaign-loop.yml
      - scripts/patch-perfect-chaos-campaign-loop.py

permissions:
  actions: read
  contents: write

concurrency:
  group: install-perfect-chaos-campaign-loop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply the state-bound dispatch loop and permanent rollback semantics
        run: python3 scripts/patch-perfect-chaos-campaign-loop.py .

      - name: Validate workflow syntax and exact engine semantics
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/reusable-perfect-chaos-16-round.yml \
            .github/workflows/continue-perfect-chaos-16-state.yml \
            .github/workflows/continue-perfect-chaos-18-state.yml \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml \
            .github/workflows/auto-advance-perfect-chaos-yellow-16.yml \
            .github/workflows/auto-advance-perfect-chaos-red-18.yml
          grep -q "from === 0" scripts/perfect-chaos-prefix.mjs
          ! grep -q 'inc-prefix-root-rollback.b64' \
            .github/workflows/reusable-perfect-chaos-16-round.yml
          grep -q 'workflow_dispatch:' \
            .github/workflows/continue-perfect-chaos-16-state.yml
          grep -q 'workflow_dispatch:' \
            .github/workflows/continue-perfect-chaos-18-state.yml
          grep -q 'expected_run_id' \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml
          grep -q 'gh workflow run "$WATCHER_WORKFLOW"' \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml
          node --check scripts/perfect-chaos-prefix.mjs
          node scripts/perfect-chaos-prefix.mjs verify > campaign-loop-verification.json
          python3 scripts/test-perfect-chaos-auto-advance.py
          python3 scripts/test-perfect-chaos-certify-closure.py

      - name: Commit only the verified engine change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs
          if git diff --cached --quiet; then
            echo 'Permanent rollback semantics are already installed.'
          else
            git commit -m 'Make Perfect Chaos prefix rollback explicit'
            git push origin HEAD:agent/perfect-chaos-16-recovery
          fi

      - name: Package the already-validated workflow definitions for app publication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patched-workflows
          mkdir patched-workflows
          cp \
            .github/workflows/reusable-perfect-chaos-16-round.yml \
            .github/workflows/continue-perfect-chaos-16-state.yml \
            .github/workflows/continue-perfect-chaos-18-state.yml \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml \
            .github/workflows/auto-advance-perfect-chaos-yellow-16.yml \
            .github/workflows/auto-advance-perfect-chaos-red-18.yml \
            patched-workflows/
          sha256sum patched-workflows/* > patched-workflows/SHA256SUMS
          sha256sum --check --strict patched-workflows/SHA256SUMS

      - name: Upload validated workflow publication package
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-self-dispatching-workflows
          path: |
            patched-workflows
            campaign-loop-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
