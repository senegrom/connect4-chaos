name: Verify finalized exact-solver tooling

on:
  push:
    branches:
      - main
    paths:
      - scripts/perfect-chaos-prefix.mjs
      - .github/workflows/reusable-perfect-chaos-18-round.yml
      - .github/workflows/compute-perfect-classic-7x7-role1.yml
      - .github/workflows/compute-perfect-classic-7x7-role2.yml
      - scripts/perfect-classic-download-fragments.py
      - tests/perfect-classic-fragment-workflow.test.js
      - tests/perfect-chaos-journal-workflow.test.js

permissions:
  contents: write

concurrency:
  group: verify-finalized-exact-solver-tooling
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify the installed production boundaries
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          grep -F -- 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'actions/cache@v4' .github/workflows/reusable-perfect-chaos-18-round.yml
          grep -F -- '--journal "$RUNNER_TEMP/perfect-chaos-prefix-journal-${{ inputs.role }}"' \
            .github/workflows/reusable-perfect-chaos-18-round.yml
          for role in 1 2; do
            file=".github/workflows/compute-perfect-classic-7x7-role$role.yml"
            test "$(grep -c 'scripts/perfect-classic-download-fragments.py' "$file")" = 3
            test "$(grep -c 'actions/download-artifact@v4' "$file")" = 1
            ! grep -Fq 'with: { pattern:' "$file"
            grep -F -- 'fragment-artifact-audit.json' "$file"
          done
          for transient in \
            .github/workflows/harden-perfect-classic-artifact-downloader.yml \
            .github/workflows/verify-perfect-classic-artifact-boundary.yml \
            scripts/patch-perfect-classic-fragment-downloads.py \
            tests/perfect-classic-fragment-workflow-patch.test.js; do
            test ! -e "$transient"
          done
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.safe_load(File.read(p), aliases: true) }' \
            .github/workflows/reusable-perfect-chaos-18-round.yml \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml
          node --test \
            tests/perfect-classic-download-fragments.test.js \
            tests/perfect-classic-fragment-workflow.test.js \
            tests/perfect-chaos-journal-workflow.test.js
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/finalized-prefix-verify.json
          jq -e '
            .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
          ' /tmp/finalized-prefix-verify.json >/dev/null
          npm run chaos:prefix:verify-reference
          npm run test:browser

      - name: Record immutable post-publication verification
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          value = {
              'format': 'connect4-finalized-exact-solver-tooling-verification-v1',
              'result': 'success',
              'sourceSha': os.environ['SOURCE_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'journal': {
                  'format': 'connect4-chaos-prefix-journal-v2',
                  'roleScopedActionsCache': True,
                  'certificateEvidence': False,
              },
              'classic7x7': {
                  'roles': [1, 2],
                  'verifiedFragmentFanInStagesPerRole': 3,
                  'remainingExactNameDownloadsPerRole': 1,
                  'archiveDigestAndSafeExtraction': True,
              },
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/finalized-exact-solver-tooling.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/finalized-exact-solver-tooling.json .audit/finalized-exact-solver-tooling.json
            git add .audit/finalized-exact-solver-tooling.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Record finalized exact-solver tooling verification'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish post-publication verification.' >&2
          exit 1
