name: Review maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-maintenance.yml'
      - '.review-source.*.patch'
      - 'scripts/review-candidate.py'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare validated normal source objects without changing a branch
        run: python3 scripts/review-candidate.py --object
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: review-candidate
          path: review-candidate.json
          retention-days: 1
