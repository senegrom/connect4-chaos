name: Review maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-maintenance.yml'
      - '.review-source.*.patch'
      - 'scripts/review-candidate.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Package source and readable fixes
        run: |
          tar -czf /tmp/review-base.tar.gz .github .review-source.*.patch scripts src native neural tests package.json package-lock.json index.html styles.css manifest.json
          python3 scripts/review-candidate.py
          tar -czf /tmp/review-working.tar.gz .github scripts src native neural tests package.json package-lock.json index.html styles.css manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: review-working-source
          path: |
            /tmp/review-base.tar.gz
            /tmp/review-working.tar.gz
          retention-days: 1
