name: Verify perfect classic policies

# Called by CI, so a failed or cancelled replay blocks Pages. Everything but
# the replay runs on every push and costs seconds; the replay itself costs
# hours, so it is skipped when some earlier run has already replayed these
# exact bytes. The skip is keyed on content - the catalog, the code that
# checks it, and this file - never on which paths a push happened to touch.
# Do not weaken that into a changed-path skip: a cancelled policy run
# followed by a documentation push would publish a still-unverified catalog,
# whereas a content key can only be satisfied by a replay that finished.
# Manual runs remain available.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-perfect-classic-policies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Verify source and small reference games
        run: npm run classic:policy:verify

      - name: Validate catalog coverage metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile(
            'data/perfect-classic/manifest.json',
            'utf8',
          ));
          const policies = Array.isArray(manifest.policies) ? manifest.policies : [];
          if (policies.length === 0) {
            console.log('No committed variable-board policies yet; source verification passed.');
            process.exit(0);
          }
          if (manifest.format !== 'connect4-perfect-classic-manifest-v1') {
            throw new Error('Committed Perfect classic catalog has the wrong format.');
          }

          const rolesByBoard = new Map();
          const policyKeys = new Set();
          for (const entry of policies) {
            const board = `${entry.rows}x${entry.columns}`;
            const key = `${board}:c${entry.connect}:r${entry.role}`;
            if (policyKeys.has(key)) throw new Error(`Duplicate committed policy ${key}.`);
            policyKeys.add(key);
            if (entry.connect !== 4
                || entry.rows < 4 || entry.rows > 7
                || entry.columns < 4 || entry.columns > 7
                || (entry.rows === 6 && entry.columns === 7)
                || (entry.role !== 1 && entry.role !== 2)) {
              throw new Error(`Unsupported committed policy ${key}.`);
            }
            let roles = rolesByBoard.get(board);
            if (!roles) {
              roles = new Set();
              rolesByBoard.set(board, roles);
            }
            roles.add(entry.role);
          }
          for (const [board, roles] of rolesByBoard) {
            if (roles.size !== 2 || !roles.has(1) || !roles.has(2)) {
              throw new Error(`${board} must contain both starting-role policies.`);
            }
          }
          if (policies.length !== rolesByBoard.size * 2) {
            throw new Error('Committed catalog must contain exactly two policies per board.');
          }

          if (manifest.coverage) {
            if (manifest.coverage.boardCount !== rolesByBoard.size
                || manifest.coverage.roleCount !== policies.length) {
              throw new Error('Perfect classic coverage counts do not match the catalog.');
            }
            if (Array.isArray(manifest.coverage.boards)) {
              const actual = [...rolesByBoard.keys()].sort();
              const recorded = [...manifest.coverage.boards].sort();
              if (JSON.stringify(actual) !== JSON.stringify(recorded)) {
                throw new Error('Perfect classic coverage board list does not match the catalog.');
              }
            }
          }

          if (manifest.complete === true) {
            if (rolesByBoard.size !== 15 || policies.length !== 30) {
              throw new Error(
                `Complete catalog requires 15 boards and 30 roles; found `
                + `${rolesByBoard.size} boards and ${policies.length} roles.`,
              );
            }
          }
          console.log(
            `Validated ${policies.length} policies for ${rolesByBoard.size} board(s); `
            + `complete=${manifest.complete === true}.`,
          );
          NODE

      - name: Fingerprint the catalog and everything that judges it
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          # The replay proves a property of the committed bytes, not of the
          # push that carried them, so key it on those bytes: the catalog, the
          # JavaScript that reads it, the independent C++ replayer it is
          # checked against, and this workflow. git ls-tree reads content
          # hashes straight out of the commit, so reverting to an
          # already-replayed catalog is recognised as replayed, and a file
          # that disappears changes the fingerprint like any other edit.
          fingerprint="$(git ls-tree -r HEAD -- \
            data/perfect-classic \
            native/perfect-classic-policy.cpp \
            scripts/perfect-classic-policy.mjs \
            src/data-loader.js \
            src/engine.js \
            src/perfect-classic-policy.js \
            .github/workflows/verify-perfect-classic-policies.yml \
            | sha256sum | cut -d' ' -f1)"
          echo "key=perfect-classic-replay-v1-${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "Catalog fingerprint ${fingerprint}."

      - name: Look for a finished replay of these bytes
        id: replayed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perfect-classic-replayed
          key: ${{ steps.catalog.outputs.key }}
          lookup-only: true

      - name: Independently replay every committed policy
        if: steps.replayed.outputs.cache-hit != 'true'
        shell: bash
        env:
          REPLAY_KEY: ${{ steps.catalog.outputs.key }}
        run: |
          set -euo pipefail
          policy_count="$(node -e \
            'const m=require("./data/perfect-classic/manifest.json"); process.stdout.write(String(m.policies?.length ?? 0))')"
          if (( policy_count == 0 )); then
            printf '%s\n' "$REPLAY_KEY" > .perfect-classic-replayed
            exit 0
          fi
          node scripts/perfect-classic-policy.mjs verify-reference \
            --reference data/perfect-classic/manifest.json
          # Written last, so only a replay that returned zero leaves a receipt.
          printf '%s\n' "$REPLAY_KEY" > .perfect-classic-replayed

      - name: Record that these bytes were replayed
        if: steps.replayed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perfect-classic-replayed
          key: ${{ steps.catalog.outputs.key }}

      - name: Report a skipped replay
        if: steps.replayed.outputs.cache-hit == 'true'
        run: echo "An earlier run replayed these exact policy bytes; skipping the replay."
