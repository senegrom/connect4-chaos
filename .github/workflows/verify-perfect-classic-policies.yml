name: Verify perfect classic policies

# Called by CI, so a failed or cancelled replay blocks Pages. Everything but
# the replay runs on every push and costs seconds; the replay itself costs
# hours, so it is skipped when some earlier run has already replayed these
# exact bytes. The skip is keyed on content - the catalog, the code that
# checks it, and this file - never on which paths a push happened to touch.
# Do not weaken that into a changed-path skip: a cancelled policy run
# followed by a documentation push would publish a still-unverified catalog,
# whereas a content key can only be satisfied by a replay that finished.
# Manual runs remain available.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-perfect-classic-policies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Node only: nothing this job runs loads a package, so there is no
      # install step whose scripts could touch the receipt. The small native
      # reference games (npm run classic:policy:verify) run in the CI test job,
      # which Pages also waits for.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fingerprint the catalog and everything that judges it
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          # The replay proves a property of the committed bytes, not of the
          # push that carried them, so key it on those bytes: the catalog, the
          # published root values it is checked against, every module the
          # JavaScript replay loads, and this workflow. The replay compiles
          # nothing, so no C++ source belongs here; tests/replay-cache.test.mjs
          # walks the replay's imports and fails when this list misses one.
          # git ls-tree reads content hashes straight out of the commit, so
          # reverting to an already-replayed catalog is recognised as
          # replayed, and a file that disappears changes the fingerprint like
          # any other edit.
          fingerprint="$(git ls-tree -r HEAD -- \
            data/perfect-classic \
            data/perfect-classic-root-values.json \
            scripts/perfect-classic-policy.mjs \
            scripts/verify-perfect-classic-parallel.mjs \
            scripts/cli-options.mjs \
            scripts/entry-point.mjs \
            src/bytes.js \
            src/classic-geometry.js \
            src/data-loader.js \
            src/engine.js \
            src/perfect-classic-policy.js \
            .github/workflows/verify-perfect-classic-policies.yml \
            | sha256sum | cut -d' ' -f1)"
          echo "key=perfect-classic-replay-v1-${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "Catalog fingerprint ${fingerprint}."

      - name: Look for a finished replay of these bytes
        id: replayed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perfect-classic-replayed
          key: ${{ steps.catalog.outputs.key }}
          lookup-only: true

      - name: Independently replay every committed policy
        if: steps.replayed.outputs.cache-hit != 'true'
        shell: bash
        env:
          REPLAY_KEY: ${{ steps.catalog.outputs.key }}
        run: |
          set -euo pipefail
          # One policy (7x6 role 2) is 70% of the catalog's closure states, so a
          # single sequential replay of all 28 grew past this job's 360-minute
          # ceiling - GitHub's maximum, which cancelled run 34856038080 and left
          # main undeployable. The parallel runner replays each policy in its own
          # verify-reference process, so the wall time is the largest policy
          # rather than their sum. Identical evidence: every policy is still
          # replayed in full by the same JavaScript replayer and exact handoff
          # solver, with its rows, columns, connect, role, entryCount,
          # closureStates and rootValue checked against the manifest, and any
          # duplicate policy rejected. A replay proves only that its policy
          # forces at least its root value, so the runner then requires both
          # roles of every board, role 1 to equal minus role 2 - which pins the
          # exact game value - and that value to equal
          # data/perfect-classic-root-values.json.
          node scripts/verify-perfect-classic-parallel.mjs \
            --reference data/perfect-classic/manifest.json \
            --workers 4
          # Written last, so only a replay that returned zero leaves a receipt.
          printf '%s\n' "$REPLAY_KEY" > .perfect-classic-replayed

      - name: Record that these bytes were replayed
        if: steps.replayed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .perfect-classic-replayed
          key: ${{ steps.catalog.outputs.key }}

      - name: Report a skipped replay
        if: steps.replayed.outputs.cache-hit == 'true'
        run: echo "An earlier run replayed these exact policy bytes; skipping the replay."
