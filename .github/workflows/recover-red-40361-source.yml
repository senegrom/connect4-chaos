name: Recover immutable Red 40,361-root source

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/recover-red-40361-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-red-40361-source
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out audited proof tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery

      - name: Download the exact connector-recovered producer archive
        shell: bash
        env:
          SOURCE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-e2f8-81f4-bb99-858a221b4e97/raw?se=2026-08-17T17%3A29%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=3b173594-7dcd-5c5c-8e30-268019fd0d0d&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T06%3A14%3A21Z&ske=2026-08-18T06%3A14%3A21Z&sks=b&skv=2026-02-06&sig=uvWGHn4n8AI3yHHx3FIdRp1OPoDTsNsQXUHQMDJ/uMk%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 1 --retry-all-errors \
            "$SOURCE_URL" -o source.zip
          test "$(stat -c '%s' source.zip)" = '10539234'
          echo 'd5990d04e4e29bbb1f7ae782c608f208b78cefea100cae1100b8f6243a184edb  source.zip' \
            | sha256sum --check --strict

      - name: Safely extract and verify every proof byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovered provenance
          mkdir -p recovered provenance
          python3 - <<'PY'
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path('source.zip')
          output = Path('recovered')
          total = 0
          seen = set()
          with zipfile.ZipFile(archive) as zipped:
              infos = zipped.infolist()
              if len(infos) != 22:
                  raise RuntimeError(f'Expected 22 proof files, got {len(infos)}.')
              for info in infos:
                  name = info.filename
                  relative = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if (
                      info.is_dir()
                      or stat.S_ISLNK(mode)
                      or relative.is_absolute()
                      or '..' in relative.parts
                      or '\\' in name
                      or '\x00' in name
                      or not relative.parts
                  ):
                      raise RuntimeError(f'Unsafe ZIP entry: {name!r}.')
                  canonical = relative.as_posix()
                  if canonical in seen:
                      raise RuntimeError(f'Duplicate ZIP entry: {canonical!r}.')
                  seen.add(canonical)
                  data = zipped.read(info)
                  total += len(data)
                  if total > 100_000_000:
                      raise RuntimeError('Recovered proof exceeds its size boundary.')
                  target = output / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          if total != 58_373_116:
              raise RuntimeError(f'Unexpected uncompressed size: {total}.')
          PY

          (cd recovered && sha256sum --check --strict SHA256SUMS)
          python3 scripts/perfect-chaos-artifacts.py verify --directory recovered
          jq -e '
            .role == "red"
            and .fromPieces == 16
            and .targetPieces == 18
            and .existingRejectedRoots == 40047
            and .newRejectedRoots == 314
            and .cumulativeRejectedRoots == 40361
            and .classificationComplete == true
            and .policyConflicts == 0
          ' recovered/campaign-summary.json >/dev/null
          echo '1328a3906abd6c97b9ff9dec21ea2c2e7bad8e358a49afb91cfcab130a630e01  recovered/16-18.policy.bin' \
            | sha256sum --check --strict
          echo '65641b43c3b4c1263b9a2d1990757481be6c4fc16630b5f5b4b891ec084234c3  recovered/16-18.frontier.bin' \
            | sha256sum --check --strict
          echo 'edf4abf57464e18d951e04d81ae900e2df304d5086bbd95d51fa47f29c37ce8e  recovered/reject-16.bin' \
            | sha256sum --check --strict

          jq -n \
            --arg originalRun '32034741055' \
            --arg originalSha '57f36a602aef0d2515da93a858a7b80adc8842a6' \
            --arg originalArtifactId '9292183852' \
            --arg originalArtifact 'perfect-chaos-red-18-40047-round' \
            --arg archiveSha256 'd5990d04e4e29bbb1f7ae782c608f208b78cefea100cae1100b8f6243a184edb' \
            --arg evidenceArtifactId '9292191482' \
            --arg evidenceArchiveSha256 '0d37051a33290373c5b260cee61b04902a56739202db8f3b7fac41146b1310ab' \
            '{format:"connect4-chaos-recovered-proof-source-v1",originalRun:($originalRun|tonumber),originalSha:$originalSha,originalArtifactId:($originalArtifactId|tonumber),originalArtifact:$originalArtifact,archiveSha256:$archiveSha256,evidenceArtifactId:($evidenceArtifactId|tonumber),evidenceArchiveSha256:$evidenceArchiveSha256,cumulativeRejectedRoots:40361}' \
            > provenance/source.json
          sha256sum provenance/source.json > provenance/SHA256SUMS
          sha256sum --check --strict provenance/SHA256SUMS

      - name: Republish one unique immutable proof source
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-18-40361-recovered-round
          path: recovered
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Publish recovery provenance
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-red-18-40361-recovery-provenance
          path: provenance
          if-no-files-found: error
          retention-days: 90
