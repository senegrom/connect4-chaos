name: Apply final UI fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-ui-final.yml']

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/browser-requirements.txt
      - name: Apply UI fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != count:
                  raise SystemExit(f"{path}: patch context mismatch: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          replace('src/settings-controller.js',
              "    elements.connectInput.max = String(maximum);\n    if (current.connect > maximum) elements.connectInput.value = String(maximum);\n    const fieldsValid = validateNumericFields();",
              "    elements.connectInput.max = String(maximum);\n    // Geometry changes must not silently rewrite a rule the user chose.\n    // Validation explains the conflict until they explicitly change Connect.\n    const fieldsValid = validateNumericFields();")

          replace('index.html',
              '            <p id="aiErrorText" class="ai-error-text" hidden></p>',
              '            <p id="aiErrorText" class="ai-error-text" role="alert" aria-live="assertive" aria-atomic="true" hidden></p>')
          replace('index.html',
              '              <button id="switchBrutalButton" class="secondary-button" type="button">Switch to Brutal</button>\n              <button id="undoAiButton" class="text-button" type="button">Undo last move</button>',
              '              <button id="switchBrutalButton" class="secondary-button" type="button">Switch to Brutal</button>\n              <button id="changeOpponentButton" class="secondary-button" type="button">Change opponent</button>\n              <button id="undoAiButton" class="text-button" type="button">Undo last move</button>')

          replace('styles.css',
              ".text-button:hover:not(:disabled) {\n  color: var(--text);\n}\n",
              ".text-button:hover:not(:disabled) {\n  color: var(--text);\n}\n\n#resetScoreButton[data-confirming=\"true\"] {\n  color: #ffb5c6;\n}\n")

          replace('src/app.js',
              "  switchBrutalButton: document.querySelector('#switchBrutalButton'),\n  undoAiButton: document.querySelector('#undoAiButton'),",
              "  switchBrutalButton: document.querySelector('#switchBrutalButton'),\n  changeOpponentButton: document.querySelector('#changeOpponentButton'),\n  undoAiButton: document.querySelector('#undoAiButton'),")
          replace('src/app.js',
              "async function resetScores() {\n  elements.resetScoreButton.disabled = true;\n  try { acceptScore(await scoreStore.reset()); scoreWarning('', { clearTone: 'error' }); }\n  catch (error) { scoreWarning(error.message, { tone: 'error' }); }\n  finally { elements.resetScoreButton.disabled = false; }\n}",
              "let resetScoreConfirmTimer = null;\nfunction disarmResetScore() {\n  clearTimeout(resetScoreConfirmTimer);\n  resetScoreConfirmTimer = null;\n  delete elements.resetScoreButton.dataset.confirming;\n  elements.resetScoreButton.textContent = 'Reset score';\n}\n\nfunction armResetScore() {\n  clearTimeout(resetScoreConfirmTimer);\n  elements.resetScoreButton.dataset.confirming = 'true';\n  elements.resetScoreButton.textContent = 'Confirm reset';\n  resetScoreConfirmTimer = setTimeout(disarmResetScore, 4_000);\n}\n\nasync function resetScores() {\n  if (elements.resetScoreButton.dataset.confirming !== 'true') {\n    armResetScore();\n    return;\n  }\n  disarmResetScore();\n  elements.resetScoreButton.disabled = true;\n  try { acceptScore(await scoreStore.reset()); scoreWarning('', { clearTone: 'error' }); }\n  catch (error) { scoreWarning(error.message, { tone: 'error' }); }\n  finally { elements.resetScoreButton.disabled = false; }\n}")
          replace('src/app.js',
              "    elements.evaluationDescription.textContent = 'Retry or switch opponents from the status line.';",
              "    elements.evaluationDescription.textContent = 'Retry or change opponent from the status line.';")
          replace('src/app.js',
              "function openRuleEditor() {\n  closeResultDialog();\n  setSettingsExpanded(true);\n  elements.setupPanel.scrollIntoView({\n    behavior: reducedMotion ? 'auto' : 'smooth',\n    block: 'start',\n  });\n  requestAnimationFrame(() => elements.rowsInput.focus({ preventScroll: true }));\n}\n",
              "function openRuleEditor() {\n  closeResultDialog();\n  setSettingsExpanded(true);\n  elements.setupPanel.scrollIntoView({\n    behavior: reducedMotion ? 'auto' : 'smooth',\n    block: 'start',\n  });\n  requestAnimationFrame(() => elements.rowsInput.focus({ preventScroll: true }));\n}\n\nfunction openOpponentEditor() {\n  closeResultDialog();\n  setSettingsExpanded(true);\n  elements.setupPanel.scrollIntoView({\n    behavior: reducedMotion ? 'auto' : 'smooth',\n    block: 'start',\n  });\n  requestAnimationFrame(() => elements.opponentInput.focus({ preventScroll: true }));\n}\n")
          replace('src/app.js',
              "elements.switchBrutalButton.addEventListener('click', switchToBrutal);\nelements.undoAiButton.addEventListener('click', undoTurn);",
              "elements.switchBrutalButton.addEventListener('click', switchToBrutal);\nelements.changeOpponentButton.addEventListener('click', openOpponentEditor);\nelements.undoAiButton.addEventListener('click', undoTurn);")
          replace('src/app.js',
              "        bytes: Number(entry.bytes),\n      });",
              "        bytes: Number(entry.bytes),\n        persistence: 'Reused for this AI session; your browser may cache the download.',\n      });")

          replace('src/download-gate.js',
              "export function requestDownload({ id, title, description, bytes, remember: keep = true, signal }) {",
              "export function requestDownload({ id, title, description, bytes, persistence = null, remember: keep = true, signal }) {")
          replace('src/download-gate.js',
              "  elements.detail.textContent = bytes ? `${formatBytes(bytes)}, downloaded once and kept by your browser.` : '';",
              "  const size = formatBytes(bytes);\n  const persistenceCopy = persistence ?? (bytes ? 'Normally cached by your browser.' : '');\n  elements.detail.textContent = [size, persistenceCopy].filter(Boolean).join(' · ');")

          p = Path('scripts/ui-browser-regressions.py')
          text = p.read_text()
          old = "        page.locator(\"#rowsInput\").fill(\"6.5\")\n        assert \"whole number\" in page.locator(\"#rowsInput\").locator(\"xpath=..\").locator(\".field-error\").inner_text().lower()\n        context.close()"
          new = '''        page.locator("#rowsInput").fill("6.5")\n        assert "whole number" in page.locator("#rowsInput").locator("xpath=..").locator(".field-error").inner_text().lower()\n        page.locator("#rowsInput").fill("6")\n        page.locator("#colsInput").fill("7")\n        page.locator("#connectInput").fill("6")\n        page.locator("#rowsInput").fill("4")\n        page.locator("#colsInput").fill("4")\n        assert page.locator("#connectInput").input_value() == "6"\n        assert page.locator("#connectInput").get_attribute("aria-invalid") == "true"\n        assert page.locator("#settingsForm button[type=submit]").is_disabled()\n        page.locator("#rowsInput").fill("6")\n        assert page.locator("#connectInput").input_value() == "6"\n        assert page.locator("#connectInput").get_attribute("aria-invalid") is None\n        context.close()'''
          if text.count(old) != 1: raise SystemExit('numeric regression context mismatch')
          text = text.replace(old, new, 1)

          old = "        assert \"AI is thinking\" in page.locator(\"#selectedColumnStatus\").inner_text()\n        context.close()\n\n        # The visible blue board"
          new = '''        assert "AI is thinking" in page.locator("#selectedColumnStatus").inner_text()\n        context.close()\n\n        # Every AI failure has a generic recovery route and announces its reason.\n        context = browser.new_context(viewport={"width": 1000, "height": 800})\n        context.add_init_script(settings_script(ai_first) + r"""\n          window.Worker = class extends EventTarget {\n            postMessage({requestId}) {\n              setTimeout(() => this.dispatchEvent(new MessageEvent('message', {data: {\n                kind: 'error', requestId, error: 'Injected AI failure'\n              }})), 0);\n            }\n            terminate() {}\n          };\n        """)\n        page = context.new_page()\n        page.goto(url)\n        page.wait_for_selector("#aiRecovery:not([hidden])")\n        assert page.locator("#changeOpponentButton").is_visible()\n        assert page.locator("#aiErrorText").get_attribute("role") == "alert"\n        assert page.locator("#aiErrorText").get_attribute("aria-live") == "assertive"\n        assert "Injected AI failure" in page.locator("#aiErrorText").inner_text()\n        page.locator("#changeOpponentButton").click()\n        assert page.locator("#settingsBody").is_visible()\n        for _ in range(20):\n            if page.locator("#opponentInput").evaluate("el => document.activeElement === el"):\n                break\n            page.wait_for_timeout(25)\n        else:\n            raise AssertionError("opponent control did not receive focus")\n        context.close()\n\n        # The visible blue board'''
          if text.count(old) != 1: raise SystemExit('AI recovery regression context mismatch')
          text = text.replace(old, new, 1)

          old = "        assert page.locator(\"#cell-5-4\").get_attribute(\"class\").find(\"red\") >= 0\n        context.close()\n\n        # Operational score errors"
          new = '''        assert page.locator("#cell-5-4").get_attribute("class").find("red") >= 0\n        context.close()\n\n        # Exact-table download copy does not promise worker bytes persist forever.\n        context = browser.new_context(viewport={"width": 1000, "height": 800})\n        context.add_init_script(settings_script(human))\n        page = context.new_page()\n        page.goto(url)\n        page.wait_for_selector(".cell")\n        page.evaluate(r"""() => {\n          import('./src/download-gate.js').then(({requestDownload}) => {\n            window.uiReviewDownload = requestDownload({\n              id: 'ui-review-copy-' + Date.now(), title: 'Exact table',\n              description: 'Copy test', bytes: 9000000, remember: false,\n              persistence: 'Reused for this AI session; your browser may cache the download.'\n            });\n          });\n        }""")\n        page.wait_for_selector("#downloadDialog[open]")\n        detail = page.locator("#downloadDetail").inner_text()\n        assert "Reused for this AI session" in detail\n        assert "kept by your browser" not in detail\n        page.locator("#downloadCancelButton").click()\n        context.close()\n\n        # Operational score errors'''
          if text.count(old) != 1: raise SystemExit('download regression context mismatch')
          text = text.replace(old, new, 1)

          old = '''        page.evaluate("window.failNextScoreTransaction = true")\n        page.locator("#resetScoreButton").click()\n        page.wait_for_timeout(50)\n        notice = page.locator("#scoreStorageStatus")\n        assert notice.is_visible()\n        assert notice.get_attribute("data-tone") == "error"\n        page.locator("#resetScoreButton").click()\n        page.wait_for_timeout(50)\n        assert notice.is_hidden()'''
          new = '''        page.evaluate("window.failNextScoreTransaction = true")\n        page.locator("#resetScoreButton").click()\n        assert page.locator("#resetScoreButton").inner_text() == "Confirm reset"\n        assert page.locator("#resetScoreButton").get_attribute("data-confirming") == "true"\n        page.locator("#resetScoreButton").click()\n        page.wait_for_timeout(50)\n        notice = page.locator("#scoreStorageStatus")\n        assert notice.is_visible()\n        assert notice.get_attribute("data-tone") == "error"\n        page.locator("#resetScoreButton").click()\n        assert page.locator("#resetScoreButton").inner_text() == "Confirm reset"\n        page.locator("#resetScoreButton").click()\n        page.wait_for_timeout(50)\n        assert notice.is_hidden()\n        assert page.locator("#resetScoreButton").inner_text() == "Reset score"'''
          if text.count(old) != 1: raise SystemExit('reset regression context mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install application dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Full source and unit checks
        run: npm run ci
      - name: Install browser test dependencies
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Focused Chromium UI regressions
        run: python scripts/ui-browser-regressions.py --browser chromium
      - name: Focused WebKit UI regressions
        run: python scripts/ui-browser-regressions.py --browser webkit
      - name: Commit tested UI source
        shell: bash
        run: |
          git config user.name "UI fix bot"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add index.html styles.css src/app.js src/settings-controller.js src/download-gate.js scripts/ui-browser-regressions.py
          git diff --cached --check
          git commit -m "Finish UI recovery and settings safeguards"
          git push origin HEAD:main
