name: Verify Perfect Chaos prefix

on:
  push:
    branches: [main]
    paths:
      - native/perfect-chaos-prefix.cpp
      - scripts/perfect-chaos-prefix.mjs
      - scripts/perfect-chaos-classify.py
      - scripts/perfect-chaos-merge-classification.py
      - scripts/perfect_chaos_tables.py
      - tests/perfect-chaos-classification.test.js
      - data/perfect-chaos-prefix/**
      - package.json
      - package-lock.json
      - .github/workflows/verify-perfect-chaos-prefix.yml
  pull_request:
    paths:
      - native/perfect-chaos-prefix.cpp
      - scripts/perfect-chaos-prefix.mjs
      - scripts/perfect-chaos-classify.py
      - scripts/perfect-chaos-merge-classification.py
      - scripts/perfect_chaos_tables.py
      - tests/perfect-chaos-classification.test.js
      - data/perfect-chaos-prefix/**
      - package.json
      - package-lock.json
      - .github/workflows/verify-perfect-chaos-prefix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-perfect-chaos-prefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Check source and replay committed certificate
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run chaos:prefix:verify
          npm run chaos:prefix:verify-reference
