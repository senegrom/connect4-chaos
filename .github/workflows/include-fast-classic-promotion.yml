name: Include optimized classic policies in promotion

on:
  push:
    branches:
      - agent/perfect-classic-7x7
    paths:
      - .github/workflows/include-fast-classic-promotion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-7x7
          fetch-depth: 0

      - name: Add optimized run to promotion sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/promote-perfect-classic-policies.yml')
          source = path.read_text()
          old = '31905360489,31906045563,31906851581,31907494113'
          new = old + ',31908445376'
          if new in source:
              raise SystemExit(0)
          if source.count(old) != 2:
              raise SystemExit(f'Expected two promotion source lists, found {source.count(old)}.')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit promotion source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/promote-perfect-classic-policies.yml
          if git diff --cached --quiet; then
            echo 'Optimized run is already included.'
            exit 0
          fi
          git commit -m 'Include optimized classic policy proofs'
          git push origin HEAD:agent/perfect-classic-7x7
