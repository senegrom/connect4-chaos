name: Continue after current Yellow hardened round

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/continue-after-current-yellow-perfect-chaos-16.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: continue-after-current-yellow-perfect-chaos-16
  cancel-in-progress: false

jobs:
  wait_for_current_round:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31648556889'
      SOURCE_SHA: 'b10a4dbf2c9615a444115e3110db168207e8edad'
    steps:
      - name: Require the locked current-code Yellow refinement run
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$actual_sha" = "$SOURCE_SHA"
          for attempt in $(seq 1 720); do
            read -r status conclusion < <(
              gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
                --jq '[.status, (.conclusion // "")] | @tsv'
            )
            if [[ "$status" == 'completed' ]]; then
              test "$conclusion" = 'success'
              exit 0
            fi
            sleep 30
          done
          echo 'The current Yellow refinement run did not complete in the continuation window.' >&2
          exit 1

  yellow:
    needs: wait_for_current_round
    uses: ./.github/workflows/reusable-perfect-chaos-16-round.yml
    with:
      role: yellow
      source_run: '31648556889'
      source_sha: 'b10a4dbf2c9615a444115e3110db168207e8edad'
      source_artifact: perfect-chaos-yellow-16-current-round
      existing_rejections: 15378
      prepare_shards: 64
      shard_count: 128
      stage_artifact: perfect-chaos-yellow-14-current-next-staged
      shard_prefix: perfect-chaos-yellow-16-current-next-shard-
      result_artifact: perfect-chaos-yellow-16-current-next-round
