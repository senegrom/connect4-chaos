name: Verify paginated Perfect Chaos merge downloads

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/verify-perfect-chaos-paginated-merge.yml
      - scripts/patch-perfect-chaos-paginated-merge.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-perfect-chaos-paginated-merge
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PARENT: 1ebde05badcd84647487bfd06ed853ad1ede039c
      CAMPAIGN_BRANCH: agent/perfect-chaos-16-recovery
    steps:
      - name: Check out the exact green release parent
        uses: actions/checkout@v6
        with:
          ref: 1ebde05badcd84647487bfd06ed853ad1ede039c
          path: release
          fetch-depth: 0

      - name: Check out campaign tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          path: campaign
          fetch-depth: 0

      - name: Apply the reviewed production patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_PARENT"
          (cd release && python3 ../campaign/scripts/patch-perfect-chaos-paginated-merge.py)
          python3 -m py_compile \
            release/scripts/perfect-chaos-download-shards.py \
            release/scripts/test-perfect-chaos-download-shards.py
          git -C release diff --check

      - name: Run focused fail-closed verification
        shell: bash
        run: |
          set -euo pipefail
          cd release
          python3 scripts/test-perfect-chaos-download-shards.py
          python3 scripts/test-perfect-chaos-download-artifact.py
          python3 scripts/test-perfect-chaos-auto-advance.py
          python3 scripts/test-perfect-chaos-certify-closure.py

          workflow16=.github/workflows/reusable-perfect-chaos-16-round.yml
          workflow18=.github/workflows/reusable-perfect-chaos-18-round.yml
          grep -F -- 'merge-artifact-audit/shards.json' "$workflow16"
          grep -F -- 'merge-artifact-audit/shards.json' "$workflow18"
          grep -F -- "test \"\$(jq -r '.missingShards | length' merge-artifact-audit/shards.json)\" = '0'" "$workflow16"
          test "$(grep -c -- '--allow-missing' "$workflow16" || true)" = '0'
          grep -F -- '--allow-missing 8' "$workflow18"
          grep -F -- 'diff -u /tmp/recorded-missing-shards.txt /tmp/actual-missing-shards.txt' "$workflow18"
          for workflow in "$workflow16" "$workflow18"; do
            test "$(grep -c 'pattern: ${{ inputs.shard_prefix }}\*' "$workflow" || true)" = '0'
          done

          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/reusable-perfect-chaos-16-round.yml'),
              Path('.github/workflows/reusable-perfect-chaos-18-round.yml'),
              Path('.github/workflows/reusable-perfect-chaos-16-evidenced-round.yml'),
              Path('.github/workflows/reusable-perfect-chaos-18-evidenced-round.yml'),
              Path('.github/workflows/reusable-perfect-chaos-auto-advance.yml'),
          ]
          for path in paths:
              lines = path.read_text().splitlines()
              uploads = 0
              overwrites = 0
              for index, line in enumerate(lines):
                  if line.strip() != '- uses: actions/upload-artifact@v4':
                      continue
                  uploads += 1
                  indent = len(line) - len(line.lstrip())
                  cursor = index + 1
                  while cursor < len(lines):
                      candidate = lines[cursor]
                      candidate_indent = len(candidate) - len(candidate.lstrip())
                      if candidate.strip().startswith('- ') and candidate_indent == indent:
                          break
                      if candidate.strip() == 'overwrite: true':
                          overwrites += 1
                          break
                      cursor += 1
              if uploads == 0 or overwrites != uploads:
                  raise RuntimeError(f'{path}: {overwrites}/{uploads} uploads are rerun-safe.')
          PY

      - name: Run complete exact and browser verification
        shell: bash
        run: |
          set -euo pipefail
          cd release
          npm ci
          npm run ci
          npm run test:browser
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/ci.yml \
            .github/workflows/reusable-perfect-chaos-16-round.yml \
            .github/workflows/reusable-perfect-chaos-18-round.yml \
            .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml \
            .github/workflows/reusable-perfect-chaos-auto-advance.yml

      - name: Require the exact seven-file release diff
        shell: bash
        run: |
          set -euo pipefail
          git -C release status --short | tee /tmp/release-status
          cat > /tmp/expected-files <<'EOF'
          .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml
          .github/workflows/reusable-perfect-chaos-16-round.yml
          .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml
          .github/workflows/reusable-perfect-chaos-18-round.yml
          .github/workflows/reusable-perfect-chaos-auto-advance.yml
          scripts/perfect-chaos-download-shards.py
          scripts/test-perfect-chaos-download-shards.py
          EOF
          diff -u /tmp/expected-files <(git -C release status --short | cut -c4- | sort)
          git -C release diff --check

      - name: Create content-addressed release blobs
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/paginated-merge-main-blobs.json
          jq -n \
            --arg parent "$RELEASE_PARENT" \
            '{format:"connect4-chaos-paginated-merge-main-blobs-v1",parent:$parent,files:[]}' \
            > "$manifest"

          while IFS= read -r path; do
            mode=100644
            case "$path" in
              scripts/*.py) mode=100755 ;;
            esac
            expected_blob=$(git -C release hash-object "$path")
            content_sha=$(sha256sum "release/$path" | cut -d' ' -f1)
            blob=$(jq -Rs '{content:.,encoding:"utf-8"}' < "release/$path" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
            test "$blob" = "$expected_blob"
            jq \
              --arg path "$path" \
              --arg mode "$mode" \
              --arg sha "$blob" \
              --arg contentSha256 "$content_sha" \
              '.files += [{path:$path,mode:$mode,type:"blob",sha:$sha,contentSha256:$contentSha256}]' \
              "$manifest" > /tmp/manifest-next.json
            mv /tmp/manifest-next.json "$manifest"
          done < /tmp/expected-files

          jq -e '
            .format == "connect4-chaos-paginated-merge-main-blobs-v1"
            and .parent == "1ebde05badcd84647487bfd06ed853ad1ede039c"
            and (.files | length) == 7
            and ([.files[].path] | unique | length) == 7
            and ([.files[].sha] | all(test("^[0-9a-f]{40}$")))
            and ([.files[].contentSha256] | all(test("^[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null

      - name: Publish the verified blob manifest without touching proof state
        shell: bash
        run: |
          set -euo pipefail
          git -C campaign config user.name 'github-actions[bot]'
          git -C campaign config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C campaign fetch origin "$CAMPAIGN_BRANCH"
            git -C campaign reset --hard "origin/$CAMPAIGN_BRANCH"
            mkdir -p campaign/.promotion
            cp /tmp/paginated-merge-main-blobs.json \
              campaign/.promotion/paginated-merge-main-blobs.json
            git -C campaign add .promotion/paginated-merge-main-blobs.json
            test "$(git -C campaign diff --cached --name-only)" = \
              '.promotion/paginated-merge-main-blobs.json'
            git -C campaign commit -m 'Publish verified paginated Chaos merge blob identities'
            if git -C campaign push origin "HEAD:$CAMPAIGN_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the verified blob manifest after five races.' >&2
          exit 1
