name: Parallelize Perfect Chaos prefix shards

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/parallelize-perfect-chaos-prefix-shards.yml

permissions:
  contents: write

concurrency:
  group: parallelize-perfect-chaos-prefix-shards
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-resumable
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply bounded deterministic shard workers
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/perfect-chaos-parallel.patch
          git apply --check /tmp/perfect-chaos-parallel.patch
          git apply /tmp/perfect-chaos-parallel.patch
          git diff --check

      - name: Verify deterministic replay and parallel adaptive splitting
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run chaos:prefix:verify
          npm run chaos:prefix:verify-reference

      - name: Require byte-identical sequential and parallel certificates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/perfect-chaos-workers-1 /tmp/perfect-chaos-workers-2
          node scripts/perfect-chaos-prefix.mjs advance-role \
            --role red \
            --frontier-pieces 10 \
            --pass-budget 20 \
            --shards 4 \
            --shard-from-pieces 10 \
            --minimum-states-per-shard 10000 \
            --shard-workers 1 \
            --output /tmp/perfect-chaos-workers-1 \
            > /tmp/perfect-chaos-workers-1.json
          node scripts/perfect-chaos-prefix.mjs advance-role \
            --role red \
            --frontier-pieces 10 \
            --pass-budget 20 \
            --shards 4 \
            --shard-from-pieces 10 \
            --minimum-states-per-shard 10000 \
            --shard-workers 2 \
            --output /tmp/perfect-chaos-workers-2 \
            > /tmp/perfect-chaos-workers-2.json
          for artifact in \
            0-8.policy.bin 0-8.frontier.bin \
            8-10.policy.bin 8-10.frontier.bin reject-8.bin; do
            cmp "/tmp/perfect-chaos-workers-1/red/$artifact" \
                "/tmp/perfect-chaos-workers-2/red/$artifact"
          done
          node - <<'NODE'
          const first = require('/tmp/perfect-chaos-workers-1.json').checkpoint;
          const second = require('/tmp/perfect-chaos-workers-2.json').checkpoint;
          const firstSummary = first.result.nativeSummaries.at(-1);
          const secondSummary = second.result.nativeSummaries.at(-1);
          if (!first.complete || !second.complete) {
            throw new Error('Worker comparison did not complete both certificates.');
          }
          for (const field of [
            'inputRoots', 'shardGraphStates', 'shardGraphEdges',
            'shardLosingStates', 'shardSafeStates', 'shardClosureStates',
            'frontierStates', 'policyEntries', 'policyConflicts',
          ]) {
            if (firstSummary[field] !== secondSummary[field]) {
              throw new Error(`Worker comparison changed ${field}.`);
            }
          }
          if (firstSummary.shardWorkers !== 1 || secondSummary.shardWorkers !== 2) {
            throw new Error('Worker comparison did not exercise both worker counts.');
          }
          if (firstSummary.policyConflicts !== 0) {
            throw new Error('Worker comparison produced a policy conflict.');
          }
          NODE

      - name: Run the full test suite
        run: npm test

      - name: Commit the tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs
          git diff --cached --check
          git commit -m 'Parallelize Perfect Chaos prefix shards'
          git push origin HEAD:agent/perfect-chaos-resumable
