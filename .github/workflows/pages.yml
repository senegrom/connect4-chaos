name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- _site
          mkdir -p \
            _site/data/perfect-chaos-prefix/red \
            _site/data/perfect-chaos-prefix/yellow \
            _site/data/perfect-classic
          cp -R \
            index.html styles.css favicon.svg favicon.ico \
            apple-touch-icon.png manifest.json cross-origin-isolation-worker.js \
            src assets icons _site/

          grep -q 'rel="apple-touch-icon"' _site/index.html
          grep -q 'rel="manifest"' _site/index.html
          test -f _site/apple-touch-icon.png
          # Without this the page cannot become cross-origin isolated and the
          # neural opponent silently drops to a single WebAssembly thread.
          test -f _site/cross-origin-isolation-worker.js
          # The network is served from R2 rather than from here, so what has
          # to ship is the manifest naming it - and a Content-Security-Policy
          # that allows fetching it. A policy missing that origin blocks the
          # download before any request leaves the browser: no network error
          # and no failed response to find, just an opponent that never
          # starts. That is exactly how it broke once.
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("_site/assets/neural/model.json", "utf8"));
            if (!manifest.origin || !manifest.object) {
              throw new Error("assets/neural/model.json names no published object");
            }
            const page = fs.readFileSync("_site/index.html", "utf8");
            const policy = page.match(/Content-Security-Policy[^>]*content="([^"]+)"/)?.[1] ?? "";
            const connect = policy.match(/connect-src ([^;]+)/)?.[1] ?? "";
            if (!connect.split(/\s+/).includes(manifest.origin)) {
              throw new Error(`connect-src does not allow ${manifest.origin}: ${connect}`);
            }
          '
          test -f _site/icons/connect4-chaos-180.png
          test -f _site/icons/connect4-chaos-192.png
          test -f _site/icons/connect4-chaos-512.png
          test -f _site/icons/connect4-chaos-512-maskable.png

          cp data/perfect-chaos-prefix/red/*.policy.bin _site/data/perfect-chaos-prefix/red/
          cp data/perfect-chaos-prefix/yellow/*.policy.bin _site/data/perfect-chaos-prefix/yellow/
          prefix_count="$(node -e \
            'const m=require("./data/perfect-chaos-prefix/manifest.json");
             process.stdout.write(String(JSON.stringify(m).match(/\.policy\.bin/g).length))')"
          test "$(find _site/data/perfect-chaos-prefix -name '*.policy.bin' | wc -l)" = "$prefix_count"

          mkdir -p _site/data/perfect-chaos-complete
          cp data/perfect-chaos-complete/manifest.json data/perfect-chaos-complete/*.bin \
            _site/data/perfect-chaos-complete/
          test "$(ls _site/data/perfect-chaos-complete | wc -l)" \
            = "$(ls data/perfect-chaos-complete | wc -l)"

          cp data/perfect-classic/manifest.json _site/data/perfect-classic/manifest.json
          policy_count="$(node -e \
            'const m=require("./data/perfect-classic/manifest.json"); process.stdout.write(String(m.policies?.length ?? 0))')"
          if (( policy_count > 0 )); then
            cp data/perfect-classic/*.bin _site/data/perfect-classic/
            test "$(find _site/data/perfect-classic -name '*.bin' | wc -l)" = "$policy_count"
          fi
          touch _site/.nojekyll
          if find _site -type l -print -quit | grep -q .; then
            echo 'Refusing to publish symlinks in the Pages artifact.' >&2
            exit 1
          fi
          if find _site -name '.*' ! -path '_site/.nojekyll' -print -quit | grep -q .; then
            echo 'Refusing to publish unexpected hidden files in the Pages artifact.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true # Retain only the validated .nojekyll marker.

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
