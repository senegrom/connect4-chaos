name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check and test
        run: npm run ci

      - name: Browser smoke
        run: npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p \
            _site/data/perfect-chaos-prefix/red \
            _site/data/perfect-chaos-prefix/yellow \
            _site/data/perfect-classic
          cp -R index.html styles.css favicon.svg src assets _site/
          cp data/perfect-chaos-prefix/red/*.policy.bin _site/data/perfect-chaos-prefix/red/
          cp data/perfect-chaos-prefix/yellow/*.policy.bin _site/data/perfect-chaos-prefix/yellow/
          prefix_count="$(node -e \
            'const m=require("./data/perfect-chaos-prefix/manifest.json");
             process.stdout.write(String(JSON.stringify(m).match(/\.policy\.bin/g).length))')"
          test "$(find _site/data/perfect-chaos-prefix -name '*.policy.bin' | wc -l)" = "$prefix_count"

          cp data/perfect-classic/manifest.json _site/data/perfect-classic/manifest.json
          policy_count="$(node -e \
            'const m=require("./data/perfect-classic/manifest.json"); process.stdout.write(String(m.policies?.length ?? 0))')"
          if (( policy_count > 0 )); then
            cp data/perfect-classic/*.bin _site/data/perfect-classic/
            test "$(find _site/data/perfect-classic -name '*.bin' | wc -l)" = "$policy_count"
          fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
