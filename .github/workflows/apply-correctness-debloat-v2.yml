  const children = makeChildren(board, player, context, preferredAction, ply);
""", "  const children = makeChildren(board, player, context, null, ply);\n", 'remove dead Chaos TT lookup')

          dead_store = re.compile(r"\n  if \(tablePosition\) \{.*?\n  \}\n\n  return bestScore;", re.S)
          match = dead_store.search(ai)
          if not match:
              raise SystemExit('dead generic TT store block not found')
          ai = ai[:match.start()] + "\n  return bestScore;" + ai[match.end():]

          pv_pattern = re.compile(r"function principalVariation\(position, firstAction, depth, context\) \{.*?\n\}\n\n\n// Specialised mutable search", re.S)
          match = pv_pattern.search(ai)
          if not match:
              raise SystemExit('generic principalVariation block not found')
          ai = ai[:match.start()] + "function principalVariation(firstAction) {\n  return firstAction ? [{ ...firstAction }] : [];\n}\n\n\n// Specialised mutable search" + ai[match.end():]
          ai = ai.replace('principalVariation(position, result.action, depth, context)', 'principalVariation(result.action)')

          ai = replace_once(ai, """  const configuredMaximumDepth = Math.max(
    1,
    options.maximumDepth
      ?? (position.chaosMode ? defaults.chaosMaximumDepth : defaults.maximumDepth),
  );
  const maximumDepth = position.chaosMode
    ? configuredMaximumDepth
    : Math.min(configuredMaximumDepth, emptyCellCount(position.board));
""", "  const maximumDepth = Math.max(1, options.maximumDepth ?? defaults.chaosMaximumDepth);\n", 'simplify Chaos depth selection')

          classic_return = """  return {
    ...best,
    nodes: context.nodes,
    elapsedMs: now() - start,
    tableHits: context.tableHits,
    cutoffs: context.cutoffs,
    tableResets: context.tableResets,
  };
}

function emptyCellCount"""
          ai = replace_once(ai, classic_return, """  return enforceTacticalSafety(position, {
    ...best,
    nodes: context.nodes,
    elapsedMs: now() - start,
    tableHits: context.tableHits,
    cutoffs: context.cutoffs,
    tableResets: context.tableResets,
  });
}

function emptyCellCount""", 'classic tactical safety return')

          chaos_return = """  return {
    ...best,
    nodes: context.nodes,
    elapsedMs: now() - start,
    tableHits: context.tableHits,
    cutoffs: context.cutoffs,
    tableResets: context.tableResets,
  };
}

export const AI_ACTION_TYPES"""
          ai = replace_once(ai, chaos_return, """  return enforceTacticalSafety(position, {
    ...best,
    nodes: context.nodes,
    elapsedMs: now() - start,
