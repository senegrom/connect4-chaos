}

export const AI_ACTION_TYPES""", 'Chaos tactical safety return')
          ai_path.write_text(ai)

          app_path = Path('src/app.js')
          app = app_path.read_text()
          app = replace_once(app, """  medium: 'Quick search with tactical awareness.',
  hard: 'A deeper search that usually thinks for under a second.',
  brutal: 'The strongest search; allow a few seconds per move.',
""", """  medium: 'Completes a 6-ply search with tactical extensions.',
  hard: 'Completes a 9-ply search with deeper tactical analysis.',
  brutal: 'Completes a 12-ply search; complex positions can take longer.',
""", 'difficulty hints')
          app = replace_once(app, """  const aiPercent = 100 - redPercent;
  elements.evaluationMeter.value = redPercent;
  elements.evaluationMeter.textContent = `${redPercent}%`;
  elements.evaluationLabel.textContent = label;
  elements.evaluationPercent.textContent = `Red ${redPercent}% · AI ${aiPercent}%`;
""", """  elements.evaluationMeter.value = redPercent;
  elements.evaluationMeter.textContent = label;
  elements.evaluationLabel.textContent = label;
  elements.evaluationPercent.textContent = 'Heuristic position estimate · not a win probability';
""", 'honest evaluation display')
          app = replace_once(app, """          result: chooseMove(position, {
            ...options,
            onIteration(progress) {
""", """          result: chooseMove(position, {
            ...options,
            difficulty: 'easy',
            onIteration(progress) {
""", 'cheap main-thread worker fallback')
          app_path.write_text(app)

          tests_path = Path('tests/ai.test.js')
          tests = tests_path.read_text()
          for budget in (80, 60, 500):
              tests = tests.replace(f"    timeBudgetMs: {budget},\n", '')
          tests = tests.replace("    timeBudgetMs: 12,\n    maximumDepth: 30,\n", "    maximumDepth: 6,\n")
          tests = tests.replace("    timeBudgetMs: 80,\n    maximumDepth: 2,\n", "    maximumDepth: 2,\n")
          tests = tests.replace("test('iterative-deepening AI returns a legal move within a small budget'", "test('depth-limited AI completes the requested search depth'")
          tests = tests.replace("test('timed classic search leaves the caller board unchanged'", "test('classic search leaves the caller board unchanged'")
          anchor = "test('the evaluator rewards central control for the AI', () => {\n"
          new_test = """test('search depth is not curtailed by a legacy time budget option', () => {
  const board = emptyBoard(4, 4);
  const result = chooseMove(position(board, { connect: 3 }), {
    difficulty: 'medium',
    timeBudgetMs: 0,
    maximumDepth: 4,
  });

  assert.equal(result.depth, 4);
  assert.ok(result.action);
});

"""
          if tests.count(anchor) != 1:
              raise SystemExit('test insertion anchor not unique')
          tests = tests.replace(anchor, new_test + anchor, 1)
          tests_path.write_text(tests)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_once(readme, "Medium prioritises quick responses, Hard searches for roughly a second, and Brutal spends a few seconds looking substantially deeper. Search time is a ceiling rather than a delay: forced moves may return immediately.\n", "Medium completes 6 plies, Hard 9, and Brutal 12, with additional tactical extensions at the horizon. There is no wall-clock search cutoff: the worker finishes the selected depth unless the player explicitly cancels it by restarting, undoing, or changing the game.\n", 'README search policy')
          readme_path.write_text(readme)

          package_path = Path('package.json')
          package_path.write_text(package_path.read_text().replace('"version": "1.1.0"', '"version": "1.2.0"'))
          lock_path = Path('package-lock.json')
          lock_path.write_text(lock_path.read_text().replace('"version": "1.1.0"', '"version": "1.2.0"'))

          Path('.github/workflows/apply-correctness-debloat.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-correctness-debloat-v2.yml').unlink()

      - name: Validate source and tests
        run: |
          npm ci
          npm run ci
          git diff --check
          ! grep -R "SearchTimeout\|defaults.timeBudgetMs\|deadline:" src/ai.js

      - name: Publish reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Remove AI time cutoffs and debloat search"
          git push origin HEAD:main
