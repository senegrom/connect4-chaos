name: Apply correctness and search debloat v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-correctness-debloat-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-correctness-debloat
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Apply reviewed changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          ai_path = Path('src/ai.js')
          ai = ai_path.read_text()

          ai = replace_once(ai, """const TIME_CHECK_MASK = 255;
const MAX_TABLE_ENTRIES = 350_000;
const PREFERRED_MOVE_BONUS = 4_000_000;
const FIRST_KILLER_BONUS = 240_000;
const SECOND_KILLER_BONUS = 120_000;

const DIFFICULTY = Object.freeze({
  medium: {
    timeBudgetMs: 250,
    maximumDepth: 10,
    chaosMaximumDepth: 4,
    quiescenceDepth: 2,
  },
  hard: {
    timeBudgetMs: 900,
    maximumDepth: 18,
    chaosMaximumDepth: 6,
    quiescenceDepth: 3,
  },
  brutal: {
    timeBudgetMs: 2_500,
    maximumDepth: 42,
    chaosMaximumDepth: 9,
    quiescenceDepth: 4,
  },
});

class SearchTimeout extends Error {
  constructor() {
    super('Search time limit reached.');
    this.name = 'SearchTimeout';
  }
}

function now() {
  return globalThis.performance?.now?.() ?? Date.now();
}

function checkTime(context) {
  context.nodes += 1;
  if ((context.nodes & TIME_CHECK_MASK) === 0 && now() >= context.deadline) {
    throw new SearchTimeout();
  }
}
""", """const MAX_TABLE_ENTRIES = 350_000;
const PREFERRED_MOVE_BONUS = 4_000_000;
const FIRST_KILLER_BONUS = 240_000;
const SECOND_KILLER_BONUS = 120_000;

// Difficulty is depth-based, never wall-clock based. Searches finish the selected
// depth unless the user explicitly cancels the worker by changing the game state.
const DIFFICULTY = Object.freeze({
  medium: { maximumDepth: 6, chaosMaximumDepth: 4, quiescenceDepth: 2 },
  hard: { maximumDepth: 9, chaosMaximumDepth: 5, quiescenceDepth: 3 },
  brutal: { maximumDepth: 12, chaosMaximumDepth: 6, quiescenceDepth: 4 },
});

function now() {
  return globalThis.performance?.now?.() ?? Date.now();
}

function visitNode(context) {
  context.nodes += 1;
}
""", 'remove wall-clock timeout machinery')

          ai = ai.replace('checkTime(context);', 'visitNode(context);')
          ai = re.sub(r"\n  const timeBudgetMs = Math\.max\(10, options\.timeBudgetMs \?\? defaults\.timeBudgetMs\);", '', ai)
          ai = ai.replace('    deadline: start + timeBudgetMs,\n', '')
          if any(token in ai for token in ('checkTime(context)', 'SearchTimeout', 'deadline:', 'defaults.timeBudgetMs')):
              raise SystemExit('timeout machinery remains after replacement')

          loop = "  for (let depth = 1; depth <= maximumDepth; depth += 1) {\n    try {\n"
          if ai.count(loop) != 2:
              raise SystemExit(f'expected two iterative timeout wrappers, found {ai.count(loop)}')
          ai = ai.replace(loop, "  for (let depth = 1; depth <= maximumDepth; depth += 1) {\n")
          catch = """    } catch (error) {
      if (error instanceof SearchTimeout) break;
      throw error;
    }
"""
          if ai.count(catch) != 2:
              raise SystemExit(f'expected two timeout catches, found {ai.count(catch)}')
          ai = ai.replace(catch, '')

          ai = replace_once(ai, """function mirrorAction(action, cols) {
  if (!action) return null;
  if (action.type === ACTION_DROP) return { type: ACTION_DROP, column: cols - 1 - action.column };
  if (action.type === ACTION_ROTATE_CW) return { type: ACTION_ROTATE_CCW };
  if (action.type === ACTION_ROTATE_CCW) return { type: ACTION_ROTATE_CW };
  return { ...action };
}
""", """function mirrorAction(action, cols) {
  if (!action) return null;
  return { type: ACTION_DROP, column: cols - 1 - action.column };
}
""", 'debloat mirror action')

          marker = "function chooseEasy(position, random = Math.random) {\n"
          safety = """function tacticallySafeActions(position) {
  const { board, connect, currentPlayer, chaosMode } = position;
  const opponent = otherPlayer(currentPlayer);
  const safe = [];

  for (const action of legalActions(board, chaosMode)) {
    const result = applyAction(board, action, currentPlayer);
    if (!result) continue;
    const outcome = actionOutcome(result, action, currentPlayer, connect);
    if (outcome.status === 'won') {
      if (outcome.winner === currentPlayer) safe.push(action);
      continue;
