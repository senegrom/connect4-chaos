name: Verify exact Perfect Chaos WDL loss ranks

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-wdl-loss-rank-check.yml

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-wdl-loss-rank-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply and verify symmetric WDL ranks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-perfect-chaos-wdl-loss-rank-check.py
          python3 scripts/apply-perfect-chaos-wdl-loss-rank-check.py
          python3 -m py_compile scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py
          python3 scripts/test-perfect-chaos-wdl.py
          node scripts/perfect-chaos-wdl-crosscheck.mjs
          npm run check
          npm test
          git diff --check

      - name: Commit the validated verifier and remove the installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git rm .github/workflows/install-perfect-chaos-wdl-loss-rank-check.yml
          git rm scripts/apply-perfect-chaos-wdl-loss-rank-check.py
          git add scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py scripts/perfect-chaos-wdl-crosscheck.mjs
          git commit -m 'Verify exact Perfect Chaos loss ranks'
          git push origin HEAD:agent/perfect-chaos-16-recovery
