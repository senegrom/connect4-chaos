name: Verify promoted Perfect Chaos journal after browser hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-promoted-perfect-chaos-journal-v2.yml

permissions:
  contents: write

concurrency:
  group: verify-promoted-perfect-chaos-journal-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify fresh, reused, and corrupt exact journal entries
        id: journal
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          grep -F -- 'connect4-chaos-prefix-journal-v2' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'binarySha256' scripts/perfect-chaos-prefix.mjs
          grep -F -- 'invalidations' scripts/perfect-chaos-prefix.mjs
          node scripts/perfect-chaos-prefix.mjs verify \
            | tee /tmp/promoted-journal-verify.json
          jq -e '
            .journal.fresh.hits == 0
            and .journal.fresh.misses >= 2
            and .journal.fresh.stores >= 2
            and .journal.reused.misses == 0
            and .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
            and .journal.recovered.misses >= 1
            and .journal.recovered.hits >= 1
          ' /tmp/promoted-journal-verify.json >/dev/null

      - name: Run complete exact release suite
        id: exact
        continue-on-error: true
        run: npm run ci

      - name: Run real browser gate with bounded startup-only retry
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/browser-smoke.log

      - name: Replay the committed two-role Perfect Chaos prefix
        id: replay
        continue-on-error: true
        run: npm run chaos:prefix:verify-reference

      - name: Record immutable promoted result and remove this gate
        if: always()
        shell: bash
        env:
          JOURNAL: ${{ steps.journal.outcome }}
          EXACT: ${{ steps.exact.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
        run: |
          set -euo pipefail
          result=failure
          if [[ "$JOURNAL" = success \
                && "$EXACT" = success \
                && "$BROWSER" = success \
                && "$REPLAY" = success ]]; then
            result=success
          fi
          RESULT="$result" JOURNAL="$JOURNAL" EXACT="$EXACT" \
            BROWSER="$BROWSER" REPLAY="$REPLAY" python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          browser_log = Path('/tmp/browser-smoke.log')
          browser_attempt = 1
          if browser_log.exists():
              match = re.search(
                  r'Browser smoke passed on clean launch attempt (\d+)/(\d+)\.',
                  browser_log.read_text(errors='replace'),
              )
              if match:
                  browser_attempt = int(match.group(1))

          value = {
              'format': 'connect4-perfect-chaos-promoted-journal-verification-v2',
              'result': os.environ['RESULT'],
              'journal': os.environ['JOURNAL'],
              'exactReleaseSuite': os.environ['EXACT'],
              'browser': os.environ['BROWSER'],
              'browserLaunchAttempt': browser_attempt,
              'committedPrefixReplay': os.environ['REPLAY'],
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/promoted-perfect-chaos-journal.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/promoted-perfect-chaos-journal.json \
              .audit/promoted-perfect-chaos-journal.json
            git rm --ignore-unmatch \
              .github/workflows/verify-promoted-perfect-chaos-journal-v2.yml
            git add .audit/promoted-perfect-chaos-journal.json
            changed="$(git diff --cached --name-only | sort)"
            expected=$'.audit/promoted-perfect-chaos-journal.json\n.github/workflows/verify-promoted-perfect-chaos-journal-v2.yml'
            test "$changed" = "$expected"
            git commit -m "Record promoted Perfect Chaos journal verification: $result"
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" = 5 ]]; then
              echo 'Could not publish the promoted journal result.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          test "$result" = success
