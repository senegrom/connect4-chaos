name: Security regressions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-size-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native size bounds and solver fixtures under UBSan
        run: python3 scripts/test-native-security.py

  local-server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Static file access and error recovery
        run: node --test tests/serve.test.mjs
