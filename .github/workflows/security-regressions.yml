name: Security regressions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Called from CI, github.workflow names CI; dispatched by hand, this workflow.
  # Without it a manual run cancelled the security jobs of the CI
  # run on the same ref, and with them that push's Pages deploy.
  group: security-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-size-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classic size bounds and the Chaos solvers under UBSan
        run: python3 scripts/test-native-security.py
