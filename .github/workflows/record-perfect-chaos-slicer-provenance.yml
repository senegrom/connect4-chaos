name: Record Perfect Chaos slicer provenance

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/record-perfect-chaos-slicer-provenance.yml

permissions:
  contents: write

concurrency:
  group: record-perfect-chaos-slicer-provenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Update only the independently verified native-source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum native/perfect-chaos-prefix.cpp | cut -d' ' -f1)" = '2ebfbeeed06b41d1a5605eaa9c132f2770fad34b9bc595684b3a9b2553fdc249'
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/perfect-chaos-prefix/manifest.json')
          manifest = json.loads(path.read_text())
          old = 'a32dc05cf3ba1f57e015ea28e74a85273227bcfac7a5971eab6685797e8b5842'
          new = '2ebfbeeed06b41d1a5605eaa9c132f2770fad34b9bc595684b3a9b2553fdc249'
          if manifest.get('sourceSha256') != old:
              raise RuntimeError(f"Unexpected prior source identity: {manifest.get('sourceSha256')!r}")
          manifest['sourceSha256'] = new
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          test "$(git diff --numstat -- data/perfect-chaos-prefix/manifest.json)" = $'1\t1\tdata/perfect-chaos-prefix/manifest.json'
          git diff --check

      - name: Replay the complete committed certificate with the updated source
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm run chaos:prefix:verify-reference

      - name: Commit the verified provenance correction and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/record-perfect-chaos-slicer-provenance.yml
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git add data/perfect-chaos-prefix/manifest.json .github/workflows/record-perfect-chaos-slicer-provenance.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/record-perfect-chaos-slicer-provenance.yml\ndata/perfect-chaos-prefix/manifest.json'
          git commit -m 'Record exact policy slicer provenance'
          git push origin HEAD:agent/perfect-chaos-16-recovery
