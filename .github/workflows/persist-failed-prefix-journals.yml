name: Verify failure-safe exact prefix journal persistence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/persist-failed-prefix-journals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-failed-prefix-journals
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for the prerequisite verified integration
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 240); do
            git fetch origin main
            if git show origin/main:scripts/perfect-chaos-prefix.mjs \
                | grep -Fq 'connect4-chaos-prefix-journal-v2' \
              && git show origin/main:.github/workflows/reusable-perfect-chaos-18-round.yml \
                | grep -Fq 'actions/cache@v4' \
              && git cat-file -e origin/main:.audit/finalized-exact-solver-tooling.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 30
          done
          test "$ready" = true
          git reset --hard origin/main

      - run: npm ci

      - name: Install explicit restore and always-save journal steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path('.github/workflows/reusable-perfect-chaos-18-round.yml')
          text = path.read_text()
          old_cache = '''      - name: Restore exact prefix journal
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/perfect-chaos-prefix-journal-${{ inputs.role }}
          key: perfect-chaos-prefix-journal-v2-${{ runner.os }}-${{ inputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perfect-chaos-prefix-journal-v2-${{ runner.os }}-${{ inputs.role }}-

'''
          new_cache = '''      - name: Create exact prefix journal directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/perfect-chaos-prefix-journal-${{ inputs.role }}"

      - name: Restore exact prefix journal
        id: journal-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/perfect-chaos-prefix-journal-${{ inputs.role }}
          key: perfect-chaos-prefix-journal-v2-${{ runner.os }}-${{ inputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perfect-chaos-prefix-journal-v2-${{ runner.os }}-${{ inputs.role }}-

'''
          if text.count(old_cache) != 1:
              raise RuntimeError(f'Expected one combined cache step, found {text.count(old_cache)}')
          text = text.replace(old_cache, new_cache, 1)

          command = 'node scripts/perfect-chaos-prefix.mjs prepare-role \\\n'
          command_at = text.index(command)
          run_at = text.rfind('        run: |\n', 0, command_at)
          step_at = text.rfind('      - ', 0, run_at)
          if min(command_at, run_at, step_at) < 0:
              raise RuntimeError('Could not isolate the exact prepare-role step.')
          header = text[step_at:run_at]
          if 'id: exact-prepare' in header or 'continue-on-error:' in header:
              raise RuntimeError('Prepare step already has unexpected outcome handling.')
          header += '        id: exact-prepare\n        continue-on-error: true\n'
          text = text[:step_at] + header + text[run_at:]

          command_at = text.index(command)
          next_step = text.find('\n      - ', command_at)
          if next_step < 0:
              raise RuntimeError('Could not locate the step after exact preparation.')
          persistence = '''
      - name: Validate the partial journal before saving
        id: journal-state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/perfect-chaos-prefix-journal-${{ inputs.role }}"
          test -d "$journal" && test ! -L "$journal"
          if find "$journal" -type l -print -quit | grep -q .; then
            echo 'The journal contains a symbolic link; refusing to cache it.' >&2
            exit 1
          fi
          bytes="$(du -sb "$journal" | cut -f1)"
          files="$(find "$journal" -type f | wc -l)"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if (( files > 0 && bytes <= 4294967296 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo 'save=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save completed content-addressed journal entries
        if: always() && steps.journal-state.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/perfect-chaos-prefix-journal-${{ inputs.role }}
          key: perfect-chaos-prefix-journal-v2-${{ runner.os }}-${{ inputs.role }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve the original exact-preparation result
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.exact-prepare.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PREPARE_OUTCOME" != success ]]; then
            echo "Exact prefix preparation concluded: $PREPARE_OUTCOME" >&2
            exit 1
          fi

'''
          text = text[:next_step] + persistence + text[next_step:]
          path.write_text(text, newline='\n')
          PY

          cat > tests/perfect-chaos-journal-failure-persistence.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';

          const workflow = readFileSync(fileURLToPath(new URL(
            '../.github/workflows/reusable-perfect-chaos-18-round.yml',
            import.meta.url,
          )), 'utf8');
          const start = workflow.indexOf('  prepare:\n');
          const end = ['\n  classify:', '\n  merge:', '\n  evidence:']
            .map((anchor) => workflow.indexOf(anchor, start))
            .filter((index) => index >= 0)
            .sort((a, b) => a - b)[0];
          const prepare = workflow.slice(start, end);

          test('preparation restores and saves with separate immutable cache actions', () => {
            assert.equal((prepare.match(/actions\/cache\/restore@v4/g) ?? []).length, 1);
            assert.equal((prepare.match(/actions\/cache\/save@v4/g) ?? []).length, 1);
            assert.equal((prepare.match(/uses: actions\/cache@v4/g) ?? []).length, 0);
            assert.match(prepare, /if: always\(\) && steps\.journal-state\.outputs\.save == 'true'/);
          });

          test('prepare failure is delayed only until validated journal persistence', () => {
            const command = prepare.indexOf('node scripts/perfect-chaos-prefix.mjs prepare-role');
            const save = prepare.indexOf('uses: actions/cache/save@v4');
            const gate = prepare.indexOf('Preserve the original exact-preparation result');
            assert.ok(command >= 0 && save > command && gate > save);
            assert.match(prepare.slice(0, command), /id: exact-prepare/);
            assert.match(prepare.slice(0, command), /continue-on-error: true/);
            assert.match(prepare, /PREPARE_OUTCOME: \$\{\{ steps\.exact-prepare\.outcome \}\}/);
            assert.match(prepare, /if \[\[ "\$PREPARE_OUTCOME" != success \]\]/);
          });

          test('partial journals are bounded and excluded from certificate output', () => {
            assert.match(prepare, /bytes <= 4294967296/);
            assert.match(prepare, /find "\$journal" -type l/);
            assert.match(prepare, /\$RUNNER_TEMP\/perfect-chaos-prefix-journal-\$\{\{ inputs\.role \}\}/);
            assert.doesNotMatch(
              prepare.match(/path: .*perfect-chaos-prefix-journal.*$/m)?.[0] ?? '',
              /generated|prepared/,
            );
          });
          EOF

          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/reusable-perfect-chaos-18-round.yml
          node --check tests/perfect-chaos-journal-failure-persistence.test.js
          git diff --check

      - name: Run focused and complete verification
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          node --test \
            tests/perfect-chaos-journal-workflow.test.js \
            tests/perfect-chaos-journal-failure-persistence.test.js
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/journal-persistence-verify.json
          jq -e '
            .journal.fresh.stores >= 2
            and .journal.reused.hits >= 2
            and .journal.recovered.invalidations >= 1
          ' /tmp/journal-persistence-verify.json >/dev/null
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish the tested workflow to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/persist-failed-prefix-journals.yml
          git add .github/workflows/reusable-perfect-chaos-18-round.yml \
                  tests/perfect-chaos-journal-failure-persistence.test.js
          git commit -m 'Persist validated exact prefix journals on failure'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
                .github/workflows/reusable-perfect-chaos-18-round.yml
              node --test \
                tests/perfect-chaos-journal-workflow.test.js \
                tests/perfect-chaos-journal-failure-persistence.test.js
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo 'A newer production workflow conflicts with this tested patch.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish failure-safe journal persistence.' >&2
          exit 1
