name: Install durable identity in independent sharded audit

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/fix-perfect-chaos-sharded-audit-artifact-identity.yml
      - scripts/patch-perfect-chaos-sharded-audit-artifact-identity.py
      - scripts/test-perfect-chaos-audit-sharded-round.py

permissions:
  contents: write

concurrency:
  group: fix-perfect-chaos-sharded-audit-artifact-identity
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the durable identity rule in the independent auditor
        run: |
          python3 scripts/patch-perfect-chaos-sharded-audit-artifact-identity.py \
            scripts/perfect-chaos-audit-sharded-round.py

      - name: Verify focused fail-closed cases and the complete suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile scripts/perfect-chaos-audit-sharded-round.py
          python3 scripts/test-perfect-chaos-audit-sharded-round.py 2>&1 \
            | tee sharded-audit-identity-test.log
          npm test | tee full-test.log
          grep -q 'Ran 4 tests' sharded-audit-identity-test.log
          grep -q '^OK$' sharded-audit-identity-test.log
          grep -q 'fail 0' full-test.log

      - name: Commit the verified independent-audit rule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/perfect-chaos-audit-sharded-round.py \
            scripts/test-perfect-chaos-audit-sharded-round.py
          if git diff --cached --quiet; then
            echo 'The independent sharded audit already uses durable identity.'
            exit 0
          fi
          git commit -m 'Align independent sharded audit with durable artifact identity'
          git push origin HEAD:agent/perfect-chaos-16-recovery

      - name: Upload audit-parser regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-sharded-audit-artifact-identity-verification
          path: |
            sharded-audit-identity-test.log
            full-test.log
          if-no-files-found: error
          retention-days: 90
