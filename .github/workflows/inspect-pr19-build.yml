name: Inspect PR19 final-file build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-pr19-build.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Bind the latest builder runs
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/build-pr19-final-files.yml/runs" \
            -f branch=main -F per_page=20 \
            | jq '{
                format: "connect4-pr19-build-inspection-v1",
                runs: [.workflow_runs[] | {
                  id, run_attempt, event, status, conclusion, head_sha,
                  created_at, updated_at, html_url, display_title
                }]
              }' > /tmp/pr19-build-inspection.json
          jq -e '.runs | length >= 1' /tmp/pr19-build-inspection.json
          cat /tmp/pr19-build-inspection.json
      - name: Commit the inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/pr19-build-inspection.json .audit/pr19-final-build-inspection.json
            git add .audit/pr19-final-build-inspection.json
            git commit -m 'Record PR19 final-file build inspection'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
