name: Refresh Perfect Chaos release documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-perfect-chaos-release-docs.yml

permissions:
  contents: write

concurrency:
  group: refresh-perfect-chaos-release-docs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build the idempotent documentation patch
        shell: bash
        run: |
          cat > /tmp/refresh-perfect-chaos-docs.py <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1:
                  return text.replace(old, new, 1)
              if old_count == 0 and new_count == 1:
                  return text
              raise RuntimeError(
                  f'{label}: expected exactly one old or one new block; '
                  f'old={old_count}, new={new_count}'
              )

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              '- **Certified Chaos prefix** — standard 6×7 Chaos Mode has an independently replayed non-losing policy certificate for both starting roles through **14 placed pieces**; Brutal lazy-loads the matching certified layer during live play.',
              '- **Certified Chaos prefix** — standard 6×7 Chaos Mode has an independently replayed non-losing policy certificate for both starting roles through **16 placed pieces**; Brutal lazy-loads the matching certified layer during live play.',
              'README highlight',
          )
          readme = replace_once(
              readme,
              '| Brutal | Certified standard-board Chaos play through 14 placed pieces, transform-aware bounded search beyond it, and automatic use of the exact Chaos endgame frontier. |',
              '| Brutal | Certified standard-board Chaos play through 16 placed pieces, transform-aware bounded search beyond it, and automatic use of the exact Chaos endgame frontier. |',
              'README AI table',
          )
          readme = replace_once(
              readme,
              'The committed certificate covers both starting roles through 14 placed pieces. It is split into the boundaries `0→8`, `8→10`, `10→12` and `12→14`. Counterexamples discovered in a later layer are propagated backward as explicit rejection sets until the earlier policy no longer reaches them. The browser worker lazy-loads only the policy layer matching the current piece count, so Brutal follows the committed certificate through 14 placed pieces without downloading later tables prematurely. Beyond that frontier it clearly returns to bounded search; this does not claim the complete game is solved.',
              'The committed certificate covers both starting roles through 16 placed pieces. It is split into the boundaries `0→8`, `8→10`, `10→12`, `12→14` and `14→16`. Counterexamples discovered in a later layer are propagated backward as explicit rejection sets until the earlier policy no longer reaches them. The browser worker lazy-loads only the policy layer matching the current piece count, so Brutal follows the committed certificate through 16 placed pieces without downloading later tables prematurely. Beyond that frontier it clearly returns to bounded search; this does not claim the complete game is solved.',
              'README prefix paragraph',
          )
          readme = replace_once(
              readme,
              'The independent JavaScript verifier checks binary headers, canonical ordering, hashes, exact frontier equality, policy reachability and every opponent action. It replayed 909,222 states in the final `12→14` closures without reaching an AI-loss terminal. Large extensions can split an exact sorted input frontier into deterministic shards, merge all safe policies and rejection sets, and then replay the merged certificate as one closure.',
              'The independent JavaScript verifier checks binary headers, canonical ordering, hashes, exact frontier equality, policy reachability and every opponent action. In the final `14→16` segments it replayed 747,775 Red closure states and 2,498,257 Yellow closure states without reaching an AI-loss terminal. Large extensions can split an exact sorted input frontier into deterministic shards, merge all safe policies and rejection sets, and then replay the merged certificate as one closure.',
              'README replay paragraph',
          )
          readme = replace_once(
              readme,
              'The remaining gap is from the committed 14-piece frontier to the exact endgame handoff at 36 placed pieces. Work beyond 14 pieces is experimental until a complete replayable certificate is committed.',
              'The remaining gap is from the committed 16-piece frontier to the exact endgame handoff at 36 placed pieces. Work beyond 16 pieces remains experimental until a complete replayable certificate is committed.',
              'README remaining gap',
          )
          readme = replace_once(
              readme,
              '| `npm run chaos:prefix:verify-reference` | Independently replay and hash-check the committed 14-piece Chaos certificate. |',
              '| `npm run chaos:prefix:verify-reference` | Independently replay and hash-check the committed 16-piece Chaos certificate. |',
              'README command table',
          )
          readme_path.write_text(readme, newline='\n')

          docs_path = Path('docs/PERFECT_CHAOS.md')
          docs = docs_path.read_text()
          scale_heading = '### How the solver scales\n'
          prefix_heading = '## Layered prefix safety certificate\n'
          start = docs.find(scale_heading)
          end = docs.find(prefix_heading)
          if start < 0 or end < 0 or end <= start:
              raise RuntimeError('Could not locate the complete-solver scaling section')
          new_scale = '''### How the solver scales

`native/perfect-chaos-complete.cpp` sizes memory by the number of *reachable* canonical states rather than by the dense mixed-radix index space. A rank/select bitset maps each reachable index to a compact ordinal, while the value, rank and selected-action arrays are stored only for those ordinals.

The current solver does not materialise forward or reverse successor lists. During ranked retrograde sweeps it regenerates each edge from the canonical state and probes the compact value arrays. Settled draw regions are skipped in later sweeps, and independent word ranges can be processed concurrently because a state settled in rank round `r` cannot satisfy another state’s rank-`r−1` condition in the same round.

Long runs are resumable. Discovery publishes a bitset checkpoint, each completed rank round atomically publishes the value/rank/action arrays, and a restarted solve validates the geometry before continuing. Byte-identical regeneration tests cover 4×4, 4×5 and 5×5, including interrupted and multithreaded runs. Current memory estimates are about 16 GB for 4×7 Connect 4 and 24 GB for 5×6 Connect 4, placing the next complete-board solves within workstation or large-runner range rather than requiring stored successor graphs.

```bash
npm run chaos:complete:generate -- --rows 4 --columns 5 --connect 4
npm run chaos:complete:verify
```

The `generate` command compiles the native solver, solves the board, emits both role certificates, replays each through `engine.js`, and writes a per-board manifest that carries the generator summary and the independent replay side by side; an entry is written only when the two agree. `merge-manifests` assembles per-board manifests into the runtime catalog and rejects duplicate identities. Every committed certificate was produced this way from the committed source, so the catalog is reproducible rather than merely verifiable.

'''
          if 'does not materialise forward or reverse successor lists' not in docs:
              docs = docs[:start] + new_scale + docs[end:]

          start_marker = '### Compositional boundaries\n'
          end_marker = '### Deterministic sharding\n'
          start = docs.find(start_marker)
          end = docs.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise RuntimeError('Could not locate the layered-prefix release section')
          new_prefix = '''### Compositional boundaries

A monolithic graph is unnecessarily large because it materialises positions that the chosen opening policy never reaches. The committed proof is instead split into exact, linked segments:

- empty board → 8 placed pieces;
- 8 → 10 placed pieces;
- 10 → 12 placed pieces;
- 12 → 14 placed pieces;
- 14 → 16 placed pieces.

The output frontier file from one segment is the exact binary input root set of the next segment. A later segment may discover that some incoming roots are losing before its next boundary. Those roots are written to a rejection file and fed back into the preceding safety game as losing boundary states. Synthesis repeats until every reachable boundary root extends safely.

The committed cumulative rejection sets are material:

- Red: 0 at 8 pieces, 80 at 10, 1,266 at 12 and 8,020 at 14.
- Yellow: 94 at 8 pieces, 941 at 10, 7,786 at 12 and 44,737 at 14.

The rejected states are committed alongside the policies so the refinement is reproducible rather than hidden in a generation log.

### Verified sixteen-piece closure

The committed reference is in `data/perfect-chaos-prefix/manifest.json`. It contains fixed-size binary policy, frontier and rejection tables plus a SHA-256 digest for every file, the historical generator source and original manifest, and the current-main independent replay identity.

`src/perfect-chaos-prefix.js` is the fail-closed runtime decoder for all five committed policy layers. The browser worker cross-checks the round starter against the recorded empty 6×7 initial position, lazy-loads only the role and layer matching the current piece count, validates its binary structure, mirrors actions correctly, and falls back to bounded search on an uncovered state. Brutal therefore follows the certified non-losing prefix through 16 placed pieces; this is not a claim that the complete game is solved.

For the AI playing Red:

| Segment | Input roots | Policy entries | Closure states | Output frontier |
|---|---:|---:|---:|---:|
| 0 → 8 | 1 | 1,299 | 3,161 | 1,477 |
| 8 → 10 | 1,477 | 5,058 | 13,404 | 6,919 |
| 10 → 12 | 6,919 | 22,831 | 57,688 | 28,561 |
| 12 → 14 | 28,561 | 92,200 | 221,708 | 105,254 |
| 14 → 16 | 105,254 | 326,031 | 747,775 | 339,682 |

For the AI playing Yellow:

| Segment | Input roots | Policy entries | Closure states | Output frontier |
|---|---:|---:|---:|---:|
| 0 → 8 | 1 | 3,863 | 9,581 | 4,522 |
| 8 → 10 | 4,522 | 15,112 | 40,223 | 20,619 |
| 10 → 12 | 20,619 | 67,605 | 174,087 | 87,073 |
| 12 → 14 | 87,073 | 281,707 | 696,282 | 337,197 |
| 14 → 16 | 337,197 | 1,059,068 | 2,498,257 | 1,164,120 |

Across the final segments, the independent replay follows 3,246,032 canonical closure states. Every policy record is reachable, every opponent action is explored, no AI-loss terminal is reachable, and each recomputed sorted frontier is byte-for-byte identical to the committed frontier.

The result is a **non-losing prefix certificate**, not a full game solution. Every adversarial line under the emitted strategy does one of four things before or at sixteen placed pieces:

1. reaches an AI win;
2. reaches a terminal draw;
3. enters a proved repetition cycle that lifts to a real threefold draw; or
4. reaches one of the explicitly committed sixteen-piece frontier states.

The fourth outcome is still unresolved and must be connected to later certified layers or to the exact endgame region.

'''
          if '### Verified sixteen-piece closure' not in docs:
              docs = docs[:start] + new_prefix + docs[end:]

          docs = replace_once(
              docs,
              '- `npm run chaos:prefix:verify-reference` checks every committed artifact hash and independently replays the full fourteen-piece reference without rerunning synthesis.\n- `npm run chaos:prefix:generate` runs counterexample-guided generation to fourteen pieces, using deterministic sharding for large extensions.',
              '- `npm run chaos:prefix:verify-reference` checks every committed artifact hash and independently replays the full sixteen-piece reference without rerunning synthesis.\n- `npm run chaos:prefix:generate` runs counterexample-guided generation through the configured frontier, using deterministic sharding for large extensions.',
              'proof command descriptions',
          )
          docs = replace_once(
              docs,
              'The empty 6×7 Chaos position has a much larger reachable graph than classic Connect Four. Transformations create large same-piece-count orbits, and rotations alternate between 6×7 and 7×6 orientations. The committed prefix reaches fourteen placed pieces; the exact runtime handoff begins at thirty-six placed pieces. The intervening frontier is not closed yet.\n\nThe committed twelve-to-fourteen layer found additional losing boundary roots for both roles and propagated them backward before acceptance. That confirms later segments must continue the same counterexample-guided refinement rather than assuming every frontier state is safe.',
              'The empty 6×7 Chaos position has a much larger reachable graph than classic Connect Four. Transformations create large same-piece-count orbits, and rotations alternate between 6×7 and 7×6 orientations. The committed prefix reaches sixteen placed pieces; the exact runtime handoff begins at thirty-six placed pieces. The intervening frontier is not closed yet.\n\nThe committed fourteen-to-sixteen layer required cumulative 14-piece rejection sets of 8,020 Red roots and 44,737 Yellow roots before acceptance. That confirms later segments must continue the same counterexample-guided refinement rather than assuming every frontier state is safe.',
              'empty-board boundary explanation',
          )
          route_pattern = re.compile(
              r'## Route to a complete Perfect Chaos release\n\n.*?\n\nThe existing classic Perfect strategy remains unchanged and independently verified\.',
              re.S,
          )
          route = '''## Route to a complete Perfect Chaos release

1. Run the independently audited 16 → 18 bootstrap from the exact promoted `main` certificate for both starting roles.
2. Commit each role’s counterexample state to `main` and dispatch the next exact round until a zero-counterexample closure candidate is produced.
3. Independently reconstruct every shard, table, checksum and complete adversarial replay before promoting the 18-piece layer.
4. Repeat the same exact process for 18 → 20 and later even-piece boundaries.
5. Continue rejection propagation until every reachable segment root is non-losing.
6. Connect the final prefix frontier to exact ranked-retrograde endgame records, currently available from 36 placed pieces.
7. Independently replay both complete starting-role closures under the literal threefold rule and verify every policy/action lookup.
8. Keep the browser loader fail-closed at the committed 16-piece frontier until the next independently replayed policy layers are accepted.
9. Enable the Perfect option for standard 6×7 Chaos only after both complete closures pass CI and production integration tests.

The existing classic Perfect strategy remains unchanged and independently verified.'''
          docs, count = route_pattern.subn(route, docs, count=1)
          if count != 1:
              raise RuntimeError(f'route-to-release section replacement count was {count}')
          docs_path.write_text(docs, newline='\n')
          PY

      - name: Patch current main, validate, and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/refresh-perfect-chaos-docs.py
            git rm --ignore-unmatch .github/workflows/refresh-perfect-chaos-release-docs.yml
            git add README.md docs/PERFECT_CHAOS.md
            git diff --check
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Align Perfect Chaos docs with the verified 16-piece release'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the documentation refresh after five races.' >&2
          exit 1
