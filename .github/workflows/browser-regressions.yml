name: Browser regressions

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/browser-requirements.txt
      - name: Install test dependencies and browser
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Desktop and mobile regression scenarios
        run: python scripts/browser-regressions.py --browser ${{ matrix.browser }}
      - name: Neural worker recovery and real-model smoke
        run: python scripts/neural-worker-regressions.py --browser ${{ matrix.browser }} --real-model
      - name: Atomic scores, loading recovery and pinned consent
        run: python scripts/review-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Undo transaction abort and reload recovery
        run: python scripts/rereview-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.browser }}
          path: browser-results/
          if-no-files-found: ignore
          retention-days: 7
