name: Browser regressions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Called from CI, github.workflow names CI; dispatched by hand, this workflow.
  # Without it a manual run cancelled the browser jobs of the CI
  # run on the same ref, and with them that push's Pages deploy.
  group: browser-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # Keep the check names browser (chromium) and browser (webkit) stable.
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both browsers install the same Playwright release; docs/WEBKIT_CI.md
        # says what to do if one browser's release regresses again.
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/browser-requirements.txt
      - name: Install test dependencies and browser
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m pip check
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify CSP evidence persistence
        run: python scripts/test-csp-evidence-persistence.py
      - name: Verify CSP enforcement and strict browser error detection
        run: python scripts/test-browser-csp.py --browser ${{ matrix.browser }}
      - name: Verify browser failure capture
        run: |
          python scripts/test-browser-evidence.py --browser ${{ matrix.browser }}
          python scripts/test-browser-persistence.py
      - name: Desktop and mobile regression scenarios
        run: python scripts/browser_evidence.py scripts/browser-regressions.py --browser ${{ matrix.browser }}
      - name: Neural worker recovery and real-model smoke
        run: python scripts/browser_evidence.py scripts/neural-worker-regressions.py --browser ${{ matrix.browser }} --real-model
      - name: Verified model cache and reload recovery
        run: python scripts/browser_evidence.py scripts/model-cache-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Atomic scores, loading recovery and pinned consent
        run: python scripts/browser_evidence.py scripts/review-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Undo transaction abort and reload recovery
        run: python scripts/browser_evidence.py scripts/rereview-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Failed result writes, database reconnect and invalid inference
        run: python scripts/browser_evidence.py scripts/failure-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Mid-game Brutal handoff and animation cancellation
        run: python scripts/browser_evidence.py scripts/handoff-browser-regressions.py --browser ${{ matrix.browser }}
      - name: UI validation, accessibility and touch regressions
        run: python scripts/browser_evidence.py scripts/ui-browser-regressions.py --browser ${{ matrix.browser }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 7
