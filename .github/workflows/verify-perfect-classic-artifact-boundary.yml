name: Verify Perfect Classic fragment artifact boundary

on:
  push:
    branches:
      - agent/perfect-classic-artifact-verification
    paths:
      - .github/workflows/verify-perfect-classic-artifact-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-perfect-classic-artifact-boundary
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-artifact-verification
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install verified downloads in both exact 7x7 workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-perfect-classic-fragment-downloads.py \
            --root . \
            --output /tmp/perfect-classic-fragment-workflow-patch.json
          cat /tmp/perfect-classic-fragment-workflow-patch.json
          jq -e '
            .format == "connect4-perfect-classic-fragment-workflow-patch-v1"
            and (.workflows | length) == 2
            and all(.workflows[];
              .verifiedDownloads == 3
              and .remainingExactNameDownloads == 1)
          ' /tmp/perfect-classic-fragment-workflow-patch.json >/dev/null

      - name: Run focused artifact and workflow tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/perfect-classic-download-fragments.py \
            scripts/patch-perfect-classic-fragment-downloads.py
          node --test \
            tests/perfect-classic-download-fragments.test.js \
            tests/perfect-classic-fragment-workflow-patch.test.js
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true); puts path }' \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml

      - name: Run current release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run classic:verify
          npm run classic:policy:verify
          npm run chaos:complete:verify
          npm run test:browser
          git diff --check

      - name: Publish only the tested production workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-perfect-classic-artifact-boundary.yml
          mapfile -t changed < <(git status --short | cut -c4- | sort)
          printf '%s\n' "${changed[@]}"
          allowed() {
            case "$1" in
              .github/workflows/compute-perfect-classic-7x7-role1.yml|\
              .github/workflows/compute-perfect-classic-7x7-role2.yml|\
              .github/workflows/verify-perfect-classic-artifact-boundary.yml) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do allowed "$path"; done
          test "${changed[-1]}" = .github/workflows/verify-perfect-classic-artifact-boundary.yml || \
            printf '%s\n' "${changed[@]}" | grep -Fx .github/workflows/verify-perfect-classic-artifact-boundary.yml
          role1=false; role2=false
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/compute-perfect-classic-7x7-role1.yml && role1=true || true
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/compute-perfect-classic-7x7-role2.yml && role2=true || true
          test "$role1" = "$role2"
          git add \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml
          git commit -am 'Verify every sharded Classic proof artifact'
          git push origin HEAD:agent/perfect-classic-artifact-verification
