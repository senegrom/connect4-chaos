name: Generate hard classic policies by role

on:
  push:
    branches:
      - agent/perfect-classic-7x7
    paths:
      - .github/workflows/generate-perfect-classic-hard-roles.yml
      - native/perfect-classic-policy-fast.cpp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfect-classic-hard-roles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - rows: 7
            columns: 6
            role: 1
          - rows: 7
            columns: 6
            role: 2
          - rows: 7
            columns: 7
            role: 1
          - rows: 7
            columns: 7
            role: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Select optimized native generator
        run: cp native/perfect-classic-policy-fast.cpp native/perfect-classic-policy.cpp

      - name: Generate and independently replay one starting role
        shell: bash
        env:
          ROWS: ${{ matrix.rows }}
          COLUMNS: ${{ matrix.columns }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          output="generated/perfect-classic-${ROWS}x${COLUMNS}-c4-role${ROLE}"
          mkdir -p "$output"
          node scripts/perfect-classic-policy.mjs generate \
            --rows "$ROWS" \
            --columns "$COLUMNS" \
            --connect 4 \
            --role "$ROLE" \
            --handoff-remaining 24 \
            --table-bits 27 \
            --maximum-nodes 0 \
            --maximum-states 100000000 \
            --verify-table-bits 23 \
            --output "$output" \
            > "$output/generation.json"

      - name: Upload verified role policy
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-policy-part-${{ matrix.rows }}x${{ matrix.columns }}-c4-role${{ matrix.role }}
          path: generated/perfect-classic-${{ matrix.rows }}x${{ matrix.columns }}-c4-role${{ matrix.role }}
          if-no-files-found: error
          retention-days: 90

  assemble-board:
    needs: generate-role
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - rows: 7
            columns: 6
          - rows: 7
            columns: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Download both verified role policies
        uses: actions/download-artifact@v4
        with:
          pattern: perfect-classic-policy-part-${{ matrix.rows }}x${{ matrix.columns }}-c4-role*
          path: downloaded
          merge-multiple: false

      - name: Merge and independently replay the complete board policy
        shell: bash
        env:
          ROWS: ${{ matrix.rows }}
          COLUMNS: ${{ matrix.columns }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find downloaded -type f -name manifest.json | sort)
          if (( ${#manifests[@]} != 2 )); then
            echo "Expected two role manifests, found ${#manifests[@]}." >&2
            exit 1
          fi
          output="generated/perfect-classic-${ROWS}x${COLUMNS}-c4"
          mkdir -p "$output"
          args=(merge-manifests)
          for manifest in "${manifests[@]}"; do
            args+=(--input "$manifest")
          done
          node scripts/perfect-classic-policy.mjs "${args[@]}" \
            --output "$output/manifest.json" \
            > "$output/merge.json"
          node scripts/perfect-classic-policy.mjs verify-reference \
            --reference "$output/manifest.json" \
            --verify-table-bits 23 \
            > "$output/verification.json"
          test "$(jq '.policies | length' "$output/manifest.json")" -eq 2

      - name: Upload verified board policy
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-policy-${{ matrix.rows }}x${{ matrix.columns }}-c4
          path: generated/perfect-classic-${{ matrix.rows }}x${{ matrix.columns }}-c4
          if-no-files-found: error
          retention-days: 90