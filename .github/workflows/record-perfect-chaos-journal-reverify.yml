name: Record resumable Perfect Chaos journal revalidation result

on:
  push:
    branches:
      - agent/perfect-chaos-journal-reverify
    paths:
      - .github/workflows/record-perfect-chaos-journal-reverify.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: record-perfect-chaos-journal-reverify
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: verify-perfect-chaos-journal-reverify.yml
      TARGET_BRANCH: agent/perfect-chaos-journal-reverify
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-journal-reverify
          fetch-depth: 0

      - name: Bind and await the exact journal verifier
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          selected=''
          for _ in $(seq 1 320); do
            response="$(gh api --method GET "repos/$repo/actions/workflows/$TARGET_WORKFLOW/runs" -f branch="$TARGET_BRANCH" -F per_page=100)"
            candidates="$(jq '[.workflow_runs[] | select(.event == "push")] | sort_by(.created_at) | reverse' <<< "$response")"
            count="$(jq 'length' <<< "$candidates")"
            if (( count < 1 )); then
              sleep 30
              continue
            fi
            selected="$(jq -c '.[0]' <<< "$candidates")"
            status="$(jq -r '.status' <<< "$selected")"
            if [[ "$status" = completed ]]; then
              break
            fi
            sleep 30
          done
          test -n "$selected"
          test "$(jq -r '.status' <<< "$selected")" = completed
          run_id="$(jq -r '.id' <<< "$selected")"
          jobs="$(gh api --method GET "repos/$repo/actions/runs/$run_id/jobs" -F per_page=100)"
          jq -n \
            --argjson run "$selected" \
            --argjson jobs "$jobs" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              format:"connect4-perfect-chaos-journal-revalidation-v1",
              recordedAt:$recordedAt,
              run:{
                id:$run.id,
                attempt:$run.run_attempt,
                headSha:$run.head_sha,
                status:$run.status,
                conclusion:$run.conclusion,
                createdAt:$run.created_at,
                updatedAt:$run.updated_at,
                url:$run.html_url
              },
              jobs:[
                $jobs.jobs[] | {
                  id,name,status,conclusion,
                  steps:[.steps[]? | {name,status,conclusion,number}]
                }
              ]
            }' > /tmp/journal-revalidation.json
          cat /tmp/journal-revalidation.json

      - name: Publish the exact result and remove this monitor
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(jq -r '.run.conclusion' /tmp/journal-revalidation.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            mkdir -p .verification
            cp /tmp/journal-revalidation.json .verification/perfect-chaos-journal-revalidation.json
            rm -f .verification/perfect-chaos-journal-success.json \
                  .verification/perfect-chaos-journal-failure.json
            if [[ "$conclusion" = success ]]; then
              cp /tmp/journal-revalidation.json .verification/perfect-chaos-journal-success.json
            else
              cp /tmp/journal-revalidation.json .verification/perfect-chaos-journal-failure.json
            fi
            git rm --ignore-unmatch .github/workflows/record-perfect-chaos-journal-reverify.yml
            git add .verification
            git commit -m "Record Perfect Chaos journal revalidation: $conclusion"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the journal verifier result.' >&2
          exit 1
