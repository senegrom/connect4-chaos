name: Certify Red 18-piece refinement at 16,242 roots

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/certify-red-18-16242.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: certify-red-18-16242
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RESULT_RUN: '31758014522'
      RESULT_SHA: a19c166bb39e64095de0a72f3a32d84e557bd34b
      RESULT_ARTIFACT: perfect-chaos-red-18-bootstrap-round
      RESULT_ARTIFACT_ID: '9204111833'
      RESULT_DIGEST: sha256:47a3aa585428b01e37ce0285ad2951de8864156adc0c1bd3167dbaf88b1d1385
      EVIDENCE_ARTIFACT: perfect-chaos-red-18-bootstrap-evidence
      EVIDENCE_ARTIFACT_ID: '9204131701'
      EVIDENCE_DIGEST: sha256:3c5c4e12db5ac8b43cc787f2bc59671d21d244d9be2f31c3c1dc223482538aac
      DETERMINISM_RUN: '31760396209'
      DETERMINISM_SHA: 34cf979669b3dd55df056eedfd9d7c26a39e52a1
      DETERMINISM_ARTIFACT: perfect-chaos-red-18-bootstrap-determinism-evidence
      DETERMINISM_ARTIFACT_ID: '9204366451'
      DETERMINISM_DIGEST: sha256:101a36c6a5a772bd65a08d406cd2d3f54c097202661abf1a40db9515436b84bf
      CERTIFIED_ARTIFACT: perfect-chaos-red-18-16242-certified
    steps:
      - uses: actions/checkout@v6

      - name: Pin the result, independent evidence, and determinism certificate
        shell: bash
        run: |
          set -euo pipefail
          pin_run() {
            local run="$1" sha="$2"
            read -r actual_sha status conclusion < <(
              gh api "repos/$REPO/actions/runs/$run" \
                --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
            )
            test "$actual_sha" = "$sha"
            test "$status" = completed
            test "$conclusion" = success
          }
          pin_artifact() {
            local run="$1" sha="$2" name="$3" artifact_id="$4" expected_digest="$5"
            read -r actual_name actual_run actual_sha digest expired < <(
              gh api "repos/$REPO/actions/artifacts/$artifact_id" \
                --jq '[.name, .workflow_run.id, .workflow_run.head_sha, (.digest // ""), .expired] | @tsv'
            )
            test "$actual_name" = "$name"
            test "$actual_run" = "$run"
            test "$actual_sha" = "$sha"
            test "$digest" = "$expected_digest"
            test "$expired" = false
          }
          pin_run "$RESULT_RUN" "$RESULT_SHA"
          pin_run "$DETERMINISM_RUN" "$DETERMINISM_SHA"
          pin_artifact "$RESULT_RUN" "$RESULT_SHA" "$RESULT_ARTIFACT" "$RESULT_ARTIFACT_ID" "$RESULT_DIGEST"
          pin_artifact "$RESULT_RUN" "$RESULT_SHA" "$EVIDENCE_ARTIFACT" "$EVIDENCE_ARTIFACT_ID" "$EVIDENCE_DIGEST"
          pin_artifact "$DETERMINISM_RUN" "$DETERMINISM_SHA" "$DETERMINISM_ARTIFACT" "$DETERMINISM_ARTIFACT_ID" "$DETERMINISM_DIGEST"

      - name: Download the exact certified inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf result evidence determinism certified
          mkdir -p result evidence determinism certified
          gh run download "$RESULT_RUN" --repo "$REPO" --name "$RESULT_ARTIFACT" --dir result
          gh run download "$RESULT_RUN" --repo "$REPO" --name "$EVIDENCE_ARTIFACT" --dir evidence
          gh run download "$DETERMINISM_RUN" --repo "$REPO" --name "$DETERMINISM_ARTIFACT" --dir determinism

      - name: Revalidate and assemble the certified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory result
          (cd evidence && sha256sum --check --strict SHA256SUMS)
          (cd determinism && sha256sum --check --strict SHA256SUMS)
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = Path('result')
          evidence = Path('evidence')
          determinism = Path('determinism')
          summary = json.loads((result / 'campaign-summary.json').read_text())
          audit = json.loads((evidence / 'raw-shard-audit.json').read_text())
          cross = json.loads((determinism / 'determinism-report.json').read_text())

          expected_summary = {
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'inputRoots': 339682,
              'existingRejectedRoots': 0,
              'newRejectedRoots': 16242,
              'cumulativeRejectedRoots': 16242,
              'safeInputRoots': 323440,
              'safePolicyEntries': 916002,
              'safeFrontierStates': 868295,
              'classificationComplete': True,
              'policyConflicts': 0,
          }
          for field, expected in expected_summary.items():
              if summary.get(field) != expected:
                  raise RuntimeError(f'Invalid result field {field}: {summary.get(field)!r}')

          expected_audit = {
              'format': 'connect4-chaos-independent-sharded-round-audit-v1',
              'status': 'pass',
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'shards': 256,
              'inputRoots': 339682,
              'existingRejectedRoots': 0,
              'newRejectedRoots': 16242,
              'cumulativeRejectedRoots': 16242,
              'safeInputRoots': 323440,
              'safePolicyEntries': 916002,
              'safeFrontierStates': 868295,
              'policyConflicts': 0,
          }
          for field, expected in expected_audit.items():
              if audit.get(field) != expected:
                  raise RuntimeError(f'Invalid audit field {field}: {audit.get(field)!r}')

          if cross.get('format') != 'connect4-chaos-cross-run-determinism-v1' or cross.get('status') != 'pass':
              raise RuntimeError('The determinism certificate did not pass.')
          if cross.get('resultTreesByteIdentical') is not True or cross.get('evidenceTreesByteIdentical') is not True:
              raise RuntimeError('The determinism certificate did not prove byte identity.')
          full = cross.get('fullRebuild', {})
          if full.get('run') != int(os.environ['RESULT_RUN']) or full.get('sha') != os.environ['RESULT_SHA']:
              raise RuntimeError('The determinism certificate refers to the wrong full result run.')
          if full.get('resultArtifactId') != int(os.environ['RESULT_ARTIFACT_ID']) or full.get('resultDigest') != os.environ['RESULT_DIGEST']:
              raise RuntimeError('The determinism certificate refers to the wrong result artifact.')
          if full.get('evidenceArtifactId') != int(os.environ['EVIDENCE_ARTIFACT_ID']) or full.get('evidenceDigest') != os.environ['EVIDENCE_DIGEST']:
              raise RuntimeError('The determinism certificate refers to the wrong evidence artifact.')
          if cross.get('summary') != summary or cross.get('audit') != audit:
              raise RuntimeError('The determinism certificate embeds different proof accounting.')

          proof_files = {
              'new-reject-16.bin': '3465641b883e2cd369445c9a5b389461513fbf566e24d4c8bfb0a0bf89f0ed1c',
              'reject-16.bin': '3465641b883e2cd369445c9a5b389461513fbf566e24d4c8bfb0a0bf89f0ed1c',
              '16-18.policy.bin': '57331ac51261e3a4b5e6ecc08320264af23679c3220d08ba8a629771e77b3697',
              '16-18.frontier.bin': '2e13a899327709ff6acb4cff577b415578e327b2121cc408350763c33635de77',
              'classification.json': '8c416df65c734612b46591935409e7137b0ca7bda8427425561f9e95b9c4ccf0',
              'campaign-summary.json': '978d7c9e30ef3dd7a30299e9797a915d03189822831cc3eeaea69f4428e50446',
          }
          for relative, expected in proof_files.items():
              actual = hashlib.sha256((result / relative).read_bytes()).hexdigest()
              if actual != expected or cross.get('proofFileSha256', {}).get(relative) != expected:
                  raise RuntimeError(f'Certified proof digest mismatch for {relative}.')

          certificate = {
              'format': 'connect4-chaos-certified-refinement-checkpoint-v1',
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'cumulativeRejectedRoots': 16242,
              'result': {
                  'run': int(os.environ['RESULT_RUN']),
                  'sha': os.environ['RESULT_SHA'],
                  'artifact': os.environ['RESULT_ARTIFACT'],
                  'artifactId': int(os.environ['RESULT_ARTIFACT_ID']),
                  'digest': os.environ['RESULT_DIGEST'],
              },
              'independentEvidence': {
                  'artifact': os.environ['EVIDENCE_ARTIFACT'],
                  'artifactId': int(os.environ['EVIDENCE_ARTIFACT_ID']),
                  'digest': os.environ['EVIDENCE_DIGEST'],
              },
              'determinismEvidence': {
                  'run': int(os.environ['DETERMINISM_RUN']),
                  'sha': os.environ['DETERMINISM_SHA'],
                  'artifact': os.environ['DETERMINISM_ARTIFACT'],
                  'artifactId': int(os.environ['DETERMINISM_ARTIFACT_ID']),
                  'digest': os.environ['DETERMINISM_DIGEST'],
              },
              'classification': expected_summary,
              'proofFileSha256': proof_files,
          }
          Path('certificate.json').write_text(json.dumps(certificate, indent=2) + '\n')
          print(json.dumps(certificate, indent=2))
          PY

          cp -a result/. certified/
          mkdir -p certified/independent-evidence certified/determinism-evidence
          cp -a evidence/. certified/independent-evidence/
          cp -a determinism/. certified/determinism-evidence/
          cp certificate.json certified/certificate.json
          rm -f certified/SHA256SUMS
          python3 scripts/perfect-chaos-artifacts.py write --directory certified
          python3 scripts/perfect-chaos-artifacts.py verify --directory certified

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CERTIFIED_ARTIFACT }}
          path: certified
          if-no-files-found: error
          retention-days: 30
