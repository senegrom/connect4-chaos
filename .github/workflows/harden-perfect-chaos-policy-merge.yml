name: Harden Perfect Chaos policy merge

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/harden-perfect-chaos-policy-merge.yml

permissions:
  contents: write

concurrency:
  group: harden-perfect-chaos-policy-merge
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-resumable
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Add fail-closed policy conflict invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tables = Path('scripts/perfect_chaos_tables.py')
          text = tables.read_text()
          old = '''    ordered, _ = merge_records(records, record_size)
              header = bytearray(16)'''
          new = '''    ordered, conflicts = merge_records(records, record_size)
              if record_size == POLICY_RECORD_SIZE and conflicts:
                  raise RuntimeError("Conflicting Perfect Chaos policy actions.")
              header = bytearray(16)'''
          if old not in text:
              raise SystemExit('table writer insertion point not found')
          tables.write_text(text.replace(old, new, 1))

          tests = Path('tests/perfect-chaos-classification.test.js')
          text = tests.read_text()
          marker = "policy table writer fails closed on conflicting actions"
          if marker in text:
              raise SystemExit('conflict regression already exists')
          text += r'''

          test('policy table writer fails closed on conflicting actions', async (context) => {
            const pythonCommand = await python();
            if (!pythonCommand) {
              context.skip('Python is required for proof-table validation.');
              return;
            }

            const directory = await mkdtemp(join(tmpdir(), 'connect4-chaos-policy-conflict-'));
            try {
              const output = join(directory, 'conflicting.policy.bin');
              const script = `
          import struct
          from pathlib import Path
          from perfect_chaos_tables import POLICY_MAGIC, POLICY_RECORD_SIZE, write_table

          def record(action):
              value = bytearray(POLICY_RECORD_SIZE)
              struct.pack_into('<QQ', value, 0, 0, 0)
              value[16] = 6
              value[17] = 7
              value[18] = action
              value[19] = 0
              return bytes(value)

          try:
              write_table(
                  Path(${JSON.stringify(output)}),
                  POLICY_MAGIC,
                  1,
                  2,
                  POLICY_RECORD_SIZE,
                  [record(1), record(2)],
              )
          except RuntimeError as error:
              if 'Conflicting Perfect Chaos policy actions.' not in str(error):
                  raise
          else:
              raise RuntimeError('Conflicting policy actions were silently merged.')
          `;
              await run(pythonCommand, ['-c', script], {
                env: {
                  ...process.env,
                  PYTHONPATH: join(ROOT, 'scripts'),
                },
              });
            } finally {
              await rm(directory, { recursive: true, force: true });
            }
          });
          '''
          tests.write_text(text)
          PY

          npm ci
          npm run check
          npm test
          git diff --check

      - name: Commit tested invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect_chaos_tables.py tests/perfect-chaos-classification.test.js
          git commit -m 'Fail closed on conflicting Perfect Chaos policies'
          git push origin HEAD:agent/perfect-chaos-resumable
