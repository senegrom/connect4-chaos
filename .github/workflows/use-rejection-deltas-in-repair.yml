name: Verify rejection-delta incremental repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/use-rejection-deltas-in-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: use-rejection-deltas-in-repair
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for finalized current-main tooling
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 240); do
            git fetch origin main
            if git cat-file -e origin/main:.audit/finalized-exact-solver-tooling.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 30
          done
          test "$ready" = true
          git reset --hard origin/main

      - run: npm ci

      - name: Partition only against newly added rejection states
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/perfect-chaos-rejection-delta.mjs <<'EOF'
          export function sortedStateDifference(superset, certifiedSubset, compare) {
            if (!Array.isArray(superset) || !Array.isArray(certifiedSubset)) {
              throw new TypeError('Rejection tables must be arrays.');
            }
            if (typeof compare !== 'function') {
              throw new TypeError('A state comparator is required.');
            }

            const validate = (states, label) => {
              for (let index = 1; index < states.length; index += 1) {
                if (compare(states[index - 1], states[index]) >= 0) {
                  throw new Error(`${label} must be strictly sorted and duplicate-free.`);
                }
              }
            };
            validate(superset, 'Current rejection table');
            validate(certifiedSubset, 'Seed rejection table');

            const difference = [];
            let currentIndex = 0;
            let seedIndex = 0;
            while (currentIndex < superset.length && seedIndex < certifiedSubset.length) {
              const order = compare(superset[currentIndex], certifiedSubset[seedIndex]);
              if (order < 0) {
                difference.push(superset[currentIndex]);
                currentIndex += 1;
              } else if (order === 0) {
                currentIndex += 1;
                seedIndex += 1;
              } else {
                throw new Error('The seed rejection table is not a subset of the current table.');
              }
            }
            if (seedIndex !== certifiedSubset.length) {
              throw new Error('The seed rejection table is not a subset of the current table.');
            }
            while (currentIndex < superset.length) {
              difference.push(superset[currentIndex]);
              currentIndex += 1;
            }
            return difference;
          }
          EOF

          cat > tests/perfect-chaos-rejection-delta.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { sortedStateDifference } from '../scripts/perfect-chaos-rejection-delta.mjs';

          const compare = (left, right) => left - right;

          test('rejection delta removes the previously certified sorted subset', () => {
            const current = [1, 2, 4, 5, 8, 13];
            const seed = [1, 4, 8];
            assert.deepEqual(sortedStateDifference(current, seed, compare), [2, 5, 13]);
            assert.deepEqual(current, [1, 2, 4, 5, 8, 13]);
            assert.deepEqual(seed, [1, 4, 8]);
          });

          test('identical rejection tables produce an empty dependency target', () => {
            assert.deepEqual(sortedStateDifference([2, 3, 9], [2, 3, 9], compare), []);
            assert.deepEqual(sortedStateDifference([2, 3, 9], [], compare), [2, 3, 9]);
          });

          test('non-subsets, duplicates, and unsorted tables fail closed', () => {
            assert.throws(
              () => sortedStateDifference([1, 3, 5], [1, 4], compare),
              /not a subset/,
            );
            assert.throws(
              () => sortedStateDifference([1, 1, 3], [1], compare),
              /strictly sorted/,
            );
            assert.throws(
              () => sortedStateDifference([3, 1], [], compare),
              /strictly sorted/,
            );
            assert.throws(
              () => sortedStateDifference([1, 2], [2, 2], compare),
              /strictly sorted/,
            );
          });
          EOF

          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          path = Path('scripts/perfect-chaos-prefix.mjs')
          text = path.read_text()
          shebang = '#!/usr/bin/env node\n'
          import_line = "import { sortedStateDifference } from './perfect-chaos-rejection-delta.mjs';\n"
          if not text.startswith(shebang):
              raise RuntimeError('Perfect Chaos prefix driver has an unexpected header.')
          if import_line not in text:
              text = text.replace(shebang, shebang + import_line, 1)

          seed_anchor = '''        const seedPolicy = join(seedRoleDirectory, `${from}-${boundary}.policy.bin`);
        const seedFrontier = join(seedRoleDirectory, `${from}-${boundary}.frontier.bin`);
        const availability = await Promise.all([
          exists(seedInputFrontier),
          exists(seedPolicy),
          exists(seedFrontier),
        ]);
'''
          seed_replacement = '''        const seedPolicy = join(seedRoleDirectory, `${from}-${boundary}.policy.bin`);
        const seedFrontier = join(seedRoleDirectory, `${from}-${boundary}.frontier.bin`);
        const seedRejectFrontier = join(seedRoleDirectory, `reject-${boundary}.bin`);
        const availability = await Promise.all([
          exists(seedInputFrontier),
          exists(seedPolicy),
          exists(seedFrontier),
          exists(seedRejectFrontier),
        ]);
'''
          if text.count(seed_anchor) != 1:
              raise RuntimeError(f'Expected one repair seed availability block, found {text.count(seed_anchor)}')
          text = text.replace(seed_anchor, seed_replacement, 1)

          call_anchor = '''            seedFrontierPath: seedFrontier,
            rejectFrontierPath: targetReject,
'''
          call_replacement = '''            seedFrontierPath: seedFrontier,
            seedRejectFrontierPath: seedRejectFrontier,
            rejectFrontierPath: targetReject,
'''
          if text.count(call_anchor) != 1:
              raise RuntimeError(f'Expected one repair call rejection block, found {text.count(call_anchor)}')
          text = text.replace(call_anchor, call_replacement, 1)

          signature_anchor = '''  seedPolicyPath,
  seedFrontierPath,
  rejectFrontierPath,
'''
          signature_replacement = '''  seedPolicyPath,
  seedFrontierPath,
  seedRejectFrontierPath,
  rejectFrontierPath,
'''
          if text.count(signature_anchor) != 1:
              raise RuntimeError(f'Expected one repair signature block, found {text.count(signature_anchor)}')
          text = text.replace(signature_anchor, signature_replacement, 1)

          promise_anchor = '''  const [input, seedInput, seedPolicy, seedFrontier, rejectedBoundary] = await Promise.all([
    readFrontier(inputFrontierPath),
    readFrontier(seedInputFrontierPath),
    readPolicy(seedPolicyPath),
    readFrontier(seedFrontierPath),
    readFrontier(rejectFrontierPath),
  ]);
'''
          promise_replacement = '''  const [
    input,
    seedInput,
    seedPolicy,
    seedFrontier,
    seedRejectedBoundary,
    rejectedBoundary,
  ] = await Promise.all([
    readFrontier(inputFrontierPath),
    readFrontier(seedInputFrontierPath),
    readPolicy(seedPolicyPath),
    readFrontier(seedFrontierPath),
    readFrontier(seedRejectFrontierPath),
    readFrontier(rejectFrontierPath),
  ]);
'''
          if text.count(promise_anchor) != 1:
              raise RuntimeError(
                  'The reviewed rejection-table read block changed; refusing an unreviewed patch. '
                  f'Found {text.count(promise_anchor)} matches.'
              )
          text = text.replace(promise_anchor, promise_replacement, 1)

          metadata_anchor = '''  if (input.count < 1) throw new Error('Incremental repair requires at least one input root.');
  if (input.role !== seedInput.role || input.role !== seedPolicy.role
      || input.role !== seedFrontier.role || input.role !== rejectedBoundary.role
      || input.boundary !== seedInput.boundary
      || seedPolicy.boundary !== targetBoundary
      || seedFrontier.boundary !== targetBoundary
      || rejectedBoundary.boundary !== targetBoundary
      || input.boundary >= targetBoundary) {
    throw new Error('Incremental repair table metadata does not align.');
  }
'''
          metadata_replacement = '''  if (input.count < 1) throw new Error('Incremental repair requires at least one input root.');
  if (input.role !== seedInput.role || input.role !== seedPolicy.role
      || input.role !== seedFrontier.role || input.role !== seedRejectedBoundary.role
      || input.role !== rejectedBoundary.role
      || input.boundary !== seedInput.boundary
      || seedPolicy.boundary !== targetBoundary
      || seedFrontier.boundary !== targetBoundary
      || seedRejectedBoundary.boundary !== targetBoundary
      || rejectedBoundary.boundary !== targetBoundary
      || input.boundary >= targetBoundary) {
    throw new Error('Incremental repair table metadata does not align.');
  }
'''
          if text.count(metadata_anchor) != 1:
              raise RuntimeError(f'Expected one repair metadata block, found {text.count(metadata_anchor)}')
          text = text.replace(metadata_anchor, metadata_replacement, 1)

          partition_anchor = '''  let partitionSummary = null;
  if (reusableStates.length > 0) {
    const partition = await nativeSegment(binary, [
      'partition',
      '--input-frontier', reusableInputPath,
      '--policy', seedPolicyPath,
      '--reference-frontier', seedFrontierPath,
      '--reject-frontier', rejectFrontierPath,
      '--unaffected', unaffectedInputPath,
      '--affected', affectedExistingInputPath,
    ]);
    if (partition.code !== 0 || partition.records.length !== 1) {
      throw new Error(
        `Exact dependency partition failed.\n${partition.stderr || partition.stdout}`,
      );
    }
    [partitionSummary] = partition.records;
  } else {
    await Promise.all([
      writeFile(unaffectedInputPath, encodeFrontier(input.role, input.boundary, [])),
      writeFile(affectedExistingInputPath, encodeFrontier(input.role, input.boundary, [])),
    ]);
  }
'''
          partition_replacement = '''  const partitionRejectStates = sortedStateDifference(
    rejectedBoundary.states,
    seedRejectedBoundary.states,
    compareState,
  );
  const partitionRejectFrontierPath = join(workDirectory, 'new-rejections.bin');
  await writeFile(
    partitionRejectFrontierPath,
    encodeFrontier(input.role, targetBoundary, partitionRejectStates),
  );

  let partitionSummary = null;
  if (reusableStates.length > 0 && partitionRejectStates.length > 0) {
    const partition = await nativeSegment(binary, [
      'partition',
      '--input-frontier', reusableInputPath,
      '--policy', seedPolicyPath,
      '--reference-frontier', seedFrontierPath,
      '--reject-frontier', partitionRejectFrontierPath,
      '--unaffected', unaffectedInputPath,
      '--affected', affectedExistingInputPath,
    ]);
    if (partition.code !== 0 || partition.records.length !== 1) {
      throw new Error(
        `Exact dependency partition failed.\n${partition.stderr || partition.stdout}`,
      );
    }
    [partitionSummary] = partition.records;
  } else {
    await Promise.all([
      writeFile(
        unaffectedInputPath,
        encodeFrontier(
          input.role,
          input.boundary,
          partitionRejectStates.length === 0 ? reusableStates : [],
        ),
      ),
      writeFile(affectedExistingInputPath, encodeFrontier(input.role, input.boundary, [])),
    ]);
  }
'''
          if text.count(partition_anchor) != 1:
              raise RuntimeError(f'Expected one dependency partition block, found {text.count(partition_anchor)}')
          text = text.replace(partition_anchor, partition_replacement, 1)

          format_anchor = "    format: 'connect4-chaos-incremental-segment-repair-v1',\n"
          format_count = text.count(format_anchor)
          if format_count != 1:
              raise RuntimeError(f'Expected one incremental repair summary, found {format_count}')
          text = text.replace(
              format_anchor,
              format_anchor
              + '    partitionUsesRejectionDelta: true,\n'
              + '    seedRejectedRoots: seedRejectedBoundary.count,\n'
              + '    cumulativeRejectedRoots: rejectedBoundary.count,\n'
              + '    partitionRejectRoots: partitionRejectStates.length,\n',
              1,
          )
          path.write_text(text, newline='\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          check = package['scripts']['check']
          old = 'node --check scripts/perfect-chaos-prefix.mjs'
          new = old + ' && node --check scripts/perfect-chaos-rejection-delta.mjs'
          if new not in check:
              if check.count(old) != 1:
                  raise RuntimeError('Could not add the rejection-delta source check.')
              package['scripts']['check'] = check.replace(old, new, 1)
          package_path.write_text(json.dumps(package, indent=2) + '\n', newline='\n')
          PY

          node --check scripts/perfect-chaos-prefix.mjs
          node --check scripts/perfect-chaos-rejection-delta.mjs
          node --check tests/perfect-chaos-rejection-delta.test.js
          git diff --check

      - name: Prove exact delta/full-rejection equivalence
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          node --test tests/perfect-chaos-rejection-delta.test.js
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/rejection-delta-verify.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/rejection-delta-verify.json').read_text())
          records = []
          def walk(node):
              if isinstance(node, dict):
                  if node.get('format') == 'connect4-chaos-incremental-segment-repair-v1':
                      records.append(node)
                  for child in node.values():
                      walk(child)
              elif isinstance(node, list):
                  for child in node:
                      walk(child)
          walk(value)
          if not records:
              raise RuntimeError('The exact verifier emitted no incremental repair record.')
          for record in records:
              if record.get('partitionUsesRejectionDelta') is not True:
                  raise RuntimeError('An incremental repair did not identify its rejection delta.')
              seed = record.get('seedRejectedRoots')
              cumulative = record.get('cumulativeRejectedRoots')
              delta = record.get('partitionRejectRoots')
              if not all(isinstance(item, int) and item >= 0 for item in (seed, cumulative, delta)):
                  raise RuntimeError('Invalid rejection-delta accounting.')
              if seed + delta != cumulative:
                  raise RuntimeError(f'Rejection delta does not close: {seed} + {delta} != {cumulative}')
          print({'repairs': len(records), 'deltaAccounting': 'exact'})
          PY

      - name: Run complete current-main release gates
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish the tested exact optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/use-rejection-deltas-in-repair.yml
          git add package.json \
                  scripts/perfect-chaos-prefix.mjs \
                  scripts/perfect-chaos-rejection-delta.mjs \
                  tests/perfect-chaos-rejection-delta.test.js
          git commit -m 'Partition repairs against rejection deltas'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              node --test tests/perfect-chaos-rejection-delta.test.js
              node --check scripts/perfect-chaos-prefix.mjs
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo 'The exact repair engine changed concurrently; refusing an unreviewed merge.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
