name: Apply reviewed AI and UX upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-reviewed-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reviewed-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Restore reviewed changes
        shell: bash
        run: |
          set -euo pipefail

          cat .upgrade/patch/* > /tmp/connect4-update.patch.gz.b64
          base64 --decode /tmp/connect4-update.patch.gz.b64 > /tmp/connect4-update.patch.gz
          echo "5523ac4746d65699b462398a4b17e2b42f6b75999e6bdb035b648d7a2915410e  /tmp/connect4-update.patch.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/connect4-update.patch.gz > /tmp/connect4-update.patch
          git apply --check /tmp/connect4-update.patch
          git apply /tmp/connect4-update.patch

          cat .upgrade/readme/* > /tmp/connect4-readme.md.gz.b64
          base64 --decode /tmp/connect4-readme.md.gz.b64 > /tmp/connect4-readme.md.gz
          echo "e3bf27c528075476b2428801aa70887f72225fb715771123f9e30369f06933b0  /tmp/connect4-readme.md.gz" | sha256sum --check -
          gzip --decompress --stdout /tmp/connect4-readme.md.gz > README.md

          rm -rf .upgrade .github/workflows/apply-reviewed-upgrade.yml
          git diff --check

      - name: Validate
        run: |
          npm ci
          npm run ci

      - name: Publish upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Improve AI strength and mobile game flow"
          git push origin HEAD:main
