name: Preserve conservative direct repair semantics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-rejection-delta-direct-callers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Correct the pending rejection-delta source patch
        shell: bash
        run: |
          set -euo pipefail
          path=.github/workflows/use-rejection-deltas-in-repair.yml
          test -f "$path"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/use-rejection-deltas-in-repair.yml')
          text = path.read_text()
          old = '''          promise_replacement = '''  const [
    input,
    seedInput,
    seedPolicy,
    seedFrontier,
    seedRejectedBoundary,
    rejectedBoundary,
  ] = await Promise.all([
    readFrontier(inputFrontierPath),
    readFrontier(seedInputFrontierPath),
    readPolicy(seedPolicyPath),
    readFrontier(seedFrontierPath),
    readFrontier(seedRejectFrontierPath),
    readFrontier(rejectFrontierPath),
  ]);
'''
'''
          new = '''          promise_replacement = '''  const [
    input,
    seedInput,
    seedPolicy,
    seedFrontier,
    rejectedBoundary,
  ] = await Promise.all([
    readFrontier(inputFrontierPath),
    readFrontier(seedInputFrontierPath),
    readPolicy(seedPolicyPath),
    readFrontier(seedFrontierPath),
    readFrontier(rejectFrontierPath),
  ]);
  // Direct repair callers predate rejection deltas. Without an explicit
  // seed table they conservatively partition against every current rejection,
  // exactly matching the former full-table semantics.
  const seedRejectedBoundary = seedRejectFrontierPath
    ? await readFrontier(seedRejectFrontierPath)
    : {
      role: rejectedBoundary.role,
      boundary: rejectedBoundary.boundary,
      count: 0,
      states: [],
    };
'''
'''
          if new in text:
              pass
          elif text.count(old) == 1:
              text = text.replace(old, new, 1)
          else:
              raise RuntimeError(
                  'Could not locate exactly one pending rejection-table read replacement.'
              )
          path.write_text(text, newline='\n')
          PY
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' "$path"
          grep -F -- 'Direct repair callers predate rejection deltas.' "$path"
          git diff --check

      - name: Publish only the pending-verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-rejection-delta-direct-callers.yml
          git add .github/workflows/use-rejection-deltas-in-repair.yml
          git commit -m 'Preserve conservative direct repair semantics'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
                .github/workflows/use-rejection-deltas-in-repair.yml
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 2))
          done
          exit 1
