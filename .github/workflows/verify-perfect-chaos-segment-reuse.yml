name: Verify exact Perfect Chaos segment reuse

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-perfect-chaos-segment-reuse.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: verify-perfect-chaos-segment-reuse
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for exact layout and repair tooling
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 360); do
            git fetch origin main
            if git cat-file -e origin/main:.audit/perfect-chaos-round-layout.json 2>/dev/null \
              && git cat-file -e origin/main:scripts/perfect-chaos-repair-segment.mjs 2>/dev/null \
              && git cat-file -e origin/main:scripts/perfect-chaos-rejection-delta.mjs 2>/dev/null; then
              ready=true
              break
            fi
            sleep 30
          done
          test "$ready" = true
          git reset --hard origin/main

      - run: npm ci

      - name: Download the exact audited source artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/perfect-chaos-segment-reuse
          mkdir -p /tmp/perfect-chaos-segment-reuse
          audit=.audit/perfect-chaos-round-layout.json
          jq -e '.format == "connect4-perfect-chaos-round-layout-v1" and .fromPieces == 16 and .targetPieces == 18' \
            "$audit" >/dev/null
          for role in red yellow; do
            run_id="$(jq -er ".roles.$role.sourceRun" "$audit")"
            run_sha="$(jq -er ".roles.$role.sourceSha" "$audit")"
            artifact="$(jq -er ".roles.$role.sourceArtifact" "$audit")"
            state=".campaign/perfect-chaos-main-18/$role.json"
            test "$(jq -r '.sourceRun' "$state")" = "$run_id"
            test "$(jq -r '.sourceSha' "$state")" = "$run_sha"
            test "$(jq -r '.sourceArtifact' "$state")" = "$artifact"
            python3 scripts/perfect-chaos-download-artifact.py \
              --repository "$GITHUB_REPOSITORY" --run-id "$run_id" --run-sha "$run_sha" \
              --artifact-name "$artifact" \
              --output "/tmp/perfect-chaos-segment-reuse/$role" \
              --metadata "/tmp/perfect-chaos-segment-reuse/$role-artifact.json"
            rm -rf "/tmp/perfect-chaos-segment-reuse/$role/.named-artifact-archives"
            python3 scripts/perfect-chaos-artifacts.py verify \
              --directory "/tmp/perfect-chaos-segment-reuse/$role"
          done

      - name: Reproduce both exact segments through the repair primitive
        shell: bash
        run: |
          set -euo pipefail
          audit=.audit/perfect-chaos-round-layout.json
          for role in red yellow; do
            root="/tmp/perfect-chaos-segment-reuse/$role"
            selected() { jq -er ".roles.$role.tables.$1.selected" "$audit"; }
            input="$root/$(selected inputFrontier)"
            policy="$root/$(selected policy)"
            frontier="$root/$(selected outputFrontier)"
            reject="$root/$(selected targetRejections)"
            for file in "$input" "$policy" "$frontier" "$reject"; do
              test -f "$file" && test ! -L "$file"
            done
            output="/tmp/perfect-chaos-segment-reuse/$role-reproduced"
            mkdir -p "$output"
            node scripts/perfect-chaos-repair-segment.mjs \
              --input-frontier "$input" \
              --seed-input-frontier "$input" \
              --seed-policy "$policy" \
              --seed-frontier "$frontier" \
              --seed-rejections "$reject" \
              --rejections "$reject" \
              --target-boundary 18 \
              --maximum-states 120000000 \
              --shards 256 \
              --minimum-states-per-shard 2000000 \
              --workers 4 \
              --work-directory "$output/work" \
              --output-policy "$output/16-18.policy.bin" \
              --output-frontier "$output/16-18.frontier.bin" \
              --output-rejected "$output/rejected-16.bin" \
              > "$output/repair.json"
            jq -e '
              .format == "connect4-chaos-standalone-segment-repair-v1"
              and .summary.format == "connect4-chaos-incremental-segment-repair-v1"
              and .summary.status == "safe"
              and .summary.partitionUsesRejectionDelta == true
              and .summary.partitionRejectRoots == 0
              and .summary.rejectedInputRoots == 0
            ' "$output/repair.json" >/dev/null
            cmp "$policy" "$output/16-18.policy.bin"
            cmp "$frontier" "$output/16-18.frontier.bin"

            ROLE="$role" INPUT="$input" POLICY="$policy" FRONTIER="$frontier" REJECT="$reject" \
              OUTPUT="$output" python3 - <<'PY'
            import hashlib
            import json
            import os
            import struct
            from pathlib import Path

            def sha(path):
                return hashlib.sha256(Path(path).read_bytes()).hexdigest()

            rejected = Path(os.environ['OUTPUT']) / 'rejected-16.bin'
            raw = rejected.read_bytes()
            if len(raw) < 16 or raw[:8] != b'C4CFRN1\0':
                raise RuntimeError('Standalone repair emitted an invalid rejected-root frontier.')
            count = struct.unpack_from('<I', raw, 12)[0]
            if count != 0:
                raise RuntimeError(f'Identity repair rejected {count} input roots.')
            repair = json.loads((Path(os.environ['OUTPUT']) / 'repair.json').read_text())
            value = {
                'format': 'connect4-perfect-chaos-segment-reuse-role-v1',
                'role': os.environ['ROLE'],
                'inputFrontierSha256': sha(os.environ['INPUT']),
                'policySha256': sha(os.environ['POLICY']),
                'frontierSha256': sha(os.environ['FRONTIER']),
                'targetRejectionsSha256': sha(os.environ['REJECT']),
                'reproducedPolicySha256': sha(Path(os.environ['OUTPUT']) / '16-18.policy.bin'),
                'reproducedFrontierSha256': sha(Path(os.environ['OUTPUT']) / '16-18.frontier.bin'),
                'rejectedInputRoots': count,
                'summary': repair['summary'],
                'byteIdentical': True,
            }
            (Path(os.environ['OUTPUT']) / 'reuse-verification.json').write_text(
                json.dumps(value, indent=2, sort_keys=True) + '\n', newline='\n'
            )
            PY
          done

      - name: Consolidate and publish the exact reuse proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          value = {
              'format': 'connect4-perfect-chaos-segment-reuse-verification-v1',
              'fromPieces': 16,
              'targetPieces': 18,
              'sourceLayout': json.loads(Path('.audit/perfect-chaos-round-layout.json').read_text()),
              'roles': {
                  role: json.loads(Path(
                      f'/tmp/perfect-chaos-segment-reuse/{role}-reproduced/reuse-verification.json'
                  ).read_text())
                  for role in ('red', 'yellow')
              },
              'completeReleaseGates': True,
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
              'sourceSha': os.environ['GITHUB_SHA'],
          }
          Path('/tmp/perfect-chaos-segment-reuse-verification.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          PY
          jq -e '
            .format == "connect4-perfect-chaos-segment-reuse-verification-v1"
            and all(.roles[]; .byteIdentical == true and .rejectedInputRoots == 0)
          ' /tmp/perfect-chaos-segment-reuse-verification.json >/dev/null
          npm run chaos:prefix:verify-reference
          npm run test:browser

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # The proof is tied to the exact audited source states.
            for role in red yellow; do
              test "$(jq -r '.sourceRun' ".campaign/perfect-chaos-main-18/$role.json")" = \
                "$(jq -r ".roles.$role.sourceRun" .audit/perfect-chaos-round-layout.json)"
            done
            mkdir -p .audit
            cp /tmp/perfect-chaos-segment-reuse-verification.json \
              .audit/perfect-chaos-segment-reuse-verification.json
            git rm --ignore-unmatch .github/workflows/verify-perfect-chaos-segment-reuse.yml
            git add .audit/perfect-chaos-segment-reuse-verification.json
            git commit -m 'Verify byte-identical Perfect Chaos segment reuse'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
