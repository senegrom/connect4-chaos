name: Generate perfect classic 7x7 policy

on:
  workflow_dispatch:
    inputs:
      handoff_remaining:
        description: Exact endgame handoff (0-49)
        required: true
        default: '24'
        type: string
      table_bits:
        description: Native exact transposition-table bits (8-27)
        required: true
        default: '25'
        type: string
      maximum_nodes:
        description: Exact-search node limit; 0 is unlimited
        required: true
        default: '0'
        type: string
      maximum_states:
        description: Selected-policy closure limit
        required: true
        default: '100000000'
        type: string
      maximum_verify_nodes:
        description: Independent JS replay node limit; 0 is unlimited
        required: true
        default: '0'
        type: string
  push:
    branches:
      - agent/perfect-classic-7x7
    paths:
      - .github/workflows/generate-perfect-classic-7x7.yml

permissions:
  contents: read

concurrency:
  group: perfect-classic-7x7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate request
        shell: bash
        env:
          HANDOFF: ${{ inputs.handoff_remaining || '24' }}
          TABLE_BITS: ${{ inputs.table_bits || '25' }}
          MAXIMUM_NODES: ${{ inputs.maximum_nodes || '0' }}
          MAXIMUM_STATES: ${{ inputs.maximum_states || '100000000' }}
          MAXIMUM_VERIFY_NODES: ${{ inputs.maximum_verify_nodes || '0' }}
        run: |
          set -euo pipefail
          if ! [[ "$HANDOFF" =~ ^([0-9]|[1-4][0-9])$ ]]; then
            echo 'handoff_remaining must be an integer from 0 through 49.' >&2
            exit 1
          fi
          if ! [[ "$TABLE_BITS" =~ ^([89]|1[0-9]|2[0-7])$ ]]; then
            echo 'table_bits must be an integer from 8 through 27.' >&2
            exit 1
          fi
          for value in "$MAXIMUM_NODES" "$MAXIMUM_STATES" "$MAXIMUM_VERIFY_NODES"; do
            if ! [[ "$value" =~ ^[0-9]{1,16}$ ]] \
                || ! node -e 'const n=Number(process.argv[1]); process.exit(Number.isSafeInteger(n) ? 0 : 1)' "$value"; then
              echo 'limits must be non-negative safe integers.' >&2
              exit 1
            fi
          done
          if (( MAXIMUM_STATES < 1 )); then
            echo 'maximum_states must be positive.' >&2
            exit 1
          fi

      - name: Generate and independently replay both 7x7 roles
        shell: bash
        env:
          HANDOFF: ${{ inputs.handoff_remaining || '24' }}
          TABLE_BITS: ${{ inputs.table_bits || '25' }}
          MAXIMUM_NODES: ${{ inputs.maximum_nodes || '0' }}
          MAXIMUM_STATES: ${{ inputs.maximum_states || '100000000' }}
          MAXIMUM_VERIFY_NODES: ${{ inputs.maximum_verify_nodes || '0' }}
        run: |
          set -euo pipefail
          output="generated/perfect-classic-7x7-c4"
          mkdir -p "$output"
          args=(
            generate
            --rows 7
            --columns 7
            --connect 4
            --role both
            --handoff-remaining "$HANDOFF"
            --table-bits "$TABLE_BITS"
            --maximum-nodes "$MAXIMUM_NODES"
            --maximum-states "$MAXIMUM_STATES"
            --output "$output"
          )
          if (( MAXIMUM_VERIFY_NODES > 0 )); then
            args+=(--maximum-verify-nodes "$MAXIMUM_VERIFY_NODES")
          fi
          node scripts/perfect-classic-policy.mjs "${args[@]}" > "$output/generation.json"

      - name: Upload verified 7x7 policy
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-policy-7x7-c4
          path: generated/perfect-classic-7x7-c4
          if-no-files-found: error
          retention-days: 90
