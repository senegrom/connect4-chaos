name: Continue Red from 7,991 rejects with independent evidence

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/continue-red-7991-evidenced.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: continue-red-7991-evidenced
  cancel-in-progress: false

jobs:
  red:
    uses: ./.github/workflows/reusable-perfect-chaos-16-evidenced-round.yml
    with:
      role: red
      source_run: '31738638508'
      source_sha: '563e3e9c94169133c3284ee8d33745b0273f205b'
      source_artifact: perfect-chaos-red-16-7990-round
      existing_rejections: 7990
      prepare_shards: 32
      prepare_workers: 2
      shard_count: 64
      stage_artifact: perfect-chaos-red-14-7991-staged
      shard_prefix: perfect-chaos-red-16-7991-shard-
      result_artifact: perfect-chaos-red-16-7991-round
      audit_artifact: perfect-chaos-red-16-7991-evidence
