name: Verify current main after proof pipeline hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-current-main-after-proof-hardening.yml

permissions:
  contents: write

concurrency:
  group: verify-current-main-after-proof-hardening
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run exact, certificate, artifact, and browser release gates
        id: gates
        continue-on-error: true
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -o pipefail
          npm run check
          npm test
          npm run classic:verify
          npm run classic:policy:verify
          npm run chaos:complete:verify
          npm run chaos:prefix:verify-reference
          npm run test:browser
          python3 -m py_compile \
            scripts/perfect-classic-download-fragments.py \
            scripts/patch-perfect-classic-fragment-downloads.py
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.safe_load(File.read(p), aliases: true); puts p }' \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml \
            .github/workflows/promote-perfect-classic-7x7.yml \
            .github/workflows/continue-perfect-chaos-18-main.yml \
            .github/workflows/promote-perfect-chaos-18.yml \
            .github/workflows/supervise-perfect-chaos-main.yml

      - name: Record immutable result and remove the one-shot gate
        if: always()
        shell: bash
        env:
          GATES: ${{ steps.gates.outcome }}
        run: |
          set -euo pipefail
          result=failure
          if [[ "$GATES" = success ]]; then result=success; fi
          RESULT="$result" GATES="$GATES" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          value = {
              'format': 'connect4-current-main-proof-hardening-verification-v1',
              'result': os.environ['RESULT'],
              'releaseGates': os.environ['GATES'],
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/current-main-proof-hardening.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(value, indent=2, sort_keys=True))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/current-main-proof-hardening.json .audit/current-main-proof-hardening.json
            git rm --ignore-unmatch .github/workflows/verify-current-main-after-proof-hardening.yml
            git add .audit/current-main-proof-hardening.json
            git commit -m "Record current-main proof hardening verification: $result"
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" = 5 ]]; then
              echo 'Could not publish verification after five races.' >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          test "$result" = success
