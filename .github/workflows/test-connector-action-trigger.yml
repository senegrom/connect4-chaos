name: Test connector-triggered Actions execution

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-connector-action-trigger.yml

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Commit an observable marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('/tmp/connector-action-trigger.json').write_text(json.dumps({
              'format': 'connect4-connector-action-trigger-v1',
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'headSha': os.environ['GITHUB_SHA'],
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/connector-action-trigger.json .audit/connector-action-trigger.json
            git add .audit/connector-action-trigger.json
            git commit -m 'Record connector-triggered Actions execution'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
