name: Trigger ply-8 perfect book

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-ply8-book.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Trigger ply-8 perfect book'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact ply-8 generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run generate-perfect-book.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f depth=8 \
            -f shards=8 \
            -f commit_book=true
