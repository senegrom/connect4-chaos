name: Install exact Perfect Chaos policy-root partitioning

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-policy-partition.yml
      - scripts/patch-perfect-chaos-policy-partition.py
      - tests/perfect-chaos-policy-partition.test.js

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-policy-partition
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply the structural source patch
        run: python3 scripts/patch-perfect-chaos-policy-partition.py native/perfect-chaos-prefix.cpp

      - name: Compile and verify the native solver
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp -o /tmp/perfect-chaos-prefix
          /tmp/perfect-chaos-prefix verify

      - name: Verify slicing and exact dependency partitioning
        run: node --test tests/perfect-chaos-policy-slice.test.js tests/perfect-chaos-policy-partition.test.js

      - name: Commit the verified native primitive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/perfect-chaos-prefix.cpp
          if git diff --cached --quiet; then
            echo 'Exact policy-root partitioning is already installed.'
            exit 0
          fi
          git commit -m 'Add exact policy-root partitioning for incremental Chaos proofs'
          git push origin HEAD:agent/perfect-chaos-16-recovery
