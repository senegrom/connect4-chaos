name: Install immutable exact Chaos journal artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-immutable-perfect-chaos-journals.yml

permissions:
  contents: write

concurrency:
  group: install-immutable-perfect-chaos-journals
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write the exact run/SHA-bound journal selector
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/perfect-chaos-select-journal.py <<'PY'
          #!/usr/bin/env python3
          """Select and optionally restore the newest immutable preparation journal."""

          from __future__ import annotations

          import argparse
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from typing import Any, NoReturn

          FORMAT = "connect4-perfect-chaos-journal-selection-v1"
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          DIGEST_RE = re.compile(r"^sha256:[0-9a-f]{64}$")
          ROLE_RE = re.compile(r"^(red|yellow)$")
          REPOSITORY_RE = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")


          def fail(message: str) -> NoReturn:
              raise RuntimeError(message)


          def integer(value: Any, label: str, minimum: int = 0) -> int:
              if isinstance(value, bool) or not isinstance(value, int) or value < minimum:
                  fail(f"{label} must be an integer >= {minimum}")
              return value


          def load_index(path: Path) -> list[dict[str, Any]]:
              if path.is_symlink() or not path.is_file():
                  fail(f"Artifact index must be a regular file: {path}")
              try:
                  value = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError) as error:
                  fail(f"Could not parse artifact index {path}: {error}")
              pages = value if isinstance(value, list) else [value]
              if any(not isinstance(page, dict) for page in pages):
                  fail("Artifact index pages must be objects")
              artifacts: list[dict[str, Any]] = []
              for page_index, page in enumerate(pages):
                  values = page.get("artifacts")
                  if not isinstance(values, list):
                      fail(f"Artifact page {page_index} has no artifacts array")
                  for artifact in values:
                      if not isinstance(artifact, dict):
                          fail(f"Artifact page {page_index} contains a non-object")
                      artifacts.append(artifact)
              return artifacts


          def select(
              artifacts: list[dict[str, Any]],
              *,
              run_id: int,
              run_sha: str,
              role: str,
              before_attempt: int | None,
          ) -> dict[str, Any]:
              prefix = f"perfect-chaos-{role}-18-prepare-journal"
              immutable = re.compile(rf"^{re.escape(prefix)}-attempt-([1-9][0-9]*)$")
              seen_ids: set[int] = set()
              candidates: dict[int, str] = {}
              expired: list[dict[str, Any]] = []

              for artifact in artifacts:
                  name = artifact.get("name")
                  if name == prefix:
                      attempt = 0
                  elif isinstance(name, str) and (match := immutable.fullmatch(name)):
                      attempt = int(match.group(1))
                  else:
                      continue

                  artifact_id = integer(artifact.get("id"), f"{name}.id", 1)
                  if artifact_id in seen_ids:
                      fail(f"Artifact id {artifact_id} appears more than once")
                  seen_ids.add(artifact_id)
                  workflow_run = artifact.get("workflow_run")
                  if not isinstance(workflow_run, dict):
                      fail(f"Artifact {name} has no workflow_run identity")
                  if workflow_run.get("id") != run_id:
                      fail(f"Artifact {name} belongs to run {workflow_run.get('id')}, expected {run_id}")
                  if workflow_run.get("head_sha") != run_sha:
                      fail(f"Artifact {name} belongs to SHA {workflow_run.get('head_sha')}, expected {run_sha}")
                  if DIGEST_RE.fullmatch(str(artifact.get("digest"))) is None:
                      fail(f"Artifact {name} has no valid SHA-256 digest")
                  if before_attempt is not None and attempt >= before_attempt:
                      continue
                  if artifact.get("expired") is not False:
                      expired.append({"id": artifact_id, "name": name, "attempt": attempt})
                      continue
                  previous = candidates.get(attempt)
                  if previous is not None and previous != name:
                      fail(f"Attempt {attempt} has conflicting journal names: {previous}, {name}")
                  candidates[attempt] = name

              if not candidates:
                  return {
                      "format": FORMAT,
                      "found": False,
                      "runId": run_id,
                      "runSha": run_sha,
                      "role": role,
                      "beforeAttempt": before_attempt,
                      "expired": expired,
                  }
              attempt = max(candidates)
              return {
                  "format": FORMAT,
                  "found": True,
                  "runId": run_id,
                  "runSha": run_sha,
                  "role": role,
                  "beforeAttempt": before_attempt,
                  "selectedAttempt": attempt,
                  "artifactName": candidates[attempt],
                  "legacy": attempt == 0,
                  "expired": expired,
              }


          def parse() -> argparse.Namespace:
              parser = argparse.ArgumentParser()
              parser.add_argument("--index", type=Path, required=True)
              parser.add_argument("--repository", required=True)
              parser.add_argument("--run-id", type=int, required=True)
              parser.add_argument("--run-sha", required=True)
              parser.add_argument("--role", required=True)
              parser.add_argument("--before-attempt", type=int)
              parser.add_argument("--output", type=Path)
              parser.add_argument("--metadata", type=Path, required=True)
              parser.add_argument("--select-only", action="store_true")
              return parser.parse_args()


          def main() -> None:
              arguments = parse()
              if REPOSITORY_RE.fullmatch(arguments.repository) is None:
                  fail("Repository must use owner/name syntax")
              if arguments.run_id < 1:
                  fail("run-id must be positive")
              if SHA_RE.fullmatch(arguments.run_sha) is None:
                  fail("run-sha must contain 40 lowercase hexadecimal characters")
              if ROLE_RE.fullmatch(arguments.role) is None:
                  fail("role must be red or yellow")
              if arguments.before_attempt is not None and arguments.before_attempt < 1:
                  fail("before-attempt must be positive")
              result = select(
                  load_index(arguments.index),
                  run_id=arguments.run_id,
                  run_sha=arguments.run_sha,
                  role=arguments.role,
                  before_attempt=arguments.before_attempt,
              )
              arguments.metadata.parent.mkdir(parents=True, exist_ok=True)
              if result["found"] and not arguments.select_only:
                  if arguments.output is None:
                      fail("--output is required unless --select-only is used")
                  downloader_metadata = arguments.metadata.with_suffix(".artifact.json")
                  command = [
                      "python3",
                      "scripts/perfect-chaos-download-artifact.py",
                      "--repository", arguments.repository,
                      "--run-id", str(arguments.run_id),
                      "--run-sha", arguments.run_sha,
                      "--artifact-name", result["artifactName"],
                      "--output", str(arguments.output),
                      "--metadata", str(downloader_metadata),
                  ]
                  subprocess.run(command, check=True, env=os.environ.copy())
                  result["artifactVerification"] = json.loads(downloader_metadata.read_text())
              arguments.metadata.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", newline="\n")
              print(json.dumps(result, indent=2, sort_keys=True))


          if __name__ == "__main__":
              main()
          PY
          chmod +x scripts/perfect-chaos-select-journal.py

      - name: Replace destructive journal transport with immutable attempts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          path = Path('.github/workflows/reusable-perfect-chaos-18-round.yml')
          text = path.read_text()

          def remove_named_step(source: str, name: str) -> str:
              marker = f'      - name: {name}\n'
              while marker in source:
                  start = source.index(marker)
                  positions = [
                      p for token in ('      - name: ', '      - uses: ')
                      if (p := source.find(token, start + len(marker))) >= 0
                  ]
                  end = min(positions) if positions else len(source)
                  source = source[:start] + source[end:]
              return source

          for name in (
              'Restore exact preparation journal from the committed source round',
              'Restore exact preparation journal from a prior attempt',
              'Preserve exact preparation journal for a rerun',
          ):
              text = remove_named_step(text, name)

          rebuild = '      - name: Rebuild the exact 16-piece prefix with bounded deterministic workers\n'
          publish = '      - name: Publish deterministic classification matrix\n'
          if text.count(rebuild) != 1 or text.count(publish) != 1:
              raise RuntimeError('Preparation workflow anchors changed unexpectedly.')
          expression = lambda value: '$' + '{{ ' + value + ' }}'
          role = expression('inputs.role')
          token = expression('github.token')
          rerun = expression('github.run_attempt > 1')
          attempt = expression('github.run_attempt')

          source_step = f'''      - name: Restore immutable journal from the committed source round
                shell: bash
                env:
                  GH_TOKEN: {token}
                run: |
                  set -euo pipefail
                  role='{role}'
                  state=".campaign/perfect-chaos-main-18/$role.json"
                  test -f "$state" && test ! -L "$state"
                  source_run="$(jq -er '.sourceRun | select(type == "number" and . > 0)' "$state")"
                  source_sha="$(jq -er '.sourceSha | select(test("^[0-9a-f]{{40}}$"))' "$state")"
                  gh api --paginate --slurp \\
                    "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts?per_page=100" \\
                    > /tmp/source-journal-index.json
                  rm -rf .perfect-chaos-prepare.journal
                  python3 scripts/perfect-chaos-select-journal.py \\
                    --index /tmp/source-journal-index.json \\
                    --repository "$GITHUB_REPOSITORY" \\
                    --run-id "$source_run" \\
                    --run-sha "$source_sha" \\
                    --role "$role" \\
                    --output .perfect-chaos-prepare.journal \\
                    --metadata /tmp/source-journal-selection.json

          '''
          rerun_step = f'''      - name: Restore immutable journal from the latest prior attempt
                if: {rerun}
                shell: bash
                env:
                  GH_TOKEN: {token}
                run: |
                  set -euo pipefail
                  role='{role}'
                  gh api --paginate --slurp \\
                    "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \\
                    > /tmp/rerun-journal-index.json
                  rm -rf .perfect-chaos-prepare.journal
                  python3 scripts/perfect-chaos-select-journal.py \\
                    --index /tmp/rerun-journal-index.json \\
                    --repository "$GITHUB_REPOSITORY" \\
                    --run-id "$GITHUB_RUN_ID" \\
                    --run-sha "$GITHUB_SHA" \\
                    --role "$role" \\
                    --before-attempt "$GITHUB_RUN_ATTEMPT" \\
                    --output .perfect-chaos-prepare.journal \\
                    --metadata /tmp/rerun-journal-selection.json

          '''
          upload_step = f'''      - name: Preserve immutable exact preparation journal
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: perfect-chaos-{role}-18-prepare-journal-attempt-{attempt}
                  path: .perfect-chaos-prepare.journal
                  if-no-files-found: ignore
                  include-hidden-files: true
                  retention-days: 30

          '''
          text = text.replace(rebuild, source_step + rerun_step + rebuild, 1)
          text = text.replace(publish, upload_step + publish, 1)
          path.write_text(text, newline='\n')

          source = path.read_text()
          checks = {
              'Restore immutable journal from the committed source round': 1,
              'Restore immutable journal from the latest prior attempt': 1,
              'Preserve immutable exact preparation journal': 1,
              'scripts/perfect-chaos-select-journal.py': 2,
              role: 3,
              token: 2,
              rerun: 1,
              attempt: 2,
              'overwrite: true': 0,
              '--before-attempt "$GITHUB_RUN_ATTEMPT"': 1,
          }
          for fragment, expected in checks.items():
              actual = source.count(fragment)
              if actual != expected:
                  raise RuntimeError(f'{fragment!r}: found {actual}, expected {expected}')
          PY

      - name: Add selector and workflow regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/perfect-chaos-select-journal.test.js <<'NODE'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';

          const ROOT = fileURLToPath(new URL('..', import.meta.url));
          const SCRIPT = join(ROOT, 'scripts', 'perfect-chaos-select-journal.py');
          const SHA = '0123456789abcdef0123456789abcdef01234567';

          function artifact(id, name, { run = 42, sha = SHA, expired = false } = {}) {
            return {
              id,
              name,
              expired,
              digest: `sha256:${String(id).padStart(64, '0')}`,
              workflow_run: { id: run, head_sha: sha },
            };
          }

          async function select(artifacts, extra = []) {
            const directory = await mkdtemp(join(tmpdir(), 'c4-journal-select-'));
            try {
              const index = join(directory, 'index.json');
              const metadata = join(directory, 'metadata.json');
              await writeFile(index, JSON.stringify([{ artifacts }]));
              const result = spawnSync('python3', [
                SCRIPT,
                '--index', index,
                '--repository', 'senegrom/connect4-chaos',
                '--run-id', '42',
                '--run-sha', SHA,
                '--role', 'red',
                '--metadata', metadata,
                '--select-only',
                ...extra,
              ], { cwd: ROOT, encoding: 'utf8' });
              return {
                result,
                metadata: result.status === 0
                  ? JSON.parse(await readFile(metadata, 'utf8'))
                  : null,
              };
            } finally {
              await rm(directory, { recursive: true, force: true });
            }
          }

          test('the newest immutable attempt wins over earlier and legacy journals', async () => {
            const { result, metadata } = await select([
              artifact(1, 'perfect-chaos-red-18-prepare-journal'),
              artifact(2, 'perfect-chaos-red-18-prepare-journal-attempt-1'),
              artifact(3, 'perfect-chaos-red-18-prepare-journal-attempt-3'),
              artifact(4, 'unrelated'),
            ]);
            assert.equal(result.status, 0, result.stderr);
            assert.equal(metadata.found, true);
            assert.equal(metadata.selectedAttempt, 3);
            assert.equal(metadata.legacy, false);
          });

          test('same-run restore selects only an earlier attempt', async () => {
            const { result, metadata } = await select([
              artifact(1, 'perfect-chaos-red-18-prepare-journal'),
              artifact(2, 'perfect-chaos-red-18-prepare-journal-attempt-1'),
              artifact(3, 'perfect-chaos-red-18-prepare-journal-attempt-3'),
            ], ['--before-attempt', '3']);
            assert.equal(result.status, 0, result.stderr);
            assert.equal(metadata.selectedAttempt, 1);
          });

          test('a missing or expired cache is an explicit non-error miss', async () => {
            const { result, metadata } = await select([
              artifact(1, 'perfect-chaos-red-18-prepare-journal-attempt-2', { expired: true }),
            ]);
            assert.equal(result.status, 0, result.stderr);
            assert.equal(metadata.found, false);
            assert.equal(metadata.expired.length, 1);
          });

          test('matching artifacts with wrong run or SHA identities fail closed', async () => {
            for (const candidate of [
              artifact(1, 'perfect-chaos-red-18-prepare-journal-attempt-1', { run: 41 }),
              artifact(1, 'perfect-chaos-red-18-prepare-journal-attempt-1', { sha: 'f'.repeat(40) }),
            ]) {
              const { result } = await select([candidate]);
              assert.notEqual(result.status, 0);
              assert.match(result.stderr, /belongs to run|belongs to SHA/);
            }
          });

          test('duplicate artifact identities fail closed', async () => {
            const value = artifact(7, 'perfect-chaos-red-18-prepare-journal-attempt-1');
            const { result } = await select([value, value]);
            assert.notEqual(result.status, 0);
            assert.match(result.stderr, /appears more than once/);
          });
          NODE

          cat > tests/perfect-chaos-journal-cache-workflow.test.js <<'NODE'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const WORKFLOW = new URL('../.github/workflows/reusable-perfect-chaos-18-round.yml', import.meta.url);

          test('preparation journals use immutable attempt-numbered artifacts', async () => {
            const source = await readFile(WORKFLOW, 'utf8');
            const cross = source.indexOf('Restore immutable journal from the committed source round');
            const rerun = source.indexOf('Restore immutable journal from the latest prior attempt');
            const rebuild = source.indexOf('Rebuild the exact 16-piece prefix with bounded deterministic workers');
            const upload = source.indexOf('Preserve immutable exact preparation journal');
            const publish = source.indexOf('Publish deterministic classification matrix');
            assert.ok(cross >= 0 && cross < rerun && rerun < rebuild && rebuild < upload && upload < publish);
            assert.equal((source.match(/scripts\/perfect-chaos-select-journal\.py/g) ?? []).length, 2);
            assert.match(source, /--before-attempt "\$GITHUB_RUN_ATTEMPT"/);
            assert.match(source, /prepare-journal-attempt-.*github\.run_attempt/);
            assert.doesNotMatch(source, /overwrite: true/);
            assert.match(source, /if: always\(\)/);
            assert.match(source, /include-hidden-files: true/);
            assert.equal((source.match(/--journal "\$journal"/g) ?? []).length, 1);
          });

          test('both restores are exact run/SHA bound through the selector', async () => {
            const source = await readFile(WORKFLOW, 'utf8');
            assert.match(source, /\.sourceRun/);
            assert.match(source, /\.sourceSha/);
            assert.match(source, /--run-id "\$source_run"/);
            assert.match(source, /--run-sha "\$source_sha"/);
            assert.match(source, /--run-id "\$GITHUB_RUN_ID"/);
            assert.match(source, /--run-sha "\$GITHUB_SHA"/);
          });
          NODE

      - name: Run selector, workflow, and complete release verification
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/perfect-chaos-select-journal.py
          node --test \
            tests/perfect-chaos-select-journal.test.js \
            tests/perfect-chaos-journal-cache-workflow.test.js
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/reusable-perfect-chaos-18-round.yml
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish immutable journal transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/install-immutable-perfect-chaos-journals.yml
          rm -f tests/perfect-chaos-prepare-journal-workflow.test.js \
                tests/perfect-chaos-cross-run-journal-workflow.test.js
          git add .github/workflows/reusable-perfect-chaos-18-round.yml \
                  scripts/perfect-chaos-select-journal.py \
                  tests/perfect-chaos-select-journal.test.js \
                  tests/perfect-chaos-journal-cache-workflow.test.js \
                  tests
          git diff --check
          git commit -m 'Preserve immutable exact Chaos journals per attempt'
          git push origin HEAD:main
