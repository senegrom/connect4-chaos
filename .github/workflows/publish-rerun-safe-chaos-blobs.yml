name: Publish verified rerun-safe Chaos blob identities

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/publish-rerun-safe-chaos-blobs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rerun-safe-chaos-blobs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SOURCE: b55c39c63652e4c345671696721da5a839fc7e90
      EXPECTED_MAIN: 6ba4aa365128cbbd09e7ae8abdfb8c80018bd8dd
    steps:
      - name: Check out exact verified source
        uses: actions/checkout@v6
        with:
          ref: b55c39c63652e4c345671696721da5a839fc7e90
          path: source

      - name: Check out exact release parent
        uses: actions/checkout@v6
        with:
          ref: main
          path: release

      - name: Check out writable campaign state
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          path: campaign
          fetch-depth: 0

      - name: Regenerate and verify exact production bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$VERIFIED_SOURCE"
          test "$(git -C release rev-parse HEAD)" = "$EXPECTED_MAIN"

          cp source/scripts/perfect-chaos-download-artifact.py release/scripts/
          cp source/scripts/test-perfect-chaos-download-artifact.py release/scripts/
          chmod +x \
            release/scripts/perfect-chaos-download-artifact.py \
            release/scripts/test-perfect-chaos-download-artifact.py
          (cd release && python3 ../source/scripts/patch-rerun-safe-artifacts.py)

          cat > /tmp/VERIFIED_SHA256SUMS <<'EOF'
          00440c34d04a5190a5260833ad2477aefa4f51b352e75a5b9edaad2d85e7e899  .github/workflows/ci.yml
          92da2aee94f967939a1e3dc6857c093ab4dc018961d2ee24b9f398c12d42bf04  .github/workflows/reusable-perfect-chaos-16-evidenced-round.yml
          286b203471cf67f23500618791e67e2809b8cfbebf1db4a65d836af821b821fe  .github/workflows/reusable-perfect-chaos-16-round.yml
          f1d6f41827f1c190c53e18bde2b64b3ce78d4ea049b87e40e559da16715395c6  .github/workflows/reusable-perfect-chaos-18-evidenced-round.yml
          8184146387cead9f90fdae65df535b6b6731108e4ce1af1ed410d7b936007a53  .github/workflows/reusable-perfect-chaos-18-round.yml
          a0feac8ec3d2b2edb6921d1077ac6ef4b9e25b4c9ba925db7cd1affc519efdf4  .github/workflows/reusable-perfect-chaos-auto-advance.yml
          76aa8a794ebef3745f8b5de3c8c39e5b24c2d377dd20f8bb74bcf5b9f9ad3423  scripts/perfect-chaos-download-artifact.py
          74d93b27c29dbc8818b409455edcf2e46ed5cb5cd1aaf7468cf1784be5858545  scripts/test-perfect-chaos-download-artifact.py
          EOF
          (cd release && sha256sum --check --strict /tmp/VERIFIED_SHA256SUMS)
          python3 release/scripts/test-perfect-chaos-download-artifact.py
          git -C release diff --check

      - name: Create content-addressed Git blobs and publish their identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campaign/.promotion
          jq -n \
            --arg format connect4-chaos-rerun-safe-main-blobs-v1 \
            --arg verifiedSource "$VERIFIED_SOURCE" \
            --arg parent "$EXPECTED_MAIN" \
            '{format:$format,verifiedSource:$verifiedSource,parent:$parent,files:[]}' \
            > campaign/.promotion/rerun-safe-main-blobs.json

          add_blob() {
            path=$1
            mode=$2
            expected_content_sha=$3
            actual_content_sha=$(sha256sum "release/$path" | cut -d' ' -f1)
            test "$actual_content_sha" = "$expected_content_sha"
            expected_blob=$(git hash-object "release/$path")
            blob=$(jq -Rs '{content:.,encoding:"utf-8"}' < "release/$path" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
            test "$blob" = "$expected_blob"
            jq \
              --arg path "$path" \
              --arg mode "$mode" \
              --arg blob "$blob" \
              --arg contentSha256 "$actual_content_sha" \
              '.files += [{path:$path,mode:$mode,type:"blob",sha:$blob,contentSha256:$contentSha256}]' \
              campaign/.promotion/rerun-safe-main-blobs.json \
              > campaign/.promotion/rerun-safe-main-blobs.tmp
            mv campaign/.promotion/rerun-safe-main-blobs.tmp campaign/.promotion/rerun-safe-main-blobs.json
          }

          add_blob .github/workflows/ci.yml 100644 00440c34d04a5190a5260833ad2477aefa4f51b352e75a5b9edaad2d85e7e899
          add_blob .github/workflows/reusable-perfect-chaos-16-round.yml 100644 286b203471cf67f23500618791e67e2809b8cfbebf1db4a65d836af821b821fe
          add_blob .github/workflows/reusable-perfect-chaos-18-round.yml 100644 8184146387cead9f90fdae65df535b6b6731108e4ce1af1ed410d7b936007a53
          add_blob .github/workflows/reusable-perfect-chaos-auto-advance.yml 100644 a0feac8ec3d2b2edb6921d1077ac6ef4b9e25b4c9ba925db7cd1affc519efdf4
          add_blob scripts/perfect-chaos-download-artifact.py 100755 76aa8a794ebef3745f8b5de3c8c39e5b24c2d377dd20f8bb74bcf5b9f9ad3423
          add_blob scripts/test-perfect-chaos-download-artifact.py 100755 74d93b27c29dbc8818b409455edcf2e46ed5cb5cd1aaf7468cf1784be5858545

          jq -e '
            .format == "connect4-chaos-rerun-safe-main-blobs-v1"
            and .verifiedSource == "b55c39c63652e4c345671696721da5a839fc7e90"
            and .parent == "6ba4aa365128cbbd09e7ae8abdfb8c80018bd8dd"
            and (.files | length) == 6
            and ([.files[].path] | unique | length) == 6
            and ([.files[].sha] | all(test("^[0-9a-f]{40}$")))
          ' campaign/.promotion/rerun-safe-main-blobs.json >/dev/null

          git -C campaign config user.name 'github-actions[bot]'
          git -C campaign config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C campaign add .promotion/rerun-safe-main-blobs.json
          test "$(git -C campaign diff --cached --name-only)" = '.promotion/rerun-safe-main-blobs.json'
          git -C campaign commit -m 'Publish verified rerun-safe Chaos blob identities'
          git -C campaign push origin HEAD:agent/perfect-chaos-16-recovery
