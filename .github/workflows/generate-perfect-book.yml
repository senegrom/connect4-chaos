name: Generate perfect-play book

on:
  workflow_dispatch:
    inputs:
      depth:
        description: Exact opening-book ply to generate (0-10)
        required: true
        default: '8'
        type: string
      shards:
        description: Parallel scoring shards (1-32)
        required: true
        default: '8'
        type: string
      commit_book:
        description: Commit the generated book to main
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: perfect-play-book
  cancel-in-progress: false

env:
  ORACLE_COMMIT: d6ba50d8aaf2308c769d9bf2abd42d90f34baf41
  ORACLE_BOOK_SHA256: 38f9834317c37d9516e45a21da598569a5d1556595686593d14c2e63f59c1f38

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      depth: ${{ steps.config.outputs.depth }}
      shard_count: ${{ steps.config.outputs.shard_count }}
      matrix: ${{ steps.config.outputs.matrix }}

    steps:
      - name: Validate generation request
        id: config
        shell: bash
        run: |
          set -euo pipefail
          depth='${{ inputs.depth }}'
          shard_count='${{ inputs.shards }}'

          if ! [[ "$depth" =~ ^([0-9]|10)$ ]]; then
            echo 'Depth must be an integer from 0 through 10.' >&2
            exit 1
          fi
          if ! [[ "$shard_count" =~ ^([1-9]|[12][0-9]|3[0-2])$ ]]; then
            echo 'Shard count must be an integer from 1 through 32.' >&2
            exit 1
          fi

          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shard_count" >> "$GITHUB_OUTPUT"
          python - "$shard_count" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          count = int(sys.argv[1])
          print('matrix=' + json.dumps(list(range(count)), separators=(',', ':')))
          PY

  score:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project
        run: npm ci

      - name: Build pinned exact oracle
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/PascalPons/connect4.git /tmp/connect4-oracle
          git -C /tmp/connect4-oracle checkout --quiet "$ORACLE_COMMIT"
          make -C /tmp/connect4-oracle -j2 c4solver
          curl --fail --location --retry 3 \
            https://github.com/PascalPons/connect4/releases/download/book/7x6_small.book \
            --output /tmp/connect4-oracle/7x6_small.book
          echo "$ORACLE_BOOK_SHA256  /tmp/connect4-oracle/7x6_small.book" | sha256sum --check --strict

      - name: Enumerate and score shard
        shell: bash
        run: |
          set -euo pipefail
          positions="/tmp/perfect-positions-${{ matrix.shard }}.txt"
          scores="/tmp/perfect-scores-${{ matrix.shard }}.txt"

          node scripts/perfect-book.mjs enumerate \
            --depth '${{ needs.prepare.outputs.depth }}' \
            --shard-count '${{ needs.prepare.outputs.shard_count }}' \
            --shard-index '${{ matrix.shard }}' \
            > "$positions"

          /tmp/connect4-oracle/c4solver \
            -a \
            -b /tmp/connect4-oracle/7x6_small.book \
            < "$positions" \
            > "$scores"

          test "$(wc -l < "$scores")" -eq "$(wc -l < "$positions")"

      - name: Upload exact scores
        uses: actions/upload-artifact@v4
        with:
          name: perfect-scores-${{ matrix.shard }}
          path: /tmp/perfect-scores-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 3

  pack:
    needs: [prepare, score]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project
        run: npm ci

      - name: Download exact score shards
        uses: actions/download-artifact@v4
        with:
          pattern: perfect-scores-*
          path: /tmp/perfect-shards
          merge-multiple: true

      - name: Pack and validate deterministic book
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/perfect-shards/perfect-scores-*.txt > /tmp/perfect-scores.txt
          node scripts/perfect-book.mjs pack \
            --input /tmp/perfect-scores.txt \
            --output assets/perfect-book.bin \
            --manifest data/perfect-book.manifest.json \
            --max-ply '${{ needs.prepare.outputs.depth }}' \
            --source "PascalPons/connect4@$ORACLE_COMMIT; 7x6_small.book sha256=$ORACLE_BOOK_SHA256; shards=${{ needs.prepare.outputs.shard_count }}"
          npm run ci
          git diff --check

      - name: Upload generated book
        uses: actions/upload-artifact@v4
        with:
          name: perfect-play-book-ply-${{ needs.prepare.outputs.depth }}
          path: |
            assets/perfect-book.bin
            data/perfect-book.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated book
        if: inputs.commit_book
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/perfect-book.bin data/perfect-book.manifest.json
          if git diff --cached --quiet; then
            echo 'The committed perfect-play book is already current.'
            exit 0
          fi
          git commit -m "Grow exact opening book to ply ${{ needs.prepare.outputs.depth }}"
          git push origin HEAD:main
