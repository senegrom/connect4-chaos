name: Continue after Red hardened audit follow-up

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/continue-after-red-hardened-audit-next.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: continue-after-red-hardened-audit-next
  cancel-in-progress: false

jobs:
  wait_for_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31649062855'
      SOURCE_SHA: '8593515d9c1e35bf0cf4e1db2d4298e5045b115c'
    steps:
      - name: Require the locked Red audited follow-up
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$actual_sha" = "$SOURCE_SHA"
          for attempt in $(seq 1 720); do
            read -r status conclusion < <(
              gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
                --jq '[.status, (.conclusion // "")] | @tsv'
            )
            if [[ "$status" == 'completed' ]]; then
              test "$conclusion" = 'success'
              exit 0
            fi
            sleep 30
          done
          echo 'The Red audited follow-up did not complete in the continuation window.' >&2
          exit 1

  continue_red:
    needs: wait_for_source
    uses: ./.github/workflows/reusable-perfect-chaos-16-round.yml
    with:
      role: red
      source_run: '31649062855'
      source_sha: '8593515d9c1e35bf0cf4e1db2d4298e5045b115c'
      source_artifact: perfect-chaos-red-16-audit-next-round
      existing_rejections: 7938
      prepare_shards: 32
      shard_count: 64
      stage_artifact: perfect-chaos-red-14-audit-followup-staged
      shard_prefix: perfect-chaos-red-16-audit-followup-shard-
      result_artifact: perfect-chaos-red-16-audit-followup-round
