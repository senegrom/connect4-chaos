name: Certify Red 8,020 16-piece closure

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/certify-red-8020-closure.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: certify-red-8020-closure
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31756023493'
      SOURCE_SHA: bd8c95e9dbdc097ae51dcc700b62715c3cadc661
      SOURCE_ARTIFACT: perfect-chaos-red-16-8020-round
      SOURCE_ARTIFACT_ID: '9202862656'
      SOURCE_ARTIFACT_DIGEST: sha256:5de8779aed51bad64bdf8d304a1de9424a5c60d477f31d0450a100238d7981af
      AUDIT_RUN: '31757582324'
      AUDIT_SHA: 7e683f8016e819ed900d23b683a8ed481be5356c
      AUDIT_ARTIFACT: perfect-chaos-red-16-8020-closure-evidence
      AUDIT_ARTIFACT_ID: '9203347832'
      AUDIT_ARTIFACT_DIGEST: sha256:cdb3144e63ed98b97e35e7dd8857376da638474a0a4cda98f6cb878134830256
      CERTIFIED_ARTIFACT: perfect-chaos-red-16-8020-certified
    steps:
      - uses: actions/checkout@v6

      - name: Pin the closure producer and independent auditor
        shell: bash
        run: |
          set -euo pipefail
          read -r source_sha source_status source_conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
          )
          test "$source_sha" = "$SOURCE_SHA"
          test "$source_status" = completed
          test "$source_conclusion" = failure
          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' \
            | sort > /tmp/source-jobs.tsv
          test "$(awk -F '\t' '$2 != "completed" { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '0'
          test "$(awk -F '\t' '$3 != "success" { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '1'
          test "$(awk -F '\t' '$3 == "failure" && $1 ~ /\/ evidence$/ { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '1'

          read -r source_artifact_id source_digest source_expired < <(
            gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$SOURCE_ARTIFACT\") | [.id, (.digest // \"\"), .expired] | @tsv"
          )
          test "$source_artifact_id" = "$SOURCE_ARTIFACT_ID"
          test "$source_digest" = "$SOURCE_ARTIFACT_DIGEST"
          test "$source_expired" = false

          read -r audit_sha audit_status audit_conclusion < <(
            gh api "repos/$REPO/actions/runs/$AUDIT_RUN" \
              --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
          )
          test "$audit_sha" = "$AUDIT_SHA"
          test "$audit_status" = completed
          test "$audit_conclusion" = success
          read -r audit_artifact_id audit_digest audit_expired < <(
            gh api --paginate "repos/$REPO/actions/runs/$AUDIT_RUN/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$AUDIT_ARTIFACT\") | [.id, (.digest // \"\"), .expired] | @tsv"
          )
          test "$audit_artifact_id" = "$AUDIT_ARTIFACT_ID"
          test "$audit_digest" = "$AUDIT_ARTIFACT_DIGEST"
          test "$audit_expired" = false

      - name: Download the exact result and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf result evidence certified
          mkdir -p result evidence certified
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$SOURCE_ARTIFACT" --dir result
          gh run download "$AUDIT_RUN" --repo "$REPO" \
            --name "$AUDIT_ARTIFACT" --dir evidence

      - name: Revalidate the closure and construct the certified source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory result
          (cd evidence && sha256sum --check --strict SHA256SUMS)
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          result = Path('result')
          evidence = Path('evidence')
          summary = json.loads((result / 'campaign-summary.json').read_text())
          report = json.loads((evidence / 'audit-report.json').read_text())
          provenance = json.loads((evidence / 'provenance.json').read_text())
          published_replay = json.loads((result / 'red-16-replay.json').read_text())
          audited_replay = json.loads((evidence / 'closure-replay.json').read_text())

          expected_summary = {
              'role': 'red',
              'fromPieces': 14,
              'targetPieces': 16,
              'existingRejectedRoots': 8020,
              'newRejectedRoots': 0,
              'cumulativeRejectedRoots': 8020,
              'rejectionProgress': 0,
              'classificationComplete': True,
              'policyConflicts': 0,
          }
          for field, expected in expected_summary.items():
              if summary.get(field) != expected:
                  raise RuntimeError(f'Invalid closure summary field {field}: {summary.get(field)!r}')

          expected_report = {
              'format': 'connect4-chaos-independent-sharded-round-audit-v1',
              'status': 'pass',
              'role': 'red',
              'fromPieces': 14,
              'targetPieces': 16,
              'shards': 64,
              'inputRoots': 105254,
              'existingRejectedRoots': 8020,
              'newRejectedRoots': 0,
              'cumulativeRejectedRoots': 8020,
              'safeInputRoots': 105254,
              'safePolicyEntries': 326031,
              'safeFrontierStates': 339682,
              'policyConflicts': 0,
          }
          for field, expected in expected_report.items():
              if report.get(field) != expected:
                  raise RuntimeError(f'Invalid independent audit field {field}: {report.get(field)!r}')

          expected_provenance = {
              'format': 'connect4-chaos-raw-shard-audit-provenance-v2',
              'role': 'red',
              'sourceRun': int(os.environ['SOURCE_RUN']),
              'sourceSha': os.environ['SOURCE_SHA'],
              'sourceConclusion': 'failure',
              'auditorSha': os.environ['AUDIT_SHA'],
              'fromPieces': 14,
              'targetPieces': 16,
              'newRejectedRoots': 0,
              'closureCandidate': True,
          }
          for field, expected in expected_provenance.items():
              if provenance.get(field) != expected:
                  raise RuntimeError(f'Invalid provenance field {field}: {provenance.get(field)!r}')
          source = provenance.get('result', {})
          if source.get('artifactId') != int(os.environ['SOURCE_ARTIFACT_ID']):
              raise RuntimeError('The evidence refers to the wrong result artifact id.')
          if source.get('digest') != os.environ['SOURCE_ARTIFACT_DIGEST'] or source.get('expired') is not False:
              raise RuntimeError('The evidence refers to the wrong or expired result artifact.')
          shards = provenance.get('shards')
          if not isinstance(shards, list) or len(shards) != 64:
              raise RuntimeError('The evidence does not pin exactly 64 raw shards.')
          for index, shard in enumerate(shards):
              if shard.get('name') != f'perfect-chaos-red-16-8020-shard-{index}':
                  raise RuntimeError(f'Unexpected shard provenance at index {index}.')
              if shard.get('expired') is not False:
                  raise RuntimeError(f'Shard {index} is marked expired.')
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', str(shard.get('digest'))):
                  raise RuntimeError(f'Shard {index} has no exact digest.')

          manifest = {}
          for line in (result / 'SHA256SUMS').read_text().splitlines():
              digest, relative = line.split('  ', 1)
              manifest[relative] = digest
          proof = report.get('proofTables', {})
          required_hashes = {
              '14-16.policy.bin': proof.get('policySha256'),
              '14-16.frontier.bin': proof.get('frontierSha256'),
              'new-reject-14.bin': proof.get('newRejectSha256'),
              'reject-14.bin': proof.get('cumulativeRejectSha256'),
          }
          for relative, expected in required_hashes.items():
              if manifest.get(relative) != expected:
                  raise RuntimeError(f'Certified proof-table digest mismatch for {relative}.')

          if published_replay.get('replay') != audited_replay.get('replay'):
              raise RuntimeError('The closure replay was not independently reproduced.')
          segments = audited_replay.get('replay', {}).get('segments')
          if not isinstance(segments, list) or len(segments) != 5:
              raise RuntimeError('The certified replay has the wrong segment count.')
          if segments[0].get('fromPieces') != 0 or segments[-1].get('frontierPieces') != 16:
              raise RuntimeError('The certified replay does not cover the exact 0-to-16 prefix.')

          prepared = result / 'red-prepared'
          assembled = result / 'assembled' / 'red'
          prepared_files = sorted(path.name for path in prepared.iterdir() if path.is_file())
          assembled_files = sorted(path.name for path in assembled.iterdir() if path.is_file())
          if prepared_files != assembled_files:
              raise RuntimeError('The assembled closure file set differs from the prepared closure.')
          for name in prepared_files:
              if (prepared / name).read_bytes() != (assembled / name).read_bytes():
                  raise RuntimeError(f'The assembled closure changed {name}.')

          certificate = {
              'format': 'connect4-chaos-certified-prefix-closure-v1',
              'role': 'red',
              'frontierPieces': 16,
              'cumulativeRejectedRoots': 8020,
              'source': {
                  'run': int(os.environ['SOURCE_RUN']),
                  'sha': os.environ['SOURCE_SHA'],
                  'artifact': os.environ['SOURCE_ARTIFACT'],
                  'artifactId': int(os.environ['SOURCE_ARTIFACT_ID']),
                  'digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              },
              'audit': {
                  'run': int(os.environ['AUDIT_RUN']),
                  'sha': os.environ['AUDIT_SHA'],
                  'artifact': os.environ['AUDIT_ARTIFACT'],
                  'artifactId': int(os.environ['AUDIT_ARTIFACT_ID']),
                  'digest': os.environ['AUDIT_ARTIFACT_DIGEST'],
              },
              'proofTables': proof,
              'replay': {
                  'segments': len(segments),
                  'finalFrontierStates': segments[-1]['frontierStates'],
                  'finalPolicyEntries': segments[-1]['policyEntries'],
                  'sha256': hashlib.sha256((evidence / 'closure-replay.json').read_bytes()).hexdigest(),
              },
          }
          Path('certificate.json').write_text(json.dumps(certificate, indent=2) + '\n')
          print(json.dumps(certificate, indent=2))
          PY

          cp -a result/. certified/
          mkdir -p certified/closure-evidence
          cp -a evidence/. certified/closure-evidence/
          cp certificate.json certified/certificate.json
          rm -f certified/SHA256SUMS
          python3 scripts/perfect-chaos-artifacts.py write --directory certified
          python3 scripts/perfect-chaos-artifacts.py verify --directory certified

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CERTIFIED_ARTIFACT }}
          path: certified
          if-no-files-found: error
          retention-days: 30
