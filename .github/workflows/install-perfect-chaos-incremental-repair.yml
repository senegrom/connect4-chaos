name: Install exact Perfect Chaos incremental segment repair

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-incremental-repair.yml
      - scripts/patch-perfect-chaos-incremental-repair.py
      - tests/perfect-chaos-incremental-repair.test.js

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-incremental-repair
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply the structural repair patch
        run: python3 scripts/patch-perfect-chaos-incremental-repair.py scripts/perfect-chaos-prefix.mjs

      - name: Parse and verify the native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/perfect-chaos-prefix.mjs
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic \
            native/perfect-chaos-prefix.cpp -o /tmp/perfect-chaos-prefix
          /tmp/perfect-chaos-prefix verify
          set +e
          prerequisite_output="$(/tmp/perfect-chaos-prefix partition 2>&1)"
          prerequisite_code=$?
          set -e
          test "$prerequisite_code" -ne 0
          grep -q 'partition requires' <<< "$prerequisite_output"

      - name: Verify no-op and changed-boundary incremental repairs
        run: node --test tests/perfect-chaos-incremental-repair.test.js

      - name: Commit the verified incremental repair command
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs
          if git diff --cached --quiet; then
            echo 'Incremental segment repair is already installed.'
            exit 0
          fi
          git commit -m 'Add exact incremental segment repair for Perfect Chaos'
          git push origin HEAD:agent/perfect-chaos-16-recovery
