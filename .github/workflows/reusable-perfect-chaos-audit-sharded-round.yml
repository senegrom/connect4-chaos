name: Reusable independent Perfect Chaos raw-shard round audit

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      source_run:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_conclusion:
        required: false
        type: string
        default: success
      stage_artifact:
        required: true
        type: string
      shard_prefix:
        required: true
        type: string
      result_artifact:
        required: true
        type: string
      shard_count:
        required: true
        type: number
      from_pieces:
        required: false
        type: number
        default: 14
      target_pieces:
        required: false
        type: number
        default: 16
      audit_artifact:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ROLE: ${{ inputs.role }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_CONCLUSION: ${{ inputs.source_conclusion }}
      STAGE_ARTIFACT: ${{ inputs.stage_artifact }}
      SHARD_PREFIX: ${{ inputs.shard_prefix }}
      RESULT_ARTIFACT: ${{ inputs.result_artifact }}
      SHARD_COUNT: ${{ inputs.shard_count }}
      FROM_PIECES: ${{ inputs.from_pieces }}
      TARGET_PIECES: ${{ inputs.target_pieces }}
      AUDIT_ARTIFACT: ${{ inputs.audit_artifact }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate the audit request
        shell: bash
        run: |
          set -euo pipefail
          test "$ROLE" = 'red' || test "$ROLE" = 'yellow'
          test "$SOURCE_CONCLUSION" = 'success' || test "$SOURCE_CONCLUSION" = 'failure'
          for value in "$SHARD_COUNT" "$FROM_PIECES" "$TARGET_PIECES"; do
            case "$value" in
              ''|*[!0-9]*) echo 'Numeric audit inputs must be integers.' >&2; exit 1 ;;
            esac
          done
          if (( SHARD_COUNT < 1 || SHARD_COUNT > 512 )); then
            echo 'shard_count must be between 1 and 512.' >&2
            exit 1
          fi
          if (( FROM_PIECES < 2 || TARGET_PIECES <= FROM_PIECES || TARGET_PIECES > 42 )); then
            echo 'The requested frontier boundaries are invalid.' >&2
            exit 1
          fi
          test -n "$SOURCE_RUN"
          test -n "$SOURCE_SHA"
          test -n "$STAGE_ARTIFACT"
          test -n "$SHARD_PREFIX"
          test -n "$RESULT_ARTIFACT"
          test -n "$AUDIT_ARTIFACT"

      - name: Pin the exact source run, job outcomes, and artifact set
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha status conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$status" = 'completed'
          test "$conclusion" = "$SOURCE_CONCLUSION"

          if [[ "$SOURCE_CONCLUSION" = 'failure' ]]; then
            gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
              --jq '.jobs[] | [.name, .status, (.conclusion // "")] | @tsv' \
              | sort > /tmp/source-jobs.tsv
            test -s /tmp/source-jobs.tsv
            test "$(awk -F '\t' '$2 != "completed" { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '0'
            test "$(awk -F '\t' '$3 != "success" { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '1'
            test "$(awk -F '\t' '$3 == "failure" && $1 ~ /\/ evidence$/ { count += 1 } END { print count + 0 }' /tmp/source-jobs.tsv)" = '1'
          fi

          gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name, .id, (.digest // ""), .expired] | @tsv' \
            | sort > /tmp/all-artifacts.tsv
          test "$(cut -f1 /tmp/all-artifacts.tsv | grep -Fxc "$STAGE_ARTIFACT" || true)" = '1'
          test "$(cut -f1 /tmp/all-artifacts.tsv | grep -Fxc "$RESULT_ARTIFACT" || true)" = '1'
          test "$(cut -f1 /tmp/all-artifacts.tsv | grep -c "^$SHARD_PREFIX" || true)" = "$SHARD_COUNT"
          : > /tmp/pinned-artifacts.tsv
          grep -F "$STAGE_ARTIFACT"$'\t' /tmp/all-artifacts.tsv >> /tmp/pinned-artifacts.tsv
          grep -F "$RESULT_ARTIFACT"$'\t' /tmp/all-artifacts.tsv >> /tmp/pinned-artifacts.tsv
          for shard in $(seq 0 $((SHARD_COUNT - 1))); do
            name="$SHARD_PREFIX$shard"
            test "$(cut -f1 /tmp/all-artifacts.tsv | grep -Fxc "$name" || true)" = '1'
            grep -F "$name"$'\t' /tmp/all-artifacts.tsv >> /tmp/pinned-artifacts.tsv
          done
          test "$(wc -l < /tmp/pinned-artifacts.tsv | tr -d ' ')" = "$((SHARD_COUNT + 2))"
          while IFS=$'\t' read -r name artifact_id digest expired; do
            case "$artifact_id" in
              ''|*[!0-9]*) echo "Invalid artifact id for $name." >&2; exit 1 ;;
            esac
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$expired" = 'false'
          done < /tmp/pinned-artifacts.tsv
          grep -F "$STAGE_ARTIFACT"$'\t' /tmp/pinned-artifacts.tsv > /tmp/stage.tsv
          grep -F "$RESULT_ARTIFACT"$'\t' /tmp/pinned-artifacts.tsv > /tmp/result.tsv
          grep -F "$SHARD_PREFIX" /tmp/pinned-artifacts.tsv > /tmp/shards.tsv

      - name: Download the stage, every exact shard, and the published result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage stage-audit shards result audit
          mkdir -p stage shards result audit
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$STAGE_ARTIFACT" --dir stage
          for shard in $(seq 0 $((SHARD_COUNT - 1))); do
            gh run download "$SOURCE_RUN" --repo "$REPO" \
              --name "$SHARD_PREFIX$shard" --dir shards
          done
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$RESULT_ARTIFACT" --dir result

      - name: Independently reconstruct all merged proof tables and closure replay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory stage
          python3 scripts/perfect-chaos-artifacts.py verify --directory result

          new=$(node -p "require('./result/campaign-summary.json').newRejectedRoots")
          policy="$FROM_PIECES-$TARGET_PIECES.policy.bin"
          frontier="$FROM_PIECES-$TARGET_PIECES.frontier.bin"
          audit_stage=stage
          closure=false

          if [[ "$new" = '0' ]]; then
            closure=true
            cmp "result/$policy" "result/$ROLE-prepared/$policy"
            cmp "result/$frontier" "result/$ROLE-prepared/$frontier"
            test -d "result/assembled/$ROLE"
            diff -u \
              <(cd "result/$ROLE-prepared" && find . -maxdepth 1 -type f -printf '%P\n' | sort) \
              <(cd "result/assembled/$ROLE" && find . -maxdepth 1 -type f -printf '%P\n' | sort)
            while IFS= read -r relative; do
              cmp "result/$ROLE-prepared/$relative" "result/assembled/$ROLE/$relative"
            done < <(cd "result/$ROLE-prepared" && find . -maxdepth 1 -type f -printf '%P\n' | sort)

            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory result/assembled \
              --role "$ROLE" \
              --frontier-pieces "$TARGET_PIECES" \
              > audit/closure-replay.json
            ROLE="$ROLE" TARGET_PIECES="$TARGET_PIECES" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          role = os.environ['ROLE']
          target = int(os.environ['TARGET_PIECES'])
          published = json.loads(Path(f'result/{role}-{target}-replay.json').read_text())
          audited = json.loads(Path('audit/closure-replay.json').read_text())
          if published.get('replay') != audited.get('replay'):
              raise RuntimeError('Published and independently replayed closure metrics differ.')
          segments = audited.get('replay', {}).get('segments')
          if not isinstance(segments, list) or not segments:
              raise RuntimeError('Independent closure replay has no segments.')
          if segments[0].get('fromPieces') != 0 or segments[-1].get('frontierPieces') != target:
              raise RuntimeError('Independent closure replay does not span the exact requested prefix.')
          PY

            cp -a stage stage-audit
            cp "result/$policy" "stage-audit/$ROLE/$policy"
            cp "result/$frontier" "stage-audit/$ROLE/$frontier"
            rm -f stage-audit/SHA256SUMS
            python3 scripts/perfect-chaos-artifacts.py write --directory stage-audit
            python3 scripts/perfect-chaos-artifacts.py verify --directory stage-audit
            audit_stage=stage-audit
          else
            test ! -e "result/$ROLE-prepared/$policy"
            test ! -e "result/$ROLE-prepared/$frontier"
            test ! -e result/assembled
            test ! -e "result/$ROLE-$TARGET_PIECES-replay.json"
          fi

          python3 scripts/perfect-chaos-audit-sharded-round.py \
            --role "$ROLE" \
            --stage-directory "$audit_stage" \
            --shard-directory shards \
            --result-directory result \
            --shard-count "$SHARD_COUNT" \
            --from-pieces "$FROM_PIECES" \
            --target-pieces "$TARGET_PIECES" \
            --report audit/audit-report.json
          CLOSURE="$closure" NEW_REJECTIONS="$new" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def parse_line(line):
              name, artifact_id, digest, expired = line.split('\t')
              return {
                  'name': name,
                  'artifactId': int(artifact_id),
                  'digest': digest,
                  'expired': expired == 'true',
              }

          stage = parse_line(Path('/tmp/stage.tsv').read_text().rstrip('\n'))
          result = parse_line(Path('/tmp/result.tsv').read_text().rstrip('\n'))
          shard_rows = [
              parse_line(line)
              for line in Path('/tmp/shards.tsv').read_text().splitlines()
          ]
          prefix = os.environ['SHARD_PREFIX']
          shard_rows.sort(key=lambda row: int(row['name'][len(prefix):]))
          closure_replay = Path('audit/closure-replay.json')
          provenance = {
              'format': 'connect4-chaos-raw-shard-audit-provenance-v2',
              'role': os.environ['ROLE'],
              'sourceRun': int(os.environ['SOURCE_RUN']),
              'sourceSha': os.environ['SOURCE_SHA'],
              'sourceConclusion': os.environ['SOURCE_CONCLUSION'],
              'auditorSha': os.environ['GITHUB_SHA'],
              'fromPieces': int(os.environ['FROM_PIECES']),
              'targetPieces': int(os.environ['TARGET_PIECES']),
              'newRejectedRoots': int(os.environ['NEW_REJECTIONS']),
              'closureCandidate': os.environ['CLOSURE'] == 'true',
              'stage': stage,
              'result': result,
              'shards': shard_rows,
          }
          if closure_replay.is_file():
              provenance['closureReplay'] = {
                  'path': closure_replay.name,
                  'bytes': closure_replay.stat().st_size,
                  'sha256': hashlib.sha256(closure_replay.read_bytes()).hexdigest(),
              }
          Path('audit/provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          (cd audit && \
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS && \
            sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AUDIT_ARTIFACT }}
          path: audit
          if-no-files-found: error
          retention-days: 30
