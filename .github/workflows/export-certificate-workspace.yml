name: Export classic certificate workspace

on:
  push:
    branches:
      - agent/perfect-classic-missing-certificates
    paths:
      - .github/workflows/export-certificate-workspace.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package source workspace
        shell: bash
        run: git archive --format=tar.gz --output=workspace.tar.gz HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-certificate-workspace
          path: workspace.tar.gz
          if-no-files-found: error
          retention-days: 7
