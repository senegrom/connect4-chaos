      SOURCE_SHA: '04b248dfb4a1b6b160f5a63107c4b7b9006ee05a'
      STAGE_ARTIFACT: perfect-chaos-yellow-14-round2-staged
      SHARD_PREFIX: perfect-chaos-yellow-16-round2-fixed-shard-
      SHARD_COUNT: '128'
      EXISTING_REJECTIONS: '15378'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Wait for one exact Yellow stage and all 128 exact shard artifacts
