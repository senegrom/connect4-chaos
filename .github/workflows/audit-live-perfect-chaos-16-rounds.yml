            cp result/14-16.frontier.bin result/yellow-prepared/14-16.frontier.bin
            mkdir -p result/assembled
            cp -a result/yellow-prepared result/assembled/yellow
            node scripts/perfect-chaos-prefix.mjs replay-role \
