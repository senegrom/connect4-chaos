          done
          test "$ready" = true
          test "$(grep -Fxc "$STAGE_ARTIFACT" /tmp/yellow-artifacts)" = '1'
          for shard in $(seq 0 127); do
            test "$(grep -Fxc "$SHARD_PREFIX$shard" /tmp/yellow-artifacts)" = '1'
          done

      - name: Download and verify the Yellow preparation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared shards result
          mkdir -p prepared shards result
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$STAGE_ARTIFACT" --dir prepared
          python3 scripts/perfect-chaos-artifacts.py verify --directory prepared
          node - <<'NODE'
          const checkpoint = require('./prepared/checkpoint.json');
          const replay = require('./prepared/yellow-replay.json').replay;
          if (!checkpoint.complete || checkpoint.mode !== 'preparation' || checkpoint.role !== 'yellow') {
