          done
          for shard in $(seq 0 127); do
            test -f "shards/summary-$shard.json"
            test -f "shards/rejected-$shard.bin"
            test -f "shards/policy-$shard.bin"
            test -f "shards/frontier-$shard.bin"
          done

      - name: Hardened Yellow remerge, accounting, and optional closure replay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-merge-classification.py \
            --directory shards \
            --input prepared/yellow/12-14.frontier.bin \
            --role yellow \
            --target-pieces 16 \
            --shard-count 128 \
            --rejected result/new-reject-14.bin \
            --policy result/14-16.policy.bin \
            --frontier result/14-16.frontier.bin \
            --summary result/classification.json
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from perfect_chaos_tables import (
