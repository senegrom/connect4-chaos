            fi
            status=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .status)
            if [[ "$status" == 'completed' ]]; then
              echo "Yellow source completed without the exact artifact set: stage=$stage_count shards=$shard_count." >&2
              exit 1
            fi
