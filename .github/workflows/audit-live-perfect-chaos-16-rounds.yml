        run: |
          set -euo pipefail
          actual_sha=$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$actual_sha" = "$SOURCE_SHA"
          ready=false
          for attempt in $(seq 1 720); do
            gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
              --jq '.artifacts[].name' | sort > /tmp/yellow-artifacts
            stage_count=$(grep -Fxc "$STAGE_ARTIFACT" /tmp/yellow-artifacts || true)
            shard_count=$(grep -c "^$SHARD_PREFIX" /tmp/yellow-artifacts || true)
            if [[ "$stage_count" == '1' && "$shard_count" == "$SHARD_COUNT" ]]; then
              ready=true
