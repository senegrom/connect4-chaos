name: Execute the exact reviewed Chaos journal-cache installer race-safely

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reinstall-perfect-chaos-journal-cache.yml

permissions:
  contents: write

concurrency:
  group: reinstall-perfect-chaos-journal-cache
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      REVIEWED_INSTALLER_COMMIT: 189216be7956855f08b1bb54131b8220437baa8e
      REVIEWED_INSTALLER_BLOB: 3389c7894587ff1571a7a7320ea05e40a01ec8e0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Extract the four exact scripts from the reviewed installer
        shell: bash
        run: |
          set -euo pipefail
          installer=.github/workflows/reinstall-perfect-chaos-journal-cache.yml
          git cat-file -e "$REVIEWED_INSTALLER_COMMIT^{commit}"
          actual="$(git rev-parse "$REVIEWED_INSTALLER_COMMIT:$installer")"
          test "$actual" = "$REVIEWED_INSTALLER_BLOB"
          git show "$REVIEWED_INSTALLER_COMMIT:$installer" \
            > /tmp/reviewed-journal-installer.yml
          grep -F -- 'name: Install exact Chaos journal cache without expression interpolation' \
            /tmp/reviewed-journal-installer.yml

          ruby -ryaml - <<'RUBY'
          document = YAML.safe_load(File.read('/tmp/reviewed-journal-installer.yml'), aliases: true)
          steps = document.fetch('jobs').fetch('install').fetch('steps')
          names = [
            'Rebuild the journal integration from structural anchors',
            'Write permanent executable integration tests',
            'Execute the selector and all release gates',
            'Publish the idempotent journal integration',
          ]
          names.each_with_index do |name, index|
            matches = steps.select { |step| step.is_a?(Hash) && step['name'] == name }
            raise "Expected one reviewed step #{name.inspect}, found #{matches.length}" unless matches.length == 1
            script = matches.first['run']
            raise "Reviewed step #{name.inspect} has no shell script" unless script.is_a?(String) && !script.empty?
            path = format('/tmp/reviewed-installer-%02d.sh', index + 1)
            File.write(path, "#!/usr/bin/env bash\n#{script}", mode: 'w')
            File.chmod(0o700, path)
            warn "Extracted #{name} to #{path}"
          end
          RUBY

          for script in /tmp/reviewed-installer-01.sh \
                        /tmp/reviewed-installer-02.sh \
                        /tmp/reviewed-installer-03.sh \
                        /tmp/reviewed-installer-04.sh; do
            test -f "$script" && test -x "$script"
          done

      - name: Reapply every release gate on latest main until publication wins the race
        shell: bash
        run: |
          set -euo pipefail
          installer=.github/workflows/reinstall-perfect-chaos-journal-cache.yml
          transient=tests/race-safe-journal-installer.test.js

          for attempt in 1 2 3 4 5; do
            echo "Journal installer publication attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            if [[ ! -f "$installer" ]]; then
              echo 'Journal installer is already absent from main; production integration won concurrently.'
              test -f tests/perfect-chaos-journal-cache-workflow.test.js
              grep -F -- 'Restore exact preparation journal from the committed source round' \
                .github/workflows/reusable-perfect-chaos-18-round.yml
              exit 0
            fi
            test ! -L "$installer"

            /tmp/reviewed-installer-01.sh
            /tmp/reviewed-installer-02.sh
            /tmp/reviewed-installer-03.sh

            rm -f "$transient"
            git rm --ignore-unmatch \
              .github/workflows/retrigger-perfect-chaos-prepare-journal.yml \
              .github/workflows/install-immutable-perfect-chaos-journals.yml

            set +e
            /tmp/reviewed-installer-04.sh
            code=$?
            set -e
            if [[ "$code" = 0 ]]; then
              exit 0
            fi
            echo "Publication raced with main (exit $code); rebuilding and retesting latest main." >&2
            sleep $((attempt * 3))
          done
          echo 'Could not publish the journal integration after five complete tested races.' >&2
          exit 1
