name: Install stack-safe Perfect Chaos frontier merging

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/fix-perfect-chaos-large-frontier-merge.yml
      - scripts/patch-perfect-chaos-large-frontier-merge.py

permissions:
  contents: write

concurrency:
  group: fix-perfect-chaos-large-frontier-merge
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install stack-safe frontier accumulation and scale regression
        run: python3 scripts/patch-perfect-chaos-large-frontier-merge.py scripts/perfect-chaos-prefix.mjs

      - name: Verify the full exact driver including a 200,000-state merge
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check scripts/perfect-chaos-prefix.mjs
          node scripts/perfect-chaos-prefix.mjs verify > large-frontier-merge-verification.json
          jq -e '
            .largeFrontierMerge.inputFiles == 2
            and .largeFrontierMerge.inputStates == 200000
            and .largeFrontierMerge.mergedStates == 200000
            and (.incrementalPreparation.repairSummaries | length >= 1)
          ' large-frontier-merge-verification.json >/dev/null

      - name: Commit the verified scale fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs
          if git diff --cached --quiet; then
            echo 'Large-frontier merge fix is already installed.'
            exit 0
          fi
          git commit -m 'Make Perfect Chaos frontier merging stack-safe'
          git push origin HEAD:agent/perfect-chaos-16-recovery

      - name: Upload scale-regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-large-frontier-merge-verification
          path: large-frontier-merge-verification.json
          if-no-files-found: error
          retention-days: 90
