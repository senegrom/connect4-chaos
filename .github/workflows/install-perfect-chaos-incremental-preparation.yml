name: Install incremental Perfect Chaos prepared-prefix synthesis

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-incremental-preparation.yml
      - scripts/patch-perfect-chaos-incremental-preparation.py

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-incremental-preparation
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply prepared-prefix integration patch
        run: python3 scripts/patch-perfect-chaos-incremental-preparation.py scripts/perfect-chaos-prefix.mjs

      - name: Parse the integrated driver
        run: node --check scripts/perfect-chaos-prefix.mjs

      - name: Reproduce full versus incremental small-prefix synthesis
        run: node scripts/perfect-chaos-prefix.mjs verify > incremental-preparation-verification.json

      - name: Require the exact incremental verifier evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .incrementalPreparation.repairSummaries | length >= 1
            and all(.[]; .format == "connect4-chaos-incremental-segment-repair-v1"
              and .status == "safe"
              and .fallbackFullRegeneration == false
              and .repairRoots < .inputRoots)
          ' incremental-preparation-verification.json >/dev/null

      - name: Commit the verified prepared-prefix integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-prefix.mjs
          if git diff --cached --quiet; then
            echo 'Incremental prepared-prefix synthesis is already installed.'
            exit 0
          fi
          git commit -m 'Use incremental repair in Perfect Chaos preparation'
          git push origin HEAD:agent/perfect-chaos-16-recovery

      - name: Upload small exact equivalence evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-incremental-preparation-verification
          path: incremental-preparation-verification.json
          if-no-files-found: error
          retention-days: 90
