name: Reusable fail-closed Perfect Chaos campaign auto-advance

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      from_pieces:
        required: true
        type: number
      target_pieces:
        required: true
        type: number
      state_file:
        required: true
        type: string
      state_workflow:
        required: true
        type: string
      watcher_workflow:
        required: true
        type: string
      expected_run_id:
        required: false
        type: string
        default: ''
      expected_run_sha:
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      ROLE: ${{ inputs.role }}
      FROM_PIECES: ${{ inputs.from_pieces }}
      TARGET_PIECES: ${{ inputs.target_pieces }}
      STATE_FILE: ${{ inputs.state_file }}
      STATE_WORKFLOW: ${{ inputs.state_workflow }}
      WATCHER_WORKFLOW: ${{ inputs.watcher_workflow }}
      EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
      EXPECTED_RUN_SHA: ${{ inputs.expected_run_sha }}

    steps:
      - name: Check out the campaign branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Test the fail-closed transition validator
        run: python3 scripts/test-perfect-chaos-auto-advance.py

      - name: Locate the exact workflow run launched by the current state
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$ROLE" = red || test "$ROLE" = yellow
          case "$FROM_PIECES:$TARGET_PIECES" in
            14:16|16:18) ;;
            *) echo 'Unsupported Perfect Chaos campaign boundary.' >&2; exit 1 ;;
          esac
          case "$STATE_FILE" in
            .campaign/perfect-chaos-16/yellow.json|.campaign/perfect-chaos-18/red.json) ;;
            *) echo 'Unexpected campaign state path.' >&2; exit 1 ;;
          esac
          case "$STATE_WORKFLOW:$WATCHER_WORKFLOW" in
            continue-perfect-chaos-16-state.yml:auto-advance-perfect-chaos-yellow-16.yml) ;;
            continue-perfect-chaos-18-state.yml:auto-advance-perfect-chaos-red-18.yml) ;;
            *) echo 'Unexpected campaign workflow pair.' >&2; exit 1 ;;
          esac
          test -f "$STATE_FILE" && test ! -L "$STATE_FILE"

          state_commit="$(git log -1 --format=%H -- "$STATE_FILE")"
          state_digest="$(sha256sum "$STATE_FILE" | cut -d' ' -f1)"
          label="$(jq -er '.cumulativeRejections | select(type == "number" and floor == . and . > 0)' "$STATE_FILE")"

          if [[ -n "$EXPECTED_RUN_ID" || -n "$EXPECTED_RUN_SHA" ]]; then
            if ! [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ && "$EXPECTED_RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Pinned campaign run identity is incomplete or malformed.' >&2
              exit 1
            fi
            pinned="$(gh api "repos/$REPOSITORY/actions/runs/$EXPECTED_RUN_ID")"
            test "$(jq -r '.path' <<< "$pinned")" = ".github/workflows/$STATE_WORKFLOW"
            test "$(jq -r '.head_branch' <<< "$pinned")" = "$BRANCH"
            test "$(jq -r '.head_sha' <<< "$pinned")" = "$EXPECTED_RUN_SHA"
            run_id="$EXPECTED_RUN_ID"
            run_sha="$EXPECTED_RUN_SHA"
          else
            response=''
            count=0
            for _ in $(seq 1 120); do
              response="$(gh api --method GET \
                "repos/$REPOSITORY/actions/workflows/$STATE_WORKFLOW/runs" \
                -f branch="$BRANCH" -F per_page=100)"
              count="$(jq --arg sha "$state_commit" '[.workflow_runs[] | select(.head_sha == $sha)] | length' <<< "$response")"
              if [[ "$count" = 1 ]]; then
                break
              fi
              if (( count > 1 )); then
                echo "Ambiguous $STATE_WORKFLOW runs at $state_commit: $count." >&2
                exit 1
              fi
              sleep 5
            done
            if [[ "$count" != 1 ]]; then
              echo "No $STATE_WORKFLOW run appeared at $state_commit." >&2
              exit 1
            fi
            run_id="$(jq -r --arg sha "$state_commit" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<< "$response")"
            run_sha="$(jq -r --arg sha "$state_commit" '.workflow_runs[] | select(.head_sha == $sha) | .head_sha' <<< "$response")"
          fi
          remote_state_digest="$(gh api --method GET \
            "repos/$REPOSITORY/contents/$STATE_FILE" -f ref="$run_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d' ' -f1)"
          if [[ "$remote_state_digest" != "$state_digest" ]]; then
            echo 'Pinned exact run does not contain the current campaign-state bytes.' >&2
            exit 1
          fi
          result_artifact="perfect-chaos-${ROLE}-${TARGET_PIECES}-${label}-round"
          evidence_artifact="perfect-chaos-${ROLE}-${TARGET_PIECES}-${label}-evidence"

          {
            echo "run_id=$run_id"
            echo "run_sha=$run_sha"
            echo "state_digest=$state_digest"
            echo "label=$label"
            echo "result_artifact=$result_artifact"
            echo "evidence_artifact=$evidence_artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful completion of the exact audited round
        shell: bash
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_SHA: ${{ steps.source.outputs.run_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 700); do
            response="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")"
            actual_sha="$(jq -r '.head_sha' <<< "$response")"
            status="$(jq -r '.status' <<< "$response")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$response")"
            test "$actual_sha" = "$RUN_SHA"
            if [[ "$status" = completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "Exact campaign run $RUN_ID concluded $conclusion." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "Exact campaign run $RUN_ID did not finish inside the fail-closed continuation window." >&2
          exit 1

      - name: Download the unique producer and independent evidence artifacts
        id: artifacts
        shell: bash
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RESULT_ARTIFACT: ${{ steps.source.outputs.result_artifact }}
          EVIDENCE_ARTIFACT: ${{ steps.source.outputs.evidence_artifact }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > artifact-pages.json
          for name in "$RESULT_ARTIFACT" "$EVIDENCE_ARTIFACT"; do
            count="$(jq --arg name "$name" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length' artifact-pages.json)"
            if [[ "$count" != 1 ]]; then
              echo "Expected one unexpired artifact named $name; found $count." >&2
              exit 1
            fi
          done
          jq --arg name "$RESULT_ARTIFACT" \
            '.[].artifacts[] | select(.name == $name and .expired == false) |
             {id,name,size_in_bytes,digest,created_at,expires_at,workflow_run}' \
            artifact-pages.json > producer-artifact.json
          jq --arg name "$EVIDENCE_ARTIFACT" \
            '.[].artifacts[] | select(.name == $name and .expired == false) |
             {id,name,size_in_bytes,digest,created_at,expires_at,workflow_run}' \
            artifact-pages.json > evidence-artifact.json
          jq -e '.digest | startswith("sha256:")' producer-artifact.json >/dev/null
          jq -e '.digest | startswith("sha256:")' evidence-artifact.json >/dev/null

          rm -rf producer evidence
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$RESULT_ARTIFACT" --dir producer
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$EVIDENCE_ARTIFACT" --dir evidence

      - name: Derive the next state only from matching independently audited bytes
        id: decision
        shell: bash
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_SHA: ${{ steps.source.outputs.run_sha }}
          RESULT_ARTIFACT: ${{ steps.source.outputs.result_artifact }}
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory producer
          (cd evidence && sha256sum --check --strict SHA256SUMS)
          python3 scripts/perfect-chaos-auto-advance.py \
            --state "$STATE_FILE" \
            --round-directory producer \
            --evidence-directory evidence \
            --role "$ROLE" \
            --from-pieces "$FROM_PIECES" \
            --target-pieces "$TARGET_PIECES" \
            --run-id "$RUN_ID" \
            --run-sha "$RUN_SHA" \
            --result-artifact "$RESULT_ARTIFACT" \
            --next-state next-state.json \
            --decision decision.json
          jq --slurpfile producer producer-artifact.json \
             --slurpfile evidence evidence-artifact.json \
             '.artifacts = {producer: $producer[0], independentEvidence: $evidence[0]}' \
             decision.json > published-decision.json
          closed="$(jq -r '.closedCandidate' decision.json)"
          cumulative="$(jq -r '.cumulativeRejectedRoots' decision.json)"
          echo "closed=$closed" >> "$GITHUB_OUTPUT"
          echo "cumulative=$cumulative" >> "$GITHUB_OUTPUT"

      - name: Upload the transition audit
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-${{ inputs.role }}-${{ inputs.target_pieces }}-${{ steps.source.outputs.label }}-auto-advance
          path: |
            decision.json
            published-decision.json
            producer-artifact.json
            evidence-artifact.json
            next-state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Atomically publish the next state or a non-claiming closure candidate
        shell: bash
        env:
          ORIGINAL_STATE_DIGEST: ${{ steps.source.outputs.state_digest }}
          CLOSED: ${{ steps.decision.outputs.closed }}
          CUMULATIVE: ${{ steps.decision.outputs.cumulative }}
        run: |
          set -euo pipefail

          if [[ "$CLOSED" = true ]]; then
            candidate="$(dirname "$STATE_FILE")/closure-candidates/${ROLE}-${CUMULATIVE}.json"
            content="$(base64 -w0 published-decision.json)"
            if current="$(gh api --method GET "repos/$REPOSITORY/contents/$candidate" -f ref="$BRANCH" 2>/dev/null)"; then
              existing="$(jq -r '.content' <<< "$current" | tr -d '\n' | base64 --decode)"
              diff -u <(printf '%s' "$existing") published-decision.json
              echo "Closure candidate $candidate is already recorded byte-identically."
              exit 0
            fi
            gh api --method PUT "repos/$REPOSITORY/contents/$candidate" \
              -f branch="$BRANCH" \
              -f message="Record ${ROLE^} ${TARGET_PIECES}-piece closure candidate at $CUMULATIVE roots" \
              -f content="$content" >/dev/null
            echo "Recorded non-claiming closure candidate $candidate."
            exit 0
          fi

          current="$(gh api --method GET "repos/$REPOSITORY/contents/$STATE_FILE" -f ref="$BRANCH")"
          blob_sha="$(jq -r '.sha' <<< "$current")"
          jq -r '.content' <<< "$current" | tr -d '\n' | base64 --decode > current-state.json
          current_digest="$(sha256sum current-state.json | cut -d' ' -f1)"
          if [[ "$current_digest" != "$ORIGINAL_STATE_DIGEST" ]]; then
            echo 'Campaign state advanced while this gate was running; refusing a stale overwrite.'
            exit 0
          fi
          content="$(base64 -w0 next-state.json)"
          gh api --method PUT "repos/$REPOSITORY/contents/$STATE_FILE" \
            -f branch="$BRANCH" \
            -f message="Continue ${ROLE^} ${TARGET_PIECES}-piece refinement from $CUMULATIVE roots" \
            -f content="$content" \
            -f sha="$blob_sha" >/dev/null
          echo "Advanced $STATE_FILE to $CUMULATIVE cumulative rejected roots."

          before_runs="$(gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/$STATE_WORKFLOW/runs" \
            -f branch="$BRANCH" -F per_page=100 \
            --jq '[.workflow_runs[].id]')"
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$STATE_WORKFLOW" --repo "$REPOSITORY" --ref "$BRANCH" \
            -f state_file="$STATE_FILE"

          next_run_id=''
          next_run_sha=''
          for _ in $(seq 1 120); do
            runs="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$STATE_WORKFLOW/runs" \
              -f branch="$BRANCH" -F per_page=100)"
            candidates="$(jq \
              --argjson before "$before_runs" \
              --arg started "$dispatch_started" \
              '[.workflow_runs[] | select(.event == "workflow_dispatch"
                and (.id as $id | ($before | index($id)) == null)
                and .created_at >= $started)]' <<< "$runs")"
            count="$(jq 'length' <<< "$candidates")"
            if [[ "$count" = 1 ]]; then
              next_run_id="$(jq -r '.[0].id' <<< "$candidates")"
              next_run_sha="$(jq -r '.[0].head_sha' <<< "$candidates")"
              break
            fi
            if (( count > 1 )); then
              echo "Ambiguous dispatched $STATE_WORKFLOW runs: $count." >&2
              exit 1
            fi
            sleep 5
          done
          if [[ -z "$next_run_id" || ! "$next_run_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Dispatched $STATE_WORKFLOW run did not appear." >&2
            exit 1
          fi
          gh workflow run "$WATCHER_WORKFLOW" --repo "$REPOSITORY" --ref "$BRANCH" \
            -f expected_run_id="$next_run_id" \
            -f expected_run_sha="$next_run_sha"
          echo "Dispatched exact run $next_run_id and pinned watcher $WATCHER_WORKFLOW."
