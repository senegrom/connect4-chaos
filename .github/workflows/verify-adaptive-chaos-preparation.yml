# Final verification revision: includes pre-prepare retry and adapted-state dispatch.
name: Verify corrected adaptive Perfect Chaos recovery

on:
  push:
    branches:
      - agent/adaptive-chaos-preparation
    paths:
      - .github/workflows/verify-adaptive-chaos-preparation.yml

permissions:
  contents: write

concurrency:
  group: verify-adaptive-chaos-preparation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run focused fail-closed recovery tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/perfect-chaos-main-supervisor.py \
            scripts/perfect-chaos-main-active-runs.py \
            scripts/perfect-chaos-main-recovery.py \
            scripts/test-perfect-chaos-main-supervisor.py \
            scripts/test-perfect-chaos-main-active-runs.py \
            scripts/test-perfect-chaos-main-recovery.py
          python3 scripts/test-perfect-chaos-main-supervisor.py
          python3 scripts/test-perfect-chaos-main-active-runs.py
          python3 scripts/test-perfect-chaos-main-recovery.py

      - name: Parse and inspect every affected workflow
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true); puts path }' \
            .github/workflows/ci.yml \
            .github/workflows/supervise-perfect-chaos-main.yml \
            .github/workflows/recover-perfect-chaos-main-preparation.yml \
            .github/workflows/verify-adaptive-chaos-preparation.yml
          grep -F "Dispatch the adapted state exactly once" \
            .github/workflows/recover-perfect-chaos-main-preparation.yml
          grep -F "test-perfect-chaos-main-recovery.py" .github/workflows/ci.yml
          grep -F "github.event.workflow_run.conclusion != 'failure'" \
            .github/workflows/supervise-perfect-chaos-main.yml

      - name: Run complete exact and browser release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser

      - name: Publish the corrected verified production branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              'format': 'connect4-chaos-adaptive-preparation-verification-v1',
              'result': 'success',
              'focused': 'success',
              'yaml': 'success',
              'complete': 'success',
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
              'publisher': 'corrected-branch-final-verifier',
          }
          path = Path('.audit/adaptive-chaos-preparation-verification.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-adaptive-chaos-preparation.yml
          git add .audit/adaptive-chaos-preparation-verification.json
          git diff --check --cached
          git commit -m 'Verify corrected adaptive Perfect Chaos recovery'
          git push origin HEAD:agent/adaptive-chaos-preparation
