name: Recover cancelled Perfect Chaos preparation on main

on:
  workflow_run:
    workflows:
      - Continue Perfect Chaos 18-piece refinement on main
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: recover-cancelled-perfect-chaos-main-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CANCELLED_RUN: ${{ github.event.workflow_run.id }}
      CONTINUE_WORKFLOW: continue-perfect-chaos-18-main.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test the fail-closed cancelled-run decision
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-perfect-chaos-main-recovery.py
          python3 scripts/test-perfect-chaos-main-cancelled-recovery.py

      - name: Bind the cancelled run, exact prepare job, and unchanged role state
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/runs/$CANCELLED_RUN" \
            > /tmp/cancelled-run.json
          gh api --method GET \
            "repos/$REPOSITORY/actions/runs/$CANCELLED_RUN/jobs" \
            -f filter=latest -F per_page=100 \
            > /tmp/cancelled-jobs.json
          python3 scripts/perfect-chaos-main-cancelled-recovery.py \
            --run /tmp/cancelled-run.json \
            --jobs /tmp/cancelled-jobs.json \
            --decision /tmp/cancelled-preparation-recovery.json \
            --state-output /tmp/recovered-state.json
          {
            echo "action=$(jq -r '.action' /tmp/cancelled-preparation-recovery.json)"
            echo "role=$(jq -r '.role' /tmp/cancelled-preparation-recovery.json)"
            echo "state=$(jq -r '.statePath' /tmp/cancelled-preparation-recovery.json)"
            echo "expected=$(jq -r '.expectedStateSha256' /tmp/cancelled-preparation-recovery.json)"
            echo "updated=$(jq -r '.updatedStateSha256 // ""' /tmp/cancelled-preparation-recovery.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish an adapted state or terminal cancellation audit
        if: steps.decision.outcome == 'success'
        shell: bash
        env:
          ROLE: ${{ steps.decision.outputs.role }}
          STATE_FILE: ${{ steps.decision.outputs.state }}
          EXPECTED_STATE_SHA256: ${{ steps.decision.outputs.expected }}
          ACTION: ${{ steps.decision.outputs.action }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            test -f "$STATE_FILE" && test ! -L "$STATE_FILE"
            current="$(sha256sum "$STATE_FILE" | cut -d' ' -f1)"
            if [[ "$current" != "$EXPECTED_STATE_SHA256" ]]; then
              echo 'Role state advanced after the cancelled run; refusing stale recovery.'
              exit 0
            fi

            mkdir -p .audit
            cp /tmp/cancelled-preparation-recovery.json \
              ".audit/perfect-chaos-main-cancelled-recovery-$ROLE.json"
            if [[ "$ACTION" = adapted ]]; then
              test -f /tmp/recovered-state.json
              cp /tmp/recovered-state.json "$STATE_FILE"
            fi
            git add .audit "$STATE_FILE"
            if git diff --cached --quiet; then
              exit 0
            fi
            case "$ACTION" in
              adapted)
                shards="$(jq -r '.newProfile.prepareShards' /tmp/cancelled-preparation-recovery.json)"
                workers="$(jq -r '.newProfile.prepareWorkers' /tmp/cancelled-preparation-recovery.json)"
                message="Adapt ${ROLE^} cancelled preparation to $shards shards and $workers workers"
                ;;
              exhausted)
                message="Record exhausted ${ROLE^} cancelled preparation recovery"
                ;;
              stale-state)
                message="Record stale ${ROLE^} cancelled preparation recovery"
                ;;
              *)
                echo "Unsupported cancelled recovery action: $ACTION" >&2
                exit 1
                ;;
            esac
            git commit -m "$message"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the cancelled preparation decision after five races.' >&2
          exit 1

      - name: Dispatch the adapted state exactly once
        if: steps.decision.outputs.action == 'adapted'
        shell: bash
        env:
          ROLE: ${{ steps.decision.outputs.role }}
          STATE_FILE: ${{ steps.decision.outputs.state }}
          UPDATED_STATE_SHA256: ${{ steps.decision.outputs.updated }}
        run: |
          set -euo pipefail
          test "$UPDATED_STATE_SHA256" != ''
          git fetch origin main
          state_commit="$(git log origin/main -1 --format=%H -- "$STATE_FILE")"
          current="$(git show "origin/main:$STATE_FILE" | sha256sum | cut -d' ' -f1)"
          if [[ "$current" != "$UPDATED_STATE_SHA256" ]]; then
            echo 'The adapted state advanced concurrently; no cancellation dispatch is needed.'
            exit 0
          fi

          runs="$(gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/$CONTINUE_WORKFLOW/runs" \
            -f branch=main -F per_page=100)"
          already_active="$(jq \
            --arg state "$STATE_FILE" \
            --arg state_commit "$state_commit" \
            '[.workflow_runs[] | select(
              .status != "completed"
              and (
                (.event == "push" and .head_sha == $state_commit)
                or (.event == "workflow_dispatch" and (.display_title | contains($state)))
              )
            )] | length' <<< "$runs")"
          if (( already_active > 0 )); then
            echo "An active $ROLE continuation already covers the adapted state."
            exit 0
          fi

          before="$(jq '[.workflow_runs[].id]' <<< "$runs")"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$CONTINUE_WORKFLOW" \
            --repo "$REPOSITORY" \
            --ref main \
            -f state_file="$STATE_FILE"

          for _ in $(seq 1 60); do
            response="$(gh api --method GET \
              "repos/$REPOSITORY/actions/workflows/$CONTINUE_WORKFLOW/runs" \
              -f branch=main -F per_page=100)"
            candidates="$(jq \
              --argjson before "$before" \
              --arg started "$started" \
              --arg state "$STATE_FILE" \
              '[.workflow_runs[] | select(
                .event == "workflow_dispatch"
                and (.id as $id | ($before | index($id)) == null)
                and .created_at >= $started
                and (.display_title | contains($state))
              )]' <<< "$response")"
            count="$(jq 'length' <<< "$candidates")"
            if [[ "$count" = 1 ]]; then
              jq '.[0] | {id, head_sha, status, display_title}' <<< "$candidates"
              exit 0
            fi
            if (( count > 1 )); then
              echo "Ambiguous cancellation recovery dispatch for $STATE_FILE: $count runs." >&2
              exit 1
            fi
            sleep 5
          done
          echo 'The cancellation recovery dispatch did not appear.' >&2
          exit 1
