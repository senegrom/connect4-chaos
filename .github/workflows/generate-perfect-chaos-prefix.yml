name: Generate Perfect Chaos prefix

on:
  workflow_dispatch:
    inputs:
      frontier_pieces:
        description: Even piece-count frontier to synthesize (8-36)
        required: true
        default: '12'
        type: string
      maximum_passes:
        description: Maximum counterexample-refinement passes per role
        required: true
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: generate-perfect-chaos-prefix
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Validate request
        id: config
        shell: bash
        run: |
          set -euo pipefail
          frontier='${{ inputs.frontier_pieces }}'
          passes='${{ inputs.maximum_passes }}'
          if ! [[ "$frontier" =~ ^([8-9]|[12][0-9]|3[0-6])$ ]] || (( frontier % 2 != 0 )); then
            echo 'frontier_pieces must be an even integer from 8 through 36.' >&2
            exit 1
          fi
          if ! [[ "$passes" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo 'maximum_passes must be an integer from 1 through 9999.' >&2
            exit 1
          fi
          echo "frontier=$frontier" >> "$GITHUB_OUTPUT"
          echo "passes=$passes" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify solver and synthesize layered certificate
        shell: bash
        run: |
          set -euo pipefail
          npm run chaos:prefix:verify
          output="generated/perfect-chaos-prefix-${{ steps.config.outputs.frontier }}"
          node scripts/perfect-chaos-prefix.mjs generate \
            --frontier-pieces '${{ steps.config.outputs.frontier }}' \
            --maximum-passes '${{ steps.config.outputs.passes }}' \
            --output "$output"
          node scripts/perfect-chaos-prefix.mjs verify-reference \
            --reference "$output/manifest.json"

      - name: Upload generated certificate
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-prefix-${{ steps.config.outputs.frontier }}
          path: generated/perfect-chaos-prefix-${{ steps.config.outputs.frontier }}
          if-no-files-found: error
          retention-days: 30
