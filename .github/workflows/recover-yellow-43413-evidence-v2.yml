name: Recover independently audited Yellow 43,413-root round v2

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/recover-yellow-43413-evidence-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: recover-yellow-perfect-chaos-43413-evidence-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN: '32028068015'
      SOURCE_SHA: '50893d8350e6258cae6d973ce7365da18fd298fd'
      ROLE: yellow
      SHARD_COUNT: '128'
      STAGE_ARTIFACT: perfect-chaos-yellow-14-43413-staged
      SHARD_PREFIX: perfect-chaos-yellow-16-43413-shard-
      RESULT_ARTIFACT: perfect-chaos-yellow-16-43413-round
      RECOVERED_SOURCE_ARTIFACT: perfect-chaos-yellow-16-43715-recovered-round
      RECOVERED_EVIDENCE_ARTIFACT: perfect-chaos-yellow-16-43715-recovered-evidence
      DECISION_ARTIFACT: perfect-chaos-yellow-16-43715-recovery-decision

    steps:
      - name: Check out the current audited tooling
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Bind the failed wrapper run to successful producer jobs and immutable artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            > source-job-pages.json
          gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            > source-artifact-pages.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path('source-run.json').read_text())
          run_id = int(os.environ['SOURCE_RUN'])
          run_sha = os.environ['SOURCE_SHA']
          if run.get('id') != run_id or run.get('head_sha') != run_sha:
              raise RuntimeError('The recovery source run identity does not match.')
          if run.get('path') != '.github/workflows/continue-perfect-chaos-16-state.yml':
              raise RuntimeError('The recovery source is not the Yellow state workflow.')
          if run.get('status') != 'completed' or run.get('conclusion') != 'failure':
              raise RuntimeError('The recovery source is not the expected completed wrapper failure.')

          pages = json.loads(Path('source-job-pages.json').read_text())
          jobs = [job for page in pages for job in page.get('jobs', [])]
          prepare = [job for job in jobs if job.get('name', '').endswith('/ prepare')]
          classify = [job for job in jobs if '/ classify (' in job.get('name', '')]
          merge = [job for job in jobs if job.get('name', '').endswith('/ merge')]
          evidence = [job for job in jobs if job.get('name', '').endswith('/ evidence')]
          if len(prepare) != 1 or prepare[0].get('conclusion') != 'success':
              raise RuntimeError('The exact Yellow preparation was not uniquely successful.')
          if len(classify) != int(os.environ['SHARD_COUNT']):
              raise RuntimeError(f'Expected 128 classifier jobs, found {len(classify)}.')
          if any(job.get('conclusion') != 'success' for job in classify):
              raise RuntimeError('At least one exact Yellow classifier job was not successful.')
          if len(merge) != 1 or merge[0].get('conclusion') != 'success':
              raise RuntimeError('The hardened Yellow merge was not uniquely successful.')
          if len(evidence) != 1 or evidence[0].get('conclusion') != 'failure':
              raise RuntimeError('The expected evidence-packaging failure is absent or ambiguous.')
          bad = [
              {'id': job.get('id'), 'name': job.get('name'), 'conclusion': job.get('conclusion')}
              for job in jobs
              if not job.get('name', '').endswith('/ evidence')
              and job.get('conclusion') != 'success'
          ]
          if bad:
              raise RuntimeError(f'An exact producer job was not successful: {bad!r}')

          pages = json.loads(Path('source-artifact-pages.json').read_text())
          artifacts = [artifact for page in pages for artifact in page.get('artifacts', [])]
          active = [artifact for artifact in artifacts if not artifact.get('expired')]
          expected_shards = {
              f"{os.environ['SHARD_PREFIX']}{index}"
              for index in range(int(os.environ['SHARD_COUNT']))
          }
          expected_names = {
              os.environ['STAGE_ARTIFACT'],
              os.environ['RESULT_ARTIFACT'],
              *expected_shards,
          }
          names = [artifact.get('name') for artifact in active]
          if len(active) != len(expected_names) or set(names) != expected_names:
              raise RuntimeError(
                  f'Producer artifact set differs: count={len(active)}, '
                  f'missing={sorted(expected_names - set(names))}, '
                  f'unexpected={sorted(set(names) - expected_names)}'
              )
          if len(names) != len(set(names)):
              raise RuntimeError('Producer artifact names are not unique.')
          for artifact in active:
              workflow = artifact.get('workflow_run') or {}
              digest = artifact.get('digest')
              if workflow.get('id') != run_id or workflow.get('head_sha') != run_sha:
                  raise RuntimeError(f"Artifact {artifact.get('name')} has the wrong producer identity.")
              if not isinstance(digest, str) or not digest.startswith('sha256:'):
                  raise RuntimeError(f"Artifact {artifact.get('name')} has no SHA-256 digest.")
              if not isinstance(artifact.get('size_in_bytes'), int) or artifact['size_in_bytes'] < 1:
                  raise RuntimeError(f"Artifact {artifact.get('name')} has an invalid size.")

          selected = sorted(
              ({
                  'id': artifact['id'],
                  'name': artifact['name'],
                  'sizeInBytes': artifact['size_in_bytes'],
                  'digest': artifact['digest'],
                  'createdAt': artifact['created_at'],
                  'expiresAt': artifact['expires_at'],
              } for artifact in active),
              key=lambda item: item['name'],
          )
          metadata = {
              'format': 'connect4-chaos-recovered-source-artifacts-v1',
              'run': run_id,
              'runSha': run_sha,
              'wrapperConclusion': run['conclusion'],
              'successfulProducerJobs': {
                  'prepare': prepare[0]['id'],
                  'classifiers': len(classify),
                  'merge': merge[0]['id'],
              },
              'failedPackagingJob': evidence[0]['id'],
              'artifacts': selected,
          }
          Path('source-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Download the exact immutable producer artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.STAGE_ARTIFACT }}
          path: stage
          github-token: ${{ github.token }}
          run-id: 32028068015

      - name: Download all exact classifier shards
        uses: actions/download-artifact@v5
        with:
          pattern: perfect-chaos-yellow-16-43413-shard-*
          path: shards
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 32028068015

      - name: Download the hardened merged result
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: result
          github-token: ${{ github.token }}
          run-id: 32028068015

      - name: Require exact durable file sets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory stage
          python3 scripts/perfect-chaos-artifacts.py verify --directory result
          test "$(find shards -maxdepth 1 -type f -name 'summary-*.json' | wc -l)" = "$SHARD_COUNT"
          test "$(find shards -maxdepth 1 -type f -name 'rejected-*.bin' | wc -l)" = "$SHARD_COUNT"
          test "$(find shards -maxdepth 1 -type f -name 'policy-*.bin' | wc -l)" = "$SHARD_COUNT"
          test "$(find shards -maxdepth 1 -type f -name 'frontier-*.bin' | wc -l)" = "$SHARD_COUNT"
          test "$(find shards -mindepth 1 -maxdepth 1 -type f | wc -l)" = "$((SHARD_COUNT * 4))"
          test "$(find shards -mindepth 1 -maxdepth 1 ! -type f | wc -l)" = 0

      - name: Independently reconstruct all shards and rejection accounting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit decision
          test "$(node -p "require('./result/campaign-summary.json').newRejectedRoots")" -gt 0
          test ! -e result/yellow-16-replay.json
          test ! -e result/assembled

          python3 scripts/perfect-chaos-audit-sharded-round.py \
            --role yellow \
            --stage-directory stage \
            --shard-directory shards \
            --result-directory result \
            --shard-count 128 \
            --from-pieces 14 \
            --target-pieces 16 \
            --report audit/raw-shard-audit.json
          python3 scripts/perfect-chaos-finalize-accounting.py \
            --role yellow \
            --from-pieces 14 \
            --target-pieces 16 \
            --existing stage/yellow/reject-14.bin \
            --discovered result/new-reject-14.bin \
            --classification result/classification.json \
            --cumulative audit/reject-14.bin \
            --campaign-summary audit/campaign-summary.json
          cmp audit/reject-14.bin result/reject-14.bin
          cmp audit/campaign-summary.json result/campaign-summary.json
          cp result/classification.json audit/classification.json
          cp result/new-reject-14.bin audit/new-reject-14.bin
          cp source-metadata.json audit/source-metadata.json
          python3 scripts/perfect-chaos-artifacts.py write --directory audit
          python3 scripts/perfect-chaos-artifacts.py verify --directory audit

          python3 scripts/perfect-chaos-auto-advance.py \
            --state .campaign/perfect-chaos-16/yellow.json \
            --round-directory result \
            --evidence-directory audit \
            --role yellow \
            --from-pieces 14 \
            --target-pieces 16 \
            --run-id "$SOURCE_RUN" \
            --run-sha "$SOURCE_SHA" \
            --result-artifact "$RESULT_ARTIFACT" \
            --next-state decision/producer-next-state.json \
            --decision decision/producer-decision.json

          RECOVERY_RUN="$GITHUB_RUN_ID" RECOVERY_SHA="$GITHUB_SHA" \
            RECOVERED_SOURCE_ARTIFACT="$RECOVERED_SOURCE_ARTIFACT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          decision = json.loads(Path('decision/producer-decision.json').read_text())
          if decision.get('newRejectedRoots') != 302:
              raise RuntimeError(
                  f"Recovered Yellow result has {decision.get('newRejectedRoots')} new roots, expected 302."
              )
          if decision.get('cumulativeRejectedRoots') != 43715 or decision.get('closedCandidate'):
              raise RuntimeError('Recovered Yellow result has inconsistent advancement accounting.')
          recovered_state = dict(decision['nextState'])
          recovered_state.update({
              'sourceRun': int(os.environ['RECOVERY_RUN']),
              'sourceSha': os.environ['RECOVERY_SHA'],
              'sourceArtifact': os.environ['RECOVERED_SOURCE_ARTIFACT'],
          })
          Path('decision/recovered-next-state.json').write_text(
              json.dumps(recovered_state, indent=2) + '\n'
          )
          envelope = {
              'format': 'connect4-chaos-recovered-round-decision-v1',
              'producerDecision': decision,
              'recoveryRun': int(os.environ['RECOVERY_RUN']),
              'recoverySha': os.environ['RECOVERY_SHA'],
              'recoveredSourceArtifact': os.environ['RECOVERED_SOURCE_ARTIFACT'],
              'nextState': recovered_state,
          }
          Path('decision/recovery-decision.json').write_text(json.dumps(envelope, indent=2) + '\n')
          PY

      - name: Upload the independently reconstructed evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECOVERED_EVIDENCE_ARTIFACT }}
          path: audit
          if-no-files-found: error
          retention-days: 90

      - name: Republish the verified result as a successful recovery source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RECOVERED_SOURCE_ARTIFACT }}
          path: result
          if-no-files-found: error
          retention-days: 90

      - name: Upload the fail-closed recovery decision
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DECISION_ARTIFACT }}
          path: decision
          if-no-files-found: error
          retention-days: 90
