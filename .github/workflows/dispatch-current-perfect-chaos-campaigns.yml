name: Dispatch current Perfect Chaos campaign states

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/dispatch-current-perfect-chaos-campaigns.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-current-perfect-chaos-campaigns
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH: agent/perfect-chaos-16-recovery
  WORKFLOW: continue-perfect-chaos-16-state.yml
  RED_STATE: .campaign/perfect-chaos-18/red.json
  RED_STATE_COMMIT: a9448ca3ac8771c571487b740029219006dcd7b7
  YELLOW_STATE: .campaign/perfect-chaos-16/yellow.json
  YELLOW_STATE_COMMIT: 838484729adb4a107639a91de2fa6a3e68024baf

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Resolve or dispatch exact current states
        shell: bash
        run: |
          set -euo pipefail
          workflow_url="repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs"

          list_runs() {
            gh api --method GET "$workflow_url" \
              -f branch="$BRANCH" -F per_page=100
          }

          resolve_push_run() {
            local sha="$1"
            list_runs | jq -r --arg sha "$sha" '
              .workflow_runs
              | map(select(.event == "push" and .head_sha == $sha))
              | sort_by(.id) | last | .id // empty
            '
          }

          dispatch_and_resolve() {
            local state_file="$1"
            local before_file="$2"
            local output_file="$3"
            list_runs | jq -r '.workflow_runs[].id' | sort -n > "$before_file"
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" \
              --ref "$BRANCH" -f state_file="$state_file"
            for _ in $(seq 1 90); do
              list_runs | jq -r '.workflow_runs[].id' | sort -n > /tmp/after-runs
              run_id="$(comm -13 "$before_file" /tmp/after-runs | tail -n1)"
              if [[ -n "$run_id" ]]; then
                echo "$run_id" > "$output_file"
                return 0
              fi
              sleep 2
            done
            echo "Could not resolve dispatched run for $state_file." >&2
            return 1
          }

          red_run="$(resolve_push_run "$RED_STATE_COMMIT")"
          if [[ -z "$red_run" ]]; then
            dispatch_and_resolve "$RED_STATE" /tmp/red-before /tmp/red-run
            red_run="$(cat /tmp/red-run)"
            red_event=workflow_dispatch
          else
            red_event=push
          fi

          yellow_run="$(resolve_push_run "$YELLOW_STATE_COMMIT")"
          if [[ -z "$yellow_run" ]]; then
            dispatch_and_resolve "$YELLOW_STATE" /tmp/yellow-before /tmp/yellow-run
            yellow_run="$(cat /tmp/yellow-run)"
            yellow_event=workflow_dispatch
          else
            yellow_event=push
          fi

          for role in red yellow; do
            eval "run_id=\${${role}_run}"
            eval "event=\${${role}_event}"
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -n \
              --arg role "$role" \
              --argjson run "$run_id" \
              --arg event "$event" \
              --arg headSha "$(jq -r '.head_sha' <<< "$run")" \
              --arg status "$(jq -r '.status' <<< "$run")" \
              --arg conclusion "$(jq -r '.conclusion // ""' <<< "$run")" \
              --arg createdAt "$(jq -r '.created_at' <<< "$run")" \
              '{role:$role,run:$run,event:$event,headSha:$headSha,status:$status,conclusion:$conclusion,createdAt:$createdAt}' \
              > "/tmp/$role.json"
          done
          jq -s '{format:"connect4-chaos-current-campaign-runs-v2",campaigns:.}' \
            /tmp/red.json /tmp/yellow.json > /tmp/current-perfect-chaos-runs.json

      - name: Publish exact current campaign run identities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p .promotion
            cp /tmp/current-perfect-chaos-runs.json .promotion/current-perfect-chaos-runs.json
            git add .promotion/current-perfect-chaos-runs.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Record explicitly dispatched Perfect Chaos runs'
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish explicitly dispatched campaign run identities.' >&2
          exit 1
