name: Verify Red 18-piece bootstrap determinism

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/verify-red-18-bootstrap-determinism.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-red-18-bootstrap-determinism
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FULL_RUN: '31758014522'
      FULL_SHA: a19c166bb39e64095de0a72f3a32d84e557bd34b
      FULL_RESULT: perfect-chaos-red-18-bootstrap-round
      FULL_RESULT_ID: '9204111833'
      FULL_RESULT_DIGEST: sha256:49342fa906b3964c57d8a6b0c1bb85eae162cf7684034793eee92d0bc2e2ea2e
      FULL_EVIDENCE: perfect-chaos-red-18-bootstrap-evidence
      FULL_EVIDENCE_ID: '9204131701'
      FULL_EVIDENCE_DIGEST: sha256:3c5c4e12db5ac8b43cc787f2bc59671d21d244d9be2f31c3c1dc223482538aac
      REUSE_RUN: '31759092213'
      REUSE_SHA: bd29c9effc16bc1d7889e77e8442bcac788851a9
      REUSE_RESULT: perfect-chaos-red-18-bootstrap-reuse-round
      REUSE_RESULT_ID: '9204208998'
      REUSE_RESULT_DIGEST: sha256:a7c4ad4bbc88842f5b1accabf81fd7f39dab152765950d9645cb963593946b40
      REUSE_EVIDENCE: perfect-chaos-red-18-bootstrap-reuse-evidence
      REUSE_EVIDENCE_ID: '9204227883'
      REUSE_EVIDENCE_DIGEST: sha256:48fc5aff76807e285d4e174db890b5d27d5ee0cdf2a553bc145585fb4437cca1
      REPORT_ARTIFACT: perfect-chaos-red-18-bootstrap-determinism-evidence
    steps:
      - uses: actions/checkout@v6

      - name: Pin both successful producer runs and all four artifacts
        shell: bash
        run: |
          set -euo pipefail
          pin_run() {
            local run="$1" sha="$2"
            read -r actual_sha status conclusion < <(
              gh api "repos/$REPO/actions/runs/$run" \
                --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
            )
            test "$actual_sha" = "$sha"
            test "$status" = completed
            test "$conclusion" = success
          }
          pin_artifact() {
            local run="$1" name="$2" expected_id="$3" expected_digest="$4"
            read -r artifact_id digest expired < <(
              gh api --paginate "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name == \"$name\") | [.id, (.digest // \"\"), .expired] | @tsv"
            )
            test "$artifact_id" = "$expected_id"
            test "$digest" = "$expected_digest"
            test "$expired" = false
          }
          pin_run "$FULL_RUN" "$FULL_SHA"
          pin_run "$REUSE_RUN" "$REUSE_SHA"
          pin_artifact "$FULL_RUN" "$FULL_RESULT" "$FULL_RESULT_ID" "$FULL_RESULT_DIGEST"
          pin_artifact "$FULL_RUN" "$FULL_EVIDENCE" "$FULL_EVIDENCE_ID" "$FULL_EVIDENCE_DIGEST"
          pin_artifact "$REUSE_RUN" "$REUSE_RESULT" "$REUSE_RESULT_ID" "$REUSE_RESULT_DIGEST"
          pin_artifact "$REUSE_RUN" "$REUSE_EVIDENCE" "$REUSE_EVIDENCE_ID" "$REUSE_EVIDENCE_DIGEST"

      - name: Download the exact result and evidence pairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf full-result full-evidence reuse-result reuse-evidence report
          mkdir -p full-result full-evidence reuse-result reuse-evidence report
          gh run download "$FULL_RUN" --repo "$REPO" --name "$FULL_RESULT" --dir full-result
          gh run download "$FULL_RUN" --repo "$REPO" --name "$FULL_EVIDENCE" --dir full-evidence
          gh run download "$REUSE_RUN" --repo "$REPO" --name "$REUSE_RESULT" --dir reuse-result
          gh run download "$REUSE_RUN" --repo "$REPO" --name "$REUSE_EVIDENCE" --dir reuse-evidence

      - name: Require exhaustive byte identity and matching independent audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory full-result
          python3 scripts/perfect-chaos-artifacts.py verify --directory reuse-result
          (cd full-evidence && sha256sum --check --strict SHA256SUMS)
          (cd reuse-evidence && sha256sum --check --strict SHA256SUMS)

          compare_tree() {
            local left="$1" right="$2"
            diff -u \
              <(cd "$left" && find . -type f -printf '%P\n' | sort) \
              <(cd "$right" && find . -type f -printf '%P\n' | sort)
            while IFS= read -r relative; do
              cmp "$left/$relative" "$right/$relative"
            done < <(cd "$left" && find . -type f -printf '%P\n' | sort)
          }
          compare_tree full-result reuse-result
          compare_tree full-evidence reuse-evidence

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          full_summary = json.loads(Path('full-result/campaign-summary.json').read_text())
          reuse_summary = json.loads(Path('reuse-result/campaign-summary.json').read_text())
          full_audit = json.loads(Path('full-evidence/raw-shard-audit.json').read_text())
          reuse_audit = json.loads(Path('reuse-evidence/raw-shard-audit.json').read_text())
          if full_summary != reuse_summary:
              raise RuntimeError('The two campaign summaries differ.')
          if full_audit != reuse_audit:
              raise RuntimeError('The two independent raw-shard audits differ.')

          required_summary = {
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'inputRoots': 339682,
              'existingRejectedRoots': 0,
              'newRejectedRoots': 16242,
              'cumulativeRejectedRoots': 16242,
              'safeInputRoots': 323440,
              'safePolicyEntries': 916002,
              'safeFrontierStates': 868295,
              'classificationComplete': True,
              'policyConflicts': 0,
          }
          for field, expected in required_summary.items():
              if full_summary.get(field) != expected:
                  raise RuntimeError(f'Unexpected summary field {field}: {full_summary.get(field)!r}')

          required_audit = {
              'format': 'connect4-chaos-independent-sharded-round-audit-v1',
              'status': 'pass',
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'shards': 256,
              'inputRoots': 339682,
              'existingRejectedRoots': 0,
              'newRejectedRoots': 16242,
              'cumulativeRejectedRoots': 16242,
              'safeInputRoots': 323440,
              'safePolicyEntries': 916002,
              'safeFrontierStates': 868295,
              'policyConflicts': 0,
          }
          for field, expected in required_audit.items():
              if full_audit.get(field) != expected:
                  raise RuntimeError(f'Unexpected audit field {field}: {full_audit.get(field)!r}')

          proof_files = [
              'new-reject-16.bin',
              'reject-16.bin',
              '16-18.policy.bin',
              '16-18.frontier.bin',
              'classification.json',
              'campaign-summary.json',
          ]
          hashes = {
              relative: hashlib.sha256(Path('full-result', relative).read_bytes()).hexdigest()
              for relative in proof_files
          }
          report = {
              'format': 'connect4-chaos-cross-run-determinism-v1',
              'status': 'pass',
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'fullRebuild': {
                  'run': int(os.environ['FULL_RUN']),
                  'sha': os.environ['FULL_SHA'],
                  'resultArtifact': os.environ['FULL_RESULT'],
                  'resultArtifactId': int(os.environ['FULL_RESULT_ID']),
                  'resultDigest': os.environ['FULL_RESULT_DIGEST'],
                  'evidenceArtifact': os.environ['FULL_EVIDENCE'],
                  'evidenceArtifactId': int(os.environ['FULL_EVIDENCE_ID']),
                  'evidenceDigest': os.environ['FULL_EVIDENCE_DIGEST'],
              },
              'prefixReuse': {
                  'run': int(os.environ['REUSE_RUN']),
                  'sha': os.environ['REUSE_SHA'],
                  'resultArtifact': os.environ['REUSE_RESULT'],
                  'resultArtifactId': int(os.environ['REUSE_RESULT_ID']),
                  'resultDigest': os.environ['REUSE_RESULT_DIGEST'],
                  'evidenceArtifact': os.environ['REUSE_EVIDENCE'],
                  'evidenceArtifactId': int(os.environ['REUSE_EVIDENCE_ID']),
                  'evidenceDigest': os.environ['REUSE_EVIDENCE_DIGEST'],
              },
              'resultTreesByteIdentical': True,
              'evidenceTreesByteIdentical': True,
              'summary': full_summary,
              'audit': full_audit,
              'proofFileSha256': hashes,
          }
          Path('report/determinism-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          cp full-result/SHA256SUMS report/full-result-SHA256SUMS
          cp full-evidence/SHA256SUMS report/full-evidence-SHA256SUMS
          (cd report && sha256sum determinism-report.json full-result-SHA256SUMS full-evidence-SHA256SUMS > SHA256SUMS && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_ARTIFACT }}
          path: report
          if-no-files-found: error
          retention-days: 30
