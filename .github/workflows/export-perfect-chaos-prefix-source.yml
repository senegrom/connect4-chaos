name: Export Perfect Chaos prefix source

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/export-perfect-chaos-prefix-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-prefix-source
          path: |
            scripts/perfect-chaos-prefix.mjs
            scripts/perfect-chaos-classify.py
            scripts/perfect-chaos-merge-classification.py
            scripts/perfect_chaos_tables.py
            native/perfect-chaos-prefix.cpp
            tests/perfect-chaos-classification.test.js
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
