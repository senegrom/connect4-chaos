name: Correct Perfect Chaos prefix rollback

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/export-perfect-chaos-prefix-source.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Correct the root rollback path and verify it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/perfect-chaos-prefix.mjs)" = 8ca1becbcda54b0b8d717e0a09a19da7daa6cb62
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/perfect-chaos-prefix.mjs')
          text = path.read_text()
          old = '''    let inputFrontier = from === reusable.through
                ? reusable.inputFrontier
                : (() => {
                  const index = preparedBoundaries.indexOf(from);
                  const previous = index <= 0 ? 0 : preparedBoundaries[index - 1];
                  return join(roleDirectory, `${previous}-${from}.frontier.bin`);
                })();
          '''
          old = old.replace('          ', '')
          new = '''    let inputFrontier = from === 0
                ? null
                : from === reusable.through
                  ? reusable.inputFrontier
                  : (() => {
                    const index = preparedBoundaries.indexOf(from);
                    if (index < 0) throw new Error(`Unknown prepared boundary: ${from}.`);
                    const previous = index === 0 ? 0 : preparedBoundaries[index - 1];
                    return join(roleDirectory, `${previous}-${from}.frontier.bin`);
                  })();
          '''
          new = new.replace('          ', '')
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one rollback block')
          path.write_text(text.replace(old, new))
          PY
          test "$(git hash-object scripts/perfect-chaos-prefix.mjs)" = 4716d75f92d4e161adff0f76bd686d1c9632c0ec
          node --check scripts/perfect-chaos-prefix.mjs
          node scripts/perfect-chaos-prefix.mjs verify > /tmp/reuse-proof.json
          test "$(node -p "require('/tmp/reuse-proof.json').prefixReuse.unchangedThrough")" = 6
          test "$(node -p "require('/tmp/reuse-proof.json').prefixReuse.invalidatedThrough")" = 4
          git add scripts/perfect-chaos-prefix.mjs
          test "$(git diff --cached --name-only)" = scripts/perfect-chaos-prefix.mjs
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'Handle full Perfect Chaos prefix rollback'
          git push origin HEAD:refs/heads/agent/perfect-chaos-16-recovery
