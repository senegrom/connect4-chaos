name: Harden Perfect Classic artifact downloader

on:
  push:
    branches:
      - agent/perfect-classic-artifact-verification
    paths:
      - .github/workflows/harden-perfect-classic-artifact-downloader.yml

permissions:
  contents: write

concurrency:
  group: harden-perfect-classic-artifact-downloader
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-artifact-verification
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Patch redirect handling and add a durable regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/perfect-classic-download-fragments.py')
          text = script_path.read_text()
          old = '''    request = urllib.request.Request(
                  artifact["archiveUrl"],
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=300) as source:
                      return copy_stream(source, destination)
              except urllib.error.URLError as error:
                  fail(
                      f"Could not download artifact {artifact['name']} "
                      f"({artifact['id']}): {error}"
                  )
          '''
          new = '''    request = urllib.request.Request(
                  artifact["archiveUrl"],
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: N802
                      return None

              try:
                  opener = urllib.request.build_opener(NoRedirect)
                  try:
                      opener.open(request, timeout=60)
                  except urllib.error.HTTPError as redirect:
                      if redirect.code not in {301, 302, 303, 307, 308}:
                          raise
                      signed_url = redirect.headers.get("Location")
                  else:
                      fail(
                          f"Artifact {artifact['name']} ({artifact['id']}) download API "
                          "did not return a signed redirect"
                      )
                  if not isinstance(signed_url, str) or not signed_url.startswith("https://"):
                      fail(
                          f"Artifact {artifact['name']} ({artifact['id']}) returned an "
                          "unsafe signed archive URL"
                      )
                  signed_request = urllib.request.Request(
                      signed_url,
                      headers={
                          "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                      },
                  )
                  # Deliberately omit Authorization on the cross-origin signed URL.
                  with urllib.request.urlopen(signed_request, timeout=300) as source:
                      return copy_stream(source, destination)
              except urllib.error.URLError as error:
                  fail(
                      f"Could not download artifact {artifact['name']} "
                      f"({artifact['id']}): {error}"
                  )
          '''
          if old not in text:
              raise RuntimeError('Could not locate the authenticated artifact download block.')
          text = text.replace(old, new, 1)
          old_path = '''    if not name or "\\x00" in name or "\\\\" in name:
                  fail(f"Unsafe ZIP entry name: {name!r}")
          '''
          new_path = '''    if not name or "\\x00" in name or "\\\\" in name or "//" in name:
                  fail(f"Unsafe ZIP entry name: {name!r}")
          '''
          if old_path not in text:
              raise RuntimeError('Could not locate the ZIP-entry name guard.')
          script_path.write_text(text.replace(old_path, new_path, 1), newline='\n')

          test_path = Path('tests/perfect-classic-download-fragments.test.js')
          tests = test_path.read_text()
          guard = '''\n
test('authenticated archive redirects never forward the GitHub token', () => {
            const source = readFileSync(SCRIPT, 'utf8');
            assert.match(source, /class NoRedirect/);
            assert.match(source, /Deliberately omit Authorization on the cross-origin signed URL/);
            const signedBlock = source.slice(
              source.indexOf('signed_request = urllib.request.Request('),
              source.indexOf('with urllib.request.urlopen(signed_request'),
            );
            assert.doesNotMatch(signedBlock, /Authorization/);
          });
          '''
          if "authenticated archive redirects never forward the GitHub token" in tests:
              raise RuntimeError('Redirect regression guard already exists unexpectedly.')
          test_path.write_text(tests + guard, newline='\n')
          PY

      - name: Verify the hardened downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/perfect-classic-download-fragments.py
          node --test tests/perfect-classic-download-fragments.test.js
          npm test
          git diff --check

      - name: Publish the tested hardening and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-perfect-classic-artifact-downloader.yml
          git add scripts/perfect-classic-download-fragments.py \
                  tests/perfect-classic-download-fragments.test.js
          git commit -m 'Do not forward tokens across artifact redirects'
          git push origin HEAD:agent/perfect-classic-artifact-verification
