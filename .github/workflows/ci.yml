name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check and test
        run: npm run ci

      - name: Test campaign auto-advance gate
        run: python3 scripts/test-perfect-chaos-auto-advance.py

      - name: Browser smoke
        run: npm run test:browser
