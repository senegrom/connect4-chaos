name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Check and test
        run: npm run ci

      - name: Test generic closure certification
        run: python3 scripts/test-perfect-chaos-certify-closure.py

      - name: Browser smoke
        run: npm run test:browser

  training-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Training defaults, holdout, mirror publication and sample bounds
        run: |
          python -m neural.test_review
          python -m neural.test_rereview
          python -m neural.test_optimizations
      - name: Existing environment, repetition and driver regressions
        run: |
          python -m neural.test_gpu_env
          python -c "from neural.test_gpu_mcts import test_repetition; test_repetition('cpu')"
          python -m neural.test_modal_loop

  native-concurrency:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run both native solvers under ThreadSanitizer
        run: python3 scripts/test-native-concurrency.py --sanitize

  browser-regressions:
    uses: ./.github/workflows/browser-regressions.yml

  security-regressions:
    uses: ./.github/workflows/security-regressions.yml

  pages:
    needs: [test, training-regressions, native-concurrency, browser-regressions, security-regressions]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Temporary: remove this job after the audited branch retirement completes.
  retire-audited-branches:
    if: github.repository == 'senegrom/connect4-chaos' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Preserve staging records and retire unchanged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          repository = 'senegrom/connect4-chaos'
          candidates = [['codex/neural-runtime-memory', 'be90429ab59d2f6bcadf36d413a675880f868adc', None], ['codex/neural-safari-recovery', '4bcc95a34e1d28ae04e31d3e55a9eeb34fa0be2c', None], ['training-opt-staging', 'bc001cca5fc54edcfadb324e6f50e2fea81d69c4', None], ['ui-final-staging', '67db5ada96ccafcf7252982786756d687e3530fa', None]]
          import json, os, subprocess, urllib.parse, urllib.request

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          assert os.environ['GITHUB_REPOSITORY'] == repository
          leases, refspecs = [], []
          for branch, expected, archive in candidates:
              ref = 'refs/heads/' + branch
              current = git('ls-remote', '--refs', 'origin', ref)
              if not current:
                  print('Already retired:', branch)
                  continue
              assert current.split() == [expected, ref], 'Branch advanced: ' + branch
              query = urllib.parse.urlencode({'state': 'open', 'head': repository.split('/')[0] + ':' + branch, 'per_page': 100})
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/pulls?' + query,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  prs = json.load(response)
              assert isinstance(prs, list) and not prs, 'Branch has an open PR: ' + branch
              git('fetch', '--no-tags', 'origin', expected)
              if archive:
                  tag = 'refs/tags/' + archive
                  existing = git('ls-remote', '--refs', 'origin', tag)
                  if existing:
                      assert existing.split() == [expected, tag], 'Archive tag differs: ' + archive
                  else:
                      leases.append('--force-with-lease=' + tag + ':')
                      refspecs.append(expected + ':' + tag)
              else:
                  subprocess.run(['git', 'merge-base', '--is-ancestor', expected, 'HEAD'], check=True)
              leases.append('--force-with-lease=' + ref + ':' + expected)
              refspecs.append(':' + ref)
              print('Retire verified branch:', branch, expected, 'archive:', archive or 'already in default history')
          if refspecs:
              subprocess.run(['git', 'push', '--atomic', *leases, 'origin', *refspecs], check=True)
