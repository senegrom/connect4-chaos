name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        # No dependency needs an install script; skipping them keeps a
        # compromised release of any of them from running code in CI.
        run: npm ci --ignore-scripts

      - name: Check and test
        run: npm run ci
        env:
          # The network is no longer committed, and tests/neural-model.test.js
          # - the only test that runs the real network through the real search
          # - skips itself when it cannot find one. Letting it fetch from R2
          # keeps that coverage instead of losing it silently to a skip.
          NEURAL_MODEL_DOWNLOAD: '1'

      - name: Browser smoke
        # Served from the assembled Pages artifact rather than the checkout,
        # so a file the site needs but the artifact omits fails here instead
        # of returning 404 only on the live site.
        run: |
          bash scripts/build-site.sh _site
          BROWSER_SMOKE_ROOT=_site npm run test:browser

  # The shipped network and the batched search the page runs on it, scored on
  # positions where exactly one move keeps a proved win. It needs the 106 MB
  # model and a few minutes of inference, so it is a job of its own rather
  # than part of `npm test`.
  neural-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        # As in the test job: no dependency needs an install script.
        run: npm ci --ignore-scripts

      - name: Only-winning-move benchmark
        # Here a missing model fails the benchmark rather than skipping it;
        # require-no-skips holds the run to that, so it can never pass green
        # having measured nothing.
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=node-test.tap tests/strength/neural-strength.mjs && node scripts/require-no-skips.mjs node-test.tap
        env:
          NEURAL_MODEL_DOWNLOAD: '1'

  training-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          pip install -r neural/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Training defaults, holdout, mirror publication and sample bounds
        run: |
          python -m neural.test_review
          python -m neural.test_rereview
          python -m neural.test_optimizations
          python -m neural.test_training_recovery
          python -m neural.test_training_safety
          python -m neural.test_export_onnx
          python -m neural.test_search_quality
          python -m neural.test_search_settings
          python -m neural.test_pair_tables
          python -m neural.test_replay_staging
          python -m neural.test_checkpoint_lineage
          python -m neural.test_soup_replay
      - name: Existing environment, repetition and driver regressions
        run: |
          python -m neural.test_gpu_env
          python -c "from neural.test_gpu_mcts import test_repetition; test_repetition('cpu')"
          python -m neural.test_modal_loop
          python -m neural.test_modal_control
          python -m neural.test_modal_review
          python -m neural.test_modal_arena
          python -m neural.test_arena
          python -m neural.test_search_history

  native-portability:
    uses: ./.github/workflows/native-portability.yml

  native-concurrency:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run both native solvers under ThreadSanitizer
        run: python3 scripts/test-native-concurrency.py --sanitize

  browser-regressions:
    uses: ./.github/workflows/browser-regressions.yml

  security-regressions:
    uses: ./.github/workflows/security-regressions.yml

  # A local reusable workflow verifies this exact commit before publication.
  classic-policies:
    uses: ./.github/workflows/verify-perfect-classic-policies.yml

  # The committed Chaos prefix certificate is replayed on every run, so a
  # prefix the replay rejects can never reach Pages.
  chaos-prefix:
    uses: ./.github/workflows/verify-perfect-chaos-prefix.yml

  pages:
    needs: [test, neural-strength, training-regressions, native-concurrency, native-portability, browser-regressions, security-regressions, classic-policies, chaos-prefix]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
