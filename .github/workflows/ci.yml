name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Check and test
        run: npm run ci

      - name: Test generic closure certification
        run: python3 scripts/test-perfect-chaos-certify-closure.py

      - name: Browser smoke
        run: npm run test:browser

  training-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Training defaults, holdout, mirror publication and sample bounds
        run: |
          python -m neural.test_review
          python -m neural.test_rereview
          python -m neural.test_optimizations
      - name: Existing environment, repetition and driver regressions
        run: |
          python -m neural.test_gpu_env
          python -c "from neural.test_gpu_mcts import test_repetition; test_repetition('cpu')"
          python -m neural.test_modal_loop

  native-concurrency:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run both native solvers under ThreadSanitizer
        run: python3 scripts/test-native-concurrency.py --sanitize

  browser-regressions:
    uses: ./.github/workflows/browser-regressions.yml

  security-regressions:
    uses: ./.github/workflows/security-regressions.yml

  pages:
    needs: [test, training-regressions, native-concurrency, browser-regressions, security-regressions]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
