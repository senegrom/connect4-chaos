name: Install reproducible Perfect Chaos checkpoint tooling

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/install-perfect-chaos-checkpoint-tool.yml

permissions:
  contents: write

concurrency:
  group: install-perfect-chaos-checkpoint-tool
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply and validate checkpoint tooling
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/checkpoint-tool.patch
          git apply --check /tmp/checkpoint-tool.patch
          git apply /tmp/checkpoint-tool.patch
          python3 -m py_compile scripts/*.py
          node --test tests/perfect-chaos-artifacts.test.js tests/perfect-chaos-classification.test.js

      - name: Commit the validated tooling and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git rm .github/workflows/install-perfect-chaos-checkpoint-tool.yml
          git add scripts/perfect-chaos-artifacts.py tests/perfect-chaos-artifacts.test.js
          git commit -m 'Automate Perfect Chaos checkpoint registration'
          git push origin HEAD:agent/perfect-chaos-16-recovery
