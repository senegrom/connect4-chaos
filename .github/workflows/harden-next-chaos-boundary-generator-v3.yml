name: Verify compositional later-boundary generation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-next-chaos-boundary-generator-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harden-next-chaos-boundary-generator-v3
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Wait for the installed generator hardening
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            git fetch origin main
            if git cat-file -e origin/main:scripts/perfect-chaos-next-boundary.py 2>/dev/null \
              && git cat-file -e origin/main:tests/perfect-chaos-next-boundary-hardening.test.js 2>/dev/null; then
              git reset --hard origin/main
              exit 0
            fi
            sleep 30
          done
          exit 1

      - run: npm ci

      - name: Preserve prior layers while adding exactly one new layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/perfect-chaos-next-boundary.py')
          text = path.read_text()
          anchor = '''              replacements: list[tuple[str, str]] = []

              # Replace combined and delimited identities through placeholders
'''
          insertion = '''              replacements: list[tuple[str, str]] = []

              # Layer history is compositional. The predecessor's existing
              # final segment remains the generated anchor, while the old new
              # segment becomes the next predecessor and a fresh segment is
              # added. Placeholders prevent cascading replacements.
              pair_forms = [
                  (f'{previous - 2}-{previous}', f'{previous}-{current}'),
                  (f'{previous}-{current}', f'{current}-{target}'),
                  (
                      f'fromBoundary: {previous - 2}, boundary: {previous}',
                      f'fromBoundary: {previous}, boundary: {current}',
                  ),
                  (
                      f'fromBoundary: {previous}, boundary: {current}',
                      f'fromBoundary: {current}, boundary: {target}',
                  ),
              ]
              for index, (old, new) in enumerate(pair_forms):
                  marker = f'__C4_LAYER_PAIR_{index}__'
                  text = text.replace(old, marker)
                  replacements.append((marker, new))

              old_boundaries = list(range(8, current + 1, 2))
              new_boundaries = [*old_boundaries, target]
              for compact in (False, True):
                  separator = ',' if compact else ', '
                  old = '[' + separator.join(str(value) for value in old_boundaries) + ']'
                  new = '[' + separator.join(str(value) for value in new_boundaries) + ']'
                  marker = f'__C4_BOUNDARY_LIST_{int(compact)}__'
                  text = text.replace(old, marker)
                  replacements.append((marker, new))

              # Replace combined and delimited identities through placeholders
'''
          if '__C4_LAYER_PAIR_' not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError('Could not install compositional layer transforms.')
              text = text.replace(anchor, insertion, 1)

          text = text.replace(
              "                  'existingBoundary', 'preparedFrontier',\n",
              "                  'existingBoundary', 'preparedFrontier',\n"
              "                  'sourceBoundary', 'inputBoundary',\n",
              1,
          ) if "'sourceBoundary', 'inputBoundary'" not in text else text
          text = text.replace(
              "                  'targetBoundary', 'target_boundary', 'target-boundary',\n",
              "                  'targetBoundary', 'target_boundary', 'target-boundary',\n"
              "                  'targetFrontier',\n",
              1,
          ) if "'targetFrontier'," not in text else text

          validation_anchor = '''                  if source_name == f'continue-perfect-chaos-{current}-main.yml':
                      if f'.campaign/perfect-chaos-main-{target}' not in content:
                          fail('Generated continuation does not bind the target campaign directory.')
'''
          validation_replacement = validation_anchor + '''                  if source_name == f'promote-perfect-chaos-{current}.yml':
                      required = (
                          f"fromBoundary: {previous}, boundary: {current}",
                          f"fromBoundary: {current}, boundary: {target}",
                          f"{previous}-{current}.policy.bin",
                          f"{current}-{target}.policy.bin",
                          '[' + ', '.join(str(value) for value in range(8, target + 1, 2)) + ']',
                      )
                      missing = [needle for needle in required if needle not in content]
                      if missing:
                          fail(f'Generated promoter lost compositional layer history: {missing}')
'''
          if 'Generated promoter lost compositional layer history' not in text:
              if text.count(validation_anchor) != 1:
                  raise RuntimeError('Could not add generated promoter semantics validation.')
              text = text.replace(validation_anchor, validation_replacement, 1)
          path.write_text(text, newline='\n')
          PY

          cat > tests/perfect-chaos-next-boundary-composition.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mkdtempSync, mkdirSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';

          const ROOT = fileURLToPath(new URL('..', import.meta.url));
          const GENERATOR = join(ROOT, 'scripts', 'perfect-chaos-next-boundary.py');

          test('generation retains the predecessor segment and appends one new segment', () => {
            const temporary = mkdtempSync(join(tmpdir(), 'c4-next-composition-'));
            try {
              const workflows = join(temporary, '.github', 'workflows');
              mkdirSync(workflows, { recursive: true });
              const names = [
                'start-perfect-chaos-18-from-main.yml',
                'advance-perfect-chaos-18-main-bootstrap.yml',
                'continue-perfect-chaos-18-main.yml',
                'reusable-perfect-chaos-18-round.yml',
                'reusable-perfect-chaos-18-evidenced-round.yml',
              ];
              const common = `name: Exact 18-piece\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo .campaign/perfect-chaos-main-18 --from-pieces 16 --target-pieces 18\n`;
              for (const name of names) writeFileSync(join(workflows, name), common);
              writeFileSync(
                join(workflows, 'promote-perfect-chaos-18.yml'),
                `name: Promote 18-piece\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: |\n          echo '[8, 10, 12, 14, 16, 18]'\n          echo "fromBoundary: 14, boundary: 16, file: '14-16.policy.bin'"\n          echo "fromBoundary: 16, boundary: 18, file: '16-18.policy.bin'"\n          echo .campaign/perfect-chaos-main-18\n`,
              );
              const output = join(temporary, 'generated');
              const result = spawnSync('python3', [
                GENERATOR, '--root', temporary, '--source-boundary', '18',
                '--target-boundary', '20', '--output', output,
                '--report', join(temporary, 'report.json'), '--write',
              ], { encoding: 'utf8' });
              assert.equal(result.status, 0, result.stderr);
              const promoter = readFileSync(join(output, 'promote-perfect-chaos-20.yml'), 'utf8');
              assert.match(promoter, /\[8, 10, 12, 14, 16, 18, 20\]/);
              assert.match(promoter, /fromBoundary: 16, boundary: 18, file: '16-18\.policy\.bin'/);
              assert.match(promoter, /fromBoundary: 18, boundary: 20, file: '18-20\.policy\.bin'/);
              assert.doesNotMatch(promoter, /fromBoundary: 14, boundary: 16/);
            } finally {
              rmSync(temporary, { recursive: true, force: true });
            }
          });
          EOF

          python3 -m py_compile scripts/perfect-chaos-next-boundary.py
          node --check tests/perfect-chaos-next-boundary-composition.test.js
          git diff --check

      - name: Prove the real generated promoter is compositional
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/compositional-perfect-chaos-20
          python3 scripts/perfect-chaos-next-boundary.py \
            --root . --source-boundary 18 --target-boundary 20 \
            --output /tmp/compositional-perfect-chaos-20 \
            --report /tmp/compositional-perfect-chaos-20.json --write
          promoter=/tmp/compositional-perfect-chaos-20/promote-perfect-chaos-20.yml
          grep -F -- '[8, 10, 12, 14, 16, 18, 20]' "$promoter"
          grep -F -- "fromBoundary: 16, boundary: 18, file: '16-18.policy.bin'" "$promoter"
          grep -F -- "fromBoundary: 18, boundary: 20, file: '18-20.policy.bin'" "$promoter"
          grep -F -- 'data/perfect-chaos-prefix/red/18-20.policy.bin' "$promoter"
          grep -F -- '--frontier-pieces 20' "$promoter"
          grep -F -- '--shard-from-pieces 18' "$promoter"
          continue_name="$(sed -n 's/^name:[[:space:]]*//p' /tmp/compositional-perfect-chaos-20/continue-perfect-chaos-20-main.yml | head -1)"
          grep -F -- "      - $continue_name" "$promoter"
          while read -r name; do
            ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' "/tmp/compositional-perfect-chaos-20/$name"
          done < <(jq -r '.generated[].destination' /tmp/compositional-perfect-chaos-20.json)
          node --test \
            tests/perfect-chaos-next-boundary.test.js \
            tests/perfect-chaos-next-boundary-hardening.test.js \
            tests/perfect-chaos-next-boundary-composition.test.js

      - name: Run complete release gates
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish the compositional generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/harden-next-chaos-boundary-generator-v3.yml
          git add scripts/perfect-chaos-next-boundary.py \
                  tests/perfect-chaos-next-boundary-composition.test.js
          git commit -m 'Extend later Chaos campaigns compositionally'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              node --test tests/perfect-chaos-next-boundary-composition.test.js
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
