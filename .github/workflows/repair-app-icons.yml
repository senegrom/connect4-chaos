name: Repair app icon assets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-app-icons.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image export dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Verify source and rebuild binary assets
        run: |
          echo 'dfe4611c874f46b28fd4effe75bdff9d383aeb53b2ddc4d162d1509865eac357  assets/connect4-chaos-logo.png' | sha256sum --check
          python scripts/build-app-icons.py
          node --test tests/pwa-installation.test.js
      - name: Commit only the rebuilt PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apple-touch-icon.png icons/connect4-chaos-180.png icons/connect4-chaos-192.png icons/connect4-chaos-512.png icons/connect4-chaos-512-maskable.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild valid opaque Home Screen PNGs from the saved logo'
          git push origin HEAD:main
