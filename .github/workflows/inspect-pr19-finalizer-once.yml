name: Inspect PR19 production finalizer once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-pr19-finalizer-once.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the finalizer run
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch=agent/perfect-classic-artifact-verification \
            -F per_page=100 \
            | jq '{
                format:"connect4-pr19-finalizer-inspection-v1",
                runs:[.workflow_runs[] | select(
                  .path == ".github/workflows/finalize-perfect-classic-artifact-verification.yml"
                ) | {
                  id, run_attempt, event, status, conclusion, head_sha,
                  created_at, updated_at, html_url, display_title
                }]
              }' > /tmp/pr19-finalizer-inspection.json
          jq -e '.runs | length >= 1' /tmp/pr19-finalizer-inspection.json
          cat /tmp/pr19-finalizer-inspection.json

      - name: Publish inspection and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/pr19-finalizer-inspection.json .audit/pr19-finalizer-inspection.json
            git rm --ignore-unmatch .github/workflows/inspect-pr19-finalizer-once.yml
            git add .audit/pr19-finalizer-inspection.json
            git commit -m 'Record PR19 finalizer inspection'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
