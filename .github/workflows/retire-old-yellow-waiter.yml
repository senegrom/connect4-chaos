name: Retire pre-fix Yellow continuation waiter

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/retire-old-yellow-waiter.yml

permissions:
  actions: write
  contents: read

jobs:
  retire:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REPLACEMENT_RUN: '31651415428'
      REPLACEMENT_SHA: '0705386aa1493dfd44b162ee823fa43bfc3472f9'
      OLD_RUN: '31649199466'
    steps:
      - name: Require the corrected replacement waiter
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha path < <(
            gh api "repos/$REPO/actions/runs/$REPLACEMENT_RUN" \
              --jq '[.head_sha, .path] | @tsv'
          )
          test "$actual_sha" = "$REPLACEMENT_SHA"
          test "$path" = '.github/workflows/continue-yellow-after-current-fixed.yml'

      - name: Cancel only the superseded pre-fix waiter
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPO/actions/runs/$OLD_RUN" --jq .status)
          if [[ "$status" != 'completed' ]]; then
            gh api --method POST "repos/$REPO/actions/runs/$OLD_RUN/cancel"
          fi
