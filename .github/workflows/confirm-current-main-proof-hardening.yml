name: Confirm current-main proof hardening result

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/confirm-current-main-proof-hardening.yml

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require the complete release gate to have succeeded
        shell: bash
        run: |
          set -euo pipefail
          audit=.audit/current-main-proof-hardening.json
          test -f "$audit" && test ! -L "$audit"
          jq -e '
            .format == "connect4-current-main-proof-hardening-verification-v1"
            and .result == "success"
            and .releaseGates == "success"
            and (.sourceSha | test("^[0-9a-f]{40}$"))
            and (.runId | type == "number" and . > 0)
          ' "$audit" >/dev/null
          cp "$audit" /tmp/current-main-proof-hardening-success.json

      - name: Publish success marker and remove this one-shot confirmation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/current-main-proof-hardening-success.json .audit/current-main-proof-hardening-success.json
            git rm --ignore-unmatch .github/workflows/confirm-current-main-proof-hardening.yml
            git add .audit/current-main-proof-hardening-success.json
            git commit -m 'Confirm current-main proof hardening release gates'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the proof-hardening success marker.' >&2
          exit 1
