name: Promote verified 18-piece Perfect Chaos prefix

on:
  push:
    branches:
      - main
    paths:
      - .campaign/perfect-chaos-main-18/closure-candidates/*.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-perfect-chaos-18
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve one independently audited closure candidate per role
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.campaign/perfect-chaos-main-18/closure-candidates')
          records = {}
          ready = True
          for role in ('red', 'yellow'):
              paths = sorted(root.glob(f'{role}-*.json')) if root.is_dir() else []
              if not paths:
                  ready = False
                  continue
              if len(paths) != 1:
                  raise RuntimeError(f'Expected exactly one {role} closure candidate, found {paths}')
              path = paths[0]
              if path.is_symlink() or not path.is_file():
                  raise RuntimeError(f'Unsafe candidate path: {path}')
              value = json.loads(path.read_text())
              expected = {
                  'format': 'connect4-chaos-auto-advance-decision-v1',
                  'role': role,
                  'fromPieces': 16,
                  'targetPieces': 18,
                  'newRejectedRoots': 0,
                  'closedCandidate': True,
                  'nextState': None,
              }
              for field, target in expected.items():
                  if value.get(field) != target:
                      raise RuntimeError(f'{path}: {field} must be {target!r}')
              run = value.get('run')
              run_sha = value.get('runSha')
              cumulative = value.get('cumulativeRejectedRoots')
              if isinstance(run, bool) or not isinstance(run, int) or run <= 0:
                  raise RuntimeError(f'{path}: invalid run id')
              if not isinstance(run_sha, str) or not re.fullmatch(r'[0-9a-f]{40}', run_sha):
                  raise RuntimeError(f'{path}: invalid run SHA')
              if isinstance(cumulative, bool) or not isinstance(cumulative, int) or cumulative <= 0:
                  raise RuntimeError(f'{path}: invalid cumulative rejection count')
              if value.get('existingRejectedRoots') != cumulative:
                  raise RuntimeError(f'{path}: zero round must preserve its cumulative count')
              artifact = f'perfect-chaos-{role}-18-{cumulative}-round'
              if value.get('resultArtifact') != artifact:
                  raise RuntimeError(f'{path}: unexpected result artifact')
              checksums = value.get('checksums')
              if not isinstance(checksums, dict) or any(
                  not isinstance(checksums.get(field), str)
                  or not re.fullmatch(r'[0-9a-f]{64}', checksums[field])
                  for field in ('roundManifest', 'evidenceManifest', 'closureReplay')
              ):
                  raise RuntimeError(f'{path}: incomplete closure checksums')
              state_path = Path(f'.campaign/perfect-chaos-main-18/{role}.json')
              state = json.loads(state_path.read_text())
              if state.get('role') != role or state.get('cumulativeRejections') != cumulative:
                  raise RuntimeError(f'{state_path}: does not bind the closure candidate')
              records[role] = {
                  'candidatePath': str(path),
                  'statePath': str(state_path),
                  'run': run,
                  'runSha': run_sha,
                  'cumulative': cumulative,
                  'resultArtifact': artifact,
                  'evidenceArtifact': f'perfect-chaos-{role}-18-{cumulative}-evidence',
                  'checksums': checksums,
              }

          output = Path('/tmp/perfect-chaos-18-candidates.json')
          output.write_text(json.dumps({'ready': ready, 'roles': records}, indent=2) + '\n')
          github_output = Path(__import__('os').environ['GITHUB_OUTPUT'])
          with github_output.open('a') as handle:
              handle.write(f"ready={str(ready).lower()}\n")
          print(output.read_text())
          PY

      - name: Require successful exact producer runs
        if: steps.candidates.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for role in red yellow; do
            run_id="$(jq -r ".roles.$role.run" /tmp/perfect-chaos-18-candidates.json)"
            run_sha="$(jq -r ".roles.$role.runSha" /tmp/perfect-chaos-18-candidates.json)"
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r '.path' <<< "$run")" = '.github/workflows/continue-perfect-chaos-18-main.yml'
            test "$(jq -r '.head_branch' <<< "$run")" = main
            test "$(jq -r '.head_sha' <<< "$run")" = "$run_sha"
            test "$(jq -r '.status' <<< "$run")" = completed
            test "$(jq -r '.conclusion' <<< "$run")" = success
          done

      - name: Download exact producer and evidence artifacts
        if: steps.candidates.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/perfect-chaos-18-promotion
          mkdir -p /tmp/perfect-chaos-18-promotion
          for role in red yellow; do
            run_id="$(jq -r ".roles.$role.run" /tmp/perfect-chaos-18-candidates.json)"
            run_sha="$(jq -r ".roles.$role.runSha" /tmp/perfect-chaos-18-candidates.json)"
            result="$(jq -r ".roles.$role.resultArtifact" /tmp/perfect-chaos-18-candidates.json)"
            evidence="$(jq -r ".roles.$role.evidenceArtifact" /tmp/perfect-chaos-18-candidates.json)"
            python3 scripts/perfect-chaos-download-artifact.py \
              --repository "$GITHUB_REPOSITORY" --run-id "$run_id" --run-sha "$run_sha" \
              --artifact-name "$result" \
              --output "/tmp/perfect-chaos-18-promotion/$role-producer" \
              --metadata "/tmp/perfect-chaos-18-promotion/$role-producer-artifact.json"
            python3 scripts/perfect-chaos-download-artifact.py \
              --repository "$GITHUB_REPOSITORY" --run-id "$run_id" --run-sha "$run_sha" \
              --artifact-name "$evidence" \
              --output "/tmp/perfect-chaos-18-promotion/$role-evidence" \
              --metadata "/tmp/perfect-chaos-18-promotion/$role-evidence-artifact.json"
          done
          rm -rf /tmp/perfect-chaos-18-promotion/*/.named-artifact-archives \
                 /tmp/perfect-chaos-18-promotion/.named-artifact-archives

      - name: Reproduce both closure decisions from independently audited bytes
        if: steps.candidates.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for role in red yellow; do
            producer="/tmp/perfect-chaos-18-promotion/$role-producer"
            evidence="/tmp/perfect-chaos-18-promotion/$role-evidence"
            python3 scripts/perfect-chaos-artifacts.py verify --directory "$producer"
            (cd "$evidence" && sha256sum --check --strict SHA256SUMS)
            run_id="$(jq -r ".roles.$role.run" /tmp/perfect-chaos-18-candidates.json)"
            run_sha="$(jq -r ".roles.$role.runSha" /tmp/perfect-chaos-18-candidates.json)"
            result="$(jq -r ".roles.$role.resultArtifact" /tmp/perfect-chaos-18-candidates.json)"
            state="$(jq -r ".roles.$role.statePath" /tmp/perfect-chaos-18-candidates.json)"
            candidate="$(jq -r ".roles.$role.candidatePath" /tmp/perfect-chaos-18-candidates.json)"
            python3 scripts/perfect-chaos-auto-advance.py \
              --state "$state" --round-directory "$producer" --evidence-directory "$evidence" \
              --role "$role" --from-pieces 16 --target-pieces 18 \
              --run-id "$run_id" --run-sha "$run_sha" --result-artifact "$result" \
              --next-state "/tmp/perfect-chaos-18-promotion/$role-next-state.json" \
              --decision "/tmp/perfect-chaos-18-promotion/$role-decision.json"
            diff -u "$candidate" "/tmp/perfect-chaos-18-promotion/$role-decision.json"
            test ! -e "/tmp/perfect-chaos-18-promotion/$role-next-state.json"
            prepared="$producer/$role-prepared"
            test -f "$prepared/16-18.policy.bin"
            test -f "$prepared/16-18.frontier.bin"
            test -f "$prepared/reject-16.bin"
            cp -a "$prepared" "/tmp/perfect-chaos-18-promotion/$role-release"
          done

      - name: Rebuild, independently replay, and publish the 18-piece release
        if: steps.candidates.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            rm -rf data/perfect-chaos-prefix/red data/perfect-chaos-prefix/yellow \
                   data/perfect-chaos-prefix/provenance
            cp -a /tmp/perfect-chaos-18-promotion/red-release data/perfect-chaos-prefix/red
            cp -a /tmp/perfect-chaos-18-promotion/yellow-release data/perfect-chaos-prefix/yellow
            node scripts/perfect-chaos-prefix.mjs assemble-reference \
              --directory data/perfect-chaos-prefix --frontier-pieces 18 \
              --method exact-main-counterexample-closure-v1 \
              > /tmp/perfect-chaos-18-promotion/assembly.json

            python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('data/perfect-chaos-prefix/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('boundaries') != [8, 10, 12, 14, 16, 18]:
              raise RuntimeError('The assembled prefix does not end at 18 pieces.')
          candidates = json.loads(Path('/tmp/perfect-chaos-18-candidates.json').read_text())
          audit = {}
          for role in ('red', 'yellow'):
              record = candidates['roles'][role]
              last = manifest['roles'][role]['replay']['segments'][-1]
              if last.get('fromPieces') != 16 or last.get('frontierPieces') != 18:
                  raise RuntimeError(f'{role}: missing 16-to-18 replay segment')
              if last.get('policyEntries', 0) <= 0 or last.get('frontierStates', 0) <= 0:
                  raise RuntimeError(f'{role}: empty 18-piece policy or frontier')
              candidate_path = Path(record['candidatePath'])
              audit[role] = {
                  'run': record['run'],
                  'runSha': record['runSha'],
                  'resultArtifact': record['resultArtifact'],
                  'evidenceArtifact': record['evidenceArtifact'],
                  'cumulativeRejectedRoots': record['cumulative'],
                  'candidatePath': record['candidatePath'],
                  'candidateSha256': hashlib.sha256(candidate_path.read_bytes()).hexdigest(),
                  'checksums': record['checksums'],
              }
          manifest['promotionAudit'] = {
              'format': 'connect4-chaos-perfect-chaos-18-promotion-v1',
              'independentDecisionReproduction': True,
              'completeOpponentReplay': True,
              'roles': audit,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', newline='\n')

          runtime = Path('src/perfect-chaos-prefix.js')
          text = runtime.read_text()
          anchor = "  Object.freeze({ fromBoundary: 14, boundary: 16, file: '14-16.policy.bin' }),\n"
          layer = "  Object.freeze({ fromBoundary: 16, boundary: 18, file: '16-18.policy.bin' }),\n"
          if layer not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError('Could not locate the current final runtime segment.')
              runtime.write_text(text.replace(anchor, anchor + layer, 1))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['chaos:prefix:generate'] = (
              'node scripts/perfect-chaos-prefix.mjs generate '
              '--frontier-pieces 18 --seed-rejections data/perfect-chaos-prefix '
              '--shards 8 --shard-from-pieces 16 '
              '--output generated/perfect-chaos-prefix-18'
          )
          package_path.write_text(json.dumps(package, indent=2) + '\n', newline='\n')
          PY

            node scripts/perfect-chaos-prefix.mjs verify-reference \
              --reference data/perfect-chaos-prefix/manifest.json \
              > /tmp/perfect-chaos-18-promotion/current-main-replay.json
            npm run check
            npm test
            npm run test:browser
            git diff --check

            python3 - <<'PY'
          import subprocess

          changed = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = [line[3:] for line in changed if line]
          unexpected = [
              path for path in paths
              if path not in {'package.json', 'src/perfect-chaos-prefix.js'}
              and not path.startswith('data/perfect-chaos-prefix/')
          ]
          if unexpected:
              raise RuntimeError(f'Unexpected 18-piece promotion paths: {unexpected}')
          required = {
              'package.json',
              'src/perfect-chaos-prefix.js',
              'data/perfect-chaos-prefix/manifest.json',
              'data/perfect-chaos-prefix/red/16-18.policy.bin',
              'data/perfect-chaos-prefix/red/16-18.frontier.bin',
              'data/perfect-chaos-prefix/yellow/16-18.policy.bin',
              'data/perfect-chaos-prefix/yellow/16-18.frontier.bin',
          }
          missing = sorted(required.difference(paths))
          if missing:
              raise RuntimeError(f'Required 18-piece promotion paths are unchanged: {missing}')
          print({'changedFiles': len(paths), 'scope': 'verified-18-piece-prefix'})
          PY

            git add package.json src/perfect-chaos-prefix.js data/perfect-chaos-prefix
            git commit -m 'Promote verified 18-piece Perfect Chaos prefix'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not publish the verified 18-piece prefix after five fully tested races.' >&2
          exit 1
