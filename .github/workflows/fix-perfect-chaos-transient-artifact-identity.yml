name: Install durable Perfect Chaos artifact identity

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/fix-perfect-chaos-transient-artifact-identity.yml
      - scripts/patch-perfect-chaos-transient-artifact-identity.py

permissions:
  contents: write

concurrency:
  group: fix-perfect-chaos-transient-artifact-identity
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out campaign branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install durable artifact identity and legacy recovery
        run: |
          python3 scripts/patch-perfect-chaos-transient-artifact-identity.py \
            scripts/perfect-chaos-artifacts.py \
            tests/perfect-chaos-artifacts.test.js

      - name: Verify focused and complete regression suites
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile scripts/perfect-chaos-artifacts.py
          node --test tests/perfect-chaos-artifacts.test.js | tee artifact-identity-test.log
          npm test | tee full-test.log
          grep -q 'pass 6' artifact-identity-test.log
          grep -q 'fail 0' artifact-identity-test.log
          grep -q 'fail 0' full-test.log

      - name: Commit the verified durable identity rule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perfect-chaos-artifacts.py tests/perfect-chaos-artifacts.test.js
          if git diff --cached --quiet; then
            echo 'Durable artifact identity is already installed.'
            exit 0
          fi
          git commit -m 'Exclude exact-repair scratch space from artifact identity'
          git push origin HEAD:agent/perfect-chaos-16-recovery

      - name: Upload identity-regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-transient-artifact-identity-verification
          path: |
            artifact-identity-test.log
            full-test.log
          if-no-files-found: error
          retention-days: 90
