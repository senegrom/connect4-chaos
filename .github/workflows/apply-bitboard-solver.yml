name: Apply bitboard solver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-bitboard-solver.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bitboard-solver
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Integrate solver and debloat search
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          ai_path = Path('src/ai.js')
          ai = ai_path.read_text()
          ai = replace_once(
              ai,
              "import {\n",
              "import { chooseBitboardMove, isBitboardPosition } from './bitboard.js';\n\nimport {\n",
              'bitboard import',
          )
          ai = replace_once(
              ai,
              """  const defaults = DIFFICULTY[difficulty] ?? DIFFICULTY.medium;
  if (!position.chaosMode) {
    return chooseClassicMove(position, options, defaults, aiPlayer, start);
  }
""",
              """  if (isBitboardPosition(position)) {
    return chooseBitboardMove(position, {
      ...options,
      difficulty,
      aiPlayer,
    });
  }

  const defaults = DIFFICULTY[difficulty] ?? DIFFICULTY.medium;
  if (!position.chaosMode) {
    return chooseClassicMove(position, options, defaults, aiPlayer, start);
  }
""",
              'bitboard routing',
          )
          ai = ai.replace(
              '// Specialised mutable search for classic drop-only games. The board passed by the UI',
              '// Fallback mutable search for configurable classic boards. The board passed by the UI',
          )
          # Repair indentation left by the previous timeout-removal transform.
          ai = ai.replace('    if (useAspiration) {\n        alpha', '    if (useAspiration) {\n      alpha')
          ai = ai.replace('        beta = previousScore + window;\n      }', '      beta = previousScore + window;\n    }')
          ai = ai.replace('    let result = classicSearchRoot(\n        board,', '    let result = classicSearchRoot(\n      board,')
          ai = ai.replace('        context,\n        preferredAction,\n        alpha,\n        beta,\n      );', '      context,\n      preferredAction,\n      alpha,\n      beta,\n    );')
          ai = ai.replace('      if (useAspiration &&', '    if (useAspiration &&')
          ai = ai.replace('    if (result.action) {\n        const pv', '    if (result.action) {\n      const pv')
          ai = ai.replace('        best = { ...result, depth, principalVariation: pv };', '      best = { ...result, depth, principalVariation: pv };')
          ai = ai.replace('        preferredAction = result.action;', '      preferredAction = result.action;')
          ai = ai.replace('        safeIterationCallback(options.onIteration, {', '      safeIterationCallback(options.onIteration, {')
          ai = ai.replace('        });\n      }\n    if (Math.abs(result.score)', '      });\n    }\n    if (Math.abs(result.score)')
          ai_path.write_text(ai)

          app_path = Path('src/app.js')
          app = app_path.read_text()
          app = replace_once(
              app,
              """  medium: 'Completes a 6-ply search with tactical extensions.',
  hard: 'Completes a 9-ply search with deeper tactical analysis.',
  brutal: 'Completes a 12-ply search; complex positions can take longer.',
""",
              """  medium: 'Standard 7×6 uses a fast 10-ply bitboard search.',
  hard: 'Standard 7×6 uses 14 plies and exact late-game solving.',
  brutal: 'Standard 7×6 uses 16 plies and solves up to 24 empty cells exactly.',
""",
              'difficulty hints',
          )
          app = replace_once(
              app,
              """    const details = [
      `Depth ${search.depth}`,
      `${numberFormatter.format(search.nodes)} positions`,
      `${seconds.toFixed(seconds >= 1 ? 1 : 2)}s`,
    ];
""",
              """    const details = [];
    if (search.solver === 'bitboard') details.push(search.solved ? 'Bitboard solved' : 'Bitboard');
    else if (search.solved) details.push('Solved');
    details.push(
      `Depth ${search.depth}`,
      `${numberFormatter.format(search.nodes)} positions`,
      `${seconds.toFixed(seconds >= 1 ? 1 : 2)}s`,
    );
""",
              'search details',
          )
          app = replace_once(
              app,
              """        tableResets: result.tableResets ?? 0,
        principalVariation: Array.isArray(result.principalVariation)
""",
              """        tableResets: result.tableResets ?? 0,
        tableStores: result.tableStores ?? 0,
        tableCollisions: result.tableCollisions ?? 0,
        solved: Boolean(result.solved),
        solver: result.solver ?? 'general',
        principalVariation: Array.isArray(result.principalVariation)
""",
              'persist solver metadata',
          )
          app_path.write_text(app)

          test_path = Path('tests/ai.test.js')
          tests = test_path.read_text()
          anchor = "test('the evaluator rewards central control for the AI', () => {\n"
          integration_test = """test('standard 7x6 classic positions route through the bitboard solver', () => {
  const result = chooseMove(position(emptyBoard()), {
    difficulty: 'medium',
    maximumDepth: 4,
  });
  assert.equal(result.solver, 'bitboard');
  assert.equal(result.depth, 4);
  assert.deepEqual(result.action, { type: ACTION_DROP, column: 3 });
});

"""
          if integration_test not in tests:
              tests = replace_once(tests, anchor, integration_test + anchor, 'AI integration test')
          test_path.write_text(tests)

          package_path = Path('package.json')
          package = package_path.read_text()
          package = package.replace('"version": "1.2.0"', '"version": "1.3.0"')
          package = package.replace(
              'node --check src/engine.js && node --check src/ai.js',
              'node --check src/engine.js && node --check src/bitboard.js && node --check src/ai.js',
          )
          package_path.write_text(package)

          lock_path = Path('package-lock.json')
          lock = lock_path.read_text().replace('"version": "1.2.0"', '"version": "1.3.0"')
          lock_path.write_text(lock)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "The AI runs in a Web Worker, so deeper searches do not freeze the interface. Classic drop-only games use a specialised in-place search, while Chaos Mode retains the fully general transformation-aware search.\n",
              "The AI runs in a Web Worker, so deeper searches do not freeze the interface. Standard 7×6 Connect Four uses a dedicated BigInt bitboard engine; configurable classic boards use the mutable array search, while Chaos Mode retains the fully general transformation-aware search.\n",
              'README engine overview',
          )
          readme = replace_once(
              readme,
              """- Iterative-deepening alpha-beta search with aspiration windows.
- Tactical horizon extensions for immediate wins, forced blocks, and double threats.
- Gravity-aware evaluation that distinguishes playable threats from floating shapes.
- Symmetry-aware transposition caching for classic boards.
""",
              """- Seven-bit column bitboards with make/unmake-free move generation on the standard board.
- Iterative-deepening alpha-beta search with forced-block extensions and non-losing move pruning.
- A fixed-size typed-array transposition table with horizontal symmetry canonicalisation.
- Exact terminal solving once a standard position reaches the configured endgame threshold.
- Gravity-aware evaluation that distinguishes playable threats from floating shapes.
""",
              'README strength list',
          )
          readme = replace_once(
              readme,
              "Medium completes 6 plies, Hard 9, and Brutal 12, with additional tactical extensions at the horizon. There is no wall-clock search cutoff: the worker finishes the selected depth unless the player explicitly cancels it by restarting, undoing, or changing the game.\n",
              "On a standard 7×6 board, Medium completes 10 plies, Hard 14, and Brutal 16. Medium solves positions with at most 16 empty cells exactly, Hard 20, and Brutal 24. Custom boards retain the general 6/9/12-ply engine. There is no wall-clock cutoff: a worker finishes the selected depth or exact endgame unless the player explicitly cancels it by restarting, undoing, or changing the game.\n",
              'README difficulty policy',
          )
          readme = replace_once(
              readme,
              "│   ├── engine.js           Pure rules, gravity, wins, transforms, repetition keys\n│   ├── ai.js               Evaluation and iterative-deepening alpha-beta searches\n",
              "│   ├── engine.js           Pure rules, gravity, wins, transforms, repetition keys\n│   ├── bitboard.js         Standard 7×6 bitboard search and exact endgame solver\n│   ├── ai.js               General-board and Chaos alpha-beta searches\n",
              'README project tree',
          )
          readme = readme.replace(
              '│   ├── ai.test.js          Tactical, search, timeout, and mutation-safety tests\n',
              '│   ├── ai.test.js          Routing, tactical, search, and mutation-safety tests\n│   ├── bitboard.test.js    Bitboard conversion, safety, depth, and exact-solve tests\n',
          )
          readme_path.write_text(readme)

          Path('.github/workflows/apply-bitboard-solver.yml').unlink()

      - name: Validate implementation
        run: |
          npm ci
          npm run ci
          git diff --check

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Use bitboard solver for standard Connect Four"
          git push origin HEAD:main
