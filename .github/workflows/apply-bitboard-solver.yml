name: Apply bitboard solver

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-bitboard-solver.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bitboard-solver
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Integrate solver and debloat search
        run: python .automation/apply-bitboard.py

      - name: Validate implementation
        run: |
          npm ci
          npm run ci
          git diff --check

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Use bitboard solver for standard Connect Four"
          git push origin HEAD:main
