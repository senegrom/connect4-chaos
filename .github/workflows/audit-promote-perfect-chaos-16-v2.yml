name: Audit and promote 16-piece Perfect Chaos prefix v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-promote-perfect-chaos-16-v2.yml
      - .audit/perfect-chaos-16-trigger
      - scripts/promote-perfect-chaos-16.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: audit-promote-perfect-chaos-16-v2
  cancel-in-progress: true

jobs:
  audit-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_REF: claude/connect4-chaos-ai-c1py3r
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0

      - name: Check out historical certificate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          fetch-depth: 0

      - name: Check out audit-status branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-audit-status
          path: status
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json

      - name: Verify historical generator, seed tables, and certificate replay
        shell: bash
        run: |
          set -euo pipefail
          echo candidate-self-replay > /tmp/perfect-chaos-16-audit-stage
          candidate_sha=$(git -C candidate rev-parse HEAD)
          manifest=candidate/data/perfect-chaos-prefix/manifest.json
          generator_hash=$(sha256sum candidate/native/perfect-chaos-prefix.cpp | cut -d' ' -f1)
          test "$generator_hash" = "$(jq -r '.sourceSha256' "$manifest")"
          jq -e '
            .format == "connect4-chaos-layered-prefix-manifest-v1"
            and .boundaries == [8,10,12,14,16]
            and .roles.red.replay.segments[-1].fromPieces == 14
            and .roles.red.replay.segments[-1].frontierPieces == 16
            and .roles.red.replay.segments[-1].policyEntries == 326031
            and .roles.red.replay.segments[-1].frontierStates == 339682
            and .roles.red.replay.segments[-1].closureStates == 747775
            and .roles.yellow.replay.segments[-1].fromPieces == 14
            and .roles.yellow.replay.segments[-1].frontierPieces == 16
            and .roles.yellow.replay.segments[-1].policyEntries == 1059068
            and .roles.yellow.replay.segments[-1].frontierStates == 1164120
            and .roles.yellow.replay.segments[-1].closureStates == 2498257
          ' "$manifest" >/dev/null
          PYTHONPATH=release/scripts python3 - <<'PY'
          from pathlib import Path
          from perfect_chaos_tables import FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table

          root = Path('candidate/data/perfect-chaos-prefix-seeds-18')
          expected = {
              'red': {8: 0, 10: 80, 12: 1298, 14: 9210, 16: 40047},
              'yellow': {8: 94, 10: 941, 12: 7786, 14: 44737},
          }
          roles = {'red': 1, 'yellow': 2}
          for role, boundaries in expected.items():
              for boundary, count in boundaries.items():
                  path = root / role / f'reject-{boundary}.bin'
                  table = read_table(path, FRONTIER_MAGIC, FRONTIER_RECORD_SIZE)
                  if table.role != roles[role] or table.boundary != boundary:
                      raise RuntimeError(f'{path}: role or boundary mismatch')
                  if len(table.records) != count:
                      raise RuntimeError(f'{path}: expected {count} records, got {len(table.records)}')
          print({'validatedSeedTables': sum(len(value) for value in expected.values())})
          PY
          (cd candidate && npm ci)
          (cd candidate && node --max-old-space-size=6144 scripts/perfect-chaos-prefix.mjs \
            verify-reference --reference data/perfect-chaos-prefix/manifest.json) \
            | tee /tmp/perfect-chaos-16-candidate-self-replay.json
          test -n "$candidate_sha"
          echo candidate-self-replay-passed > /tmp/perfect-chaos-16-audit-stage

      - name: Independently replay every policy byte with current main
        shell: bash
        run: |
          set -euo pipefail
          echo current-main-cross-replay > /tmp/perfect-chaos-16-audit-stage
          (cd release && npm ci)
          rm -rf /tmp/perfect-chaos-prefix-16
          cp -a candidate/data/perfect-chaos-prefix /tmp/perfect-chaos-prefix-16
          current_source_hash=$(sha256sum release/native/perfect-chaos-prefix.cpp | cut -d' ' -f1)
          CURRENT_SOURCE_HASH="$current_source_hash" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/perfect-chaos-prefix-16/manifest.json')
          manifest = json.loads(path.read_text())
          # This bypasses only the historical source-identity equality.  Current
          # main still hashes every artifact and independently replays every legal
          # opponent continuation, reachable policy record and exact frontier.
          manifest['sourceSha256'] = os.environ['CURRENT_SOURCE_HASH']
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          (cd release && node --max-old-space-size=6144 scripts/perfect-chaos-prefix.mjs \
            verify-reference --reference /tmp/perfect-chaos-prefix-16/manifest.json) \
            | tee /tmp/perfect-chaos-16-current-main-cross-replay.json
          echo current-main-cross-replay-passed > /tmp/perfect-chaos-16-audit-stage

      - name: Prepare the provenance-preserving release tree
        shell: bash
        run: |
          set -euo pipefail
          echo prepare-release-tree > /tmp/perfect-chaos-16-audit-stage
          candidate_sha=$(git -C candidate rev-parse HEAD)
          python3 release/scripts/promote-perfect-chaos-16.py \
            --release release \
            --candidate candidate \
            --candidate-ref "$CANDIDATE_REF" \
            --candidate-commit "$candidate_sha" \
            --verification-commit "$GITHUB_SHA" \
            | tee /tmp/perfect-chaos-16-preparation.json
          git -C release diff --check
          echo release-tree-prepared > /tmp/perfect-chaos-16-audit-stage

      - name: Run complete exact, certificate, and browser release gates
        shell: bash
        run: |
          set -euo pipefail
          echo release-gates > /tmp/perfect-chaos-16-audit-stage
          cd release
          npm run check
          npm test
          npm run classic:verify
          npm run classic:policy:verify
          npm run chaos:complete:verify
          npm run chaos:prefix:verify
          npm run chaos:prefix:verify-reference
          npm run test:browser
          echo release-gates-passed > /tmp/perfect-chaos-16-audit-stage

      - name: Require the exact promotion scope
        shell: bash
        run: |
          set -euo pipefail
          echo scope-check > /tmp/perfect-chaos-16-audit-stage
          python3 - <<'PY'
          import subprocess

          allowed_exact = {
              'package.json',
              'scripts/perfect-chaos-prefix.mjs',
              'src/perfect-chaos-prefix.js',
              'tests/perfect-chaos-prefix-manifest.test.js',
              'tests/perfect-chaos-prefix-runtime.test.js',
          }
          changed = subprocess.run(
              ['git', '-C', 'release', 'status', '--short'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          paths = [line[3:] for line in changed if line]
          unexpected = [
              path for path in paths
              if path not in allowed_exact
              and not path.startswith('data/perfect-chaos-prefix/')
              and not path.startswith('data/perfect-chaos-prefix-seeds-18/')
          ]
          if unexpected:
              raise RuntimeError(f'Unexpected promotion paths: {unexpected}')
          required = {
              'data/perfect-chaos-prefix/manifest.json',
              'data/perfect-chaos-prefix/red/14-16.policy.bin',
              'data/perfect-chaos-prefix/red/14-16.frontier.bin',
              'data/perfect-chaos-prefix/yellow/14-16.policy.bin',
              'data/perfect-chaos-prefix/yellow/14-16.frontier.bin',
              'data/perfect-chaos-prefix/provenance/perfect-chaos-prefix-generator.cpp',
              'data/perfect-chaos-prefix/provenance/original-manifest.json',
              'data/perfect-chaos-prefix-seeds-18/README.md',
              'data/perfect-chaos-prefix-seeds-18/red/reject-16.bin',
              'data/perfect-chaos-prefix-seeds-18/yellow/reject-14.bin',
          }
          missing = required.difference(paths)
          if missing:
              raise RuntimeError(f'Required promotion paths are not changed: {sorted(missing)}')
          print({'changedFiles': len(paths), 'scope': 'verified-16-piece-prefix'})
          PY
          echo scope-check-passed > /tmp/perfect-chaos-16-audit-stage

      - name: Commit the verified certificate directly to main
        shell: bash
        run: |
          set -euo pipefail
          echo publish-main > /tmp/perfect-chaos-16-audit-stage
          git -C release config user.name 'github-actions[bot]'
          git -C release config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release fetch origin main
          current=$(git -C release rev-parse origin/main)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main advanced from $GITHUB_SHA to $current during verification; refusing an untested rebase." >&2
            exit 1
          fi
          git -C release add \
            package.json \
            scripts/perfect-chaos-prefix.mjs \
            src/perfect-chaos-prefix.js \
            tests/perfect-chaos-prefix-manifest.test.js \
            tests/perfect-chaos-prefix-runtime.test.js \
            data/perfect-chaos-prefix \
            data/perfect-chaos-prefix-seeds-18
          git -C release commit -m 'Promote verified 16-piece Perfect Chaos prefix

          Preserve the historical generator source and original manifest, verify the
          complete binary closure with that source, then independently hash and replay
          every policy against current main. Expose the fifth 14-to-16 runtime layer
          only after both role closures, all opponent continuations, exact frontiers,
          complete tests and browser smoke checks pass.'
          git -C release push origin HEAD:main
          echo promoted-to-main > /tmp/perfect-chaos-16-audit-stage

      - name: Publish final audit status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          stage=$(cat /tmp/perfect-chaos-16-audit-stage 2>/dev/null || printf '%s' not-started)
          main_head=$(git -C status ls-remote origin refs/heads/main | cut -f1)
          STAGE="$stage" MAIN_HEAD="$main_head" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              'format': 'connect4-chaos-perfect-chaos-16-audit-status-v2',
              'workflow': 'Audit and promote 16-piece Perfect Chaos prefix v2',
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'jobStatus': os.environ['JOB_STATUS'],
              'lastStage': os.environ['STAGE'],
              'headSha': os.environ['GITHUB_SHA'],
              'mainHeadAtRecord': os.environ['MAIN_HEAD'],
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          encoded = json.dumps(record, indent=2, sort_keys=True) + '\n'
          Path('/tmp/perfect-chaos-16-audit-status.json').write_text(encoded)
          print(encoded)
          PY
          git -C status config user.name 'github-actions[bot]'
          git -C status config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C status fetch origin agent/perfect-chaos-audit-status
            git -C status reset --hard origin/agent/perfect-chaos-audit-status
            mkdir -p status/audit-status/runs
            cp /tmp/perfect-chaos-16-audit-status.json \
              "status/audit-status/runs/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT.json"
            cp /tmp/perfect-chaos-16-audit-status.json status/audit-status/latest-v2.json
            git -C status add audit-status
            if git -C status diff --cached --quiet; then
              exit 0
            fi
            git -C status commit -m \
              "Record Perfect Chaos v2 audit run $GITHUB_RUN_ID: $JOB_STATUS at $stage"
            if git -C status push origin HEAD:agent/perfect-chaos-audit-status; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the final v2 audit status after five races.' >&2
          exit 1
