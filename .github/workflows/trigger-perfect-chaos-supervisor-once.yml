name: Trigger role-aware Perfect Chaos supervisor once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-perfect-chaos-supervisor-once.yml

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and dispatch exactly one role-aware supervisor
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow=.github/workflows/supervise-perfect-chaos-main.yml
          test -f "$workflow" && test ! -L "$workflow"
          before="$(gh api --method GET "repos/$repo/actions/workflows/supervise-perfect-chaos-main.yml/runs" -f branch=main -F per_page=100 --jq '[.workflow_runs[].id]')"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run supervise-perfect-chaos-main.yml --repo "$repo" --ref main
          for _ in $(seq 1 120); do
            runs="$(gh api --method GET "repos/$repo/actions/workflows/supervise-perfect-chaos-main.yml/runs" -f branch=main -F per_page=100)"
            candidates="$(jq --argjson before "$before" --arg started "$started" '[.workflow_runs[] | select(.event == "workflow_dispatch" and (.id as $id | ($before | index($id)) == null) and .created_at >= $started)]' <<< "$runs")"
            count="$(jq 'length' <<< "$candidates")"
            if [[ "$count" = 1 ]]; then
              jq -c '.[0] | {id,head_sha,status,conclusion,html_url,created_at}' <<< "$candidates" > /tmp/supervisor-run.json
              cat /tmp/supervisor-run.json
              break
            fi
            if (( count > 1 )); then
              echo "Ambiguous new supervisor runs: $count" >&2
              exit 1
            fi
            sleep 5
          done
          test -s /tmp/supervisor-run.json

      - name: Record the dispatch and remove this one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            jq -n \
              --argjson run "$(cat /tmp/supervisor-run.json)" \
              --arg triggeredBy "$GITHUB_SHA" \
              --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{format:"connect4-chaos-supervisor-dispatch-v1",triggeredBy:$triggeredBy,recordedAt:$recordedAt,run:$run}' \
              > .audit/perfect-chaos-supervisor-dispatch.json
            git rm --ignore-unmatch .github/workflows/trigger-perfect-chaos-supervisor-once.yml
            git add .audit/perfect-chaos-supervisor-dispatch.json
            git commit -m 'Record role-aware Perfect Chaos supervisor dispatch'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the supervisor dispatch record after five races.' >&2
          exit 1
