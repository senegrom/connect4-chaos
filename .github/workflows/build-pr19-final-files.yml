name: Build final verified PR19 production files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-pr19-final-files.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-final-pr19-production-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact rebased PR head
        uses: actions/checkout@v6
        with:
          ref: cdd086f4694b544c36074cba1d7614006ffdabb5
          path: pr
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pr/package-lock.json

      - name: Install dependencies
        working-directory: pr
        run: npm ci

      - name: Apply the reviewed downloader hardening and workflow installation
        working-directory: pr
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/perfect-classic-download-fragments.py')
          text = script_path.read_text()
          old = '''    request = urllib.request.Request(
              artifact["archiveUrl"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=300) as source:
                  return copy_stream(source, destination)
          except urllib.error.URLError as error:
              fail(
                  f"Could not download artifact {artifact['name']} "
                  f"({artifact['id']}): {error}"
              )
          '''
          new = '''    request = urllib.request.Request(
              artifact["archiveUrl"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: N802
                  return None

          try:
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  opener.open(request, timeout=60)
              except urllib.error.HTTPError as redirect:
                  if redirect.code not in {301, 302, 303, 307, 308}:
                      raise
                  signed_url = redirect.headers.get("Location")
              else:
                  fail(
                      f"Artifact {artifact['name']} ({artifact['id']}) download API "
                      "did not return a signed redirect"
                  )
              if not isinstance(signed_url, str) or not signed_url.startswith("https://"):
                  fail(
                      f"Artifact {artifact['name']} ({artifact['id']}) returned an "
                      "unsafe signed archive URL"
                  )
              signed_request = urllib.request.Request(
                  signed_url,
                  headers={
                      "User-Agent": "connect4-chaos-perfect-classic-fragment-downloader",
                  },
              )
              # Deliberately omit Authorization on the cross-origin signed URL.
              with urllib.request.urlopen(signed_request, timeout=300) as source:
                  return copy_stream(source, destination)
          except urllib.error.URLError as error:
              fail(
                  f"Could not download artifact {artifact['name']} "
                  f"({artifact['id']}): {error}"
              )
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one authenticated archive block, found {text.count(old)}.')
          text = text.replace(old, new, 1)
          old_path = '    if not name or "\\x00" in name or "\\\\" in name:\n'
          new_path = '    if not name or "\\x00" in name or "\\\\" in name or "//" in name:\n'
          if text.count(old_path) != 1:
              raise RuntimeError('Could not locate the ZIP-entry name guard.')
          script_path.write_text(text.replace(old_path, new_path, 1), newline='\n')

          test_path = Path('tests/perfect-classic-download-fragments.test.js')
          tests = test_path.read_text()
          marker = "authenticated archive redirects never forward the GitHub token"
          if marker in tests:
              raise RuntimeError('Redirect regression guard already exists unexpectedly.')
          tests += '''\n
test('authenticated archive redirects never forward the GitHub token', () => {
  const source = readFileSync(SCRIPT, 'utf8');
  assert.match(source, /class NoRedirect/);
  assert.match(source, /Deliberately omit Authorization on the cross-origin signed URL/);
  const signedBlock = source.slice(
    source.indexOf('signed_request = urllib.request.Request('),
    source.indexOf('with urllib.request.urlopen(signed_request'),
  );
  assert.doesNotMatch(signedBlock, /Authorization/);
});
'''
          test_path.write_text(tests, newline='\n')
          PY

          python3 scripts/patch-perfect-classic-fragment-downloads.py \
            --root . --output /tmp/pr19-workflow-patch.json
          jq -e '.changed == true and (.workflows | length) == 2' /tmp/pr19-workflow-patch.json
          rm .github/workflows/harden-perfect-classic-artifact-downloader.yml
          rm .github/workflows/verify-perfect-classic-artifact-boundary.yml

      - name: Run focused and complete release gates
        working-directory: pr
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/perfect-classic-download-fragments.py \
            scripts/patch-perfect-classic-fragment-downloads.py
          node --test \
            tests/perfect-classic-download-fragments.test.js \
            tests/perfect-classic-fragment-workflow-patch.test.js
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true); puts path }' \
            .github/workflows/compute-perfect-classic-7x7-role1.yml \
            .github/workflows/compute-perfect-classic-7x7-role2.yml
          npm run ci
          npm run test:browser
          git diff --check

      - name: Require the exact reviewed change scope
        working-directory: pr
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee /tmp/pr19-status.txt
          changed="$(git status --short | cut -c4- | sort)"
          expected=$'.github/workflows/compute-perfect-classic-7x7-role1.yml\n.github/workflows/compute-perfect-classic-7x7-role2.yml\n.github/workflows/harden-perfect-classic-artifact-downloader.yml\n.github/workflows/verify-perfect-classic-artifact-boundary.yml\nscripts/perfect-classic-download-fragments.py\ntests/perfect-classic-download-fragments.test.js'
          test "$changed" = "$expected"

      - name: Package content-addressed final files
        working-directory: pr
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/pr19-final-payload
          rm -rf "$payload"
          mkdir -p "$payload/files/.github/workflows" "$payload/files/scripts" "$payload/files/tests"
          cp .github/workflows/compute-perfect-classic-7x7-role1.yml "$payload/files/.github/workflows/"
          cp .github/workflows/compute-perfect-classic-7x7-role2.yml "$payload/files/.github/workflows/"
          cp scripts/perfect-classic-download-fragments.py "$payload/files/scripts/"
          cp tests/perfect-classic-download-fragments.test.js "$payload/files/tests/"
          printf '%s\n' \
            '.github/workflows/harden-perfect-classic-artifact-downloader.yml' \
            '.github/workflows/verify-perfect-classic-artifact-boundary.yml' \
            > "$payload/delete.txt"
          SOURCE_SHA="$(git rev-parse HEAD)" PAYLOAD="$payload" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['PAYLOAD'])
          files = []
          for path in sorted((root / 'files').rglob('*')):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              files.append({
                  'path': path.relative_to(root / 'files').as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'mode': '100644',
              })
          deleted = [line for line in (root / 'delete.txt').read_text().splitlines() if line]
          manifest = {
              'format': 'connect4-pr19-final-production-files-v1',
              'sourceSha': os.environ['SOURCE_SHA'],
              'files': files,
              'deleted': deleted,
              'verification': {
                  'focusedArtifactTests': True,
                  'workflowYaml': True,
                  'completeNodeSuite': True,
                  'classicVerification': True,
                  'classicPolicyReplay': True,
                  'completeChaosVerification': True,
                  'browserSmoke': True,
              },
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload the verified final file set
        uses: actions/upload-artifact@v4
        with:
          name: pr19-final-production-files-cdd086f4
          path: /tmp/pr19-final-payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Check out current main for a durable completion marker
        uses: actions/checkout@v6
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Publish the exact run identity and successful verification marker
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$GITHUB_RUN_ID" RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = json.loads(Path('/tmp/pr19-final-payload/manifest.json').read_text())
          marker = {
              'format': 'connect4-pr19-final-build-v1',
              'result': 'success',
              'runId': int(os.environ['RUN_ID']),
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'artifact': 'pr19-final-production-files-cdd086f4',
              'sourceSha': manifest['sourceSha'],
              'files': manifest['files'],
              'deleted': manifest['deleted'],
              'verification': manifest['verification'],
              'recordedAt': datetime.now(timezone.utc).isoformat(),
          }
          Path('/tmp/pr19-final-build.json').write_text(json.dumps(marker, indent=2, sort_keys=True) + '\n')
          PY
          git -C main config user.name 'github-actions[bot]'
          git -C main config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C main fetch origin main
            git -C main reset --hard origin/main
            mkdir -p main/.audit
            cp /tmp/pr19-final-build.json main/.audit/pr19-final-build.json
            git -C main add .audit/pr19-final-build.json
            if git -C main diff --cached --quiet; then
              exit 0
            fi
            git -C main commit -m 'Record verified PR19 production file build'
            if git -C main push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the PR19 build marker after five races.' >&2
          exit 1
