name: Fix bitboard winning mask

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bitboard-winning-mask.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Correct winning-square generation and add exact cross-checks
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/bitboard.js')
          source = source_path.read_text()
          old = """export function winningPosition(position, mask) {
            let result = (position << 1n) & (position << 2n) & (position << 3n);
            for (const direction of [HEIGHT, STRIDE, HEIGHT + 2]) {
              const shift = BigInt(direction);
              const pair = (position << shift) & (position << (2n * shift));
              result |= pair & (position << (3n * shift));
              result |= pair & (position >> shift);
            }
            return result & (BOARD_MASK ^ mask);
          }
          """
          new = """export function winningPosition(position, mask) {
            let result = (position << 1n) & (position << 2n) & (position << 3n);
            for (const direction of [HEIGHT, STRIDE, HEIGHT + 2]) {
              const shift = BigInt(direction);
              let pair = (position << shift) & (position << (2n * shift));
              result |= pair & (position << (3n * shift));
              result |= pair & (position >> shift);
              pair = (position >> shift) & (position >> (2n * shift));
              result |= pair & (position << shift);
              result |= pair & (position >> (3n * shift));
            }
            return result & (BOARD_MASK ^ mask);
          }
          """
          if source.count(old) != 1:
              raise SystemExit('winningPosition implementation anchor not found exactly once')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/bitboard.test.js')
          tests = test_path.read_text()
          addition = r'''

          function hasLineFrom(board, row, column, player) {
            for (const [deltaRow, deltaColumn] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
              let count = 1;
              for (const sign of [-1, 1]) {
                for (let step = 1; step < 4; step += 1) {
                  const nextRow = row + sign * step * deltaRow;
                  const nextColumn = column + sign * step * deltaColumn;
                  if (board[nextRow]?.[nextColumn] !== player) break;
                  count += 1;
                }
              }
              if (count >= 4) return true;
            }
            return false;
          }

          function exactArrayResult(board, player, memo = new Map()) {
            const key = `${player}:${board.flat().join('')}`;
            const cached = memo.get(key);
            if (cached) return cached;

            let bestScore = -2;
            let bestColumns = [];
            for (let column = 0; column < 7; column += 1) {
              const row = drop(board, column, player);
              if (row < 0) continue;
              const score = hasLineFrom(board, row, column, player)
                ? 1
                : -exactArrayResult(board, player === RED ? YELLOW : RED, memo).score;
              board[row][column] = 0;
              if (score > bestScore) {
                bestScore = score;
                bestColumns = [column];
              } else if (score === bestScore) {
                bestColumns.push(column);
              }
            }

            const result = bestScore === -2
              ? { score: 0, columns: [] }
              : { score: bestScore, columns: bestColumns };
            memo.set(key, result);
            return result;
          }

          function seededRandom(seed) {
            let state = seed >>> 0;
            return () => {
              state = (state + 0x6d2b79f5) >>> 0;
              let value = state;
              value = Math.imul(value ^ (value >>> 15), value | 1);
              value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
              return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
            };
          }

          function randomLatePosition(random, remaining) {
            for (let attempt = 0; attempt < 10_000; attempt += 1) {
              const board = emptyBoard();
              let player = RED;
              let moves = 0;
              let ended = false;
              while (42 - moves > remaining) {
                const columns = [];
                for (let column = 0; column < 7; column += 1) {
                  if (board[0][column] === 0) columns.push(column);
                }
                const column = columns[Math.floor(random() * columns.length)];
                const row = drop(board, column, player);
                moves += 1;
                if (hasLineFrom(board, row, column, player)) {
                  ended = true;
                  break;
                }
                player = player === RED ? YELLOW : RED;
              }
              if (!ended) return { board, player };
            }
            throw new Error('Could not generate a non-terminal late position.');
          }

          test('winning-square generation detects both ends and internal gaps', () => {
            const board = [
              [RED, 0, YELLOW, 0, RED, 0, RED],
              [RED, 0, YELLOW, 0, RED, RED, YELLOW],
              [YELLOW, 0, RED, YELLOW, YELLOW, YELLOW, RED],
              [RED, 0, RED, RED, RED, YELLOW, YELLOW],
              [YELLOW, RED, YELLOW, YELLOW, YELLOW, RED, YELLOW],
              [YELLOW, RED, YELLOW, YELLOW, RED, RED, RED],
            ];
            const result = chooseBitboardMove(position(board, YELLOW), {
              maximumDepth: 7,
              exactThreshold: 7,
            });
            assert.equal(result.solved, true);
            assert.ok(result.score > 0);
            assert.ok([1, 3].includes(result.action.column));
          });

          test('exact late-game bitboard results match independent array minimax', () => {
            const random = seededRandom(0xc04ec7);
            for (let sample = 0; sample < 250; sample += 1) {
              const remaining = 4 + Math.floor(random() * 5);
              const { board, player } = randomLatePosition(random, remaining);
              const expected = exactArrayResult(board.map((row) => [...row]), player);
              const actual = chooseBitboardMove(position(board, player), {
                maximumDepth: remaining,
                exactThreshold: remaining,
                tableBits: 15,
              });
              const actualScore = actual.score > 0 ? 1 : actual.score < 0 ? -1 : 0;
              assert.equal(actualScore, expected.score, `sample ${sample}`);
              assert.ok(expected.columns.includes(actual.action.column), `sample ${sample}`);
            }
          });
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          if "exact late-game bitboard results match independent array minimax" not in tests:
              test_path.write_text(tests + addition + '\n')

          Path('.github/workflows/fix-bitboard-winning-mask.yml').unlink()

      - name: Validate
        run: |
          npm ci
          npm run ci
          git diff --check

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix bitboard winning-square generation"
          git push origin HEAD:main
