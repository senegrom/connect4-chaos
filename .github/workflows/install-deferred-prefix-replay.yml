# Verification revision 2: retrigger the one-shot installer.
name: Install deferred Perfect Chaos seed replay

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-deferred-prefix-replay.yml

permissions:
  contents: write

concurrency:
  group: install-deferred-prefix-replay
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/defer-duplicate-prefix-replay
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply the exact reviewed optimization
        run: python3 scripts/patch-deferred-prefix-replay.py

      - name: Prove exact equivalence and fail-closed corruption handling
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/perfect-chaos-prefix.mjs
          npm run chaos:prefix:verify
          npm run chaos:prefix:verify-reference

      - name: Run complete release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser

      - name: Publish the verified production-only branch
        shell: bash
        env:
          TARGET_BRANCH: agent/defer-duplicate-prefix-replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              'format': 'connect4-chaos-deferred-seed-replay-verification-v1',
              'result': 'success',
              'exactSmallEquivalence': True,
              'corruptSeedRejectedAtFinalReplay': True,
              'committedReferenceReplay': True,
              'completeReleaseGates': True,
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
              'publisher': 'main-one-shot-installer',
          }
          path = Path('.audit/deferred-prefix-replay-verification.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/patch-deferred-prefix-replay.py \
            .github/workflows/verify-deferred-prefix-replay.yml
          git add \
            scripts/perfect-chaos-prefix.mjs \
            .audit/deferred-prefix-replay-verification.json
          git diff --check --cached
          git commit -m 'Verify deferred Perfect Chaos seed replay'
          if git push origin HEAD:"$TARGET_BRANCH"; then
            exit 0
          fi

          git fetch origin "$TARGET_BRANCH"
          if git show "origin/$TARGET_BRANCH:.audit/deferred-prefix-replay-verification.json" \
              | jq -e '.result == "success"' >/dev/null \
              && ! git cat-file -e "origin/$TARGET_BRANCH:scripts/patch-deferred-prefix-replay.py" 2>/dev/null \
              && ! git cat-file -e "origin/$TARGET_BRANCH:.github/workflows/verify-deferred-prefix-replay.yml" 2>/dev/null; then
            echo 'A concurrent verifier published an equivalent successful production branch.'
            exit 0
          fi
          echo 'The verified branch changed incompatibly during publication.' >&2
          exit 1
