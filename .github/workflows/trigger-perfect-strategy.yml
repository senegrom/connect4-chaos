name: Trigger perfect-play strategy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-perfect-strategy.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Trigger exact perfect strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch closed two-role strategy generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run generate-perfect-strategy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f handoff_remaining=24 \
            -f workers=8 \
            -f commit_strategy=true
