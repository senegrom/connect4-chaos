name: Solve classic boards through 7x7

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Solve every 4x4 through 7x7 board, or one selected board
        required: true
        default: all
        type: choice
        options:
          - all
          - single
      rows:
        description: Rows for single-board mode (4-7)
        required: true
        default: '6'
        type: string
      columns:
        description: Columns for single-board mode (4-7)
        required: true
        default: '7'
        type: string
      connect:
        description: Pieces required to connect (1-7)
        required: true
        default: '4'
        type: string
      table_bits:
        description: Native transposition-table bits (8-27)
        required: true
        default: '25'
        type: string
      maximum_nodes:
        description: Deterministic node limit per board; 0 means no limit
        required: true
        default: '0'
        type: string
      max_parallel:
        description: Maximum simultaneous board solvers (1-16)
        required: true
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: solve-perfect-classic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      expected_count: ${{ steps.config.outputs.expected_count }}
    steps:
      - name: Validate request and construct board matrix
        id: config
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          ROWS: ${{ inputs.rows }}
          COLUMNS: ${{ inputs.columns }}
          CONNECT: ${{ inputs.connect }}
          TABLE_BITS: ${{ inputs.table_bits }}
          MAXIMUM_NODES: ${{ inputs.maximum_nodes }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          set -euo pipefail
          if ! [[ "$ROWS" =~ ^[4-7]$ ]]; then
            echo 'rows must be an integer from 4 through 7.' >&2
            exit 1
          fi
          if ! [[ "$COLUMNS" =~ ^[4-7]$ ]]; then
            echo 'columns must be an integer from 4 through 7.' >&2
            exit 1
          fi
          if ! [[ "$CONNECT" =~ ^[1-7]$ ]]; then
            echo 'connect must be an integer from 1 through 7.' >&2
            exit 1
          fi
          if ! [[ "$TABLE_BITS" =~ ^([89]|1[0-9]|2[0-7])$ ]]; then
            echo 'table_bits must be an integer from 8 through 27.' >&2
            exit 1
          fi
          if ! [[ "$MAXIMUM_NODES" =~ ^[0-9]{1,16}$ ]] \
              || ! node -e 'const n=Number(process.argv[1]); process.exit(Number.isSafeInteger(n) ? 0 : 1)' \
                "$MAXIMUM_NODES"; then
            echo 'maximum_nodes must be a non-negative safe integer.' >&2
            exit 1
          fi
          if ! [[ "$MAX_PARALLEL" =~ ^([1-9]|1[0-6])$ ]]; then
            echo 'max_parallel must be an integer from 1 through 16.' >&2
            exit 1
          fi
          matrix="$(node --input-type=module <<'NODE'
          const scope = process.env.SCOPE;
          const rows = Number(process.env.ROWS);
          const columns = Number(process.env.COLUMNS);
          const boards = [];
          if (scope === 'all') {
            for (let selectedRows = 4; selectedRows <= 7; selectedRows += 1) {
              for (let selectedColumns = 4; selectedColumns <= 7; selectedColumns += 1) {
                boards.push({ rows: selectedRows, columns: selectedColumns });
              }
            }
          } else {
            boards.push({ rows, columns });
          }
          process.stdout.write(JSON.stringify({ include: boards }));
          NODE
          )"
          count="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).include.length))' "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "expected_count=$count" >> "$GITHUB_OUTPUT"

  solve:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Solve empty board exactly
        shell: bash
        env:
          ROWS: ${{ matrix.rows }}
          COLUMNS: ${{ matrix.columns }}
          CONNECT: ${{ inputs.connect }}
          TABLE_BITS: ${{ inputs.table_bits }}
          MAXIMUM_NODES: ${{ inputs.maximum_nodes }}
        run: |
          set -euo pipefail
          output="generated/perfect-classic-${ROWS}x${COLUMNS}-c${CONNECT}"
          mkdir -p "$output"
          node scripts/perfect-classic.mjs solve \
            --rows "$ROWS" \
            --columns "$COLUMNS" \
            --connect "$CONNECT" \
            --table-bits "$TABLE_BITS" \
            --maximum-nodes "$MAXIMUM_NODES" \
            > "$output/result.json"

      - name: Check published Connect-4 root value
        if: ${{ inputs.connect == '4' }}
        shell: bash
        env:
          ROWS: ${{ matrix.rows }}
          COLUMNS: ${{ matrix.columns }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const rows = Number(process.env.ROWS);
          const columns = Number(process.env.COLUMNS);
          const result = JSON.parse(await readFile(
            `generated/perfect-classic-${rows}x${columns}-c4/result.json`,
            'utf8',
          ));
          const reference = JSON.parse(await readFile(
            'data/perfect-classic-root-values.json',
            'utf8',
          ));
          const expected = reference.boards.find((entry) => (
            entry.rows === rows && entry.columns === columns
          ));
          if (!expected || result.value !== expected.value) {
            throw new Error(
              `Root value mismatch for ${rows}x${columns}: `
              + `${result.value} instead of ${expected?.value}.`,
            );
          }
          NODE

      - name: Upload exact result
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-${{ matrix.rows }}x${{ matrix.columns }}-c${{ inputs.connect }}
          path: generated/perfect-classic-${{ matrix.rows }}x${{ matrix.columns }}-c${{ inputs.connect }}
          if-no-files-found: error
          retention-days: 90

  manifest:
    needs:
      - prepare
      - solve
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download exact board results
        uses: actions/download-artifact@v4
        with:
          pattern: perfect-classic-*
          path: downloaded
          merge-multiple: false

      - name: Build result manifest
        shell: bash
        env:
          CONNECT: ${{ inputs.connect }}
          EXPECTED_COUNT: ${{ needs.prepare.outputs.expected_count }}
        run: |
          set -euo pipefail
          mkdir -p generated/perfect-classic-manifest
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          async function walk(directory) {
            const files = [];
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) files.push(...await walk(path));
              else if (entry.name === 'result.json') files.push(path);
            }
            return files;
          }

          const files = await walk('downloaded');
          const results = [];
          for (const path of files) results.push(JSON.parse(await readFile(path, 'utf8')));
          results.sort((first, second) => (
            first.rows - second.rows || first.columns - second.columns
          ));
          const expectedCount = Number(process.env.EXPECTED_COUNT);
          if (results.length !== expectedCount) {
            throw new Error(`Expected ${expectedCount} results, found ${results.length}.`);
          }
          const manifest = {
            format: 'connect4-classic-exact-matrix-v1',
            connect: Number(process.env.CONNECT),
            results,
          };
          await writeFile(
            'generated/perfect-classic-manifest/manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE

      - name: Upload exact matrix manifest
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-matrix-c${{ inputs.connect }}
          path: generated/perfect-classic-manifest
          if-no-files-found: error
          retention-days: 90
