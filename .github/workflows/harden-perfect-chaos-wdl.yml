name: Harden exact Perfect Chaos WDL verification

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/harden-perfect-chaos-wdl.yml

permissions:
  contents: write

concurrency:
  group: harden-perfect-chaos-wdl
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Harden the exact WDL parser and verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          solver = Path('scripts/perfect-chaos-wdl.py')
          tests = Path('scripts/test-perfect-chaos-wdl.py')

          replace_once(
              solver,
              'import argparse\nimport heapq\nimport json\nfrom collections import deque\n',
              'import argparse\nimport hashlib\nimport heapq\nimport json\n',
          )
          replace_once(
              solver,
              '''def require_index(value: Any, field: str, maximum: int) -> int:\n    if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value < maximum:\n        raise RuntimeError(f"{field} must be an integer in [0, {maximum}).")\n    return value\n\n\ndef parse_graph(path: Path) -> tuple[dict[str, Any], list[Node], list[int]]:\n''',
              '''def require_index(value: Any, field: str, maximum: int) -> int:\n    if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value < maximum:\n        raise RuntimeError(f"{field} must be an integer in [0, {maximum}).")\n    return value\n\n\ndef parse_action(value: Any, field: str) -> dict[str, Any]:\n    action = require_object(value, field)\n    action_type = action.get("type")\n    if action_type not in {"drop", "flip", "rotateCW", "rotateCCW"}:\n        raise RuntimeError(f"{field}.type is invalid.")\n    expected = {"type", "column"} if action_type == "drop" else {"type"}\n    if set(action) != expected:\n        raise RuntimeError(f"{field} has unexpected or missing fields.")\n    if action_type == "drop":\n        column = action["column"]\n        if isinstance(column, bool) or not isinstance(column, int) or column < 0:\n            raise RuntimeError(f"{field}.column must be a non-negative integer.")\n    return dict(action)\n\n\ndef parse_graph(path: Path) -> tuple[dict[str, Any], list[Node], list[int]]:\n''',
          )
          replace_once(solver, '        seen: set[tuple[Any, ...]] = set()\n', '        seen_actions: set[str] = set()\n')
          replace_once(
              solver,
              '''            action = edge.get("action")\n            if action is None:\n                raise RuntimeError(f"graph.nodes[{node_index}].edges[{edge_index}].action is required.")\n''',
              '''            action = parse_action(\n                edge.get("action"),\n                f"graph.nodes[{node_index}].edges[{edge_index}].action",\n            )\n''',
          )
          replace_once(solver, '                identity = ("next", next_node, json.dumps(action, sort_keys=True))\n', '')
          replace_once(solver, '                identity = (field, name, json.dumps(action, sort_keys=True))\n', '')
          replace_once(
              solver,
              '''            if identity in seen:\n                raise RuntimeError(f"graph.nodes[{node_index}] contains a duplicate edge.")\n            seen.add(identity)\n            edges.append(parsed)\n        nodes.append(Node(record["aiTurn"], tuple(edges)))\n\n    raw_roots = graph.get("roots")\n''',
              '''            action_identity = json.dumps(action, sort_keys=True, separators=(",", ":"))\n            if action_identity in seen_actions:\n                raise RuntimeError(f"graph.nodes[{node_index}] contains a duplicate action.")\n            seen_actions.add(action_identity)\n            edges.append(parsed)\n        nodes.append(Node(record["aiTurn"], tuple(edges)))\n\n    for node_index, node in enumerate(nodes):\n        for edge_index, edge in enumerate(node.edges):\n            if edge.next_node is not None and nodes[edge.next_node].ai_turn == node.ai_turn:\n                raise RuntimeError(\n                    f"graph.nodes[{node_index}].edges[{edge_index}] must alternate the side to move."\n                )\n\n    raw_roots = graph.get("roots")\n''',
          )
          replace_once(
              solver,
              '''    def edge_value(edge: Edge) -> int:\n        return edge.value if edge.value is not None else values[edge.next_node]\n\n    for index, node in enumerate(nodes):\n''',
              '''    def edge_value(edge: Edge) -> int:\n        return edge.value if edge.value is not None else values[edge.next_node]\n\n    def edge_rank(edge: Edge) -> int:\n        return 0 if edge.value is not None else ranks[edge.next_node]\n\n    for index, node in enumerate(nodes):\n''',
          )
          replace_once(
              solver,
              '''    counts = {name: sum(value == code for value in values) for name, code in VALUES.items()}\n    root_values = [VALUE_NAMES[values[index]] for index in roots]\n    return {\n''',
              '''    all_chosen_actions_optimal = True\n    ranked_winning_progress_verified = True\n    draw_region_closed_verified = True\n    for index, node in enumerate(nodes):\n        edge_values = [edge_value(edge) for edge in node.edges]\n        if node.ai_turn:\n            selected = best_edges[index]\n            if selected < 0 or edge_values[selected] != max(edge_values):\n                all_chosen_actions_optimal = False\n        if values[index] == VALUES["win"]:\n            if node.ai_turn:\n                selected_edge = node.edges[best_edges[index]]\n                if edge_value(selected_edge) != VALUES["win"] or edge_rank(selected_edge) >= ranks[index]:\n                    ranked_winning_progress_verified = False\n            elif any(\n                edge_value(edge) != VALUES["win"] or edge_rank(edge) >= ranks[index]\n                for edge in node.edges\n            ):\n                ranked_winning_progress_verified = False\n        elif values[index] == VALUES["draw"]:\n            if node.ai_turn:\n                if not any(value == VALUES["draw"] for value in edge_values):\n                    draw_region_closed_verified = False\n            elif min(edge_values) != VALUES["draw"]:\n                draw_region_closed_verified = False\n\n    if not all_chosen_actions_optimal:\n        raise RuntimeError("The emitted AI policy contains a suboptimal action.")\n    if not ranked_winning_progress_verified:\n        raise RuntimeError("Winning ranks do not make strict finite progress.")\n    if not draw_region_closed_verified:\n        raise RuntimeError("The unresolved draw region is not closed under optimal play.")\n\n    counts = {name: sum(value == code for value in values) for name, code in VALUES.items()}\n    root_values = [VALUE_NAMES[values[index]] for index in roots]\n    return {\n''',
          )
          replace_once(
              solver,
              '''        "allChosenActionsOptimal": True,\n        "rankedWinningProgressVerified": True,\n        "drawRegionClosedVerified": True,\n''',
              '''        "allChosenActionsOptimal": all_chosen_actions_optimal,\n        "rankedWinningProgressVerified": ranked_winning_progress_verified,\n        "drawRegionClosedVerified": draw_region_closed_verified,\n''',
          )
          replace_once(
              solver,
              '''def solve_file(input_path: Path, output_path: Path | None = None) -> dict[str, Any]:\n    graph, nodes, roots = parse_graph(input_path)\n    solved = solve_nodes(nodes, roots)\n    result = {\n        "format": SOLUTION_FORMAT,\n        "objective": OBJECTIVE,\n        "role": graph["role"],\n        "roots": roots,\n        **solved,\n    }\n''',
              '''def solve_file(input_path: Path, output_path: Path | None = None) -> dict[str, Any]:\n    graph, nodes, roots = parse_graph(input_path)\n    graph_bytes = input_path.read_bytes()\n    solved = solve_nodes(nodes, roots)\n    graph_edges = sum(edge.next_node is not None for node in nodes for edge in node.edges)\n    terminal_edges = sum(edge.source == "terminal" for node in nodes for edge in node.edges)\n    oracle_edges = sum(edge.source == "oracle" for node in nodes for edge in node.edges)\n    result = {\n        "format": SOLUTION_FORMAT,\n        "objective": OBJECTIVE,\n        "role": graph["role"],\n        "sourceGraph": {\n            "sha256": hashlib.sha256(graph_bytes).hexdigest(),\n            "nodes": len(nodes),\n            "edges": graph_edges + terminal_edges + oracle_edges,\n            "graphEdges": graph_edges,\n            "terminalEdges": terminal_edges,\n            "oracleEdges": oracle_edges,\n        },\n        "roots": roots,\n        **solved,\n    }\n''',
          )

          replace_once(tests, 'import json\nimport subprocess\n', 'import hashlib\nimport json\nimport subprocess\n')
          replace_once(
              tests,
              '''    if stdout != saved:\n        raise AssertionError(f"W/D/L solver output mismatch for {name}")\n    return saved\n''',
              '''    if stdout != saved:\n        raise AssertionError(f"W/D/L solver output mismatch for {name}")\n    source_graph = saved.get("sourceGraph")\n    if not isinstance(source_graph, dict):\n        raise AssertionError(f"W/D/L solver did not bind {name} to its source graph")\n    if source_graph.get("sha256") != hashlib.sha256(source.read_bytes()).hexdigest():\n        raise AssertionError(f"W/D/L solver source hash mismatch for {name}")\n    if source_graph.get("nodes") != len(value["nodes"]):\n        raise AssertionError(f"W/D/L solver node count mismatch for {name}")\n    if source_graph.get("edges") != sum(len(node["edges"]) for node in value["nodes"]):\n        raise AssertionError(f"W/D/L solver edge count mismatch for {name}")\n    return saved\n''',
          )
          replace_once(
              tests,
              '''        require_failure(\n            script,\n            root,\n            "bad-objective",\n''',
              '''        require_failure(\n            script,\n            root,\n            "duplicate-action",\n            graph([{\n                "aiTurn": True,\n                "edges": [\n                    {"terminal": "draw", "action": {"type": "flip"}},\n                    {"terminal": "win", "action": {"type": "flip"}},\n                ],\n            }]),\n            "duplicate action",\n        )\n        require_failure(\n            script,\n            root,\n            "invalid-action",\n            graph([{\n                "aiTurn": True,\n                "edges": [{"terminal": "draw", "action": {"type": "teleport"}}],\n            }]),\n            "action.type is invalid",\n        )\n        require_failure(\n            script,\n            root,\n            "negative-drop",\n            graph([{\n                "aiTurn": True,\n                "edges": [{"terminal": "draw", "action": {"type": "drop", "column": -1}}],\n            }]),\n            ".column must be a non-negative integer",\n        )\n        require_failure(\n            script,\n            root,\n            "same-owner-edge",\n            graph([\n                {"aiTurn": True, "edges": [{"next": 1, "action": {"type": "drop", "column": 0}}]},\n                {"aiTurn": True, "edges": [{"terminal": "draw", "action": {"type": "flip"}}]},\n            ]),\n            "must alternate the side to move",\n        )\n        require_failure(\n            script,\n            root,\n            "bad-objective",\n''',
          )
          PY

          python3 -m py_compile scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py
          python3 scripts/test-perfect-chaos-wdl.py
          node scripts/perfect-chaos-wdl-crosscheck.mjs
          git diff --check

      - name: Commit the validated WDL hardening and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git rm .github/workflows/harden-perfect-chaos-wdl.yml
          git add scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py
          git commit -m 'Harden exact Perfect Chaos WDL verification'
          git push origin HEAD:agent/perfect-chaos-16-recovery
