name: Harden exact Perfect Chaos WDL verification

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/harden-perfect-chaos-wdl.yml
      - scripts/apply-perfect-chaos-wdl-hardening.py

permissions:
  contents: write

concurrency:
  group: harden-perfect-chaos-wdl
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply and verify the WDL hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-perfect-chaos-wdl-hardening.py
          python3 scripts/apply-perfect-chaos-wdl-hardening.py
          python3 -m py_compile scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py
          python3 scripts/test-perfect-chaos-wdl.py
          node scripts/perfect-chaos-wdl-crosscheck.mjs
          npm run check
          git diff --check

      - name: Commit the validated hardening and remove the installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git rm .github/workflows/harden-perfect-chaos-wdl.yml
          git rm scripts/apply-perfect-chaos-wdl-hardening.py
          git add scripts/perfect-chaos-wdl.py scripts/test-perfect-chaos-wdl.py
          git commit -m 'Harden exact Perfect Chaos WDL verification'
          git push origin HEAD:agent/perfect-chaos-16-recovery
