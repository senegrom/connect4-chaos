name: Install adaptive Perfect Chaos preparation recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-adaptive-chaos-preparation.yml

permissions:
  contents: write

concurrency:
  group: install-adaptive-chaos-preparation
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/adaptive-chaos-preparation
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply the reviewed integration
        run: python3 scripts/patch-adaptive-chaos-recovery.py

      - name: Run focused fail-closed tests and parse affected workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/perfect-chaos-main-supervisor.py \
            scripts/perfect-chaos-main-active-runs.py \
            scripts/perfect-chaos-main-recovery.py \
            scripts/test-perfect-chaos-main-supervisor.py \
            scripts/test-perfect-chaos-main-active-runs.py \
            scripts/test-perfect-chaos-main-recovery.py
          python3 scripts/test-perfect-chaos-main-supervisor.py
          python3 scripts/test-perfect-chaos-main-active-runs.py
          python3 scripts/test-perfect-chaos-main-recovery.py
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true); puts path }' \
            .github/workflows/ci.yml \
            .github/workflows/supervise-perfect-chaos-main.yml \
            .github/workflows/recover-perfect-chaos-main-preparation.yml

      - name: Run complete exact and browser release gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser

      - name: Publish the fully verified production diff to the PR branch
        shell: bash
        env:
          TARGET_BRANCH: agent/adaptive-chaos-preparation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              'format': 'connect4-chaos-adaptive-preparation-verification-v1',
              'result': 'success',
              'patch': 'success',
              'focused': 'success',
              'yaml': 'success',
              'complete': 'success',
              'sourceSha': os.environ['GITHUB_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'recordedAt': datetime.now(timezone.utc).isoformat(),
              'publisher': 'main-one-shot-installer',
          }
          path = Path('.audit/adaptive-chaos-preparation-verification.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            scripts/patch-adaptive-chaos-recovery.py \
            .github/workflows/verify-adaptive-chaos-preparation.yml
          git add \
            .github/workflows/ci.yml \
            .github/workflows/supervise-perfect-chaos-main.yml \
            scripts/perfect-chaos-main-recovery.py \
            scripts/test-perfect-chaos-main-recovery.py \
            .audit/adaptive-chaos-preparation-verification.json
          git diff --check --cached
          git commit -m 'Verify adaptive Perfect Chaos preparation recovery'
          if git push origin HEAD:"$TARGET_BRANCH"; then
            exit 0
          fi

          git fetch origin "$TARGET_BRANCH"
          if git show "origin/$TARGET_BRANCH:.audit/adaptive-chaos-preparation-verification.json" \
              | jq -e '.result == "success"' >/dev/null \
              && ! git cat-file -e "origin/$TARGET_BRANCH:scripts/patch-adaptive-chaos-recovery.py" 2>/dev/null \
              && ! git cat-file -e "origin/$TARGET_BRANCH:.github/workflows/verify-adaptive-chaos-preparation.yml" 2>/dev/null; then
            echo 'A concurrent verifier published an equivalent successful production branch.'
            exit 0
          fi
          echo 'The verified branch changed incompatibly during publication.' >&2
          exit 1
