name: Remove temporary supervisor publication branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-temporary-supervisor-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Delete only empty temporary branch refs
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            agent/main-chaos-supervisor \
            agent/main-chaos-supervisor-2 \
            agent/main-chaos-supervisor-3 \
            agent/main-chaos-supervisor-4 \
            agent/main-chaos-supervisor-5 \
            agent/main-chaos-supervisor-6
          do
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            if ! gh api "repos/$REPOSITORY/branches/$encoded" >/dev/null 2>&1; then
              continue
            fi
            comparison="$(gh api "repos/$REPOSITORY/compare/main...$encoded")"
            ahead="$(jq -r '.ahead_by' <<< "$comparison")"
            if [[ "$ahead" != 0 ]]; then
              echo "$branch is $ahead commit(s) ahead of main; refusing deletion." >&2
              exit 1
            fi
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch."
          done

      - name: Remove this one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          workflow=.github/workflows/cleanup-temporary-supervisor-branches.yml
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [[ ! -f "$workflow" ]]; then
              exit 0
            fi
            git rm "$workflow"
            git commit -m 'Remove completed temporary-branch cleanup workflow'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not remove the completed cleanup workflow.' >&2
          exit 1
