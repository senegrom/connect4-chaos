name: Kick exact proof supervisors

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kick-exact-campaigns.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: kick-exact-campaigns
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch the fail-closed supervisors
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run supervise-perfect-chaos-main.yml --repo "$repo" --ref main

          mapfile -t classic < <(find .github/workflows -maxdepth 1 -type f \
            \( -iname '*recover*classic*7x7*.yml' -o -iname '*classic*7x7*recover*.yml' \) \
            -printf '%f\n' | sort -u)
          if (( ${#classic[@]} > 1 )); then
            printf 'Ambiguous Classic recovery workflows: %s\n' "${classic[*]}" >&2
            exit 1
          fi
          if (( ${#classic[@]} == 1 )); then
            gh workflow run "${classic[0]}" --repo "$repo" --ref main
          fi

          python3 - "$before" "${classic[0]:-}" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          record = {
              'format': 'connect4-exact-campaign-kick-v1',
              'sourceSha': os.environ['GITHUB_SHA'],
              'requestedAt': sys.argv[1],
              'recordedAt': datetime.now(timezone.utc).isoformat(),
              'chaosSupervisor': 'supervise-perfect-chaos-main.yml',
              'classicRecovery': sys.argv[2] or None,
              'semantics': 'dispatch-only; each target independently fails closed',
          }
          Path('/tmp/exact-campaign-kick.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Publish the dispatch audit and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/exact-campaign-kick.json .audit/exact-campaign-kick.json
            git rm --ignore-unmatch .github/workflows/kick-exact-campaigns.yml
            git add .audit/exact-campaign-kick.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Record exact proof supervisor dispatch'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the exact-campaign dispatch audit.' >&2
          exit 1
