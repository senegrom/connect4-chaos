name: Bootstrap Connect 4 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore verified source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/connect4-source.tar.gz.b64
          base64 --decode /tmp/connect4-source.tar.gz.b64 > /tmp/connect4-source.tar.gz
          echo "d20b3b1c579190950ac90c18d0e821118d07b6132164b42c9fb218ca0d772547  /tmp/connect4-source.tar.gz" | sha256sum --check -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/connect4-source.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Initial release of Connect 4: Chaos Edition"
          git push origin HEAD:main
