name: Optimize and generate hard classic policies

on:
  push:
    branches:
      - agent/perfect-classic-7x7
    paths:
      - .github/workflows/optimize-perfect-classic-policy.yml

permissions:
  contents: write

concurrency:
  group: optimize-perfect-classic-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-7x7
          fetch-depth: 0

      - name: Apply exact-search hot-path optimizations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('native/perfect-classic-policy.cpp')
          source = path.read_text()

          alignment = '''bool hasAlignment(const Geometry& geometry, std::uint64_t bits) {
            for (const int direction : geometry.directions) {
              std::uint64_t run = bits;
              for (int offset = 1; offset < geometry.connect && run != 0; ++offset) {
                run &= bits >> (offset * direction);
              }
              if (run != 0) return true;
            }
            return false;
          }
          '''
          alignment = '\n'.join(line[10:] if line.startswith('          ') else line for line in alignment.splitlines()) + '\n'
          if source.count(alignment) != 1:
            raise SystemExit('Could not locate hasAlignment for optimization.')
          winning = alignment + '''
          std::uint64_t winningPosition(
              const Geometry& geometry,
              std::uint64_t pieces,
              std::uint64_t mask) {
            if (geometry.connect != 4) return 0;
            std::uint64_t result = (pieces << 1) & (pieces << 2) & (pieces << 3);
            for (const int direction : {geometry.rows, geometry.stride, geometry.rows + 2}) {
              std::uint64_t pair =
                  (pieces << direction) & (pieces << (2 * direction));
              result |= pair & (pieces << (3 * direction));
              result |= pair & (pieces >> direction);
              pair = (pieces >> direction) & (pieces >> (2 * direction));
              result |= pair & (pieces << direction);
              result |= pair & (pieces >> (3 * direction));
            }
            return result & (geometry.boardMask ^ mask);
          }
          '''
          winning = '\n'.join(line[10:] if line.startswith('          ') else line for line in winning.splitlines()) + '\n'
          source = source.replace(alignment, winning)

          threat_pattern = re.compile(
              r'std::uint64_t immediateWinningMoves\(\n'
              r'.*?\n}\n\nstruct TableEntry \{',
              re.S,
          )
          threat_replacement = '''std::uint64_t immediateWinningMoves(
              const Geometry& geometry,
              const Position& position,
              std::uint64_t pieces) {
            const std::uint64_t possible = possibleMoves(geometry, position.mask);
            if (geometry.connect == 4) {
              return possible & winningPosition(geometry, pieces, position.mask);
            }
            std::uint64_t winning = 0;
            for (const int column : geometry.columnOrder) {
              const std::uint64_t move = moveForColumn(geometry, position.mask, column);
              if ((possible & move) != 0 && hasAlignment(geometry, pieces | move)) winning |= move;
            }
            return winning;
          }

          std::uint64_t immediateWinningMoves(const Geometry& geometry, const Position& position) {
            return immediateWinningMoves(geometry, position, position.current);
          }

          std::uint64_t possibleNonLosingMoves(const Geometry& geometry, const Position& position) {
            std::uint64_t possible = possibleMoves(geometry, position.mask);
            const std::uint64_t opponent = position.current ^ position.mask;
            if (geometry.connect == 4) {
              const std::uint64_t opponentWinning =
                  winningPosition(geometry, opponent, position.mask);
              const std::uint64_t forced = possible & opponentWinning;
              if (forced != 0) {
                if ((forced & (forced - 1)) != 0) return 0;
                possible = forced;
              }
              return possible & ~(opponentWinning >> 1);
            }

            const std::uint64_t opponentWins =
                immediateWinningMoves(geometry, position, opponent);
            if (opponentWins != 0) {
              if ((opponentWins & (opponentWins - 1)) != 0) return 0;
              possible = opponentWins;
            }
            std::uint64_t safe = 0;
            for (const int column : geometry.columnOrder) {
              const std::uint64_t move = moveForColumn(geometry, position.mask, column);
              if ((possible & move) == 0) continue;
              if (hasAlignment(geometry, position.current | move)) {
                safe |= move;
                continue;
              }
              const Position child = play(position, move);
              if (immediateWinningMoves(geometry, child) == 0) safe |= move;
            }
            return safe;
          }

          struct TableEntry {'''
          threat_replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in threat_replacement.splitlines()
          )
          source, count = threat_pattern.subn(threat_replacement, source, count=1)
          if count != 1:
            raise SystemExit(f'Could not replace threat generation ({count}).')

          candidate = '''struct Candidate {
            int column;
            std::uint64_t move;
            int historyIndex;
            int order;
          };
          '''
          candidate = '\n'.join(line[10:] if line.startswith('          ') else line for line in candidate.splitlines()) + '\n'
          if source.count(candidate) != 1:
            raise SystemExit('Could not locate Candidate definition.')
          candidate_list = candidate + '''
          struct CandidateList {
            std::array<Candidate, 7> values{};
            int count = 0;

            Candidate* begin() { return values.data(); }
            Candidate* end() { return values.data() + count; }
            const Candidate* begin() const { return values.data(); }
            const Candidate* end() const { return values.data() + count; }
          };
          '''
          candidate_list = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in candidate_list.splitlines()
          ) + '\n'
          source = source.replace(candidate, candidate_list)

          move_values_pattern = re.compile(
              r'  MoveValues moveValues\(const Position& position\) \{\n.*?\n  \}\n\n'
              r'  std::uint64_t nodes = 0;',
              re.S,
          )
          move_values = '''  MoveValues moveValues(const Position& position) {
            const std::uint64_t possible = possibleMoves(geometry_, position.mask);
            if (possible == 0) return {DRAW, 0};

            const std::uint64_t winning = immediateWinningMoves(geometry_, position);
            if (winning != 0) {
              for (const int column : geometry_.columnOrder) {
                if ((winning & moveForColumn(geometry_, position.mask, column)) != 0) {
                  return {WIN, static_cast<std::uint8_t>(1u << column)};
                }
              }
            }

            const std::uint64_t safe = possibleNonLosingMoves(geometry_, position);
            if (safe == 0) {
              for (const int column : geometry_.columnOrder) {
                if ((possible & moveForColumn(geometry_, position.mask, column)) != 0) {
                  return {LOSS, static_cast<std::uint8_t>(1u << column)};
                }
              }
            }

            const int value = solve(position);
            const CandidateList candidates = orderedMoves(position, safe);
            for (const Candidate& candidate : candidates) {
              const int childValue = solve(play(position, candidate.move));
              const int moveValue = childValue == DRAW ? DRAW : -childValue;
              if (moveValue == value) {
                return {value, static_cast<std::uint8_t>(1u << candidate.column)};
              }
            }
            throw std::runtime_error("exact solver could not recover an optimal move");
          }

            std::uint64_t nodes = 0;'''
          move_values = '\n'.join(
              line[8:] if line.startswith('        ') else line
              for line in move_values.splitlines()
          )
          source, count = move_values_pattern.subn(move_values, source, count=1)
          if count != 1:
            raise SystemExit(f'Could not replace moveValues ({count}).')

          ordered_pattern = re.compile(
              r'  std::vector<Candidate> orderedMoves\(const Position& position, std::uint64_t moves\) \{\n'
              r'.*?\n  \}\n\n  int search',
              re.S,
          )
          ordered = '''  CandidateList orderedMoves(const Position& position, std::uint64_t moves) {
            CandidateList candidates;
            for (const int column : geometry_.columnOrder) {
              const std::uint64_t move = moveForColumn(geometry_, position.mask, column);
              if ((moves & move) == 0) continue;
              const std::uint64_t nextMask = position.mask | move;
              int futureWins = 0;
              if (geometry_.connect == 4) {
                futureWins = __builtin_popcountll(
                    winningPosition(geometry_, position.current | move, nextMask));
              } else {
                for (const int futureColumn : geometry_.columnOrder) {
                  const std::uint64_t future =
                      moveForColumn(geometry_, nextMask, futureColumn);
                  if (future != 0
                      && hasAlignment(geometry_, position.current | move | future)) {
                    ++futureWins;
                  }
                }
              }
              const int index = historyIndex(position, column);
              const int centrality = static_cast<int>(
                  (geometry_.columns
                    - std::abs(column - (geometry_.columns - 1) / 2.0)) * 8);
              Candidate candidate{
                  column,
                  move,
                  index,
                  history_[index] + futureWins * 128 + centrality,
              };
              int insertion = candidates.count;
              while (insertion > 0) {
                const Candidate& previous = candidates.values[insertion - 1];
                if (previous.order > candidate.order
                    || (previous.order == candidate.order
                        && previous.column < candidate.column)) break;
                candidates.values[insertion] = previous;
                --insertion;
              }
              candidates.values[insertion] = candidate;
              ++candidates.count;
            }
            return candidates;
          }

            int search'''
          ordered = '\n'.join(
              line[8:] if line.startswith('        ') else line
              for line in ordered.splitlines()
          )
          source, count = ordered_pattern.subn(ordered, source, count=1)
          if count != 1:
            raise SystemExit(f'Could not replace orderedMoves ({count}).')

          search_old = '''    std::vector<Candidate> tried;
            for (const Candidate& candidate : orderedMoves(position, nonLosing)) {
              const int childScore = search(play(position, candidate.move), -beta, -alpha);
              const int score = childScore == DRAW ? DRAW : -childScore;
              if (score >= beta) {
                ++cutoffs;
                for (const Candidate& previous : tried) --history_[previous.historyIndex];
                history_[candidate.historyIndex] += static_cast<int>(tried.size());
                table_.storeLower(key, score);
                return score;
              }
              tried.push_back(candidate);
              if (score > alpha) alpha = score;
            }
          '''
          search_old = '\n'.join(line[8:] if line.startswith('        ') else line for line in search_old.splitlines()) + '\n'
          if source.count(search_old) != 1:
            raise SystemExit('Could not locate search tried-move block.')
          search_new = '''    std::array<int, 7> triedHistory{};
            int triedCount = 0;
            const CandidateList candidates = orderedMoves(position, nonLosing);
            for (const Candidate& candidate : candidates) {
              const int childScore = search(play(position, candidate.move), -beta, -alpha);
              const int score = childScore == DRAW ? DRAW : -childScore;
              if (score >= beta) {
                ++cutoffs;
                for (int index = 0; index < triedCount; ++index) {
                  --history_[triedHistory[index]];
                }
                history_[candidate.historyIndex] += triedCount;
                table_.storeLower(key, score);
                return score;
              }
              triedHistory[triedCount++] = candidate.historyIndex;
              if (score > alpha) alpha = score;
            }
          '''
          search_new = '\n'.join(line[8:] if line.startswith('        ') else line for line in search_new.splitlines()) + '\n'
          source = source.replace(search_old, search_new)

          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify optimized source
        run: |
          node --check scripts/perfect-classic-policy.mjs
          npm run classic:policy:verify

      - name: Commit optimization
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/perfect-classic-policy.cpp
          git commit -m 'Optimize classic policy exact search'
          git push origin HEAD:agent/perfect-classic-7x7
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  generate:
    needs: optimize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - rows: 5
            columns: 7
          - rows: 6
            columns: 6
          - rows: 7
            columns: 6
          - rows: 7
            columns: 7

    steps:
      - name: Check out optimized branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-7x7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate and independently replay both roles
        shell: bash
        env:
          ROWS: ${{ matrix.rows }}
          COLUMNS: ${{ matrix.columns }}
        run: |
          set -euo pipefail
          output="generated/perfect-classic-${ROWS}x${COLUMNS}-c4"
          mkdir -p "$output"
          node scripts/perfect-classic-policy.mjs generate \
            --rows "$ROWS" \
            --columns "$COLUMNS" \
            --connect 4 \
            --role both \
            --handoff-remaining 24 \
            --table-bits 26 \
            --maximum-nodes 0 \
            --maximum-states 100000000 \
            --verify-table-bits 23 \
            --output "$output" \
            > "$output/generation.json"

      - name: Upload verified board policy
        uses: actions/upload-artifact@v4
        with:
          name: perfect-classic-policy-${{ matrix.rows }}x${{ matrix.columns }}-c4
          path: generated/perfect-classic-${{ matrix.rows }}x${{ matrix.columns }}-c4
          if-no-files-found: error
          retention-days: 90
