name: Validate Perfect Chaos Red root catalog at 25,425

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/validate-perfect-chaos-root-catalog-red-25425.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: validate-perfect-chaos-root-catalog-red-25425
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      FIRST_RUN: '31758014522'
      FIRST_SHA: a19c166bb39e64095de0a72f3a32d84e557bd34b
      FIRST_RESULT: perfect-chaos-red-18-bootstrap-round
      FIRST_RESULT_ID: '9204111833'
      FIRST_RESULT_DIGEST: sha256:47a3aa585428b01e37ce0285ad2951de8864156adc0c1bd3167dbaf88b1d1385
      SECOND_RUN: '31759998497'
      SECOND_SHA: 3c7ab55a076247e6d2e52a097e7a6e3cf753a4db
      SECOND_RESULT: perfect-chaos-red-18-16242-round
      SECOND_RESULT_ID: '9207558460'
      SECOND_RESULT_DIGEST: sha256:bb9f0bb0aa3783e2bc54f219fac9067a69de3cd3975236b5e1f81dbaef9c39c5
      SECOND_EVIDENCE: perfect-chaos-red-18-16242-evidence
      SECOND_EVIDENCE_ID: '9207575385'
      SECOND_EVIDENCE_DIGEST: sha256:af647c8b8eec05cf9039c714d08756e03a7c5c3ebb466c1351fb0c134cb48bb4
      REPORT_ARTIFACT: perfect-chaos-red-root-catalog-25425-validation
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/perfect-chaos-16-recovery
          fetch-depth: 0

      - name: Pin both source runs and all exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          pin_run() {
            local run="$1" expected_sha="$2"
            read -r sha status conclusion < <(
              gh api "repos/$REPO/actions/runs/$run" \
                --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
            )
            test "$sha" = "$expected_sha"
            test "$status" = completed
            test "$conclusion" = success
          }
          pin_artifact() {
            local run="$1" name="$2" expected_id="$3" expected_digest="$4"
            read -r id digest expired < <(
              gh api --paginate "repos/$REPO/actions/runs/$run/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name == \"$name\") | [.id, (.digest // \"\"), .expired] | @tsv"
            )
            test "$id" = "$expected_id"
            test "$digest" = "$expected_digest"
            test "$expired" = false
          }
          pin_run "$FIRST_RUN" "$FIRST_SHA"
          pin_run "$SECOND_RUN" "$SECOND_SHA"
          pin_artifact "$FIRST_RUN" "$FIRST_RESULT" "$FIRST_RESULT_ID" "$FIRST_RESULT_DIGEST"
          pin_artifact "$SECOND_RUN" "$SECOND_RESULT" "$SECOND_RESULT_ID" "$SECOND_RESULT_DIGEST"
          pin_artifact "$SECOND_RUN" "$SECOND_EVIDENCE" "$SECOND_EVIDENCE_ID" "$SECOND_EVIDENCE_DIGEST"

      - name: Download and strictly verify both exact rounds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf first second evidence catalog-1 partition catalog-2 report
          mkdir first second evidence report
          gh run download "$FIRST_RUN" --repo "$REPO" --name "$FIRST_RESULT" --dir first
          gh run download "$SECOND_RUN" --repo "$REPO" --name "$SECOND_RESULT" --dir second
          gh run download "$SECOND_RUN" --repo "$REPO" --name "$SECOND_EVIDENCE" --dir evidence
          python3 scripts/perfect-chaos-artifacts.py verify --directory first
          python3 scripts/perfect-chaos-artifacts.py verify --directory second
          python3 scripts/perfect-chaos-artifacts.py verify --directory evidence
          for file in campaign-summary.json classification.json new-reject-16.bin reject-16.bin; do
            cmp "second/$file" "evidence/$file"
          done

      - name: Reconstruct and verify the reusable root catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-root-catalog.py bootstrap \
            --input first/red-prepared/14-16.frontier.bin \
            --rejected first/new-reject-16.bin \
            --output catalog-1 \
            > report/bootstrap.json
          python3 scripts/perfect-chaos-root-catalog.py partition \
            --frontier second/red-prepared/14-16.frontier.bin \
            --catalog catalog-1 \
            --output partition \
            > report/partition.json
          python3 scripts/perfect-chaos-root-catalog.py update \
            --catalog catalog-1 \
            --unknown partition/unknown.bin \
            --new-rejected second/new-reject-16.bin \
            --classification-summary second/classification.json \
            --classification-audit evidence/raw-shard-audit.json \
            --output catalog-2 \
            > report/update.json
          python3 scripts/perfect-chaos-root-catalog.py verify \
            --directory catalog-2 \
            > report/verify.json
          cmp catalog-2/rejected.bin second/reject-16.bin

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          bootstrap = json.loads(Path('report/bootstrap.json').read_text())
          partition = json.loads(Path('report/partition.json').read_text())
          update = json.loads(Path('report/update.json').read_text())
          verified = json.loads(Path('report/verify.json').read_text())
          if bootstrap['counts'] != {
              'classifiedRoots': 339682,
              'inputRoots': 339682,
              'newRejectedRoots': 16242,
              'newSafeRoots': 323440,
              'rejectedRoots': 16242,
              'safeRoots': 323440,
          }:
              raise RuntimeError(f'Unexpected bootstrap counts: {bootstrap["counts"]}')
          if partition['counts'] != {
              'currentRoots': 341689,
              'knownSafeRoots': 318981,
              'rejectedHits': 0,
              'unknownRoots': 22708,
          }:
              raise RuntimeError(f'Unexpected partition counts: {partition["counts"]}')
          if partition['reusePercent'] != 93.354239:
              raise RuntimeError(f'Unexpected reuse rate: {partition["reusePercent"]}')
          required_update = {
              'classifiedRoots': 362390,
              'newRejectedRoots': 9183,
              'newSafeRoots': 13525,
              'previousRejectedRoots': 16242,
              'previousSafeRoots': 323440,
              'rejectedRoots': 25425,
              'safeRoots': 336965,
              'unknownRoots': 22708,
          }
          if update['counts'] != required_update:
              raise RuntimeError(f'Unexpected update counts: {update["counts"]}')
          if verified.get('status') != 'pass' or verified.get('safeRoots') != 336965 \
                  or verified.get('rejectedRoots') != 25425:
              raise RuntimeError(f'Unexpected verification: {verified}')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          report = {
              'format': 'connect4-chaos-root-catalog-validation-v1',
              'status': 'pass',
              'role': 'red',
              'boundary': 16,
              'firstRound': {
                  'run': int(os.environ['FIRST_RUN']),
                  'sha': os.environ['FIRST_SHA'],
                  'artifact': os.environ['FIRST_RESULT'],
                  'artifactId': int(os.environ['FIRST_RESULT_ID']),
                  'digest': os.environ['FIRST_RESULT_DIGEST'],
              },
              'secondRound': {
                  'run': int(os.environ['SECOND_RUN']),
                  'sha': os.environ['SECOND_SHA'],
                  'resultArtifact': os.environ['SECOND_RESULT'],
                  'resultArtifactId': int(os.environ['SECOND_RESULT_ID']),
                  'resultDigest': os.environ['SECOND_RESULT_DIGEST'],
                  'evidenceArtifact': os.environ['SECOND_EVIDENCE'],
                  'evidenceArtifactId': int(os.environ['SECOND_EVIDENCE_ID']),
                  'evidenceDigest': os.environ['SECOND_EVIDENCE_DIGEST'],
              },
              'counts': {
                  'priorClassifiedRoots': 339682,
                  'currentRoots': 341689,
                  'knownSafeRootsReused': 318981,
                  'unknownRoots': 22708,
                  'newSafeRoots': 13525,
                  'newRejectedRoots': 9183,
                  'catalogSafeRoots': 336965,
                  'catalogRejectedRoots': 25425,
              },
              'reusePercent': partition['reusePercent'],
              'cumulativeRejectByteIdentical': True,
              'catalogManifestSha256': digest('catalog-2/catalog-manifest.json'),
              'catalogSafeSha256': digest('catalog-2/safe.bin'),
              'catalogRejectedSha256': digest('catalog-2/rejected.bin'),
          }
          Path('report/root-catalog-validation.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          cp -a catalog-2 report/catalog
          cp -a partition/partition-manifest.json report/
          python3 scripts/perfect-chaos-artifacts.py write --directory report
          python3 scripts/perfect-chaos-artifacts.py verify --directory report

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_ARTIFACT }}
          path: report
          if-no-files-found: error
          retention-days: 30

      - name: Retire this one-shot validator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf first second evidence catalog-1 partition catalog-2 report
          git rm .github/workflows/validate-perfect-chaos-root-catalog-red-25425.yml
          git config user.name 'senegrom'
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git commit -m 'Validate reusable Perfect Chaos root catalog'
          git push origin HEAD:agent/perfect-chaos-16-recovery
