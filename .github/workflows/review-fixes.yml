name: Isolated review fix validation
on:
  push:
    branches: [review/fix-b8caed9-20260912]
permissions:
  contents: read
concurrency:
  group: review-fix-b8caed9
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact-base patch and commit the tree locally
        run: |
          python .review-fix.py
          python .review-native.py
          rm .review-fix.py .review-native.py .github/workflows/review-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Validate native portability and search accounting fixes'
          git rev-parse 'HEAD^{tree}'
          git archive --format=zip --output "$RUNNER_TEMP/review-source.zip" HEAD neural native scripts tests .github src docs package.json data/perfect-classic-root-values.json
      - name: Linux full application and native suite
        if: matrix.os == 'ubuntu-latest'
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          NEURAL_MODEL_DOWNLOAD: '1'
        run: |
          npm ci
          npm run ci
      - name: CPU neural regressions
        if: matrix.os == 'ubuntu-latest'
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.2.6
          python -m neural.test_search_quality
          python -m neural.test_search_settings
          python -m neural.test_review
          python -m neural.test_rereview
          python -m neural.test_optimizations
          python -m neural.test_training_recovery
          python -m neural.test_training_safety
          python -m neural.test_export_onnx
          python -m neural.test_gpu_env
          python -c "from neural.test_gpu_mcts import test_repetition; test_repetition('cpu')"
          python -m neural.test_modal_loop
          python -m neural.test_modal_arena
          python -m neural.test_search_history
      - name: Real Darwin native build and solver tests
        if: matrix.os == 'macos-latest'
        env:
          CXX: clang++
        run: |
          node --test tests/native-toolchain.test.mjs tests/perfect-chaos-layered.test.js tests/perfect-chaos-paired.test.js tests/perfect-chaos-remote-lookup.test.js tests/perfect-chaos-classification.test.js tests/perfect-chaos-incremental-repair.test.js tests/perfect-chaos-policy-partition.test.js tests/perfect-chaos-policy-slice.test.js
          npm run classic:verify
          npm run classic:policy:verify
          npm run chaos:prefix:verify
          node scripts/perfect-chaos-native.mjs
      - name: Retain the exact tested source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-source-${{ matrix.os }}
          path: ${{ runner.temp }}/review-source.zip
          if-no-files-found: error
          retention-days: 7
  candidate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
      - name: Publish validated candidate to the isolated branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/review/fix-b8caed9-20260912'
          python .review-fix.py
          python .review-native.py
          cp .github/workflows/ci.yml .review-ci.yml
          cp .github/workflows/verify-perfect-classic-policies.yml .review-classic.yml
          git restore .github/workflows/ci.yml .github/workflows/verify-perfect-classic-policies.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Validated native portability and neural evaluation fixes'
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git push origin HEAD:refs/heads/review/fix-b8caed9-20260912
