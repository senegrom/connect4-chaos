name: Verify next-boundary Perfect Chaos generation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-next-chaos-boundary-generator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-next-chaos-boundary-generator
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Add a fail-closed boundary generator
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/perfect-chaos-next-boundary.py <<'PY'
          #!/usr/bin/env python3
          """Generate the next exact Perfect Chaos campaign from a reviewed predecessor."""

          from __future__ import annotations

          import argparse
          import json
          import re
          from pathlib import Path
          from typing import NoReturn

          FORMAT = 'connect4-perfect-chaos-next-boundary-generation-v1'
          ESSENTIAL = (
              'start-perfect-chaos-{target}-from-main.yml',
              'advance-perfect-chaos-{target}-main-bootstrap.yml',
              'continue-perfect-chaos-{target}-main.yml',
              'reusable-perfect-chaos-{target}-round.yml',
              'reusable-perfect-chaos-{target}-evidenced-round.yml',
              'promote-perfect-chaos-{target}.yml',
          )
          EXCLUDED_PREFIXES = (
              'build-', 'verify-', 'snapshot-', 'kick-', 'ensure-', 'persist-',
              'bound-', 'harden-', 'use-', 'install-', 'finalize-', 'sync-',
          )

          def fail(message: str) -> NoReturn:
              raise RuntimeError(message)

          def regular(path: Path, label: str) -> str:
              if path.is_symlink() or not path.is_file():
                  fail(f'{label} must be a regular file: {path}')
              return path.read_text()

          def essential_sources(boundary: int) -> list[str]:
              return [template.format(target=boundary) for template in ESSENTIAL]

          def output_name(source: str, current: int, target: int) -> str:
              if str(current) in source:
                  return source.replace(str(current), str(target))
              path = Path(source)
              return f'{path.stem}-{target}{path.suffix}'

          def replace_pair(text: str, old: str, new: str, placeholder: str) -> str:
              return text.replace(old, placeholder), (placeholder, new)

          def transform(text: str, previous: int, current: int, target: int) -> str:
              if target != current + 2 or current != previous + 2:
                  fail('Boundary generation requires consecutive even two-piece layers.')
              replacements: list[tuple[str, str]] = []

              # Replace combined and delimited identities through placeholders
              # so 16→18 becomes 18→20 rather than cascading to 20→20.
              forms = [
                  (f'{previous}→{current}', f'{current}→{target}'),
                  (f'{previous}-to-{current}', f'{current}-to-{target}'),
                  (f'{previous}_to_{current}', f'{current}_to_{target}'),
                  (f'{previous} to {current}', f'{current} to {target}'),
              ]
              for index, (old, new) in enumerate(forms):
                  marker = f'__C4_PAIR_{index}__'
                  text = text.replace(old, marker)
                  replacements.append((marker, new))

              delimiters = [
                  ('-', '-'), ('/', '/'), ('_', '_'),
                  ('-', '-piece'), (' ', ' pieces'),
              ]
              for index, (left, right) in enumerate(delimiters):
                  old_current = f'{left}{current}{right}'
                  old_previous = f'{left}{previous}{right}'
                  target_marker = f'__C4_TARGET_{index}__'
                  from_marker = f'__C4_FROM_{index}__'
                  text = text.replace(old_current, target_marker)
                  text = text.replace(old_previous, from_marker)
                  replacements.extend([
                      (target_marker, f'{left}{target}{right}'),
                      (from_marker, f'{left}{current}{right}'),
                  ])

              # Numeric proof fields and command flags are boundary semantics;
              # hexadecimal identities and unrelated numbers are untouched.
              from_labels = (
                  'fromPieces', 'from_pieces', 'from-pieces',
                  'shardFromPieces', 'shard_from_pieces', 'shard-from-pieces',
                  'existingBoundary', 'preparedFrontier',
              )
              target_labels = (
                  'targetPieces', 'target_pieces', 'target-pieces',
                  'frontierPieces', 'frontier_pieces', 'frontier-pieces',
                  'targetBoundary', 'target_boundary', 'target-boundary',
              )
              for label in from_labels:
                  text = re.sub(
                      rf'({re.escape(label)}[^0-9\n]{{0,12}}){previous}(?![0-9])',
                      rf'\g<1>{current}',
                      text,
                  )
              for label in target_labels:
                  text = re.sub(
                      rf'({re.escape(label)}[^0-9\n]{{0,12}}){current}(?![0-9])',
                      rf'\g<1>{target}',
                      text,
                  )

              for marker, value in replacements:
                  text = text.replace(marker, value)
              if '__C4_' in text:
                  fail('A boundary placeholder survived generation.')
              return text

          def select_sources(root: Path, current: int) -> list[str]:
              workflow_root = root / '.github/workflows'
              essential = essential_sources(current)
              for name in essential:
                  regular(workflow_root / name, f'essential {current}-piece workflow')

              selected = set(essential)
              state_marker = f'.campaign/perfect-chaos-main-{current}'
              continuation_marker = f'continue-perfect-chaos-{current}-main.yml'
              for path in sorted(workflow_root.glob('*.yml')):
                  if path.name in selected or path.name.startswith(EXCLUDED_PREFIXES):
                      continue
                  content = regular(path, 'workflow')
                  if state_marker in content or continuation_marker in content:
                      selected.add(path.name)
              return sorted(selected)

          def generate(root: Path, current: int, target: int, output: Path, write: bool) -> dict:
              previous = current - 2
              if current < 18 or current % 2 or target != current + 2 or target > 36:
                  fail(f'Unsupported boundary transition: {previous}→{current}→{target}')
              sources = select_sources(root, current)
              workflow_root = root / '.github/workflows'
              generated = []
              seen_outputs: set[str] = set()
              for source_name in sources:
                  source_path = workflow_root / source_name
                  destination_name = output_name(source_name, current, target)
                  if destination_name in seen_outputs:
                      fail(f'Generated workflow collision: {destination_name}')
                  seen_outputs.add(destination_name)
                  content = transform(regular(source_path, 'source workflow'), previous, current, target)
                  if f'.campaign/perfect-chaos-main-{current}' in content:
                      fail(f'{source_name}: old campaign-state path survived generation')
                  if source_name in essential_sources(current):
                      expected_name = output_name(source_name, current, target)
                      if destination_name != expected_name:
                          fail(f'{source_name}: unexpected destination {destination_name}')
                  if source_name == f'continue-perfect-chaos-{current}-main.yml':
                      if f'.campaign/perfect-chaos-main-{target}' not in content:
                          fail('Generated continuation does not bind the target campaign directory.')
                  destination = output / destination_name
                  if write:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_text(content, newline='\n')
                  generated.append({
                      'source': source_name,
                      'destination': destination_name,
                      'bytes': len(content.encode()),
                  })

              expected = {output_name(name, current, target) for name in essential_sources(current)}
              actual = {record['destination'] for record in generated}
              missing = sorted(expected - actual)
              if missing:
                  fail(f'Essential generated workflows are missing: {missing}')
              return {
                  'format': FORMAT,
                  'previousBoundary': previous,
                  'sourceBoundary': current,
                  'targetBoundary': target,
                  'write': write,
                  'generated': generated,
              }

          def arguments() -> argparse.Namespace:
              parser = argparse.ArgumentParser()
              parser.add_argument('--root', type=Path, default=Path('.'))
              parser.add_argument('--source-boundary', type=int, required=True)
              parser.add_argument('--target-boundary', type=int, required=True)
              parser.add_argument('--output', type=Path, required=True)
              parser.add_argument('--report', type=Path, required=True)
              parser.add_argument('--write', action='store_true')
              return parser.parse_args()

          def main() -> None:
              args = arguments()
              root = args.root.resolve()
              output = args.output if args.output.is_absolute() else root / args.output
              result = generate(
                  root,
                  args.source_boundary,
                  args.target_boundary,
                  output,
                  args.write,
              )
              encoded = json.dumps(result, indent=2, sort_keys=True) + '\n'
              args.report.parent.mkdir(parents=True, exist_ok=True)
              args.report.write_text(encoded, newline='\n')
              print(encoded, end='')

          if __name__ == '__main__':
              main()
          PY

          cat > tests/perfect-chaos-next-boundary.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { mkdtempSync, mkdirSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { spawnSync } from 'node:child_process';

          const ROOT = fileURLToPath(new URL('..', import.meta.url));
          const GENERATOR = join(ROOT, 'scripts', 'perfect-chaos-next-boundary.py');

          test('numeric boundary replacement cannot alter run SHAs or unrelated integers', () => {
            const temporary = mkdtempSync(join(tmpdir(), 'c4-next-boundary-'));
            try {
              const workflows = join(temporary, '.github', 'workflows');
              mkdirSync(workflows, { recursive: true });
              const essential = [
                'start-perfect-chaos-18-from-main.yml',
                'advance-perfect-chaos-18-main-bootstrap.yml',
                'continue-perfect-chaos-18-main.yml',
                'reusable-perfect-chaos-18-round.yml',
                'reusable-perfect-chaos-18-evidenced-round.yml',
                'promote-perfect-chaos-18.yml',
              ];
              const source = `name: Proof 16→18\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: |\n          echo .campaign/perfect-chaos-main-18\n          echo --from-pieces 16 --target-pieces 18\n          echo runSha=a18b16c\n          echo retention-days=18\n`;
              for (const name of essential) writeFileSync(join(workflows, name), source);
              const output = join(temporary, 'generated');
              const result = spawnSync('python3', [
                GENERATOR,
                '--root', temporary,
                '--source-boundary', '18',
                '--target-boundary', '20',
                '--output', output,
                '--report', join(temporary, 'report.json'),
                '--write',
              ], { encoding: 'utf8' });
              assert.equal(result.status, 0, result.stderr);
              const generated = readFileSync(
                join(output, 'continue-perfect-chaos-20-main.yml'),
                'utf8',
              );
              assert.match(generated, /Proof 18→20/);
              assert.match(generated, /perfect-chaos-main-20/);
              assert.match(generated, /--from-pieces 18 --target-pieces 20/);
              assert.match(generated, /runSha=a18b16c/);
              assert.match(generated, /retention-days=18/);
            } finally {
              rmSync(temporary, { recursive: true, force: true });
            }
          });

          test('the current 18-piece production pipeline generates a complete YAML-valid 20-piece set', () => {
            const temporary = mkdtempSync(join(tmpdir(), 'c4-current-next-boundary-'));
            try {
              const result = spawnSync('python3', [
                GENERATOR,
                '--root', ROOT,
                '--source-boundary', '18',
                '--target-boundary', '20',
                '--output', temporary,
                '--report', join(temporary, 'report.json'),
                '--write',
              ], { encoding: 'utf8' });
              assert.equal(result.status, 0, result.stderr);
              const report = JSON.parse(readFileSync(join(temporary, 'report.json'), 'utf8'));
              assert.equal(report.format, 'connect4-perfect-chaos-next-boundary-generation-v1');
              assert.ok(report.generated.length >= 6);
              const yaml = spawnSync('ruby', [
                '-e',
                'require "yaml"; ARGV.each { |p| YAML.safe_load(File.read(p), aliases: true) }',
                ...report.generated.map(({ destination }) => join(temporary, destination)),
              ], { encoding: 'utf8' });
              assert.equal(yaml.status, 0, yaml.stderr);
            } finally {
              rmSync(temporary, { recursive: true, force: true });
            }
          });
          EOF

          python3 -m py_compile scripts/perfect-chaos-next-boundary.py
          node --check tests/perfect-chaos-next-boundary.test.js

      - name: Add persistent activation after each promoted boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/activate-next-perfect-chaos-boundary.yml <<'EOF'
          name: Activate the next Perfect Chaos boundary

          on:
            workflow_dispatch:
            push:
              branches:
                - main
              paths:
                - data/perfect-chaos-prefix/manifest.json

          permissions:
            actions: write
            contents: write

          concurrency:
            group: activate-next-perfect-chaos-boundary
            cancel-in-progress: false

          jobs:
            activate:
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              env:
                GH_TOKEN: ${{ github.token }}
              steps:
                - uses: actions/checkout@v6
                  with:
                    ref: main
                    fetch-depth: 0

                - uses: actions/setup-node@v6
                  with:
                    node-version: 24
                    cache: npm

                - run: npm ci

                - name: Generate, verify, and publish one next campaign
                  shell: bash
                  run: |
                    set -euo pipefail
                    source_boundary="$(jq -er '.boundaries[-1] | select(type == "number")' data/perfect-chaos-prefix/manifest.json)"
                    if (( source_boundary >= 36 )); then
                      echo 'The released prefix already reaches the exact endgame handoff.'
                      exit 0
                    fi
                    if (( source_boundary < 18 || source_boundary % 2 != 0 )); then
                      echo "Boundary $source_boundary is not eligible for generated continuation."
                      exit 0
                    fi
                    target_boundary=$((source_boundary + 2))
                    start=".github/workflows/start-perfect-chaos-${target_boundary}-from-main.yml"
                    if [[ -f "$start" ]]; then
                      echo "The ${target_boundary}-piece campaign already exists."
                      exit 0
                    fi

                    output="/tmp/perfect-chaos-${target_boundary}-workflows"
                    report="/tmp/perfect-chaos-${target_boundary}-generation.json"
                    rm -rf "$output"
                    python3 scripts/perfect-chaos-next-boundary.py \
                      --root . \
                      --source-boundary "$source_boundary" \
                      --target-boundary "$target_boundary" \
                      --output "$output" \
                      --report "$report" \
                      --write
                    mapfile -t generated < <(jq -r '.generated[].destination' "$report")
                    (( ${#generated[@]} >= 6 ))
                    for name in "${generated[@]}"; do
                      ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
                        "$output/$name"
                      test ! -e ".github/workflows/$name"
                      cp "$output/$name" ".github/workflows/$name"
                    done
                    node --test tests/perfect-chaos-next-boundary.test.js
                    npm run check
                    git diff --check

                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    mkdir -p .audit
                    cp "$report" ".audit/perfect-chaos-${target_boundary}-generation.json"
                    git add .github/workflows .audit/perfect-chaos-${target_boundary}-generation.json
                    git commit -m "Add exact ${source_boundary}-to-${target_boundary} Chaos campaign"
                    for attempt in 1 2 3 4 5; do
                      git fetch origin main
                      if git rebase origin/main; then
                        if git push origin HEAD:main; then break; fi
                      else
                        git rebase --abort || true
                        echo 'The campaign workflow set changed concurrently.' >&2
                        exit 1
                      fi
                      if [[ "$attempt" = 5 ]]; then exit 1; fi
                      sleep $((attempt * 3))
                    done

                    for _ in $(seq 1 60); do
                      if gh workflow view "start-perfect-chaos-${target_boundary}-from-main.yml" \
                          --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                        gh workflow run "start-perfect-chaos-${target_boundary}-from-main.yml" \
                          --repo "$GITHUB_REPOSITORY" --ref main
                        exit 0
                      fi
                      sleep 5
                    done
                    echo 'The generated bootstrap workflow did not become dispatchable.' >&2
                    exit 1
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/promote-perfect-chaos-18.yml')
          text = path.read_text()
          permissions = 'permissions:\n  actions: read\n  contents: write\n'
          replacement = 'permissions:\n  actions: write\n  contents: write\n'
          if replacement not in text:
              if text.count(permissions) != 1:
                  raise RuntimeError('Could not strengthen the exact promoter action permission.')
              text = text.replace(permissions, replacement, 1)

          job = '''
  activate-next-boundary:
    needs: promote
    if: needs.promote.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recheck the released manifest for a next boundary
        run: gh workflow run activate-next-perfect-chaos-boundary.yml --repo "$GITHUB_REPOSITORY" --ref main
'''
          if '  activate-next-boundary:\n' not in text:
              text = text.rstrip() + '\n' + job
          path.write_text(text, newline='\n')
          PY

          cat > tests/perfect-chaos-next-boundary-activation.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';

          const activation = readFileSync(fileURLToPath(new URL(
            '../.github/workflows/activate-next-perfect-chaos-boundary.yml',
            import.meta.url,
          )), 'utf8');
          const promoter = readFileSync(fileURLToPath(new URL(
            '../.github/workflows/promote-perfect-chaos-18.yml',
            import.meta.url,
          )), 'utf8');

          test('promotion explicitly dispatches the persistent next-boundary activator', () => {
            assert.match(promoter, /^  actions: write$/m);
            assert.match(promoter, /activate-next-perfect-chaos-boundary\.yml/);
            assert.match(promoter, /needs: promote/);
          });

          test('the activator derives exactly one later even boundary from the released manifest', () => {
            assert.match(activation, /\.boundaries\[-1\]/);
            assert.match(activation, /target_boundary=\$\(\(source_boundary \+ 2\)\)/);
            assert.match(activation, /source_boundary >= 36/);
            assert.match(activation, /perfect-chaos-next-boundary\.py/);
            assert.match(activation, /npm run check/);
            assert.match(activation, /gh workflow run "start-perfect-chaos-\$\{target_boundary\}-from-main\.yml"/);
          });
          EOF

          ruby -e 'require "yaml"; ARGV.each { |p| YAML.safe_load(File.read(p), aliases: true) }' \
            .github/workflows/activate-next-perfect-chaos-boundary.yml \
            .github/workflows/promote-perfect-chaos-18.yml
          node --check tests/perfect-chaos-next-boundary-activation.test.js
          git diff --check

      - name: Prove generation against current production workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/generated-perfect-chaos-20
          python3 scripts/perfect-chaos-next-boundary.py \
            --root . \
            --source-boundary 18 \
            --target-boundary 20 \
            --output /tmp/generated-perfect-chaos-20 \
            --report /tmp/generated-perfect-chaos-20.json \
            --write
          jq -e '
            .format == "connect4-perfect-chaos-next-boundary-generation-v1"
            and .sourceBoundary == 18
            and .targetBoundary == 20
            and (.generated | length) >= 6
          ' /tmp/generated-perfect-chaos-20.json >/dev/null
          while read -r name; do
            ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
              "/tmp/generated-perfect-chaos-20/$name"
          done < <(jq -r '.generated[].destination' /tmp/generated-perfect-chaos-20.json)
          node --test \
            tests/perfect-chaos-next-boundary.test.js \
            tests/perfect-chaos-next-boundary-activation.test.js

      - name: Run complete current-main release gates
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          npm run ci
          npm run test:browser
          npm run chaos:prefix:verify-reference
          git diff --check

      - name: Publish the tested future-boundary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-next-chaos-boundary-generator.yml
          git add scripts/perfect-chaos-next-boundary.py \
                  tests/perfect-chaos-next-boundary.test.js \
                  tests/perfect-chaos-next-boundary-activation.test.js \
                  .github/workflows/activate-next-perfect-chaos-boundary.yml \
                  .github/workflows/promote-perfect-chaos-18.yml
          git commit -m 'Prepare automatic later Perfect Chaos boundaries'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              node --test \
                tests/perfect-chaos-next-boundary.test.js \
                tests/perfect-chaos-next-boundary-activation.test.js
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              echo 'The campaign pipeline changed concurrently; refusing an unreviewed merge.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          exit 1
