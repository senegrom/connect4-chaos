name: One-shot exact solver steward 2026-08-19

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-exact-steward-20260819.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: one-shot-exact-steward-20260819
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/one-shot-exact-steward-20260819.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and dispatch the exact fail-closed stewards
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/actions/workflows?per_page=100" \
            --jq '.workflows[]' > /tmp/workflows.ndjson

          resolve_one() {
            local label="$1" expression="$2" output="$3"
            jq -s "$expression" /tmp/workflows.ndjson > "$output"
            count="$(jq 'length' "$output")"
            if [[ "$count" != 1 ]]; then
              echo "$label workflow resolution produced $count candidates." >&2
              cat "$output" >&2
              exit 1
            fi
            jq -er '.[0].id | select(type == "number" and . > 0)' "$output"
          }

          supervisor="$(resolve_one supervisor \
            '[.[] | select(.state == "active" and ((.path | test("supervise-perfect-chaos-main\\.yml$")) or ((.name | ascii_downcase) | test("supervise.*perfect chaos.*main"))))]' \
            /tmp/supervisor.json)"
          classic="$(resolve_one classic-recovery \
            '[.[] | select(.state == "active" and ((.path | test("recover.*perfect-classic.*7x7.*\\.yml$"; "i")) or ((.name | ascii_downcase) | test("recover.*7x7.*classic|7x7.*classic.*recover"))))]' \
            /tmp/classic.json)"

          for workflow in "$supervisor" "$classic"; do
            gh api --method POST \
              "repos/$repo/actions/workflows/$workflow/dispatches" \
              -f ref=main
          done

          jq -n \
            --argjson supervisor "$supervisor" \
            --argjson classicRecovery "$classic" \
            --argjson sourceRun "$GITHUB_RUN_ID" \
            --arg sourceSha "$GITHUB_SHA" \
            '{format:"connect4-exact-steward-dispatch-v1",sourceRun:$sourceRun,sourceSha:$sourceSha,workflowIds:{supervisor:$supervisor,classicRecovery:$classicRecovery}}' \
            > /tmp/exact-steward-dispatch.json
          cat /tmp/exact-steward-dispatch.json

      - name: Remove the one-shot workflow and retain the dispatch audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/exact-steward-dispatch.json .audit/exact-steward-dispatch-latest.json
            git rm --ignore-unmatch "$SELF"
            git add .audit/exact-steward-dispatch-latest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Record exact solver steward dispatch'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the stewardship audit after five races.' >&2
          exit 1
