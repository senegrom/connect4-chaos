name: Snapshot exact solver campaigns

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snapshot-exact-solver-campaigns.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: snapshot-exact-solver-campaigns
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Bind current proof states to GitHub run identities
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']

          def gh(path: str):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', f'repos/{repository}/{path}'], text=True
              ))

          chaos_runs = gh(
              'actions/workflows/continue-perfect-chaos-18-main.yml/runs?branch=main&per_page=100'
          )['workflow_runs']
          roles = {}
          for role in ('red', 'yellow'):
              path = Path(f'.campaign/perfect-chaos-main-18/{role}.json')
              state = json.loads(path.read_text())
              state_commit = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%H', '--', str(path)], text=True
              ).strip()
              active = []
              for run in chaos_runs:
                  if run['status'] == 'completed':
                      continue
                  title = (run.get('display_title') or '').lower()
                  if role in title or run.get('head_sha') == state_commit:
                      active.append({
                          'id': run['id'],
                          'attempt': run['run_attempt'],
                          'status': run['status'],
                          'headSha': run['head_sha'],
                          'event': run['event'],
                          'createdAt': run['created_at'],
                          'updatedAt': run['updated_at'],
                          'url': run['html_url'],
                      })
              source = gh(f"actions/runs/{state['sourceRun']}")
              roles[role] = {
                  'statePath': str(path),
                  'stateCommit': state_commit,
                  'existingRejectedRoots': state['existingRejections'],
                  'cumulativeRejectedRoots': state['cumulativeRejections'],
                  'prepareShards': state['prepareShards'],
                  'prepareWorkers': state['prepareWorkers'],
                  'classificationShards': state['shardCount'],
                  'source': {
                      'runId': state['sourceRun'],
                      'runSha': state['sourceSha'],
                      'artifact': state['sourceArtifact'],
                      'status': source['status'],
                      'conclusion': source.get('conclusion'),
                      'attempt': source['run_attempt'],
                      'url': source['html_url'],
                  },
                  'activeRuns': active,
              }

          classic_launch_path = Path('.audit/perfect-classic-7x7-launch.json')
          classic = None
          if classic_launch_path.is_file() and not classic_launch_path.is_symlink():
              launch = json.loads(classic_launch_path.read_text())
              classic = {
                  'sourceSha': launch['sourceSha'],
                  'roles': {},
              }
              for name in ('role1', 'role2'):
                  pinned = launch['roles'][name]
                  run = gh(f"actions/runs/{pinned['id']}")
                  jobs = gh(f"actions/runs/{pinned['id']}/jobs?per_page=100")['jobs']
                  classic['roles'][name] = {
                      'runId': pinned['id'],
                      'headSha': run['head_sha'],
                      'attempt': run['run_attempt'],
                      'status': run['status'],
                      'conclusion': run.get('conclusion'),
                      'successfulJobs': sum(job.get('conclusion') == 'success' for job in jobs),
                      'activeJobs': sum(job.get('status') != 'completed' for job in jobs),
                      'failedJobs': sum(
                          job.get('status') == 'completed'
                          and job.get('conclusion') not in {'success', 'skipped', 'neutral'}
                          for job in jobs
                      ),
                      'knownJobs': len(jobs),
                      'url': run['html_url'],
                  }

          output = {
              'format': 'connect4-exact-solver-live-status-v1',
              'recordedAt': datetime.now(timezone.utc).isoformat(),
              'repository': repository,
              'mainSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'releasedChaosBoundary': 16,
              'targetChaosBoundary': 18,
              'chaos': roles,
              'classic7x7': classic,
              'claim': 'No complete standard 6x7 Chaos solution is claimed.',
          }
          Path('/tmp/exact-solver-live-status.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Publish the exact snapshot and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .audit
            cp /tmp/exact-solver-live-status.json .audit/exact-solver-live-status.json
            git rm --ignore-unmatch .github/workflows/snapshot-exact-solver-campaigns.yml
            git add .audit/exact-solver-live-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Record exact solver live status'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
