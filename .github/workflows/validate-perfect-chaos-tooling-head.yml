name: Validate hardened Perfect Chaos tooling head

on:
  push:
    branches:
      - agent/perfect-chaos-resumable
    paths:
      - .github/workflows/validate-perfect-chaos-tooling-head.yml

permissions:
  contents: read

concurrency:
  group: validate-perfect-chaos-tooling-head
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Source checks and full automated tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Real-browser smoke gate
        run: npm run test:browser

      - name: Independent Perfect Chaos proof-tool replay
        shell: bash
        run: |
          set -euo pipefail
          npm run chaos:prefix:verify
          npm run chaos:prefix:verify-reference
