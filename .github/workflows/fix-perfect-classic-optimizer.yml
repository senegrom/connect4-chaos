name: Fix classic policy optimizer patch

on:
  push:
    branches:
      - agent/perfect-classic-7x7
    paths:
      - .github/workflows/fix-perfect-classic-optimizer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/perfect-classic-7x7
          fetch-depth: 0

      - name: Make the final optimizer transformation indentation-independent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/optimize-perfect-classic-policy.yml')
          source = path.read_text()
          start_marker = "          search_old = '''    std::vector<Candidate> tried;"
          end_marker = "          path.write_text(source)"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate optimizer search-block transformation.')
          replacement = r'''          search_pattern = re.compile(
              r'    std::vector<Candidate> tried;\n'
              r'    for \(const Candidate& candidate : orderedMoves\(position, nonLosing\)\) \{\n'
              r'.*?'
              r'      if \(score > alpha\) alpha = score;\n'
              r'    \}\n',
              re.S,
          )
          search_new = '''    std::array<int, 7> triedHistory{};
            int triedCount = 0;
            const CandidateList candidates = orderedMoves(position, nonLosing);
            for (const Candidate& candidate : candidates) {
              const int childScore = search(play(position, candidate.move), -beta, -alpha);
              const int score = childScore == DRAW ? DRAW : -childScore;
              if (score >= beta) {
                ++cutoffs;
                for (int index = 0; index < triedCount; ++index) {
                  --history_[triedHistory[index]];
                }
                history_[candidate.historyIndex] += triedCount;
                table_.storeLower(key, score);
                return score;
              }
              triedHistory[triedCount++] = candidate.historyIndex;
              if (score > alpha) alpha = score;
            }
          '''
          search_new = '\n'.join(
              line[8:] if line.startswith('        ') else line
              for line in search_new.splitlines()
          ) + '\n'
          source, count = search_pattern.subn(search_new, source, count=1)
          if count != 1:
            raise SystemExit(f'Could not replace search tried-move block ({count}).')

'''
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Commit optimizer workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/optimize-perfect-classic-policy.yml
          git commit -m 'Fix classic policy optimizer patch'
          git push origin HEAD:agent/perfect-classic-7x7
