name: Apply UI review fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-ui-review-fixes.yml']

permissions:
  contents: read

jobs:
  export-tested-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct verified UI tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/ui-patch/part01 \
            .github/ui-patch/part02a \
            .github/ui-patch/part02b \
            .github/ui-patch/part02c \
            .github/ui-patch/q0200 \
            .github/ui-patch/q0201 \
            .github/ui-patch/q0202 \
            .github/ui-patch/q0203 \
            .github/ui-patch/part03 \
            .github/ui-patch/part04head \
            .github/ui-patch/part04tail \
            .github/ui-patch/part05full > /tmp/ui-fixes.patch.b64
          echo '061b3d77da0845ca8eec3e0dab8aa6bf8f84f5bc072d678df4a8b516bae2a7bf  /tmp/ui-fixes.patch.b64' | sha256sum -c -
          base64 --decode /tmp/ui-fixes.patch.b64 > /tmp/ui-fixes.patch
          echo '8f887a2d55c52b0f1ad841ec213b99a56729b375f7cf72a16e5de766bd84b525  /tmp/ui-fixes.patch' | sha256sum -c -
          echo '46bf665db9ba14873065db1bf057676d5ea87d4701e027739425ac9a8165c285  .github/ui-patch/compat.patch' | sha256sum -c -
          echo '110bdc1df92a9ad33bf0afd9939c4be2032b537bd21c9db4be57716ca822c9a2  .github/ui-patch/ui-test-compat.patch' | sha256sum -c -
          echo '62c82fce36bbba22467415d9a8d1f17e7de6de44554b29e6aa55a7e04860e71e  .github/ui-patch/numeric-aria.patch' | sha256sum -c -
          echo '5614d272e7c42de17d434476c8a01d20a1256653602d893f9a159271212fa6c0  .github/ui-patch/gap-test.patch' | sha256sum -c -
          git apply /tmp/ui-fixes.patch
          git apply .github/ui-patch/compat.patch
          git apply .github/ui-patch/ui-test-compat.patch
          git apply .github/ui-patch/numeric-aria.patch
          git apply .github/ui-patch/gap-test.patch
          node --check src/app.js
          node --check src/settings-controller.js
          python -m py_compile scripts/ui-browser-regressions.py
          git diff --check
          git diff --name-only > /tmp/ui-final-files.txt
          git diff --binary > /tmp/ui-final.patch
          tar -czf /tmp/ui-final.tgz -T /tmp/ui-final-files.txt
          sha256sum /tmp/ui-final.tgz /tmp/ui-final.patch > /tmp/SHA256SUMS
          cat /tmp/ui-final-files.txt
          cat /tmp/SHA256SUMS

      - name: Upload tested UI tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-ui-tree
          path: |
            /tmp/ui-final.tgz
            /tmp/ui-final.patch
            /tmp/ui-final-files.txt
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
