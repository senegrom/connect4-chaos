name: repair vendored ONNX runtime

# One-off, trusted-branch asset generation. No pull_request_target, secrets,
# automatic merge, force push, or writes to main/the Dependabot branch.
on:
  push:
    branches: ['fix/onnx-runtime-1.31.1-20261103']
    paths:
      - '.github/workflows/vendor-onnx-repair.yml'
      - 'scripts/vendor-onnx-runtime.mjs'
      - 'tests/vendor-onnx-runtime.test.js'
permissions:
  contents: read
concurrency:
  group: repair-vendored-onnx-runtime
  cancel-in-progress: false
jobs:
  vendor:
    if: github.repository == 'senegrom/connect4-chaos' && github.ref == 'refs/heads/fix/onnx-runtime-1.31.1-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install exactly the locked dependency without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate and vendor matching runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').devDependencies['onnxruntime-web']")" = '1.31.1'
          node --test tests/vendor-onnx-runtime.test.js
          node scripts/vendor-onnx-runtime.mjs
          sha256sum assets/neural/ort-1.31.1/* | tee "$RUNNER_TEMP/runtime-sha256.txt"
          # Do not carry this temporary privileged generator into the repair PR.
          git rm -- .github/workflows/vendor-onnx-repair.yml
          git add -A -- assets/neural/ort-1.30.0 assets/neural/ort-1.31.1 src/neural-runtime.js
          git write-tree > "$RUNNER_TEMP/tested-tree.txt"
      - name: Run unchanged full Node regressions with the real model
        run: npm run ci
        env:
          NEURAL_MODEL_DOWNLOAD: '1'
      - name: Test the assembled site rather than only the source tree
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-site.sh _site
          BROWSER_SMOKE_ROOT=_site npm run test:browser
      - name: Publish only the unchanged tested tree to a new review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tested-tree.txt")"
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Vendor and verify the ONNX Runtime 1.31.1 browser assets'
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$RUNNER_TEMP/tested-tree.txt")"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          branch="automation/vendored-onnx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          printf 'Published %s at %s. Ordinary PR CI and security checks must pass before any merge.\n' \
            "$branch" "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain generated asset checksums
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onnx-runtime-repair-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-sha256.txt
            ${{ runner.temp }}/tested-tree.txt
          if-no-files-found: ignore
          retention-days: 14
