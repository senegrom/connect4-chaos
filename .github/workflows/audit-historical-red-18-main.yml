name: Audit historical Red 18-piece closure against main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-historical-red-18-main.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: audit-historical-red-18-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '32098434092'
      SOURCE_SHA: b0e3aa9f83e195863eff9721203b9bafc53b76f8
      PRODUCER_ARTIFACT: perfect-chaos-red-18-41422-round
      EVIDENCE_ARTIFACT: perfect-chaos-red-18-41422-evidence

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the exact historical producer and independent evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf producer evidence download-audit
          mkdir -p download-audit
          python3 scripts/perfect-chaos-download-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN" \
            --run-sha "$SOURCE_SHA" \
            --artifact-name "$PRODUCER_ARTIFACT" \
            --output producer \
            --metadata download-audit/producer.json
          python3 scripts/perfect-chaos-download-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN" \
            --run-sha "$SOURCE_SHA" \
            --artifact-name "$EVIDENCE_ARTIFACT" \
            --output evidence \
            --metadata download-audit/evidence.json
          rm -rf download-audit/.named-artifact-archives

      - name: Validate all durable proof bytes and accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/perfect-chaos-artifacts.py verify --directory producer
          (cd evidence && sha256sum --check --strict SHA256SUMS)

          for name in campaign-summary.json classification.json \
            new-reject-16.bin reject-16.bin
          do
            test -f "producer/$name" && test -f "evidence/$name"
            cmp --silent "producer/$name" "evidence/$name"
          done
          jq -e '
            .format == "connect4-chaos-frontier-classification-merged-v1"
            and .role == "red"
            and .fromPieces == 16
            and .targetPieces == 18
            and .existingRejectedRoots == 41422
            and .newRejectedRoots == 0
            and .cumulativeRejectedRoots == 41422
            and .classificationComplete == true
            and .policyConflicts == 0
          ' producer/campaign-summary.json >/dev/null
          jq -e '
            .format == "connect4-chaos-independent-sharded-round-audit-v1"
            and .status == "pass"
            and .role == "red"
            and .fromPieces == 16
            and .targetPieces == 18
            and .existingRejectedRoots == 41422
            and .newRejectedRoots == 0
            and .cumulativeRejectedRoots == 41422
            and .policyConflicts == 0
          ' evidence/raw-shard-audit.json >/dev/null

      - name: Check exact compatibility with the promoted main prefix
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t policies < <(find producer -type f -path '*/red-prepared/14-16.policy.bin' -print)
          mapfile -t frontiers < <(find producer -type f -path '*/red-prepared/14-16.frontier.bin' -print)
          if (( ${#policies[@]} != 1 || ${#frontiers[@]} != 1 )); then
            echo 'Historical artifact does not contain one unambiguous prepared Red prefix.' >&2
            exit 1
          fi
          historical_policy="${policies[0]}"
          historical_frontier="${frontiers[0]}"
          main_policy=data/perfect-chaos-prefix/red/14-16.policy.bin
          main_frontier=data/perfect-chaos-prefix/red/14-16.frontier.bin
          test -f "$main_policy" && test -f "$main_frontier"

          policy_match=false
          frontier_match=false
          cmp --silent "$historical_policy" "$main_policy" && policy_match=true
          cmp --silent "$historical_frontier" "$main_frontier" && frontier_match=true
          compatible=false
          if [[ "$policy_match" = true && "$frontier_match" = true ]]; then
            compatible=true
          fi

          {
            echo "historical_policy=$historical_policy"
            echo "historical_frontier=$historical_frontier"
            echo "policy_match=$policy_match"
            echo "frontier_match=$frontier_match"
            echo "compatible=$compatible"
          } >> "$GITHUB_OUTPUT"

          HISTORICAL_POLICY="$historical_policy" \
          HISTORICAL_FRONTIER="$historical_frontier" \
          POLICY_MATCH="$policy_match" \
          FRONTIER_MATCH="$frontier_match" \
          COMPATIBLE="$compatible" \
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      value.update(block)
              return value.hexdigest()

          historical_policy = Path(os.environ['HISTORICAL_POLICY'])
          historical_frontier = Path(os.environ['HISTORICAL_FRONTIER'])
          main_policy = Path('data/perfect-chaos-prefix/red/14-16.policy.bin')
          main_frontier = Path('data/perfect-chaos-prefix/red/14-16.frontier.bin')
          report = {
              'format': 'connect4-chaos-red-18-historical-main-compatibility-v1',
              'sourceRun': int(os.environ['SOURCE_RUN']),
              'sourceSha': os.environ['SOURCE_SHA'],
              'producerArtifact': os.environ['PRODUCER_ARTIFACT'],
              'evidenceArtifact': os.environ['EVIDENCE_ARTIFACT'],
              'mainVerificationCommit': os.environ['GITHUB_SHA'],
              'policyByteIdentical': os.environ['POLICY_MATCH'] == 'true',
              'frontierByteIdentical': os.environ['FRONTIER_MATCH'] == 'true',
              'compatible': os.environ['COMPATIBLE'] == 'true',
              'hashes': {
                  'historical14To16Policy': digest(historical_policy),
                  'main14To16Policy': digest(main_policy),
                  'historical16Frontier': digest(historical_frontier),
                  'main16Frontier': digest(main_frontier),
              },
          }
          Path('/tmp/red-18-main-compatibility.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Independently replay the compatible historical closure with current main
        if: steps.compatibility.outputs.compatible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          prepared_parent="$(dirname "$(dirname "${{ steps.compatibility.outputs.historical_policy }}")")"
          rm -rf current-main-candidate
          mkdir -p current-main-candidate/red
          cp -a "$prepared_parent/red-prepared/." current-main-candidate/red/
          node --max-old-space-size=6144 scripts/perfect-chaos-prefix.mjs replay-role \
            --directory current-main-candidate \
            --role red \
            --frontier-pieces 18 \
            > current-main-replay.json
          jq -e '.replay.role == "red" and .replay.segments[0].fromPieces == 0
            and .replay.segments[-1].frontierPieces == 18' current-main-replay.json >/dev/null
          jq -S '.replay' current-main-replay.json > /tmp/current-replay.json
          jq -S '.replay' evidence/closure-replay.json > /tmp/evidence-replay.json
          cmp --silent /tmp/current-replay.json /tmp/evidence-replay.json

      - name: Build a non-claiming compatible closure candidate
        if: steps.compatibility.outputs.compatible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          summary = json.loads(Path('producer/campaign-summary.json').read_text())
          candidate = {
              'format': 'connect4-chaos-auto-advance-decision-v1',
              'role': 'red',
              'fromPieces': 16,
              'targetPieces': 18,
              'run': int(os.environ['SOURCE_RUN']),
              'runSha': os.environ['SOURCE_SHA'],
              'resultArtifact': os.environ['PRODUCER_ARTIFACT'],
              'existingRejectedRoots': summary['existingRejectedRoots'],
              'newRejectedRoots': summary['newRejectedRoots'],
              'cumulativeRejectedRoots': summary['cumulativeRejectedRoots'],
              'closedCandidate': True,
              'nextState': None,
              'checksums': {
                  'roundManifest': digest(Path('producer/SHA256SUMS')),
                  'evidenceManifest': digest(Path('evidence/SHA256SUMS')),
                  'closureReplay': digest(Path('evidence/closure-replay.json')),
                  'currentMainReplay': digest(Path('current-main-replay.json')),
              },
              'compatibilityReport': 'data/perfect-chaos-campaign/red-18-41422-main-compatibility.json',
          }
          Path('/tmp/red-41422-main-candidate.json').write_text(
              json.dumps(candidate, indent=2, sort_keys=True) + '\n', newline='\n'
          )
          PY

      - name: Commit the compatibility verdict to main
        shell: bash
        env:
          COMPATIBLE: ${{ steps.compatibility.outputs.compatible }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/perfect-chaos-campaign \
              .campaign/perfect-chaos-main-18/closure-candidates

            current_policy_hash="$(sha256sum data/perfect-chaos-prefix/red/14-16.policy.bin | cut -d' ' -f1)"
            current_frontier_hash="$(sha256sum data/perfect-chaos-prefix/red/14-16.frontier.bin | cut -d' ' -f1)"
            expected_policy_hash="$(jq -r '.hashes.main14To16Policy' /tmp/red-18-main-compatibility.json)"
            expected_frontier_hash="$(jq -r '.hashes.main16Frontier' /tmp/red-18-main-compatibility.json)"
            test "$current_policy_hash" = "$expected_policy_hash"
            test "$current_frontier_hash" = "$expected_frontier_hash"

            cp /tmp/red-18-main-compatibility.json \
              data/perfect-chaos-campaign/red-18-41422-main-compatibility.json
            if [[ "$COMPATIBLE" = true ]]; then
              cp /tmp/red-41422-main-candidate.json \
                .campaign/perfect-chaos-main-18/closure-candidates/red-41422.json
            fi
            git add data/perfect-chaos-campaign \
              .campaign/perfect-chaos-main-18/closure-candidates
            if git diff --cached --quiet; then
              exit 0
            fi
            if [[ "$COMPATIBLE" = true ]]; then
              message='Import verified Red 18-piece closure candidate onto main'
            else
              message='Record Red 18-piece historical prefix incompatibility'
            fi
            git commit -m "$message"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish the historical compatibility verdict.' >&2
          exit 1
