name: Validate four-worker Perfect Chaos prefix synthesis

on:
  push:
    branches:
      - agent/perfect-chaos-16-recovery
    paths:
      - .github/workflows/validate-perfect-chaos-prefix-workers-4.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: validate-perfect-chaos-prefix-workers-4
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_RUN: '31741937118'
      SOURCE_SHA: 'a1e1bf6a0b4343ba3921430675cbd65d86977e3b'
      SOURCE_ARTIFACT: perfect-chaos-red-16-7995-round
      SOURCE_DIGEST: sha256:43014d10ed403487a91d44ef39dfdf26628eb42a481afcb0266ebd936207428f
      ROLE: red
      EXPECTED_REJECTIONS: '7997'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pin and download the audited source result
        shell: bash
        run: |
          set -euo pipefail
          read -r actual_sha status conclusion < <(
            gh api "repos/$REPO/actions/runs/$SOURCE_RUN" \
              --jq '[.head_sha, .status, (.conclusion // "")] | @tsv'
          )
          test "$actual_sha" = "$SOURCE_SHA"
          test "$status" = 'completed'
          test "$conclusion" = 'success'
          read -r artifact_id digest expired < <(
            gh api --paginate "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"$SOURCE_ARTIFACT\") | [.id, (.digest // \"\"), .expired] | @tsv"
          )
          test -n "$artifact_id"
          test "$digest" = "$SOURCE_DIGEST"
          test "$expired" = 'false'
          rm -rf source seed prepared-2 prepared-4 report
          mkdir -p source seed/$ROLE report
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name "$SOURCE_ARTIFACT" --dir source
          python3 scripts/perfect-chaos-artifacts.py verify --directory source
          cp -a "source/$ROLE-prepared"/. "seed/$ROLE/"
          ROLE="$ROLE" EXPECTED_REJECTIONS="$EXPECTED_REJECTIONS" PYTHONPATH=scripts python3 - <<'PY'
          import os
          from pathlib import Path
          from perfect_chaos_tables import FRONTIER_MAGIC, FRONTIER_RECORD_SIZE, read_table
          role = os.environ['ROLE']
          expected = int(os.environ['EXPECTED_REJECTIONS'])
          table = read_table(Path(f'seed/{role}/reject-14.bin'), FRONTIER_MAGIC, FRONTIER_RECORD_SIZE)
          if table.boundary != 14 or len(table.records) != expected:
              raise RuntimeError('The source rejection checkpoint is incompatible.')
          PY

      - name: Rebuild with two and four deterministic workers
        shell: bash
        run: |
          set -euo pipefail
          : > report/timings.tsv
          for workers in 2 4; do
            start=$(date +%s%N)
            node scripts/perfect-chaos-prefix.mjs prepare-role \
              --role "$ROLE" \
              --frontier-pieces 16 \
              --pass-budget 9999 \
              --shards 32 \
              --shard-from-pieces 14 \
              --shard-workers "$workers" \
              --seed-rejections seed \
              --output "prepared-$workers"
            end=$(date +%s%N)
            elapsed=$((end - start))
            printf '%s\t%s\n' "$workers" "$elapsed" >> report/timings.tsv
            node scripts/perfect-chaos-prefix.mjs replay-role \
              --directory "prepared-$workers" \
              --role "$ROLE" \
              --frontier-pieces 14 \
              > "report/replay-$workers.json"
            python3 scripts/perfect-chaos-artifacts.py write --directory "prepared-$workers"
            python3 scripts/perfect-chaos-artifacts.py verify --directory "prepared-$workers"
          done

      - name: Require byte-identical proof tables and equivalent replay
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t two_files < <(cd prepared-2 && find "$ROLE" -type f -name '*.bin' -printf '%P\n' | sort)
          mapfile -t four_files < <(cd prepared-4 && find "$ROLE" -type f -name '*.bin' -printf '%P\n' | sort)
          test "${two_files[*]}" = "${four_files[*]}"
          for path in "${two_files[@]}"; do
            cmp "prepared-2/$ROLE/$path" "prepared-4/$ROLE/$path"
          done
          ROLE="$ROLE" EXPECTED_REJECTIONS="$EXPECTED_REJECTIONS" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          role = os.environ['ROLE']
          expected = int(os.environ['EXPECTED_REJECTIONS'])
          checkpoints = {
              workers: json.loads(Path(f'prepared-{workers}/checkpoint.json').read_text())
              for workers in (2, 4)
          }
          for workers, checkpoint in checkpoints.items():
              if not checkpoint.get('complete') or checkpoint.get('role') != role or checkpoint.get('target') != 16:
                  raise RuntimeError(f'The {workers}-worker checkpoint is incomplete or incompatible.')
              if checkpoint.get('rejectionCounts', {}).get('at14') != expected:
                  raise RuntimeError(f'The {workers}-worker checkpoint has the wrong rejection count.')
              if checkpoint.get('sharding', {}).get('workers') != workers:
                  raise RuntimeError(f'The {workers}-worker checkpoint reports the wrong worker count.')

          replays = {
              workers: json.loads(Path(f'report/replay-{workers}.json').read_text())['replay']
              for workers in (2, 4)
          }
          if replays[2] != replays[4]:
              raise RuntimeError('Two-worker and four-worker replay metrics differ.')

          timings = {}
          for line in Path('report/timings.tsv').read_text().splitlines():
              workers, nanoseconds = line.split('\t')
              timings[workers] = int(nanoseconds)
          report = {
              'format': 'connect4-chaos-prefix-worker-equivalence-v1',
              'role': role,
              'rejectedRoots': expected,
              'workers': [2, 4],
              'proofTablesByteIdentical': True,
              'replayEquivalent': True,
              'timingsNanoseconds': timings,
              'fourWorkerRatio': timings['4'] / timings['2'],
          }
          Path('report/worker-equivalence.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          (cd report && \
            sha256sum replay-2.json replay-4.json timings.tsv worker-equivalence.json \
              > SHA256SUMS && sha256sum --check --strict SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: perfect-chaos-prefix-worker-equivalence
          path: report
          if-no-files-found: error
          retention-days: 30
