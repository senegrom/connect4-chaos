name: Fix browser-smoke teardown

on:
  push:
    branches:
      - agent/browser-smoke
    paths:
      - .github/workflows/fix-browser-smoke-teardown.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run browser-smoke teardown fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Harden Chrome shutdown and profile removal
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/browser-smoke.mjs')
          text = path.read_text()
          old = """    cdp?.close();
              browserProcess.kill('SIGTERM');
              await Promise.race([
                new Promise((resolveExit) => browserProcess.once('exit', resolveExit)),
                delay(2_000).then(() => browserProcess.kill('SIGKILL')),
              ]);
              await new Promise((resolveClose) => server.close(resolveClose));
              await rm(userDataDirectory, { recursive: true, force: true });
          """
          new = """    cdp?.close();
              const browserExit = browserProcess.exitCode !== null
                ? Promise.resolve()
                : new Promise((resolveExit) => browserProcess.once('exit', resolveExit));
              browserProcess.kill('SIGTERM');
              await Promise.race([browserExit, delay(2_000)]);
              if (browserProcess.exitCode === null) {
                browserProcess.kill('SIGKILL');
                await Promise.race([browserExit, delay(2_000)]);
              }
              await new Promise((resolveClose) => server.close(resolveClose));
              await rm(userDataDirectory, {
                recursive: true,
                force: true,
                maxRetries: 10,
                retryDelay: 100,
              });
          """
          if text.count(old) != 1:
              raise SystemExit('browser teardown anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))

      - name: Validate in real Chromium
        run: |
          node --check scripts/browser-smoke.mjs
          npm ci
          npm run test:browser

      - name: Publish teardown fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-smoke.mjs
          git commit -m 'Harden browser-smoke teardown'
          git push origin HEAD:agent/browser-smoke
